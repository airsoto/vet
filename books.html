<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Buscador de Libros</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #121212;
      color: #fff;
      padding: 20px;
    }
    input, select {
      padding: 10px;
      margin-bottom: 10px;
      width: 100%;
      border-radius: 5px;
      border: none;
    }
    .book {
      border: 1px solid #333;
      border-radius: 10px;
      padding: 20px;
      background-color: #1e1e1e;
      margin-top: 20px;
    }
    .book img {
      width: 200px;
      border-radius: 10px;
      display: block;
      margin-bottom: 10px;
    }
    .rating {
      font-size: 2rem;
      color: #fbc02d;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <h1>📚 Buscador de Libros</h1>

    <h1>📚 33333</h1>
  <input type="text" id="search" placeholder="Buscar por título, autor o género...">
  <label for="speed">Velocidad de lectura (palabras/min):</label>
  <select id="speed">
    <option value="250">250</option>
    <option value="275">275</option>
    <option value="300" selected>300</option>
    <option value="325">325</option>
  </select>

  <div id="results"></div>

  <script>
    let books = [];

    // Utilidad para convertir strings como "['Fantasy', 'Magic']" a array real
    function cleanArrayString(str) {
      try {
        return JSON.parse(str.replace(/'/g, '"'));
      } catch (e) {
        return [];
      }
    }

    function normalize(str) {
      return str.toLowerCase().trim();
    }

    // Función principal de búsqueda
    function searchBooks() {
      const query = normalize(document.getElementById('search').value);
      const speed = parseInt(document.getElementById('speed').value);
      const results = document.getElementById('results');
      results.innerHTML = '';

      if (!query) return;

      const matches = books.filter(book => {
        const title = normalize(book.book_title);
        const author = normalize(book.author);
        const genresArr = cleanArrayString(book.genres).map(g => normalize(g));
        return (
          title.includes(query) ||
          author.includes(query) ||
          genresArr.some(g => g.includes(query))
        );
      });

      matches.forEach(book => {
        const pagesArray = cleanArrayString(book.num_pages);
        const pages = parseInt(pagesArray[0]) || 0;
        const wordsPerPage = 300;
        const totalWords = pages * wordsPerPage;
        const totalMinutes = Math.ceil(totalWords / speed);
        const hours = Math.floor(totalMinutes / 60);
        const minutes = totalMinutes % 60;
        const genresStr = cleanArrayString(book.genres).join(', ');

        results.innerHTML += `
          <div class="book">
            <img src="${book.cover_image_uri}" alt="Portada de ${book.book_title}">
            <div class="rating">⭐ ${book.average_rating}</div>
            <h2>${book.book_title}</h2>
            <p><strong>Autor:</strong> ${book.author}</p>
            <p><strong>Géneros:</strong> ${genresStr}</p>
            <p><strong>Detalles:</strong> ${book.book_details}</p>
            <p><strong>Páginas:</strong> ${pages}</p>
            <p><strong>Tiempo estimado de lectura:</strong> ${hours}h ${minutes}min</p>
          </div>
        `;
      });
    }

    // Cargar JSON externo desde tu GitHub Pages
    fetch('https://airsoto.github.io/vet/books.json')
      .then(response => response.json())
      .then(data => {
        books = data;
        document.getElementById('search').addEventListener('input', searchBooks);
        document.getElementById('speed').addEventListener('change', searchBooks);
      })
      .catch(err => {
        document.getElementById('results').innerHTML = '<p>Error cargando libros.</p>';
        console.error(err);
      });
  </script>

</body>
</html>
