<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Book Search</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background-color: #1c1c1c;
      color: #eee;
      margin: 0;
      padding: 2em;
    }

    .container {
      max-width: 900px;
      margin: auto;
    }

    input, select {
      width: 100%;
      padding: 0.6em;
      margin-top: 1em;
      border-radius: 5px;
      border: none;
      font-size: 1em;
    }

    .results, .details {
      margin-top: 2em;
      background-color: #2a2a2a;
      padding: 1em;
      border-radius: 10px;
    }

    .result-item {
      cursor: pointer;
      padding: 0.5em;
      border-bottom: 1px solid #444;
    }

    .result-item:hover {
      background-color: #333;
    }

    .details img {
      float: right;
      max-width: 120px;
      margin-left: 20px;
      border-radius: 8px;
    }

    h2 {
      margin-top: 0;
    }

    .rating {
      font-size: 1.2em;
      color: gold;
      display: flex;
      align-items: center;
      gap: 0.3em;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Book Search</h1>
    <input type="text" id="searchInput" placeholder="Search by title, author or genre...">
    <select id="wpmSelect">
      <option value="300">300 wpm (default)</option>
      <option value="250">250 wpm</option>
      <option value="275">275 wpm</option>
      <option value="325">325 wpm</option>
    </select>

    <div class="results" id="results"></div>
    <div class="details" id="bookDetails"></div>
  </div>

  <script>
    let books = [];

    // Carga el JSON desde el mismo directorio
    fetch('books.json')
      .then(response => response.json())
      .then(data => {
        books = data;
      });

    const searchInput = document.getElementById('searchInput');
    const resultsContainer = document.getElementById('results');
    const bookDetails = document.getElementById('bookDetails');
    const wpmSelect = document.getElementById('wpmSelect');

    searchInput.addEventListener('input', () => {
      const query = searchInput.value.toLowerCase();
      resultsContainer.innerHTML = '';
      bookDetails.innerHTML = '';

      if (query.length < 2) return;

      const matches = books.filter(book =>
        book.book_title.toLowerCase().includes(query) ||
        book.author.toLowerCase().includes(query) ||
        book.genres.toLowerCase().includes(query)
      ).slice(0, 50); // Limita a los primeros 50 resultados

      matches.forEach(book => {
        const item = document.createElement('div');
        item.className = 'result-item';
        item.textContent = `${book.book_title} by ${book.author}`;
        item.addEventListener('click', () => displayBook(book));
        resultsContainer.appendChild(item);
      });
    });

    function displayBook(book) {
      const wpm = parseInt(wpmSelect.value);
      const pages = parseInt(book.num_pages) || 0;
      const avgWordsPerPage = 250;
      const totalWords = pages * avgWordsPerPage;
      const readingTime = Math.ceil(totalWords / wpm);

      bookDetails.innerHTML = `
        <h2>${book.book_title}</h2>
        <img src="${book.cover_image_uri}" alt="Cover">
        <p><strong>Author:</strong> ${book.author}</p>
        <p><strong>Pages:</strong> ${pages}</p>
        <p><strong>Genres:</strong> ${book.genres}</p>
        <p><strong>Details:</strong> ${book.book_details}</p>
        <p><strong>Estimated reading time:</strong> ${readingTime} minutes at ${wpm} wpm</p>
        <div class="rating"><span>⭐</span>${book.average_rating}</div>
      `;
    }
  </script>
</body>
</html>
