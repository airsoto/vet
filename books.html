<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Book Search</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background-color: #1c1c1c;
      color: #eee;
      margin: 0;
      padding: 2em;
    }

    .container {
      max-width: 900px;
      margin: auto;
    }

    .search-fields {
      display: flex;
      flex-wrap: wrap;
      gap: 1em;
      align-items: center;
    }

    .search-fields input {
      flex: 1;
      min-width: 200px;
      padding: 1em;
      font-size: 1.2em;
      border-radius: 5px;
      border: none;
    }

    .search-fields label {
      margin-top: 1em;
      font-size: 1.1em;
    }

    .search-fields select {
      padding: 1em;
      font-size: 1.1em;
      border-radius: 5px;
      border: none;
    }

    .results, .details {
      margin-top: 2em;
      background-color: #2a2a2a;
      padding: 1em;
      border-radius: 10px;
    }

    .result-item {
      cursor: pointer;
      padding: 0.5em;
      border-bottom: 1px solid #444;
    }

    .result-item:hover {
      background-color: #333;
    }

    .details img {
      float: right;
      max-width: 240px;
      margin-left: 20px;
      border-radius: 8px;
    }

    h2 {
      margin-top: 0;
      font-size: 2em;
    }

    .details p {
      font-size: 1.2em;
    }

    .rating {
      font-size: 1.4em;
      color: gold;
      display: flex;
      align-items: center;
      gap: 0.3em;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Book Search</h1>
    <h3><span style="color: #339966;">Developed by Angel Soto</span></h3>
    <div class="search-fields">
      <input type="text" id="titleInput" placeholder="Search by title...">
      <input type="text" id="authorInput" placeholder="Search by author...">
      <input type="text" id="genreInput" placeholder="Search by genre...">
      <label for="wpmSelect">WPM:
        <select id="wpmSelect">
          <option value="300">300 (default)</option>
          <option value="250">250</option>
          <option value="275">275</option>
          <option value="325">325</option>
        </select>
      </label>
    </div>

    <div class="results" id="results"></div>
    <div class="details" id="bookDetails"></div>
  </div>

  <script>
    fetch('https://airsoto.github.io/vet/books.json')
      .then(response => response.json())
      .then(books => {
        const titleInput = document.getElementById('titleInput');
        const authorInput = document.getElementById('authorInput');
        const genreInput = document.getElementById('genreInput');
        const resultsContainer = document.getElementById('results');
        const bookDetails = document.getElementById('bookDetails');
        const wpmSelect = document.getElementById('wpmSelect');

        [titleInput, authorInput, genreInput].forEach(input => {
          input.addEventListener('input', () => {
            const titleQuery = titleInput.value.toLowerCase();
            const authorQuery = authorInput.value.toLowerCase();
            const genreQuery = genreInput.value.toLowerCase();

            resultsContainer.innerHTML = '';
            bookDetails.innerHTML = '';

            if (!titleQuery && !authorQuery && !genreQuery) return;

            const matches = books.filter(book => {
              const title = book.book_title?.toLowerCase() || '';
              const author = book.author?.toLowerCase() || '';
              const genres = String(book.genres || '').toLowerCase();

              return (
                (!titleQuery || title.includes(titleQuery)) &&
                (!authorQuery || author.includes(authorQuery)) &&
                (!genreQuery || genres.includes(genreQuery))
              );
            }).slice(0, 50);

            matches.forEach(book => {
              const item = document.createElement('div');
              item.className = 'result-item';
              item.textContent = `${book.book_title} by ${book.author}`;
              item.addEventListener('click', () => displayBook(book));
              resultsContainer.appendChild(item);
            });
          });
        });

        function displayBook(book) {
          const wpm = parseInt(wpmSelect.value);
          const pages = parseInt(book.num_pages) || 0;
          const avgWordsPerPage = 250;
          const totalWords = pages * avgWordsPerPage;
          const totalMinutes = Math.ceil(totalWords / wpm);
          const hours = Math.floor(totalMinutes / 60);
          const minutes = totalMinutes % 60;
          const timeString = hours > 0 ? `${hours}h ${minutes}m` : `${minutes} minutes`;

          const cleanGenres = String(book.genres).trim();

          bookDetails.innerHTML = `
            <h2>${book.book_title}</h2>
            <img src="${book.cover_image_uri}" alt="Cover">
            <p><strong>Author:</strong> ${book.author}</p>
            <p><strong>Pages:</strong> ${pages}</p>
            <p><strong>Genres:</strong> ${cleanGenres}</p>
            <p><strong>Details:</strong> ${book.book_details}</p>
            <p><strong>Estimated reading time:</strong> ${timeString} at ${wpm} wpm</p>
            <div class="rating"><span>⭐</span>${book.average_rating}</div>
          `;
        }
      })
      .catch(error => {
        document.getElementById('results').innerHTML = '<p style="color: red;">Error loading book data.</p>';
        console.error('Error loading books.json:', error);
      });
  </script>
</body>
</html>
