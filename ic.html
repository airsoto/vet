    }

      text-align: center;
      color: #90caf9;
    }

      text-align: center;
      margin-bottom: 2em;
    }

    input {
      padding: 0.6em;
      font-size: 1em;
      width: 300px;
      border: none;
      border-radius: 8px;
      background-color: #1e1e1e;
      color: #f0f0f0;
    }

    .results {
      max-width: 1200px;
      margin: auto;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 1em;
    }

    .result-item {
      background-color: #1e1e1e;
      border: 1px solid #333;
      border-radius: 10px;
      padding: 1em;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .result-item:hover {
      background-color: #2a2a2a;
    }

    .title {
      font-size: 1.2em;
      color: #90caf9;
      margin-bottom: 0.5em;
    }

    .meta {
      font-size: 0.9em;
      color: #ccc;
    }
  </style>

    function search() {
      const query = document.getElementById("searchInput").value.toLowerCase();
      const resultsContainer = document.getElementById("results");
      resultsContainer.innerHTML = "";

      const filtered = data.filter(entry =>
        entry.título.toLowerCase().includes(query) ||
        entry.año.includes(query)
      );

      if (filtered.length === 0) {
        resultsContainer.innerHTML = "<p>No se encontraron resultados.</p>";
        return;
      }

      filtered.forEach(entry => {
        const item = document.createElement("div");
        item.className = "result-item";
        item.innerHTML = `
          <div class="title">${entry.título}</div>
          <div class="meta">Autor(es): ${entry.autores}</div>
          <div class="meta">Año: ${entry.año} | Volumen: ${entry.volumen} | Páginas: ${entry.páginas}</div>
        `;
        item.onclick = () => window.open(entry.url, "_blank");
        resultsContainer.appendChild(item);
      });
    }
