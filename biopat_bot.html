

<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>VN Perro/Gato en PDF (desde JSON)</title>
<style>
  :root{--bg:#0f1115;--panel:#171a21;--ink:#e6e6e6;--muted:#9aa4b2;--pri:#4ea8de;--pri2:#1e88e5}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,Segoe UI,Roboto,Ubuntu,Helvetica,Arial}
  header{position:sticky;top:0;background:#0f1115cc;backdrop-filter:blur(6px);border-bottom:1px solid #222}
  .wrap{max-width:1100px;margin:0 auto;padding:18px}
  h1{margin:0;color:#cfe8ff;font-size:clamp(20px,3vw,28px)}
  p.lead{margin:.4rem 0 0;color:var(--muted)}
  main .card{background:var(--panel);border:1px solid #222;border-radius:16px;padding:18px}
  .grid{display:grid;gap:16px}
  @media(min-width:900px){.grid{grid-template-columns:1fr 1fr}}
  label{display:block;font-weight:600;margin-bottom:6px;color:#c7d2fe}
  input[type="file"],button{width:100%;background:#11151c;border:1px solid #2a2f3a;color:var(--ink);border-radius:12px;padding:12px 14px;font-size:15px}
  .muted{color:var(--muted);font-size:13px}
  .log{background:#0c0f14;border:1px dashed #2a2f3a;border-radius:12px;padding:12px;min-height:140px;overflow:auto;white-space:pre-wrap;font-family:ui-monospace,Menlo,Consolas,monospace}
  .toggle{display:flex;gap:10px}
  .toggle button{flex:1;cursor:pointer;background:#141923}
  .toggle button.active{background:linear-gradient(180deg,var(--pri),var(--pri2));font-weight:800}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <h1>VN Perro/Gato en PDF (desde JSON)</h1>
    <p class="lead">Usa <code>json/inf_biopat_valores.json</code>. Escribe únicamente la columna elegida (Perro o Gato) a 2&nbsp;cm del borde derecho. “VALORES NORMALES (…)” se añade en negrita junto a “SERIE ERITROIDE”.</p>
  </div>
</header>

<main class="wrap grid" id="app">
  <section class="card">
    <label>Especie</label>
    <div class="toggle" id="speciesToggle">
      <button type="button" data-species="perro" class="active">🐶 Perro</button>
      <button type="button" data-species="gato">🐱 Gato</button>
    </div>

    <div style="margin-top:14px">
      <label for="pdfInput">PDF(s) a procesar</label>
      <input id="pdfInput" type="file" accept="application/pdf" multiple />
    </div>
    <div style="margin-top:12px">
      <button id="runBtn">Procesar y descargar</button>
      <div class="muted" style="margin-top:8px">Salida: <b>nombre_mod.pdf</b>.</div>
    </div>
  </section>

  <section class="card">
    <div class="muted" id="jsonStatus">Cargando JSON…</div>
    <div class="log" id="log" style="margin-top:10px"></div>
  </section>
</main>

<!-- Librerías -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
<script>pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js";</script>
<script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>

<script>
(async function(){
  const JSON_PATH = "json/inf_biopat_valores.json";
  const RIGHT_SELECTED_CM = 2.0;         // distancia desde el borde derecho
  const Y_ADJUST = 0.25;                 // pequeño ajuste vertical
  const cm = (n)=> n*28.3464567;

  const $ = (id)=>document.getElementById(id);
  const logBox = $("log"), jsonStatus = $("jsonStatus");
  const pdfInput = $("pdfInput"), runBtn = $("runBtn"), toggle = $("speciesToggle");

  function log(m,cls=""){ const d=document.createElement("div"); if(cls)d.className=cls; d.textContent=m; logBox.appendChild(d); logBox.scrollTop=logBox.scrollHeight; }
  const norm = s => (s??"").toString().normalize("NFD").replace(/\p{Diacritic}/gu,"").replace(/\.+/g," ").replace(/\s+/g," ").trim().toLowerCase();

  // Estado especie (solo una a la vez)
  let species = "perro";
  toggle.addEventListener("click", e=>{
    const btn = e.target.closest("button[data-species]");
    if(!btn) return;
    species = btn.dataset.species;
    toggle.querySelectorAll("button").forEach(b=>b.classList.toggle("active", b===btn));
  });

  // --- Cargar JSON ---
  let mapping = new Map();
  try{
    const r = await fetch(JSON_PATH, {cache:"no-store"});
    if(!r.ok) throw new Error(`HTTP ${r.status}`);
    const data = await r.json();
    const list = Array.isArray(data) ? data : (data?.items || data?.valores || []);
    let n=0;
    for(const row of list){
      const name = (row["Parámetro"] ?? row["Parametro"] ?? "").toString().trim();
      if(!name) continue;
      const perro = (row["vn (Perro)"] ?? row["vn (Perro) "] ?? row["vn_perro"] ?? "").toString().replace(/\s+/g," ").trim();
      const gato  = (row["vn(Gato)"]   ?? row["vn (Gato)"]   ?? row["vn_gato"]  ?? "").toString().replace(/\s+/g," ").trim();
      mapping.set(norm(name), {raw:name, perro, gato});
      n++;
    }
    jsonStatus.textContent = `JSON cargado (${n} filas).`;
  }catch(e){
    jsonStatus.textContent = `Error cargando JSON: ${e.message}`;
  }

  runBtn.addEventListener("click", async ()=>{
    logBox.innerHTML="";
    if(mapping.size===0){ log("⚠️ JSON vacío o no cargado."); return; }
    const files = Array.from(pdfInput.files||[]);
    if(!files.length){ log("⚠️ Selecciona al menos un PDF."); return; }

    for(const file of files){
      try{
        log(`\n📄 Procesando: ${file.name}`);
        const buf = await file.arrayBuffer();

        // 1) Extraer texto por líneas con pdf.js
        const doc = await pdfjsLib.getDocument({data: buf}).promise;
        const lines = [];
        for(let p=1;p<=doc.numPages;p++){
          const page = await doc.getPage(p);
          const text = await page.getTextContent();
          const byY = new Map();
          for(const it of text.items){
            const str = it.str||""; if(!str) continue;
            const [a,b,c,d,e,f] = it.transform; // e=x, f=y
            const fs = Math.abs(d||10);
            const yk = Math.round(f);
            (byY.get(yk) || byY.set(yk,[]).get(yk)).push({str,x:e,y:f,w:it.width||0,fs});
          }
          for(const [yk, arr] of byY){
            arr.sort((u,v)=>u.x - v.x);
            const t = arr.map(x=>x.str).join("");
            const maxX = Math.max(...arr.map(x=>x.x + (x.w||0)));
            const fs = arr.reduce((s,x)=>s+x.fs,0)/arr.length || 10;
            lines.push({pageIndex:p-1,y:arr[0].y,text:t,maxX,fontSize:fs});
          }
        }

        // 2) Escribir con pdf-lib
        const out = await PDFLib.PDFDocument.load(buf);
        const fontReg = await out.embedFont(PDFLib.StandardFonts.Courier);
        const fontBold = await out.embedFont(PDFLib.StandardFonts.CourierBold);
        const rgbBlack = PDFLib.rgb(0,0,0);

        const findLines = (q)=>lines.filter(ln=>norm(ln.text).includes(norm(q)));

        // 2a) Añadir SOLO la leyenda junto a "SERIE ERITROIDE" (negrita)
        const serieHits = findLines("SERIE ERITROIDE");
        if(serieHits.length){
          const textLegend = species==="perro" ? "VALORES NORMALES (Perro)" : "VALORES NORMALES (Gato)";
          for(const ln of serieHits){
            const pg = out.getPage(ln.pageIndex);
            const size = ln.fontSize;
            pg.drawText(textLegend, { x: ln.maxX + 10, y: ln.y - size*0.25, size, font: fontBold, color: rgbBlack });
          }
          log(`Añadido rótulo de valores normales (${species}).`);
        }else{
          log("No se encontró “SERIE ERITROIDE”.");
        }

        // 2b) Para cada parámetro, escribir SOLO el valor de la especie seleccionada.
        //     Además, SALTAMOS la fila "SERIE ERITROIDE" para no duplicar el rótulo.
        let placed=0, missed=[];
        for(const {raw, perro, gato} of mapping.values()){
          if(norm(raw)===norm("SERIE ERITROIDE")) continue;          // evita duplicado
          const val = species==="perro" ? perro : gato;               // ← CLAVE: una sola columna
          if(!val) continue;
          const hits = findLines(raw);
          if(!hits.length){ missed.push(raw); continue; }
          for(const ln of hits){
            const pg = out.getPage(ln.pageIndex);
            const size = ln.fontSize;
            const pageW = pg.getWidth();
            const w = fontReg.widthOfTextAtSize(val, size);
            const x = (pageW - cm(RIGHT_SELECTED_CM)) - w;
            pg.drawText(val, { x, y: ln.y - size*0.25, size, font: fontReg, color: rgbBlack });
            placed++;
          }
        }

        // 3) Descargar
        const bytes = await out.save();
        const blob = new Blob([bytes], {type:"application/pdf"});
        const a=document.createElement("a");
        a.href=URL.createObjectURL(blob);
        a.download=file.name.replace(/\.pdf$/i,"")+"_mod.pdf";
        document.body.appendChild(a); a.click(); URL.revokeObjectURL(a.href); a.remove();

        log(`✅ Escrito(s): ${placed}. ${missed.length? "No encontrados: "+missed.slice(0,12).join(", ")+ (missed.length>12?"…":""):""}`);
      }catch(e){
        console.error(e); log(`❌ Error con ${file.name}: ${e.message}`);
      }
    }
  });
})();
</script>
</body>
</html>


<!-- Contenedor del footer -->
<div id="footer"></div>

<script>
  // Cargar footer.html y colocarlo en #footer
  fetch("footer.html")
    .then(response => {
      if (!response.ok) throw new Error("No se pudo cargar footer.html");
      return response.text();
    })
    .then(data => {
      document.getElementById("footer").innerHTML = data;
    })
    .catch(error => console.error("Error cargando el footer:", error));
</script>
