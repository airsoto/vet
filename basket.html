<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Torneo de Baloncesto</title>
    <link rel="stylesheet" type="text/css" href="estilo.css">
</head>
<body>
    <h1>Torneo de Baloncesto</h1>
    <button onclick="cambiarModo()">Cambiar a Modo Oscuro</button> <!-- Botón para cambiar el modo -->
    <div>
        <textarea id="participantes" placeholder="Nombres de los participantes, separados por comas"></textarea>
    </div>
    <div>
        <input type="number" id="numeroEquipos" placeholder="Número de Equipos">
    </div>
    <button onclick="distribuirEquipos()">Distribuir en Equipos</button>
    <div id="resultados"></div>
    <script src="script.js"></script>
</body>
</html>
