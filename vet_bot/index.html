<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#07080d">
  <meta name="color-scheme" content="dark">
  <title>VetBOT</title>

  <style>
    :root {
      --bg-1: #050609;
      --bg-2: #090b16;
      --bg-3: #0b0c2a;
      --panel: rgba(24, 26, 34, 0.88);
      --panel-strong: rgba(29, 31, 39, 0.98);
      --panel-soft: rgba(255, 255, 255, 0.045);
      --border: rgba(255, 255, 255, 0.10);
      --border-strong: rgba(255, 255, 255, 0.18);
      --text: #f6f7fb;
      --muted: #a9acb7;
      --muted-2: #777b89;
      --accent: #7f84ff;
      --accent-2: #54a2ff;
      --accent-soft: rgba(108, 116, 255, 0.18);
      --success: #6ad5a5;
      --warning: #f3c96d;
      --danger: #ff8585;
      --radius-xl: 30px;
      --radius-lg: 22px;
      --radius-md: 16px;
      --shadow: 0 24px 80px rgba(0, 0, 0, 0.42);
      --safe-top: max(18px, env(safe-area-inset-top));
      --safe-right: max(18px, env(safe-area-inset-right));
      --safe-bottom: max(18px, env(safe-area-inset-bottom));
      --safe-left: max(18px, env(safe-area-inset-left));
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
      background: var(--bg-1);
      -webkit-text-size-adjust: 100%;
    }

    body {
      margin: 0;
      min-height: 100dvh;
      overflow-x: hidden;
      color: var(--text);
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "SF Pro Text",
        "Helvetica Neue",
        Arial,
        sans-serif;
      background:
        radial-gradient(
          920px 520px at 50% 36%,
          rgba(39, 33, 135, 0.48) 0%,
          rgba(22, 20, 82, 0.30) 30%,
          rgba(7, 8, 16, 0.02) 70%
        ),
        radial-gradient(
          700px 430px at 80% 12%,
          rgba(17, 50, 120, 0.18) 0%,
          transparent 68%
        ),
        linear-gradient(145deg, var(--bg-1) 0%, var(--bg-2) 52%, #05060a 100%);
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        linear-gradient(
          120deg,
          transparent 0%,
          rgba(255, 255, 255, 0.012) 42%,
          transparent 72%
        );
      mix-blend-mode: screen;
    }

    button,
    textarea {
      font: inherit;
    }

    button {
      -webkit-tap-highlight-color: transparent;
    }

    .app-shell {
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      padding:
        var(--safe-top)
        var(--safe-right)
        var(--safe-bottom)
        var(--safe-left);
    }

    .topbar {
      position: relative;
      z-index: 15;
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 46px;
    }

    .icon-button {
      width: 44px;
      height: 44px;
      display: inline-grid;
      place-items: center;
      border: 1px solid var(--border);
      border-radius: 15px;
      color: var(--text);
      background: rgba(18, 20, 28, 0.72);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      cursor: pointer;
      transition:
        transform 160ms ease,
        background 160ms ease,
        border-color 160ms ease;
    }

    .icon-button:hover {
      background: rgba(32, 35, 46, 0.92);
      border-color: var(--border-strong);
      transform: translateY(-1px);
    }

    .icon-button:active {
      transform: scale(0.96);
    }

    .icon-button svg {
      width: 21px;
      height: 21px;
    }

    .brand-mark {
      display: flex;
      align-items: center;
      gap: 9px;
      color: var(--muted);
      font-size: 12px;
      letter-spacing: 0.02em;
      user-select: none;
    }

    .brand-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: linear-gradient(145deg, var(--accent), var(--accent-2));
      box-shadow: 0 0 18px rgba(103, 123, 255, 0.82);
    }

    .spacer-button {
      width: 44px;
      height: 44px;
    }

    .main {
      width: min(920px, 100%);
      flex: 1;
      align-self: center;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: clamp(38px, 8vh, 92px) 0 clamp(34px, 7vh, 72px);
      transition: justify-content 240ms ease, padding 240ms ease;
    }

    body.has-answer .main {
      justify-content: flex-start;
      padding-top: clamp(34px, 6vh, 62px);
    }

    .hero {
      width: 100%;
      text-align: center;
      transition: transform 240ms ease;
    }

    .hero h1 {
      margin: 0;
      font-size: clamp(36px, 6vw, 66px);
      line-height: 1.03;
      letter-spacing: -0.047em;
      font-weight: 430;
      text-wrap: balance;
      text-shadow: 0 8px 45px rgba(89, 94, 255, 0.12);
    }

    .hero-subtitle {
      margin: 14px auto 0;
      max-width: 600px;
      color: var(--muted);
      font-size: clamp(13px, 2vw, 15px);
      line-height: 1.55;
    }

    .composer-wrap {
      width: min(760px, 100%);
      margin: clamp(34px, 6vh, 52px) auto 0;
    }

    .composer {
      position: relative;
      display: flex;
      align-items: flex-end;
      min-height: 74px;
      padding: 10px 10px 10px 20px;
      border: 1px solid var(--border);
      border-radius: var(--radius-xl);
      background:
        linear-gradient(
          180deg,
          rgba(34, 36, 45, 0.94),
          rgba(25, 27, 35, 0.94)
        );
      box-shadow:
        0 22px 80px rgba(0, 0, 0, 0.28),
        inset 0 1px 0 rgba(255, 255, 255, 0.035);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      transition:
        border-color 180ms ease,
        box-shadow 180ms ease,
        transform 180ms ease;
    }

    .composer:focus-within {
      border-color: rgba(118, 125, 255, 0.56);
      box-shadow:
        0 22px 90px rgba(0, 0, 0, 0.34),
        0 0 0 4px rgba(105, 113, 255, 0.10),
        0 0 56px rgba(47, 49, 159, 0.20);
      transform: translateY(-1px);
    }

    .composer-icon {
      flex: 0 0 auto;
      width: 27px;
      height: 52px;
      display: grid;
      place-items: center;
      color: var(--muted);
      pointer-events: none;
    }

    .composer-icon svg {
      width: 20px;
      height: 20px;
    }

    #question {
      flex: 1 1 auto;
      width: 100%;
      min-height: 52px;
      max-height: 180px;
      padding: 15px 12px 13px;
      resize: none;
      overflow-y: auto;
      border: 0;
      outline: 0;
      color: var(--text);
      background: transparent;
      font-size: 16px;
      line-height: 1.45;
      caret-color: #9ba0ff;
    }

    #question::placeholder {
      color: #9a9da8;
      opacity: 1;
    }

    .send-button {
      position: relative;
      flex: 0 0 auto;
      width: 54px;
      height: 54px;
      display: grid;
      place-items: center;
      border: 1px solid rgba(142, 148, 255, 0.38);
      border-radius: 50%;
      color: white;
      background:
        radial-gradient(
          circle at 35% 30%,
          rgba(152, 159, 255, 0.98),
          rgba(89, 97, 224, 0.96) 46%,
          rgba(58, 64, 170, 0.98) 100%
        );
      box-shadow:
        0 10px 32px rgba(71, 78, 210, 0.34),
        inset 0 1px 0 rgba(255, 255, 255, 0.30);
      cursor: pointer;
      transition:
        transform 160ms ease,
        filter 160ms ease,
        opacity 160ms ease;
    }

    .send-button:hover {
      transform: translateY(-1px) scale(1.02);
      filter: brightness(1.08);
    }

    .send-button:active {
      transform: scale(0.96);
    }

    .send-button:disabled {
      cursor: wait;
      opacity: 0.92;
    }

    .send-button svg {
      width: 25px;
      height: 25px;
    }

    .ai-static-icon {
      display: block;
    }

    .thinking-icon {
      position: relative;
      display: none;
      width: 27px;
      height: 27px;
    }

    .thinking-icon span {
      position: absolute;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: white;
      box-shadow: 0 0 10px rgba(255, 255, 255, 0.45);
      animation: thinkOrbit 1.15s infinite ease-in-out;
    }

    .thinking-icon span:nth-child(1) {
      left: 1px;
      top: 10px;
      animation-delay: -0.24s;
    }

    .thinking-icon span:nth-child(2) {
      left: 10px;
      top: 1px;
      animation-delay: -0.12s;
    }

    .thinking-icon span:nth-child(3) {
      right: 1px;
      top: 10px;
    }

    .send-button.is-thinking .ai-static-icon {
      display: none;
    }

    .send-button.is-thinking .thinking-icon {
      display: block;
    }

    @keyframes thinkOrbit {
      0%, 100% {
        transform: scale(0.72);
        opacity: 0.42;
      }
      50% {
        transform: scale(1.16);
        opacity: 1;
      }
    }

    .composer-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      margin: 11px 8px 0;
      color: var(--muted-2);
      font-size: 11px;
      line-height: 1.4;
    }

    #statusText {
      min-height: 16px;
    }

    .memory-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
    }

    .memory-pill::before {
      content: "";
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--muted-2);
    }

    .memory-pill.active::before {
      background: var(--success);
      box-shadow: 0 0 10px rgba(106, 213, 165, 0.48);
    }

    .answer-area {
      width: min(820px, 100%);
      margin: 32px auto 0;
      display: none;
      animation: answerIn 280ms ease both;
    }

    .answer-area.visible {
      display: block;
    }

    @keyframes answerIn {
      from {
        opacity: 0;
        transform: translateY(12px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .answer-card {
      overflow: hidden;
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      background:
        linear-gradient(
          155deg,
          rgba(25, 27, 38, 0.94),
          rgba(13, 15, 24, 0.96)
        );
      box-shadow: var(--shadow);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
    }

    .answer-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
      padding: 20px 22px 16px;
      border-bottom: 1px solid var(--border);
    }

    .answer-heading-wrap {
      min-width: 0;
    }

    .answer-kicker {
      margin-bottom: 6px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 650;
      letter-spacing: 0.09em;
      text-transform: uppercase;
    }

    #answerTitle {
      margin: 0;
      font-size: clamp(20px, 3vw, 28px);
      line-height: 1.18;
      letter-spacing: -0.025em;
      font-weight: 610;
      overflow-wrap: anywhere;
    }

    .evidence-badge {
      flex: 0 0 auto;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      min-height: 29px;
      padding: 0 10px;
      border: 1px solid var(--border);
      border-radius: 999px;
      color: var(--muted);
      background: var(--panel-soft);
      font-size: 11px;
      white-space: nowrap;
    }

    .evidence-badge::before {
      content: "";
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--muted-2);
    }

    .evidence-badge[data-status="suficiente"]::before {
      background: var(--success);
    }

    .evidence-badge[data-status="parcial"]::before {
      background: var(--warning);
    }

    .evidence-badge[data-status="insuficiente"]::before {
      background: var(--danger);
    }

    .answer-body {
      padding: 22px;
    }

    .direct-answer {
      margin: 0;
      padding: 18px 19px;
      border: 1px solid rgba(123, 130, 255, 0.20);
      border-radius: var(--radius-md);
      background:
        linear-gradient(
          145deg,
          rgba(89, 96, 224, 0.13),
          rgba(74, 85, 170, 0.055)
        );
      font-size: 16px;
      line-height: 1.68;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .answer-section {
      margin-top: 20px;
    }

    .answer-section h3 {
      margin: 0 0 10px;
      color: #e9eafd;
      font-size: 15px;
      line-height: 1.35;
      letter-spacing: -0.012em;
      font-weight: 650;
    }

    .answer-section p {
      margin: 0;
      color: #d7d9e1;
      font-size: 14px;
      line-height: 1.7;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .bullet-list {
      display: grid;
      gap: 9px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .bullet-list li {
      position: relative;
      padding-left: 18px;
      color: #d7d9e1;
      font-size: 14px;
      line-height: 1.62;
      overflow-wrap: anywhere;
    }

    .bullet-list li::before {
      content: "";
      position: absolute;
      left: 2px;
      top: 0.69em;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: linear-gradient(145deg, var(--accent), var(--accent-2));
      box-shadow: 0 0 9px rgba(111, 120, 255, 0.32);
    }

    .notice {
      margin-top: 18px;
      padding: 15px 16px;
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      background: rgba(255, 255, 255, 0.035);
    }

    .notice.warning {
      border-color: rgba(243, 201, 109, 0.24);
      background: rgba(243, 201, 109, 0.06);
    }

    .notice.danger {
      border-color: rgba(255, 133, 133, 0.24);
      background: rgba(255, 133, 133, 0.06);
    }

    .notice h3 {
      margin: 0 0 9px;
      font-size: 13px;
      font-weight: 680;
    }

    .source-panel {
      margin-top: 20px;
      border-top: 1px solid var(--border);
      padding-top: 18px;
    }

    .source-panel summary {
      display: flex;
      align-items: center;
      gap: 9px;
      color: var(--muted);
      font-size: 12px;
      cursor: pointer;
      user-select: none;
      list-style: none;
    }

    .source-panel summary::-webkit-details-marker {
      display: none;
    }

    .source-panel summary::before {
      content: "›";
      display: inline-grid;
      place-items: center;
      width: 19px;
      height: 19px;
      border: 1px solid var(--border);
      border-radius: 6px;
      transform: rotate(0deg);
      transition: transform 160ms ease;
    }

    .source-panel[open] summary::before {
      transform: rotate(90deg);
    }

    .source-list {
      display: grid;
      gap: 9px;
      margin-top: 13px;
    }

    .source-item {
      padding: 12px 13px;
      border: 1px solid var(--border);
      border-radius: 13px;
      background: rgba(255, 255, 255, 0.028);
    }

    .source-name {
      color: #e8e9ef;
      font-size: 12px;
      font-weight: 650;
      overflow-wrap: anywhere;
    }

    .source-meta {
      margin-top: 5px;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.55;
      overflow-wrap: anywhere;
    }

    .answer-actions {
      display: flex;
      justify-content: flex-end;
      gap: 9px;
      padding: 0 22px 20px;
    }

    .subtle-button {
      min-height: 38px;
      padding: 0 13px;
      border: 1px solid var(--border);
      border-radius: 12px;
      color: var(--muted);
      background: rgba(255, 255, 255, 0.035);
      cursor: pointer;
      transition:
        background 160ms ease,
        color 160ms ease,
        border-color 160ms ease;
    }

    .subtle-button:hover {
      color: var(--text);
      border-color: var(--border-strong);
      background: rgba(255, 255, 255, 0.065);
    }

    .error-card {
      padding: 18px;
      border: 1px solid rgba(255, 133, 133, 0.30);
      border-radius: var(--radius-lg);
      color: #ffd2d2;
      background: rgba(105, 28, 40, 0.24);
      box-shadow: var(--shadow);
      font-size: 14px;
      line-height: 1.6;
    }

    footer {
      text-align: center;
      color: var(--muted-2);
      font-size: 10px;
      line-height: 1.5;
      letter-spacing: 0.01em;
    }

    footer a {
      color: inherit;
      text-decoration: none;
    }

    footer a:hover {
      color: var(--muted);
    }

    .drawer-backdrop {
      position: fixed;
      inset: 0;
      z-index: 39;
      display: none;
      background: rgba(0, 0, 0, 0.54);
      backdrop-filter: blur(5px);
      -webkit-backdrop-filter: blur(5px);
      opacity: 0;
      transition: opacity 180ms ease;
    }

    .drawer-backdrop.visible {
      display: block;
      opacity: 1;
    }

    .drawer {
      position: fixed;
      z-index: 40;
      inset: 0 auto 0 0;
      width: min(360px, 88vw);
      display: flex;
      flex-direction: column;
      padding:
        var(--safe-top)
        16px
        var(--safe-bottom)
        var(--safe-left);
      border-right: 1px solid var(--border);
      background:
        linear-gradient(
          180deg,
          rgba(17, 19, 28, 0.98),
          rgba(8, 10, 17, 0.99)
        );
      box-shadow: 26px 0 80px rgba(0, 0, 0, 0.46);
      transform: translateX(-104%);
      transition: transform 220ms ease;
    }

    .drawer.open {
      transform: translateX(0);
    }

    .drawer-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      min-height: 48px;
    }

    .drawer-header h2 {
      margin: 0;
      font-size: 19px;
      font-weight: 620;
      letter-spacing: -0.02em;
    }

    .drawer-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 9px;
      margin: 18px 0 14px;
    }

    .drawer-action {
      min-height: 42px;
      border: 1px solid var(--border);
      border-radius: 13px;
      color: var(--muted);
      background: rgba(255, 255, 255, 0.035);
      cursor: pointer;
    }

    .drawer-action:hover {
      color: var(--text);
      border-color: var(--border-strong);
    }

    .history-list {
      flex: 1;
      overflow-y: auto;
      display: grid;
      align-content: start;
      gap: 9px;
      padding-right: 3px;
    }

    .history-empty {
      padding: 26px 12px;
      color: var(--muted-2);
      font-size: 13px;
      line-height: 1.55;
      text-align: center;
    }

    .history-item {
      width: 100%;
      padding: 13px 14px;
      border: 1px solid var(--border);
      border-radius: 14px;
      color: var(--text);
      background: rgba(255, 255, 255, 0.026);
      text-align: left;
      cursor: pointer;
      transition:
        background 150ms ease,
        border-color 150ms ease,
        transform 150ms ease;
    }

    .history-item:hover {
      background: rgba(255, 255, 255, 0.055);
      border-color: var(--border-strong);
      transform: translateX(2px);
    }

    .history-question {
      display: -webkit-box;
      overflow: hidden;
      color: #e7e8ef;
      font-size: 13px;
      line-height: 1.45;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
    }

    .history-time {
      margin-top: 7px;
      color: var(--muted-2);
      font-size: 10px;
    }

    .drawer-note {
      margin: 13px 4px 0;
      color: var(--muted-2);
      font-size: 10px;
      line-height: 1.5;
      text-align: center;
    }

    @media (max-width: 680px) {
      .app-shell {
        padding-left: max(13px, env(safe-area-inset-left));
        padding-right: max(13px, env(safe-area-inset-right));
      }

      .main {
        padding-top: clamp(34px, 9vh, 72px);
        padding-bottom: 46px;
      }

      body.has-answer .main {
        padding-top: 28px;
      }

      .hero h1 {
        font-size: clamp(34px, 10vw, 48px);
      }

      .hero-subtitle {
        max-width: 330px;
        font-size: 13px;
      }

      .composer-wrap {
        margin-top: 28px;
      }

      .composer {
        min-height: 70px;
        padding-left: 15px;
        border-radius: 25px;
      }

      .composer-icon {
        width: 22px;
      }

      #question {
        font-size: 16px;
        padding-left: 9px;
        padding-right: 9px;
      }

      .send-button {
        width: 50px;
        height: 50px;
      }

      .composer-meta {
        align-items: flex-start;
      }

      .answer-area {
        margin-top: 26px;
      }

      .answer-header {
        padding: 18px 17px 15px;
      }

      .answer-header {
        flex-direction: column;
        align-items: flex-start;
      }

      .answer-body {
        padding: 17px;
      }

      .answer-actions {
        padding: 0 17px 17px;
      }

      .direct-answer {
        font-size: 15px;
      }
    }

    @media (max-width: 410px) {
      .brand-mark span:last-child {
        display: none;
      }

      .composer-meta {
        font-size: 10px;
      }

      .answer-actions {
        justify-content: stretch;
      }

      .subtle-button {
        flex: 1;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        animation-duration: 0.001ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.001ms !important;
      }
    }

    @media print {
      body {
        background: white;
        color: black;
      }

      .topbar,
      .hero,
      .composer-wrap,
      footer,
      .answer-actions,
      .drawer,
      .drawer-backdrop {
        display: none !important;
      }

      .app-shell,
      .main,
      .answer-area {
        display: block;
        width: 100%;
        padding: 0;
        margin: 0;
      }

      .answer-card {
        color: black;
        background: white;
        border: 0;
        box-shadow: none;
      }

      .answer-header,
      .answer-body {
        padding-left: 0;
        padding-right: 0;
      }

      .direct-answer,
      .notice,
      .source-item {
        color: black;
        background: white;
        border-color: #bbb;
      }

      .answer-section p,
      .bullet-list li,
      .source-name,
      .source-meta {
        color: black;
      }
    }
  </style>
</head>

<body>
  <div class="drawer-backdrop" id="drawerBackdrop"></div>

  <aside class="drawer" id="drawer" aria-hidden="true">
    <div class="drawer-header">
      <h2>Preguntas de la sesión</h2>
      <button class="icon-button" id="closeDrawer" type="button" aria-label="Cerrar menú">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        </svg>
      </button>
    </div>

    <div class="drawer-actions">
      <button class="drawer-action" id="newConversation" type="button">
        Nueva conversación
      </button>
      <button class="drawer-action" id="clearHistory" type="button">
        Borrar historial
      </button>
    </div>

    <div class="history-list" id="historyList"></div>

    <p class="drawer-note">
      El historial y la memoria se conservan únicamente durante esta sesión del navegador.
    </p>
  </aside>

  <div class="app-shell">
    <header class="topbar">
      <button class="icon-button" id="openDrawer" type="button" aria-label="Abrir historial">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M4.5 7h15M4.5 12h15M4.5 17h10" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        </svg>
      </button>

      <div class="brand-mark" aria-label="VetBOT">
        <span class="brand-dot"></span>
        <span></span>
      </div>

      <div class="spacer-button" aria-hidden="true"></div>
    </header>

    <main class="main">
      <section class="hero">
        <h1>Haz tu pregunta a VetBOT</h1>
        <p class="hero-subtitle">
        </p>
      </section>

      <section class="composer-wrap" aria-label="Consulta veterinaria">
        <form id="askForm" novalidate>
          <div class="composer">
            <span class="composer-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none">
                <path d="M12 3v18M3 12h18" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
              </svg>
            </span>

            <textarea
              id="question"
              maxlength="2000"
              rows="1"
              enterkeyhint="send"
              autocomplete="off"
              autocapitalize="sentences"
              spellcheck="true"
              aria-label="Pregunta para VetBOT"
              placeholder="Escribe una pregunta clínica…"
              required></textarea>

            <button class="send-button" id="sendButton" type="submit" aria-label="Enviar pregunta">
              <span class="ai-static-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none">
                  <path d="M12 2.8l1.45 4.05a4.3 4.3 0 0 0 2.6 2.6L20.1 10.9l-4.05 1.45a4.3 4.3 0 0 0-2.6 2.6L12 19l-1.45-4.05a4.3 4.3 0 0 0-2.6-2.6L3.9 10.9l4.05-1.45a4.3 4.3 0 0 0 2.6-2.6L12 2.8Z"
                    stroke="currentColor" stroke-width="1.55" stroke-linejoin="round"/>
                  <path d="M18.4 3.8l.55 1.55a1.65 1.65 0 0 0 1 1l1.55.55-1.55.55a1.65 1.65 0 0 0-1 1L18.4 10l-.55-1.55a1.65 1.65 0 0 0-1-1L15.3 6.9l1.55-.55a1.65 1.65 0 0 0 1-1l.55-1.55Z"
                    fill="currentColor"/>
                </svg>
              </span>

              <span class="thinking-icon" aria-hidden="true">
                <span></span><span></span><span></span>
              </span>
            </button>
          </div>

          <div class="composer-meta">
            <span id="statusText">Intro para enviar · Mayús + Intro para nueva línea</span>
            <span class="memory-pill" id="memoryPill">Memoria nueva</span>
          </div>
        </form>
      </section>

      <section class="answer-area" id="answerArea" aria-live="polite"></section>
    </main>

    <footer>
      Desarrollado por Ángel Soto ·
      <a href="mailto:airsoto@googlemail.com">airsoto@googlemail.com</a>
    </footer>
  </div>

  <script>
    "use strict";

    const API_URL = "https://vetbot.airsoto.workers.dev/ask";

    const STORAGE_KEYS = {
      responseId: "vetbot.previousResponseId",
      history: "vetbot.sessionHistory",
      sessionId: "vetbot.sessionId"
    };

    const form = document.getElementById("askForm");
    const question = document.getElementById("question");
    const sendButton = document.getElementById("sendButton");
    const statusText = document.getElementById("statusText");
    const memoryPill = document.getElementById("memoryPill");
    const answerArea = document.getElementById("answerArea");

    const drawer = document.getElementById("drawer");
    const drawerBackdrop = document.getElementById("drawerBackdrop");
    const openDrawerButton = document.getElementById("openDrawer");
    const closeDrawerButton = document.getElementById("closeDrawer");
    const historyList = document.getElementById("historyList");
    const newConversationButton = document.getElementById("newConversation");
    const clearHistoryButton = document.getElementById("clearHistory");

    let isLoading = false;
    let history = loadHistory();
    let sessionId = getOrCreateSessionId();

    renderHistory();
    updateMemoryState();
    autoResizeTextarea();

    question.addEventListener("input", autoResizeTextarea);

    question.addEventListener("keydown", (event) => {
      if (
        event.key === "Enter" &&
        !event.shiftKey &&
        !event.isComposing
      ) {
        event.preventDefault();
        form.requestSubmit();
      }
    });

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      if (isLoading) return;

      const text = question.value.trim();

      if (!text) {
        setStatus("Escribe una pregunta antes de enviarla.", "error");
        question.focus();
        return;
      }

      await askVetBot(text);
    });

    openDrawerButton.addEventListener("click", openDrawer);
    closeDrawerButton.addEventListener("click", closeDrawer);
    drawerBackdrop.addEventListener("click", closeDrawer);

    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape" && drawer.classList.contains("open")) {
        closeDrawer();
      }
    });

    newConversationButton.addEventListener("click", () => {
      sessionStorage.removeItem(STORAGE_KEYS.responseId);
      answerArea.classList.remove("visible");
      answerArea.replaceChildren();
      document.body.classList.remove("has-answer");
      question.value = "";
      autoResizeTextarea();
      updateMemoryState();
      setStatus("Nueva conversación iniciada.");
      closeDrawer();
      question.focus();
    });

    clearHistoryButton.addEventListener("click", () => {
      history = [];
      sessionStorage.removeItem(STORAGE_KEYS.history);
      renderHistory();
    });

    async function askVetBot(text) {
      setLoading(true);
      clearAnswer();
      setStatus("VetBOT está pensando…");

      const previousResponseId =
        sessionStorage.getItem(STORAGE_KEYS.responseId) || "";

      const payload = {
        question: text,
        sessionId
      };

      if (previousResponseId) {
        payload.previousResponseId = previousResponseId;
      }

      try {
        const response = await fetch(API_URL, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "X-Vetbot-Session": sessionId
          },
          body: JSON.stringify(payload)
        });

        let data;

        try {
          data = await response.json();
        } catch {
          throw new Error("El Worker devolvió una respuesta no interpretable.");
        }

        if (!response.ok) {
          throw new Error(
            data?.error || `Error HTTP ${response.status}`
          );
        }

        const responseId =
          data?.responseId ||
          data?.interactionId ||
          "";

        if (responseId) {
          sessionStorage.setItem(
            STORAGE_KEYS.responseId,
            responseId
          );
        }

        const historyItem = {
          id: crypto.randomUUID(),
          askedAt: new Date().toISOString(),
          question: text,
          data
        };

        history.unshift(historyItem);
        history = history.slice(0, 40);
        saveHistory();
        renderHistory();

        renderAnswer(data);
        question.value = "";
        autoResizeTextarea();
        updateMemoryState();

        const modelText = data?.model
          ? ` · ${data.model}`
          : "";

        setStatus(
          data?.contextReset
            ? `Contexto anterior caducado; se inició una conversación nueva${modelText}`
            : `Respuesta completada${modelText}`
        );
      } catch (error) {
        renderError(
          error instanceof Error
            ? error.message
            : "No se pudo completar la consulta."
        );

        setStatus("No se pudo completar la consulta.", "error");
      } finally {
        setLoading(false);
      }
    }

    function renderAnswer(data) {
      answerArea.replaceChildren();
      answerArea.classList.add("visible");
      document.body.classList.add("has-answer");

      const structured = data?.structured;

      if (
        structured &&
        typeof structured === "object" &&
        typeof structured.directAnswer === "string"
      ) {
        renderStructuredAnswer(data, structured);
      } else {
        renderPlainAnswer(data);
      }

      requestAnimationFrame(() => {
        answerArea.scrollIntoView({
          behavior: "smooth",
          block: "start"
        });
      });
    }

    function renderStructuredAnswer(data, structured) {
      const card = element("article", "answer-card");

      const header = element("header", "answer-header");
      const titleWrap = element("div", "answer-heading-wrap");
      const kicker = element("div", "answer-kicker", "Respuesta bibliográfica");
      const title = element(
        "h2",
        "",
        structured.title || "Respuesta de VetBOT"
      );
      title.id = "answerTitle";

      titleWrap.append(kicker, title);

      const evidence = element(
        "span",
        "evidence-badge",
        evidenceLabel(structured.evidenceStatus)
      );
      evidence.dataset.status =
        structured.evidenceStatus || "parcial";

      header.append(titleWrap, evidence);

      const body = element("div", "answer-body");

      const direct = element(
        "p",
        "direct-answer",
        structured.directAnswer
      );
      body.append(direct);

      appendListSection(
        body,
        "Puntos clave",
        structured.keyPoints
      );

      if (Array.isArray(structured.sections)) {
        for (const section of structured.sections) {
          if (!section?.heading || !section?.content) continue;

          const block = element("section", "answer-section");
          block.append(
            element("h3", "", section.heading),
            element("p", "", section.content)
          );
          body.append(block);
        }
      }

      appendNotice(
        body,
        "Precauciones y señales de alarma",
        structured.clinicalAlerts,
        "danger"
      );

      appendNotice(
        body,
        "Datos clínicos que faltan",
        structured.missingClinicalData,
        "warning"
      );

      appendNotice(
        body,
        "Limitaciones de la evidencia",
        structured.limitations,
        ""
      );

      appendSources(body, data?.sources);

      const actions = buildAnswerActions(
        structuredToText(structured)
      );

      card.append(header, body, actions);
      answerArea.append(card);
    }

    function renderPlainAnswer(data) {
      const card = element("article", "answer-card");

      const header = element("header", "answer-header");
      const titleWrap = element("div", "answer-heading-wrap");
      titleWrap.append(
        element("div", "answer-kicker", "Respuesta bibliográfica"),
        element("h2", "", "VetBOT")
      );
      header.append(titleWrap);

      const body = element("div", "answer-body");
      body.append(
        element(
          "p",
          "direct-answer",
          data?.answer || "No se recibió una respuesta."
        )
      );

      appendSources(body, data?.sources);

      const actions = buildAnswerActions(
        data?.answer || ""
      );

      card.append(header, body, actions);
      answerArea.append(card);
    }

    function appendListSection(parent, heading, items) {
      if (!Array.isArray(items) || items.length === 0) return;

      const section = element("section", "answer-section");
      section.append(element("h3", "", heading));

      const list = element("ul", "bullet-list");

      for (const item of items) {
        if (!item) continue;
        list.append(element("li", "", String(item)));
      }

      section.append(list);
      parent.append(section);
    }

    function appendNotice(parent, heading, items, variant) {
      if (!Array.isArray(items) || items.length === 0) return;

      const box = element(
        "section",
        `notice ${variant}`.trim()
      );
      box.append(element("h3", "", heading));

      const list = element("ul", "bullet-list");

      for (const item of items) {
        if (!item) continue;
        list.append(element("li", "", String(item)));
      }

      box.append(list);
      parent.append(box);
    }

    function appendSources(parent, sources) {
      if (!Array.isArray(sources) || sources.length === 0) return;

      const details = element("details", "source-panel");
      const summary = element(
        "summary",
        "",
        `Fuentes recuperadas (${sources.length})`
      );
      const list = element("div", "source-list");

      for (const source of sources) {
        const item = element("article", "source-item");
        const name = element(
          "div",
          "source-name",
          source?.fileName || "Documento de la biblioteca"
        );

        const metaParts = [];

        if (source?.pageNumber) {
          metaParts.push(`Página ${source.pageNumber}`);
        }

        if (typeof source?.score === "number") {
          metaParts.push(
            `Relevancia ${Math.round(source.score * 100)} %`
          );
        }

        if (source?.excerpt) {
          metaParts.push(source.excerpt);
        }

        item.append(name);

        if (metaParts.length) {
          item.append(
            element(
              "div",
              "source-meta",
              metaParts.join(" · ")
            )
          );
        }

        list.append(item);
      }

      details.append(summary, list);
      parent.append(details);
    }

    function buildAnswerActions(text) {
      const actions = element("div", "answer-actions");

      const copyButton = element(
        "button",
        "subtle-button",
        "Copiar"
      );
      copyButton.type = "button";
      copyButton.addEventListener("click", async () => {
        try {
          await navigator.clipboard.writeText(text);
          copyButton.textContent = "Copiado";
          window.setTimeout(() => {
            copyButton.textContent = "Copiar";
          }, 1400);
        } catch {
          setStatus("No se pudo copiar el texto.", "error");
        }
      });

      const printButton = element(
        "button",
        "subtle-button",
        "Imprimir"
      );
      printButton.type = "button";
      printButton.addEventListener("click", () => window.print());

      actions.append(copyButton, printButton);
      return actions;
    }

    function renderError(message) {
      answerArea.replaceChildren();
      answerArea.classList.add("visible");
      document.body.classList.add("has-answer");
      answerArea.append(
        element("div", "error-card", message)
      );
    }

    function clearAnswer() {
      answerArea.classList.remove("visible");
      answerArea.replaceChildren();
    }

    function setLoading(active) {
      isLoading = active;
      sendButton.disabled = active;
      sendButton.classList.toggle("is-thinking", active);
      question.readOnly = active;
      sendButton.setAttribute(
        "aria-label",
        active ? "VetBOT está pensando" : "Enviar pregunta"
      );
    }

    function setStatus(message, type = "normal") {
      statusText.textContent = message;
      statusText.style.color =
        type === "error" ? "var(--danger)" : "";
    }

    function updateMemoryState() {
      const active = Boolean(
        sessionStorage.getItem(STORAGE_KEYS.responseId)
      );

      memoryPill.classList.toggle("active", active);
      memoryPill.textContent =
        active ? "Memoria activa" : "Memoria nueva";
    }

    function autoResizeTextarea() {
      question.style.height = "auto";
      question.style.height =
        `${Math.min(question.scrollHeight, 180)}px`;
    }

    function openDrawer() {
      drawer.classList.add("open");
      drawerBackdrop.classList.add("visible");
      drawer.setAttribute("aria-hidden", "false");
      document.body.style.overflow = "hidden";
    }

    function closeDrawer() {
      drawer.classList.remove("open");
      drawerBackdrop.classList.remove("visible");
      drawer.setAttribute("aria-hidden", "true");
      document.body.style.overflow = "";
    }

    function renderHistory() {
      historyList.replaceChildren();

      if (history.length === 0) {
        historyList.append(
          element(
            "div",
            "history-empty",
            "Todavía no hay preguntas en esta sesión."
          )
        );
        return;
      }

      for (const item of history) {
        const button = element("button", "history-item");
        button.type = "button";

        button.append(
          element(
            "div",
            "history-question",
            item.question || "Pregunta sin título"
          ),
          element(
            "div",
            "history-time",
            formatDate(item.askedAt)
          )
        );

        button.addEventListener("click", () => {
          if (item?.data) {
            renderAnswer(item.data);
            setStatus("Mostrando una respuesta anterior.");
          }

          closeDrawer();
        });

        historyList.append(button);
      }
    }

    function loadHistory() {
      try {
        const raw = sessionStorage.getItem(
          STORAGE_KEYS.history
        );

        const parsed = raw ? JSON.parse(raw) : [];

        return Array.isArray(parsed) ? parsed : [];
      } catch {
        return [];
      }
    }

    function saveHistory() {
      try {
        sessionStorage.setItem(
          STORAGE_KEYS.history,
          JSON.stringify(history)
        );
      } catch {
        history = history.slice(0, 10);

        try {
          sessionStorage.setItem(
            STORAGE_KEYS.history,
            JSON.stringify(history)
          );
        } catch {
          // El historial es opcional; la consulta puede continuar.
        }
      }
    }

    function getOrCreateSessionId() {
      let value = sessionStorage.getItem(
        STORAGE_KEYS.sessionId
      );

      if (!value) {
        value = crypto.randomUUID();
        sessionStorage.setItem(
          STORAGE_KEYS.sessionId,
          value
        );
      }

      return value;
    }

    function formatDate(isoDate) {
      const date = new Date(isoDate);

      if (Number.isNaN(date.getTime())) {
        return "Esta sesión";
      }

      return new Intl.DateTimeFormat("es-ES", {
        hour: "2-digit",
        minute: "2-digit"
      }).format(date);
    }

    function evidenceLabel(status) {
      const labels = {
        suficiente: "Evidencia suficiente",
        parcial: "Evidencia parcial",
        insuficiente: "Evidencia insuficiente"
      };

      return labels[status] || "Evidencia bibliográfica";
    }

    function structuredToText(structured) {
      const lines = [
        structured.title || "VetBOT",
        "",
        structured.directAnswer || ""
      ];

      appendTextList(lines, "Puntos clave", structured.keyPoints);

      if (Array.isArray(structured.sections)) {
        for (const section of structured.sections) {
          if (!section?.heading || !section?.content) continue;

          lines.push(
            "",
            section.heading,
            section.content
          );
        }
      }

      appendTextList(
        lines,
        "Precauciones y señales de alarma",
        structured.clinicalAlerts
      );

      appendTextList(
        lines,
        "Datos clínicos que faltan",
        structured.missingClinicalData
      );

      appendTextList(
        lines,
        "Limitaciones de la evidencia",
        structured.limitations
      );

      return lines.join("\n").trim();
    }

    function appendTextList(lines, heading, items) {
      if (!Array.isArray(items) || items.length === 0) return;

      lines.push("", heading);

      for (const item of items) {
        lines.push(`• ${item}`);
      }
    }

    function element(tag, className = "", text = "") {
      const node = document.createElement(tag);

      if (className) {
        node.className = className;
      }

      if (text !== "") {
        node.textContent = text;
      }

      return node;
    }
  </script>
</body>
</html>
