<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Buscador de Artículos Veterinarios</title>
  <style>
    body {
      background-color: #121212;
      color: #f0f0f0;
      font-family: 'Georgia', serif;
      margin: 0;
      padding: 2em;
    }
    h1 {
      text-align: center;
      color: #90caf9;
    }
    .search-section {
      display: flex;
      gap: 1em;
      justify-content: center;
      flex-wrap: wrap;
      margin-bottom: 2em;
    }
    input, select, button {
      padding: 0.5em;
      font-size: 1em;
      border-radius: 5px;
      border: none;
    }
    input, select {
      width: 200px;
    }
    button {
      background-color: #1e88e5;
      color: white;
      cursor: pointer;
    }
    .results {
      margin-top: 2em;
    }
    .article {
      background-color: #1e1e1e;
      padding: 1.5em;
      border-left: 4px solid #90caf9;
      margin-bottom: 2em;
      border-radius: 8px;
    }
    .latex-style {
      font-family: 'Times New Roman', serif;
      background-color: #222;
      padding: 1em;
      border: 1px solid #555;
      border-radius: 6px;
      margin-top: 1em;
    }
    .email-section {
      margin-top: 1em;
    }
  </style>
</head>
<body>
  <h1>Buscador de Artículos Veterinarios</h1>
  <div class="search-section">
    <select id="search-type">
      <option value="title">Título</option>
      <option value="authors">Autor</option>
      <option value="journal">Revista</option>
    </select>
    <input type="text" id="search-input" placeholder="Buscar...">
    <button onclick="search()">Buscar</button>
  </div>

  <div id="results" class="results"></div>

  <script>
    let articles = [];

    fetch('papers.json')
      .then(res => res.json())
      .then(data => articles = data)
      .catch(err => console.error("Error cargando el archivo JSON:", err));

    function search() {
      const type = document.getElementById('search-type').value;
      const query = document.getElementById('search-input').value.toLowerCase();
      const resultsContainer = document.getElementById('results');
      resultsContainer.innerHTML = '';

      const filtered = articles.filter(article => {
        if (type === 'authors') {
          return article.authors.some(a => a.toLowerCase().includes(query));
        }
        return article[type].toLowerCase().includes(query);
      });

      if (filtered.length === 0) {
        resultsContainer.innerHTML = "<p>No se encontraron resultados.</p>";
        return;
      }

      filtered.forEach(article => {
        const div = document.createElement('div');
        div.className = 'article';
        div.innerHTML = `
          <div class="latex-style">
            <h2 style="text-align: center;">${article.title}</h2>
            <p style="text-align: center; font-style: italic;">${article.authors.join(', ')}</p>
            <p style="text-align: center; font-size: 0.95em;">${article.journal}, Vol. ${article.volume}(${article.issue}), ${article.year}</p>
            <h3 style="margin-top: 1.5em;">Resumen</h3>
            <p style="text-align: justify;">${article.abstract}</p>
          </div>
          <div class="email-section">
            <input type="email" placeholder="Tu email..." id="email-${article.title}" style="margin-top: 1em;"/>
            <button onclick="sendEmail('${article.title.replace(/'/g, "\'")}')">Enviar por correo</button>
          </div>
        `;
        resultsContainer.appendChild(div);
      });
    }

    function sendEmail(title) {
      const article = articles.find(a => a.title === title);
      const email = document.getElementById(`email-${title}`).value;

      if (!email || !email.includes('@')) {
        alert("Introduce un email válido.");
        return;
      }

      const subject = encodeURIComponent("Artículo Veterinario: " + article.title);
      const body = encodeURIComponent(`Título: ${article.title}\nAutores: ${article.authors.join(', ')}\nRevista: ${article.journal}, Vol. ${article.volume}(${article.issue}), ${article.year}\n\nResumen:\n${article.abstract}`);
      const mailto = `mailto:${email}?subject=${subject}&body=${body}`;
      window.location.href = mailto;
    }
  </script>
</body>
</html>
