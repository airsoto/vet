<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>🎵 Juego Spotify Year Guess</title>
<style>
  :root{
    --bg:#0b1118; --panel:#101826; --ink:#e6edf3;
    --accent:#7cc7ff; --error:#f87171; --success:#4ade80;
    --btn:#18253a; --btnHover:#20314a; --btnText:#e6edf3;
    --ring:#2b3d5c;
  }
  *{box-sizing:border-box}
  body{
    font-family: "Inter", system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    background:var(--bg); color:var(--ink);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    min-height:100vh; margin:0; text-align:center; padding:16px;
  }
  .game-box{
    background:var(--panel);
    padding:2rem; border-radius:1rem; box-shadow:0 0 25px rgba(0,0,0,.35);
    width:min(820px, 95vw);
  }
  h1{margin:.2rem 0 0.3rem 0; font-size:clamp(22px,4vw,30px)}
  .meta{color:#9bb0c3; font-size:clamp(12px,2.6vw,14px); margin-top:.25rem}
  .song{
    font-size:clamp(16px,3.2vw,20px); margin:1rem 0 0.75rem 0; font-weight:600;
  }

  /* Botones principales */
  .controls{display:flex; gap:.6rem; justify-content:center; flex-wrap:wrap; margin:1rem 0 .5rem}
  .controls button{
    background:var(--accent); color:#000; border:none;
    padding:0.65rem 1.1rem; border-radius:0.6rem; font-weight:700;
    cursor:pointer; transition:transform .12s ease, filter .12s ease;
  }
  .controls button:hover{ transform:translateY(-1px) }
  .controls button:active{ transform:translateY(0) scale(.98) }

  /* Selector de años por botones */
  .year-wrap{
    border:1px solid var(--ring);
    border-radius:12px;
    padding:10px;
    background:#0f1624;
    max-height:min(48vh, 420px);
    overflow:auto;
  }
  .year-grid{
    display:grid;
    grid-template-columns: repeat(auto-fill, minmax(60px, 1fr));
    gap:8px;
  }
  .year-btn{
    appearance:none; border:none; cursor:pointer;
    padding:.55rem .2rem; border-radius:.55rem;
    background:var(--btn); color:var(--btnText);
    font-weight:700; letter-spacing:.2px;
    transition:background .15s ease, transform .1s ease, outline .2s ease;
    outline:1px solid transparent;
  }
  .year-btn:hover{ background:var(--btnHover); }
  .year-btn:active{ transform:scale(.98) }
  .year-btn[disabled]{ opacity:.45; cursor:not-allowed }
  .year-btn.selected{ outline:2px solid var(--accent); box-shadow:0 0 0 4px rgba(124,199,255,.15) inset; }

  .message{margin:1rem 0 .5rem 0; font-weight:700; min-height:1.6em}
  .points{font-size:1.1rem; margin:.6rem 0 1rem 0}

  /* Input numérico como alternativa (opcional) */
  .alt-input{
    display:flex; gap:.5rem; justify-content:center; align-items:center;
    margin:.4rem 0 1rem 0; flex-wrap:wrap;
  }
  .alt-input input{
    padding:0.55rem; border:none; border-radius:0.4rem; width:110px; text-align:center;
    font-size:1rem; background:#0f1624; color:var(--ink); outline:1px solid var(--ring);
  }

  /* Estrellas */
  .stars{ position:fixed; top:0; left:0; width:100%; height:100%; pointer-events:none; overflow:hidden; }
  .star{ position:absolute; color:gold; font-size:1.5rem; animation:fall 1s linear forwards; }
  @keyframes fall{ to{ transform:translateY(100vh) rotate(720deg); opacity:0; } }

  .footer-note{font-size:12px; color:#9bb0c3; margin-top:.8rem}
</style>
</head>
<body>
  <div class="game-box" role="application" aria-label="Juego de adivinar año de canciones">
    <h1>🎧 Adivina el año</h1>

    <!-- Bloque solicitado (sin los </div> sueltos del snippet original) -->
    <h2 style="margin:0; font-size:clamp(13px,3vw,14px); font-weight:600;">
      <span style="color:#ff9900;">Desarrollado por: Ángel Soto</span>
    </h2>
    <p class="home" style="margin:0; font-size:clamp(12px,2.8vw,13px);">
      <a href="https://airsoto.github.io/vet/" target="_blank" rel="noopener">
        🏠 <span>volver a página de inicio</span>
      </a>
    </p>

    <p class="meta">Selecciona el año de publicación del álbum (solo el año).</p>
    <p id="song" class="song" aria-live="polite"></p>

    <!-- Selector por botones -->
    <div class="year-wrap" aria-label="Selector de año por botones">
      <div id="yearGrid" class="year-grid"></div>
    </div>

    <!-- Alternativa: entrada manual + comprobar -->
    <div class="alt-input">
      <label for="yearInput" class="meta">Entrada manual (opcional):</label>
      <input type="number" id="yearInput" placeholder="Año">
      <button id="checkBtn" title="Comprobar año manual">Comprobar</button>
    </div>

    <p class="message" id="message" aria-live="polite"></p>
    <p class="points">Puntos: <span id="score">0</span></p>

    <div class="controls">
      <button id="nextBtn" title="Ir a otra canción">Siguiente canción</button>
      <button id="resetBtn" title="Reiniciar puntuación y ronda">Reiniciar</button>
    </div>

    <p class="footer-note">Reglas: +10 si aciertas. Si fallas, pierdes 1 punto por cada año de diferencia.</p>
  </div>

  <div class="stars" id="stars"></div>

<script>
let songs = [];
let currentSong = null;
let score = 0;
let roundOver = false;
let allYears = []; // Años únicos del JSON

async function loadSongs(){
  const res = await fetch('/json/spotify.json');
  songs = await res.json();

  // Obtener años únicos de los datos
  const yearSet = new Set();
  for(const s of songs){
    if(!s.track_album_release_date) continue;
    const y = parseInt(String(s.track_album_release_date).substring(0,4));
    if(!Number.isNaN(y)) yearSet.add(y);
  }
  allYears = Array.from(yearSet).sort((a,b)=>a-b); // ascendente
  renderYearButtons(allYears);
  nextSong();
}

function renderYearButtons(years){
  const grid = document.getElementById('yearGrid');
  grid.innerHTML = '';
  years.forEach(y=>{
    const btn = document.createElement('button');
    btn.className = 'year-btn';
    btn.type = 'button';
    btn.textContent = y;
    btn.setAttribute('data-year', y);
    btn.setAttribute('aria-label', `Año ${y}`);
    btn.addEventListener('click', ()=> handleGuess(y, btn));
    grid.appendChild(btn);
  });
}

function disableYearButtons(disabled){
  document.querySelectorAll('.year-btn').forEach(b=> b.disabled = disabled);
}

function markSelected(btn){
  document.querySelectorAll('.year-btn').forEach(b=> b.classList.remove('selected'));
  if(btn) btn.classList.add('selected');
}

function nextSong(){
  if(songs.length === 0) return;
  currentSong = songs[Math.floor(Math.random()*songs.length)];
  const name = currentSong.track_name || '—';
  const artist = currentSong.track_artist || '—';
  document.getElementById('song').innerText = `${name} — ${artist}`;
  document.getElementById('message').innerText = '';
  document.getElementById('yearInput').value = '';
  roundOver = false;
  disableYearButtons(false);
  markSelected(null);
}

function showStars(){
  const container = document.getElementById('stars');
  for(let i=0;i<24;i++){
    const s = document.createElement('div');
    s.className = 'star';
    s.innerText = '⭐';
    s.style.left = Math.random()*100+'%';
    s.style.fontSize = (1 + Math.random()*1.3) + 'rem';
    s.style.animationDuration = (0.75+Math.random()*0.6)+'s';
    container.appendChild(s);
    setTimeout(()=>s.remove(),1200);
  }
}

function evaluateGuess(guessYear){
  if(!currentSong || roundOver) return;
  const year = parseInt(String(currentSong.track_album_release_date).substring(0,4));
  if(Number.isNaN(year)) return;

  const diff = Math.abs(year - guessYear);
  const msg = document.getElementById('message');

  if(diff === 0){
    score += 10;
    msg.style.color = 'var(--success)';
    msg.innerText = '¡Correcto! 🎉 +10 puntos';
    showStars();
  }else{
    const penalty = diff;
    score -= penalty;
    msg.style.color = 'var(--error)';
    msg.innerText = `❌ Era ${year}. Pierdes ${penalty} punto(s).`;
  }
  document.getElementById('score').innerText = score;
  roundOver = true;
  disableYearButtons(true);
}

function handleGuess(guessYear, btn){
  if(roundOver) return;
  markSelected(btn);
  evaluateGuess(guessYear);
}

document.getElementById('checkBtn').addEventListener('click', ()=>{
  const val = document.getElementById('yearInput').value;
  if(!val) return;
  const y = parseInt(val);
  if(Number.isNaN(y)) return;
  // intentar resaltar botón si existe
  const matchBtn = Array.from(document.querySelectorAll('.year-btn'))
    .find(b => parseInt(b.dataset.year) === y);
  if(matchBtn) markSelected(matchBtn);
  evaluateGuess(y);
});

document.getElementById('nextBtn').addEventListener('click', nextSong);

document.getElementById('resetBtn').addEventListener('click', ()=>{
  score = 0;
  document.getElementById('score').innerText = score;
  roundOver = false;
  disableYearButtons(false);
  markSelected(null);
  nextSong();
});

// Soporta Enter en el input manual
document.getElementById('yearInput').addEventListener('keydown', (e)=>{
  if(e.key === 'Enter') document.getElementById('checkBtn').click();
});

// Cargar datos
loadSongs();
</script>
</body>
</html>
