<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07111d"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><title>Aero Control 7</title><style>html,body{margin:0;width:100%;height:100%;display:grid;place-items:center;background:#07111d;color:#edf8ff;font-family:system-ui}small{opacity:.65}</style></head><body><small>Cargando aeropuerto…</small><script>(async()=>{try{const names=Array.from({length:8},(_,i)=>`data${i}.txt`);const parts=await Promise.all(names.map(n=>fetch(n,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error(n);return r.text()})));const s=atob(parts.join('').trim()),u=new Uint8Array(s.length);for(let i=0;i<s.length;i++)u[i]=s.charCodeAt(i);const t=await new Response(new Blob([u]).stream().pipeThrough(new DecompressionStream('gzip'))).text();document.open();document.write(t);document.close()}catch(e){document.body.innerHTML='<p>No se pudo cargar el simulador.</p>';console.error(e)}})();</script></body></html>
