<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
    <meta name="theme-color" content="#111111">
    <title>Clutch Duel</title>
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="shell">
      <section class="game-wrap" aria-label="Clutch Duel">
        <canvas id="game" width="960" height="540"></canvas>
        <div class="hud" aria-live="polite">
          <div><span id="modeLabel">Duelo</span></div>
          <div><strong id="scoreLabel">0 - 0</strong></div>
          <div><span id="clockLabel">2:00</span></div>
        </div>
        <div id="menu" class="menu">
          <h1>Clutch Duel</h1>
          <p>Uno contra uno retro, hecho con arte propio para web móvil.</p>
          <button data-mode="duel">Duelo 1 vs 1</button>
          <button data-mode="threes">Concurso de triples</button>
          <button data-mode="dunks">Concurso de mates</button>
        </div>
        <div id="toast" class="toast" hidden></div>
      </section>
      <section class="controls" aria-label="Controles táctiles">
        <div class="stick" id="stick">
          <div class="nub" id="nub"></div>
        </div>
        <div class="actions">
          <button id="shootBtn" aria-label="Tirar">Tirar</button>
          <button id="driveBtn" aria-label="Correr">Correr</button>
          <button id="stealBtn" aria-label="Robar o bloquear">Robar</button>
        </div>
      </section>
    </main>
    <script src="game.js"></script>
  </body>
</html>
