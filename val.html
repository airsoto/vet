<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Valencias de la Tabla Periódica</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #1c1c1c;
      color: #fff;
      margin: 0;
      padding: 2em;
    }
    .wrapper {
      display: flex;
      flex-direction: row;
      justify-content: center;
      gap: 2em;
      flex-wrap: wrap;
    }
    .container {
      max-width: 500px;
      flex: 1;
    }
    .image-column {
      flex: 1;
      max-width: 600px;
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }
    .image-column img {
      max-width: 100%;
      height: auto;
      border: 2px solid #444;
      border-radius: 8px;
    }
    .question {
      font-size: 1.5em;
      margin: 1em 0;
    }
    .buttons {
      display: flex;
      justify-content: center;
      gap: 0.5em;
      flex-wrap: wrap;
    }
    .buttons button {
      font-size: 1em;
      padding: 0.4em 0.8em;
      border-radius: 6px;
    }
    .selected {
      background-color: orange;
      color: black;
    }
    .feedback {
      font-size: 2em;
      margin-top: 1em;
    }
    #result-image {
      height: 300px;
      margin-top: 1em;
    }
    #final-score {
      font-size: 2em;
      margin-top: 1em;
    }
    .control-buttons {
      margin-top: 1em;
      display: flex;
      justify-content: center;
      gap: 1em;
      flex-wrap: wrap;
    }
    .control-buttons button {
      padding: 0.6em 1.2em;
      font-size: 1.1em;
      border-radius: 8px;
      cursor: pointer;
    }
    .submit-button { background-color: #4CAF50; color: white; }
    .reset-button { background-color: #f44336; color: white; }
    .end-button { background-color: #2196F3; color: white; }
  </style>
</head>
<body>
  <div class="wrapper">
    <div class="container">
      <h1>Aprende las Valencias de los Elementos Químicos</h1>
      <h2>Desarrollado por: Angel Soto</h2>

      <div id="score">✔️ 0 | ❌ 0</div>
      <div class="question" id="question"></div>
      <div class="buttons" id="valencia-options"></div>
      <div class="control-buttons">
        <button class="submit-button" onclick="submitAnswer()">Definir respuesta</button>
        <button class="reset-button" onclick="resetGame()">Reiniciar examen</button>
        <button class="end-button" onclick="showFinalScore()">Terminar examen</button>
      </div>
      <div class="feedback" id="feedback"></div>
      <img id="result-image" style="display:none" />
      <div id="final-score"></div>
    </div>


  </div>

<script>
const elementos = [
  {"simbolo": "H", "nombre": "Hidrógeno", "valencias": [1]},
  {"simbolo": "Li", "nombre": "Litio", "valencias": [1]},
  {"simbolo": "Na", "nombre": "Sodio", "valencias": [1]},
  {"simbolo": "K", "nombre": "Potasio", "valencias": [1]},
  {"simbolo": "Rb", "nombre": "Rubidio", "valencias": [1]},
  {"simbolo": "Cs", "nombre": "Cesio", "valencias": [1]},
  {"simbolo": "Fr", "nombre": "Francio", "valencias": [1]},
  {"simbolo": "Be", "nombre": "Berilio", "valencias": [2]},
  {"simbolo": "Mg", "nombre": "Magnesio", "valencias": [2]},
  {"simbolo": "Ca", "nombre": "Calcio", "valencias": [2]},
  {"simbolo": "Sr", "nombre": "Estroncio", "valencias": [2]},
  {"simbolo": "Ba", "nombre": "Bario", "valencias": [2]},
  {"simbolo": "Ra", "nombre": "Radio", "valencias": [2]},
  {"simbolo": "B", "nombre": "Boro", "valencias": [3]},
  {"simbolo": "Al", "nombre": "Aluminio", "valencias": [3]},
  {"simbolo": "Ga", "nombre": "Galio", "valencias": [3]},
  {"simbolo": "In", "nombre": "Indio", "valencias": [3]},
  {"simbolo": "Tl", "nombre": "Talio", "valencias": [1, 3]},
  {"simbolo": "C", "nombre": "Carbono", "valencias": [2, 4]},
  {"simbolo": "Si", "nombre": "Silicio", "valencias": [4]},
  {"simbolo": "Ge", "nombre": "Germanio", "valencias": [2, 4]},
  {"simbolo": "Sn", "nombre": "Estaño", "valencias": [2, 4]},
  {"simbolo": "Pb", "nombre": "Plomo", "valencias": [2, 4]},
  {"simbolo": "N", "nombre": "Nitrógeno", "valencias": [1, 2, 3, 4, 5]},
  {"simbolo": "P", "nombre": "Fósforo", "valencias": [3, 5]},
  {"simbolo": "As", "nombre": "Arsénico", "valencias": [3, 5]},
  {"simbolo": "Sb", "nombre": "Antimonio", "valencias": [3, 5]},
  {"simbolo": "Bi", "nombre": "Bismuto", "valencias": [3, 5]},
  {"simbolo": "O", "nombre": "Oxígeno", "valencias": [2]},
  {"simbolo": "S", "nombre": "Azufre", "valencias": [2, 4, 6]},
  {"simbolo": "Se", "nombre": "Selenio", "valencias": [2, 4, 6]},
  {"simbolo": "Te", "nombre": "Telurio", "valencias": [2, 4, 6]},
  {"simbolo": "F", "nombre": "Flúor", "valencias": [1]},
  {"simbolo": "Cl", "nombre": "Cloro", "valencias": [1, 3, 5, 7]},
  {"simbolo": "Br", "nombre": "Bromo", "valencias": [1, 3, 5, 7]},
  {"simbolo": "I", "nombre": "Yodo", "valencias": [1, 3, 5, 7]},
  {"simbolo": "Fe", "nombre": "Hierro", "valencias": [2, 3]},
  {"simbolo": "Ni", "nombre": "Níquel", "valencias": [2, 3]},
  {"simbolo": "Zn", "nombre": "Cinc", "valencias": [2]},
  {"simbolo": "Cd", "nombre": "Cadmio", "valencias": [2]},
  {"simbolo": "Hg", "nombre": "Mercurio", "valencias": [1, 2]},
  {"simbolo": "Cu", "nombre": "Cobre", "valencias": [1, 2]},
  {"simbolo": "Ag", "nombre": "Plata", "valencias": [1]},
  {"simbolo": "Au", "nombre": "Oro", "valencias": [1, 3]},
  {"simbolo": "Pt", "nombre": "Platino", "valencias": [2, 4]},
  {"simbolo": "Cr", "nombre": "Cromo", "valencias": [2, 3, 6]},
  {"simbolo": "Mn", "nombre": "Manganeso", "valencias": [2, 3, 4, 6, 7]}
]
; // Mantén aquí tu lista completa de elementos

let usedElements = [];
let correct = 0;
let incorrect = 0;
let totalAnswers = 0;
let selected = [];
let currentElement = null;

function getRandomElement() {
  if (usedElements.length === elementos.length) return null;
  let idx;
  do {
    idx = Math.floor(Math.random() * elementos.length);
  } while (usedElements.includes(idx));
  usedElements.push(idx);
  return elementos[idx];
}

function renderQuestion() {
  currentElement = getRandomElement();
  if (!currentElement) {
    showFinalScore();
    return;
  }
  document.getElementById("question").textContent = `¿Qué valencias tiene el elemento ${currentElement.nombre} (${currentElement.simbolo})?`;
  const options = document.getElementById("valencia-options");
  options.innerHTML = "";
  selected = [];
  for (let i = 1; i <= 7; i++) {
    const btn = document.createElement("button");
    btn.textContent = i;
    btn.onclick = () => {
      if (selected.includes(i)) {
        selected = selected.filter(x => x !== i);
        btn.classList.remove("selected");
      } else {
        selected.push(i);
        btn.classList.add("selected");
      }
    };
    options.appendChild(btn);
  }
  document.getElementById("feedback").textContent = "";
  document.getElementById("result-image").style.display = "none";
}

function arraysEqual(a, b) {
  return a.sort().toString() === b.sort().toString();
}

function submitAnswer() {
  if (!currentElement) return;
  const isCorrect = arraysEqual(selected, currentElement.valencias);
  const feedback = document.getElementById("feedback");
  const img = document.getElementById("result-image");

  totalAnswers++;

  if (isCorrect) {
    feedback.textContent = "✅ ¡CORRECTO!";
    img.src = "th1.png";
    correct++;
  } else {
    feedback.textContent = "❌ INCORRECTO";
    img.src = "th2.png";
    incorrect++;
  }
  img.style.height = "300px";
  img.style.display = "inline";
  document.getElementById("score").textContent = `✔️ ${correct} | ❌ ${incorrect}`;

  setTimeout(renderQuestion, 2000);
}

function showFinalScore() {
  if (totalAnswers === 0) return;
  const nota = (correct / totalAnswers) * 10;
  const feedback = document.getElementById("feedback");
  const img = document.getElementById("result-image");
  const final = document.getElementById("final-score");
  final.textContent = `Nota final: ${nota.toFixed(1)} / 10`;

  if (nota >= 8.5) {
    feedback.textContent = "🎉 SOBRESALIENTE";
    img.src = "th1.png";
  } else if (nota >= 7) {
    feedback.textContent = "🎉 NOTABLE";
    img.src = "th1.png";
  } else if (nota >= 5) {
    feedback.textContent = "🎉 APROBADO";
    img.src = "th1.png";
  } else {
    feedback.textContent = "❌ SUSPENSO";
    img.src = "th2.png";
  }
  img.style.height = "350px";
  img.style.display = "inline";
}

function resetGame() {
  usedElements = [];
  correct = 0;
  incorrect = 0;
  totalAnswers = 0;
  selected = [];
  currentElement = null;
  document.getElementById("score").textContent = "✔️ 0 | ❌ 0";
  document.getElementById("final-score").textContent = "";
  document.getElementById("feedback").textContent = "";
  document.getElementById("result-image").style.display = "none";
  renderQuestion();
}

renderQuestion();
</script>
</body>
</html>
