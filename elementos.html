    let current = null;
    let score = 0;
    let errors = 0;
    let total = 0;

    function pickRandomElement() {
      current = data[Math.floor(Math.random() * data.length)];
      document.getElementById('question').textContent = Math.random() > 0.5 ? current.Nombre : current.Simbolo;
    }

    function submitAnswer() {
      const input = document.getElementById('answerInput').value.trim().toLowerCase();
      const correct = document.getElementById('question').textContent === current.Nombre ? current.Simbolo : current.Nombre;
      if (input === correct.toLowerCase()) {
        score++;
        document.getElementById('result').textContent = "✅ ¡Correcto!";
      } else {
        errors++;
        document.getElementById('result').textContent = `❌ Incorrecto. Era: ${correct}`;
      }
      total++;
      document.getElementById('answerInput').value = '';
      pickRandomElement();
    }

    function resetGame() {
      score = 0;
      errors = 0;
      total = 0;
      document.getElementById('result').textContent = '';
      document.getElementById('score').textContent = '';
      pickRandomElement();
    }

    function finishGame() {
      const nota = total === 0 ? 0 : (10 * score / total).toFixed(2);
      document.getElementById('score').textContent = `✅ Aciertos: ${score} | ❌ Errores: ${errors} | 📊 Nota: ${nota}/10`;
    }
