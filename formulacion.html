    function generateQuestion() {
      document.getElementById("options").innerHTML = "";
      const types = ["SISTEMÁTICA→compuesto", "STOCK→compuesto", "compuesto→SISTEMÁTICA", "compuesto→STOCK"];
      questionType = getRandomElement(types);
      const correct = getRandomElement(data);

      let questionText = "";
      let answerField = "";
      let fieldToShow = "";

      switch (questionType) {
        case "SISTEMÁTICA→compuesto":
          questionText = `¿Qué compuesto corresponde a la nomenclatura SISTEMÁTICA "<b>${correct["nomenclatura SISTEMÁTICA"]}</b>"?`;
          currentAnswer = correct.compuesto;
          answerField = "compuesto";
          break;
        case "STOCK→compuesto":
          questionText = `¿Qué compuesto corresponde a la nomenclatura STOCK "<b>${correct["nomenclatura STOCK"]}</b>"?`;
          currentAnswer = correct.compuesto;
          answerField = "compuesto";
          break;
        case "compuesto→SISTEMÁTICA":
          questionText = `¿Cuál es la nomenclatura SISTEMÁTICA del compuesto "<b>${correct.compuesto}</b>"?`;
          currentAnswer = correct["nomenclatura SISTEMÁTICA"];
          answerField = "nomenclatura SISTEMÁTICA";
          break;
        case "compuesto→STOCK":
          questionText = `¿Cuál es la nomenclatura STOCK del compuesto "<b>${correct.compuesto}</b>"?`;
          currentAnswer = correct["nomenclatura STOCK"];
          answerField = "nomenclatura STOCK";
          break;
      }

      document.getElementById("question").innerHTML = questionText;

      let options = new Set();
      options.add(currentAnswer);
      while (options.size < 6) {
        let candidate = getRandomElement(data)[answerField];
        options.add(candidate);
      }

      Array.from(options).sort(() => Math.random() - 0.5).forEach(opt => {
        const button = document.createElement("button");
        button.textContent = opt;
        button.onclick = () => checkAnswer(button, opt);
        document.getElementById("options").appendChild(button);
      });
    }

    function checkAnswer(button, selected) {
      const buttons = document.querySelectorAll("#options button");
      buttons.forEach(btn => btn.disabled = true);

      if (selected === currentAnswer) {
        button.classList.add("correct");
        score.correct++;
      } else {
        button.classList.add("incorrect");
        buttons.forEach(btn => {
          if (btn.textContent === currentAnswer) {
            btn.classList.add("correct");
          }
        });
        score.incorrect++;
      }

      updateScore();
      setTimeout(generateQuestion, 1500);
    }

    function updateScore() {
      document.getElementById("score").textContent = `Aciertos: ${score.correct} | Errores: ${score.incorrect}`;
    }

    function resetGame() {
      score = { correct: 0, incorrect: 0 };
      updateScore();
      generateQuestion();
    }

    function finishGame() {
      const total = score.correct + score.incorrect;
      const nota = total === 0 ? 0 : Math.round((score.correct / total) * 10 * 100) / 100;
      alert(`Has terminado el examen.\nNota final: ${nota}/10`);
    }

    // Inicializar
    generateQuestion();
  </script>
</body>
</html>
