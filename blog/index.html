<!doctype html>
<html lang="es">
  <script defer src="../goat.js"></script>

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f7f4">
  <meta name="description" content="Notas al margen: ideas, retos y curiosidades.">
  <title>Angel Soto— Blog</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&display=swap" rel="stylesheet">
  <style>
    :root{color-scheme:light;--bg:#f7f7f4;--surface:#fff;--ink:#242522;--muted:#797c75;--border:#e7e8e2;--accent:#506b57;--accent-soft:#e8eee8;--shadow:0 18px 50px rgba(34,39,31,.055)}
    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--ink);font-family:'DM Sans',system-ui,sans-serif;font-size:15px;line-height:1.7}button,input{font:inherit}button{cursor:pointer}a{color:inherit} .shell{max-width:1100px;margin:auto;padding:0 34px} .topbar{border-bottom:1px solid var(--border)}.nav{height:83px;display:flex;align-items:center;justify-content:space-between;gap:16px}.brand{font-family:Newsreader,Georgia,serif;font-size:26px;font-weight:600;text-decoration:none;letter-spacing:-.7px}.brand span{color:var(--accent)}.nav-right{display:flex;align-items:center;gap:20px}.nav-right a{text-decoration:none;color:var(--muted);font-size:13px}.nav-right a:hover{color:var(--accent)}.dot{height:9px;width:9px;background:#86a18a;border-radius:50%;display:inline-block;margin-right:8px}
    .hero{padding:96px 0 66px;max-width:820px}.eyebrow{text-transform:uppercase;letter-spacing:.18em;color:var(--accent);font-size:11px;font-weight:700}.hero h1{font:500 clamp(48px,7.2vw,87px)/1.04 Newsreader,Georgia,serif;letter-spacing:-2px;margin:18px 0}.hero p{font-size:17px;color:var(--muted);max-width:610px;margin:20px 0 0}.section-heading{display:flex;align-items:center;justify-content:space-between;margin:0 0 23px;gap:10px}.section-heading h2{font-family:Newsreader,Georgia,serif;font-size:30px;font-weight:500;margin:0;letter-spacing:-.4px}.count{font-size:12px;color:var(--muted)}
    .toolbar{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin:0 0 32px}.search{position:relative;flex:1;min-width:200px}.search svg{position:absolute;left:17px;top:50%;transform:translateY(-50%);color:var(--muted)}.search input{display:block;width:100%;height:47px;border:1px solid var(--border);border-radius:12px;background:var(--surface);padding:0 15px 0 45px;color:var(--ink);outline:none}.search input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}.chips{display:flex;gap:7px;flex-wrap:wrap}.chip{background:transparent;border:1px solid var(--border);color:#71756e;border-radius:999px;padding:8px 13px;font-size:12px;transition:.2s}.chip:hover,.chip.active{background:var(--accent-soft);color:#385340;border-color:#d7e2d8}
    .feed{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px;padding-bottom:95px}.post-card{border:1px solid var(--border);background:var(--surface);border-radius:18px;overflow:hidden;box-shadow:var(--shadow);display:flex;flex-direction:column;min-width:0;transition:transform .2s,box-shadow .2s}.post-card:hover{transform:translateY(-3px);box-shadow:0 24px 60px rgba(34,39,31,.085)}.post-img{width:100%;height:270px;object-fit:cover;object-position:center;background:#eeede8;display:block}.card-body{padding:27px 29px 28px;display:flex;flex-direction:column;flex:1}.meta{display:flex;align-items:center;gap:10px;flex-wrap:wrap;color:var(--muted);font-size:12px}.meta-sep{color:#bdc3b8}.card-body h3{font:500 31px/1.15 Newsreader,Georgia,serif;letter-spacing:-.5px;margin:16px 0 11px}.card-body p{color:#6c716b;font-size:14px;margin:0 0 22px;line-height:1.75}.tag-row{display:flex;flex-wrap:wrap;gap:8px}.tag{font-size:12px;color:var(--accent);background:#f0f4ef;border-radius:7px;padding:3px 8px}.card-footer{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:auto;padding-top:21px;border-top:1px solid var(--border)}.read-btn{background:none;border:0;padding:0;color:var(--accent);font-size:13px;font-weight:700}.read-btn:hover{text-decoration:underline}.read-time{color:var(--muted);font-size:12px}
    .footer{border-top:1px solid var(--border);padding:30px 0 38px;color:var(--muted);font-size:12px}.footer .shell{display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px}.empty{grid-column:1/-1;padding:55px 15px;border:1px dashed var(--border);border-radius:14px;text-align:center;color:var(--muted)}
    .article-page{max-width:790px;margin:0 auto;padding:62px 24px 110px}.back{display:inline-flex;align-items:center;gap:8px;color:var(--accent);border:0;background:none;padding:4px 0;font-size:13px;font-weight:600}.article-header{margin:45px 0 28px}.article-header h1{font:500 clamp(43px,6.5vw,70px)/1.08 Newsreader,Georgia,serif;letter-spacing:-1.5px;margin:14px 0 21px}.article-header .tag-row{margin-top:20px}.article-image{width:100%;max-height:490px;object-fit:contain;background:#f0efeb;border-radius:16px;display:block;margin:34px 0 40px}.markdown{font-size:16px;line-height:1.9;color:#41453f}.markdown h2,.markdown h3{font:500 32px/1.2 Newsreader,Georgia,serif;color:var(--ink);margin:42px 0 15px}.markdown h3{font-size:25px}.markdown p{margin:0 0 18px}.markdown strong{color:var(--ink)}.markdown code{font-family:ui-monospace,monospace;font-size:.9em;background:#edf0e9;padding:3px 6px;border-radius:5px}.markdown blockquote{margin:25px 0;border-left:3px solid var(--accent);padding:7px 19px;color:#6c716b;background:#f1f4ef}.markdown ul{padding-left:24px}.math-display{text-align:center;font:italic 28px/1.4 Georgia,serif;padding:22px 15px;background:#f1f3ee;border-radius:12px;margin:25px 0;overflow-x:auto}.reveal{margin-top:48px;border:1px solid #dce4dc;border-radius:16px;background:#f1f5f0;overflow:hidden}.reveal summary{padding:21px 24px;font-weight:700;color:#3d6047;cursor:pointer;list-style:none;display:flex;align-items:center;justify-content:space-between;gap:12px}.reveal summary::-webkit-details-marker{display:none}.reveal summary::after{content:'+';font-size:24px;font-weight:400}.reveal[open] summary::after{content:'−'}.solution-body{background:#fff;padding:6px 26px 24px;border-top:1px solid #dce4dc}.solution-body h2:first-child{margin-top:26px}.error{background:white;padding:24px;border:1px solid #ebd0cb;border-radius:14px;color:#944638}.hidden{display:none!important}
    @media(max-width:720px){.shell{padding:0 20px}.nav{height:70px}.brand{font-size:23px}.hero{padding:74px 0 54px}.hero h1{letter-spacing:-1px}.hero p{font-size:15px}.feed{grid-template-columns:1fr}.post-img{height:225px}.card-body{padding:23px}.article-page{padding:36px 20px 80px}.article-header{margin-top:35px}.article-image{max-height:420px}.markdown{font-size:15px}.nav-right a:nth-child(1){display:none}}
    @media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important}}
  </style>
</head>
<body>
  <header class="topbar"><div class="shell nav"><a class="brand" href="#" id="brandLink"><span>.</span></a><div class="nav-right"><a href="#publicaciones" id="navPosts">Publicaciones</a><span class="count"><span class="dot"></span>Un espacio para explorar</span></div></div></header>
  <main id="homeView" class="shell">
    <section class="hero"><div class="eyebrow"></div><h1>Blog sobre muchas cosas<br><span style="color:var(--accent)">.</span></h1><p id="subtitle"></p></section>
    <section id="publicaciones"><div class="section-heading"><h2>Últimas publicaciones</h2><span class="count" id="postCount"></span></div><div class="toolbar"><label class="search"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-4-4"></path></svg><input id="searchInput" type="search" placeholder="Buscar publicaciones..." aria-label="Buscar publicaciones"></label><div class="chips" id="tagFilters" aria-label="Filtrar por tema"></div></div><div class="feed" id="feed" aria-live="polite"></div></section>
  </main>
  <main class="article-page hidden" id="articleView"><button class="back" id="backButton" type="button">← Volver a publicaciones</button><div id="articleContent"></div></main>
  <footer class="footer"><div class="shell"><span id="footerBrand"></span><span></span></div></footer>
  <script>
    'use strict';
    const DATA_URL = '../json/blog.json';
    const state = {posts:[], tag:'Todos', search:'', blog:{}};
    const $ = id => document.getElementById(id);
    const escapeHTML = value => String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const dateText = value => {const d = new Date(value+'T12:00:00');return isNaN(d) ? value : new Intl.DateTimeFormat('es-ES',{day:'numeric',month:'long',year:'numeric'}).format(d)};
    function renderInline(source){
      let s=escapeHTML(source);
      s=s.replace(/`([^`]+)`/g,'<code>$1</code>');
      s=s.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');
      s=s.replace(/\*([^*]+)\*/g,'<em>$1</em>');
      // Only safe, ordinary HTTP(S) URLs are accepted.
      s=s.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,'<a href="$2" rel="noopener noreferrer" target="_blank">$1</a>');
      return s;
    }
    const mathHtml = s => '<div class="math-display">'+renderInline(s.replaceAll('^2','²').replaceAll('^3','³').replaceAll('\\cdot','·'))+'</div>';
    function renderMarkdown(md){
      const lines=String(md).replace(/\r/g,'').split('\n');let result=[],paragraph=[],list=[];
      const flushP=()=>{if(paragraph.length){result.push('<p>'+renderInline(paragraph.join(' '))+'</p>');paragraph=[]}};
      const flushL=()=>{if(list.length){result.push('<ul>'+list.map(x=>'<li>'+renderInline(x)+'</li>').join('')+'</ul>');list=[]}};
      for(const line of lines){const t=line.trim();if(!t){flushP();flushL();continue}
        if(t.startsWith('$$')&&t.endsWith('$$')&&t.length>4){flushP();flushL();result.push(mathHtml(t.slice(2,-2)));continue}
        const heading=t.match(/^(#{1,3})\s+(.+)$/);if(heading){flushP();flushL();const n=Math.min(heading[1].length+1,3);result.push('<h'+n+'>'+renderInline(heading[2])+'</h'+n+'>');continue}
        if(t.startsWith('- ')){flushP();list.push(t.slice(2));continue}
        if(t.startsWith('> ')){flushP();flushL();result.push('<blockquote>'+renderInline(t.slice(2))+'</blockquote>');continue}
        flushL();paragraph.push(t);
      }flushP();flushL();return result.join('\n');
    }
    const tagsFor = post => (Array.isArray(post.tags)?post.tags:[]);
    function showError(message){$('feed').innerHTML='<div class="error">'+escapeHTML(message)+'</div>'}
    function renderTags(){const tags=[...new Set(state.posts.flatMap(tagsFor))];$('tagFilters').innerHTML=['Todos',...tags].map(tag=>'<button type="button" class="chip '+(state.tag===tag?'active':'')+'" data-tag="'+escapeHTML(tag)+'">'+(tag==='Todos'?'Todos':'#'+escapeHTML(tag))+'</button>').join('');$('tagFilters').querySelectorAll('button').forEach(b=>b.onclick=()=>{state.tag=b.dataset.tag;renderTags();renderFeed()})}
    function renderFeed(){const q=state.search.trim().toLocaleLowerCase('es');const posts=state.posts.filter(p=>(state.tag==='Todos'||tagsFor(p).includes(state.tag))&&[p.title,p.excerpt,tagsFor(p).join(' ')].join(' ').toLocaleLowerCase('es').includes(q));$('postCount').textContent=posts.length+' '+(posts.length===1?'artículo':'artículos');$('feed').innerHTML=posts.length?posts.map(p=>`<article class="post-card">${p.image?`<img class="post-img" src="${escapeHTML(p.image)}" alt="${escapeHTML(p.imageAlt||'')}" loading="lazy">`:''}<div class="card-body"><div class="meta"><time datetime="${escapeHTML(p.date)}">${escapeHTML(dateText(p.date))}</time><span class="meta-sep">•</span><span>${escapeHTML(p.readingMinutes||2)} min de lectura</span></div><h3>${escapeHTML(p.title)}</h3><p>${escapeHTML(p.excerpt||'')}</p><div class="tag-row">${tagsFor(p).map(t=>`<span class="tag">#${escapeHTML(t)}</span>`).join('')}</div><div class="card-footer"><button type="button" class="read-btn" data-post="${escapeHTML(p.id)}">Leer artículo →</button><span class="read-time">Lectura breve</span></div></div></article>`).join(''):'<div class="empty">No hay publicaciones que coincidan con tu búsqueda.</div>';$('feed').querySelectorAll('[data-post]').forEach(b=>b.onclick=()=>{location.hash='post/'+encodeURIComponent(b.dataset.post)})}
    function showHome(){ $('homeView').classList.remove('hidden');$('articleView').classList.add('hidden');document.title=state.blog.title||'Notas al margen'; }
    function showPost(post){const fragments=String(post.markdown||'').split(':::solution');const before=fragments[0];const after=fragments.length>1?fragments.slice(1).join(':::solution').split(':::end')[0]:'';$('articleContent').innerHTML=`<header class="article-header"><div class="meta"><time datetime="${escapeHTML(post.date)}">${escapeHTML(dateText(post.date))}</time><span class="meta-sep">•</span>${escapeHTML(post.readingMinutes||2)} min de lectura</div><h1>${escapeHTML(post.title)}</h1><div class="tag-row">${tagsFor(post).map(t=>`<span class="tag">#${escapeHTML(t)}</span>`).join('')}</div></header>${post.image?`<img class="article-image" src="${escapeHTML(post.image)}" alt="${escapeHTML(post.imageAlt||'')}">`:''}<div class="markdown">${renderMarkdown(before)}${after?'<details class="reveal"><summary>Ver solución (spoiler)</summary><div class="solution-body">'+renderMarkdown(after)+'</div></details>':''}</div>`;$('homeView').classList.add('hidden');$('articleView').classList.remove('hidden');document.title=post.title+' — '+(state.blog.title||'Blog');window.scrollTo({top:0,behavior:'instant'})}
    function navigate(){const id=location.hash.startsWith('#post/')?decodeURIComponent(location.hash.slice(6)):null;const post=id?state.posts.find(p=>p.id===id):null;if(post)showPost(post);else showHome()}
    async function load(){try{const response=await fetch(DATA_URL,{cache:'no-cache'});if(!response.ok)throw new Error('HTTP '+response.status);const data=await response.json();if(!Array.isArray(data.posts))throw new Error('Formato JSON incorrecto');state.posts=data.posts.filter(p=>p.id&&p.title&&p.date).sort((a,b)=>b.date.localeCompare(a.date));state.blog=data.blog||{};$('subtitle').textContent=state.blog.subtitle||$('subtitle').textContent;$('footerBrand').textContent=(state.blog.title||'Notas al margen')+' · '+(state.blog.author||'');renderTags();renderFeed();navigate()}catch(err){showError('No se pudo cargar ../json/blog.json. Abre la web desde un servidor HTTP (no directamente como archivo file://). Detalle: '+err.message)}}
    $('searchInput').addEventListener('input',e=>{state.search=e.target.value;renderFeed()});$('backButton').onclick=()=>{location.hash='publicaciones';window.scrollTo({top:0})};$('brandLink').onclick=()=>{location.hash='';};$('navPosts').onclick=()=>{location.hash='publicaciones'};window.addEventListener('hashchange',navigate);load();
  </script>
</body>
</html>
