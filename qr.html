<!DOCTYPE html>
<html lang='es'>
<head>
<meta charset='UTF-8'>
<meta name='viewport' content='width=device-width, initial-scale=1.0'>
<title>Generador de Códigos QR</title>
<script src='https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js'></script>
<style>
:root{
 --background:#121212;
 --foreground:#e0e0e0;
}
*{box-sizing:border-box;}
body{
 margin:0;
 padding:2rem;
 background:var(--background);
 color:var(--foreground);
 font-family:'Segoe UI',sans-serif;
 display:flex;
 flex-direction:column;
 align-items:center;
 min-height:100vh;
}
h1{margin-bottom:1rem;}
label{display:block;margin:.5rem 0;}
input[type=text]{
 width:100%;
 max-width:320px;
 padding:.5rem;
 border-radius:8px;
 border:2px solid #333;
 background:#1e1e1e;
 color:#0000FF;
}
.controls{
 display:flex;
 flex-wrap:wrap;
 gap:1rem;
 justify-content:center;
 margin-top:1rem;
}
.controls > div{
 display:flex;
 flex-direction:column;
 align-items:center;
}
button{
 background:#2196f3;
 border:none;
 border-radius:8px;
 padding:.6rem 1.2rem;
 color:#fff;
 font-weight:600;
 cursor:pointer;
 transition:opacity .2s;
}
button:hover{opacity:.8;}
#qrcode{
 margin-top:1.5rem;
}
</style>
</head>
<body>
<h1>Generador de CÓDIGOS QR</h1>
  <h2>Desarrollado por: Angel Soto</h2>

<label for='text'>Texto o URL</label>
<input id='text' type='text' placeholder='https://ejemplo.com'>

<div class='controls'>
 <div>
  <label for='fgColor'>Color código</label>
  <input id='fgColor' type='color' value='#000000'>
 </div>
 <div>
  <label for='bgColor'>Color fondo</label>
  <input id='bgColor' type='color' value='#ffffff'>
 </div>
 <div>
  <label for='borderColor'>Color borde</label>
  <input id='borderColor' type='color' value='#ffffff'>
 </div>
</div>

<div class='controls'>
 <button id='generate'>Generar QR</button>
 <button id='invert'>Invertir colores</button>
</div>

<div id='qrcode'></div>

<script>
const textInput=document.getElementById('text');
const fgColor=document.getElementById('fgColor');
const bgColor=document.getElementById('bgColor');
const borderColor=document.getElementById('borderColor');
const generateBtn=document.getElementById('generate');
const invertBtn=document.getElementById('invert');
const qrDiv=document.getElementById('qrcode');

function generateQR(){
 const value=textInput.value.trim();
 if(!value){
  alert('Introduce texto o URL');
  return;
 }
 qrDiv.innerHTML='';
 new QRCode(qrDiv,{
  text:value,
  width:256,
  height:256,
  colorDark:fgColor.value,
  colorLight:bgColor.value,
  correctLevel:QRCode.CorrectLevel.M
 });
 qrDiv.style.border='8px solid '+borderColor.value;
}
function invertColors(){
 const temp=fgColor.value;
 fgColor.value=bgColor.value;
 bgColor.value=temp;
 generateQR();
}
generateBtn.addEventListener('click',generateQR);
invertBtn.addEventListener('click',invertColors);
</script>
</body>
</html>
