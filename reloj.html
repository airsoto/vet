<!DOCTYPE html>
<html>
<script defer src="goat.js"></script>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Reloj en Palabras</title>
    <style>
        body {
            overflow: hidden;
            background: #111;
            color: white;
        }

        .wrapper {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100vw;
            height: 100vh;
            font-size: clamp(20px, 4vw, 60px);
            font-family: serif;
            text-align: center;
        }

        #sumertime {
            max-width: 90vw;
        }
    </style>
</head>
<body>

<div class="wrapper">
    <div id="sumertime"></div>
</div>

<script>
    const unidades = ["cero", "uno", "dos", "tres", "cuatro", "cinco", "seis", "siete", "ocho", "nueve"];
    const especiales = ["diez", "once", "doce", "trece", "catorce", "quince"];
    const decenas = ["", "", "veinte", "treinta", "cuarenta", "cincuenta"];

    function numeroATexto(n) {
        if (n < 10) return unidades[n];
        if (n < 16) return especiales[n - 10];
        if (n < 20) return "dieci" + unidades[n - 10];
        if (n === 20) return "veinte";
        if (n < 30) return "veinti" + unidades[n - 20];
        if (n % 10 === 0) return decenas[Math.floor(n / 10)];
        return decenas[Math.floor(n / 10)] + " y " + unidades[n % 10];
    }

    function actualizarReloj() {
        const ahora = new Date();
        const horas = ahora.getHours();
        const minutos = ahora.getMinutes();
        const segundos = ahora.getSeconds();

        const textoHora = numeroATexto(horas) + " horas";
        const textoMin = numeroATexto(minutos) + " minutos";
        const textoSeg = numeroATexto(segundos) + " segundos";

        document.getElementById("sumertime").innerHTML = `${textoHora} : ${textoMin} : ${textoSeg}`;
    }

    actualizarReloj();
    setInterval(actualizarReloj, 1000);
</script>

</body>
</html>
