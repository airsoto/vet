<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>MagPad</title>
<style>
:root{--bg:#000;--panel:#0a0e14;--line:#202936;--text:#f5f7fb;--muted:#8290a3;--blue:#2f9cff;--blue2:#8bd0ff;--r:22px}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:radial-gradient(circle at 50% 38%,rgba(47,156,255,.10),transparent 34%),#000;color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;-webkit-tap-highlight-color:transparent;user-select:none;overscroll-behavior:none}body{min-height:100dvh;display:flex;flex-direction:column;padding:calc(12px + env(safe-area-inset-top)) 14px calc(14px + env(safe-area-inset-bottom))}button,a{font:inherit}button{touch-action:manipulation}.topbar{width:min(94vw,520px);margin:0 auto 8px;display:flex;justify-content:space-between;gap:10px}.home-link,.icon-btn,.small-btn{min-height:44px;border:1px solid var(--line);background:rgba(12,16,22,.9);color:var(--text);border-radius:14px;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;padding:0 13px;cursor:pointer}.icon-btn{width:44px;padding:0}.top-actions{display:flex;gap:8px}button:focus-visible,a:focus-visible{outline:2px solid var(--blue2);outline-offset:3px}main{flex:1;display:flex;align-items:center;justify-content:center}.game-shell{width:min(94vw,520px);display:flex;flex-direction:column;align-items:center;gap:12px}.title-wrap{text-align:center}h1{margin:0;font-size:clamp(1.65rem,7vw,2.3rem);letter-spacing:.23em;text-indent:.23em}.level-label{margin-top:4px;color:var(--muted);font-size:.95rem}.hint{font-size:.8rem;color:#667487;text-align:center;min-height:18px}.progress-dots{display:flex;gap:7px;min-height:16px}.dot{width:8px;height:8px;border-radius:50%;background:#1c2633}.dot.unlocked{background:#35526f}.dot.done{background:var(--blue2);box-shadow:0 0 8px rgba(126,200,255,.45)}.dot.current{transform:scale(1.25);background:var(--blue);box-shadow:0 0 12px rgba(47,156,255,.8)}.board-wrap{width:min(88vw,430px);aspect-ratio:1;position:relative;touch-action:none}.board{position:absolute;inset:0;padding:clamp(13px,3.5vw,19px);display:grid;grid-template-columns:repeat(5,1fr);grid-template-rows:repeat(5,1fr);gap:clamp(7px,2vw,11px);border-radius:var(--r);background:linear-gradient(145deg,#151b24,#070a0f 58%,#0d1218);border:1px solid #202936;box-shadow:0 18px 60px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.055),inset 0 -10px 28px rgba(0,0,0,.45)}.cell{appearance:none;border:0;padding:0;border-radius:50%;background:radial-gradient(circle at 48% 42%,#111820 0 20%,#080c11 58%,#020305 100%);position:relative;cursor:pointer;outline:none;box-shadow:inset 0 6px 11px rgba(0,0,0,.78),0 1px 0 rgba(255,255,255,.02);transition:filter .16s,opacity .16s,transform .12s}.cell::after{content:"";position:absolute;inset:17%;border-radius:50%;background:radial-gradient(circle at 35% 27%,rgba(255,255,255,.19) 0 4%,rgba(255,255,255,.055) 8%,transparent 21%),radial-gradient(circle at 50% 55%,#3d4651 0,#252d36 47%,#12171d 74%,#080b0f 100%);transform:translateY(4px) scale(.9);box-shadow:inset 0 1px 2px rgba(255,255,255,.06),inset 0 -5px 8px rgba(0,0,0,.55),0 5px 8px rgba(0,0,0,.48);transition:transform .18s cubic-bezier(.2,.8,.25,1.35),background .18s,box-shadow .18s}.cell:active:not(.disabled){transform:scale(.94)}.cell.on::after{background:radial-gradient(circle at 34% 28%,rgba(255,255,255,.9) 0 4%,rgba(255,255,255,.34) 8%,transparent 20%),radial-gradient(circle at 50% 50%,#c5e8ff 0,#69bfff 18%,#2f9cff 44%,#126ccc 72%,#07396f 100%);transform:translateY(-1px) scale(1);box-shadow:inset 0 1px 3px rgba(255,255,255,.5),inset 0 -6px 12px rgba(0,42,93,.38),0 0 10px rgba(47,156,255,.9),0 0 22px rgba(47,156,255,.55),0 4px 9px rgba(0,0,0,.5)}.cell.head::before{content:"";position:absolute;inset:5%;border-radius:50%;border:2px solid rgba(139,208,255,.75);box-shadow:0 0 12px rgba(47,156,255,.7);pointer-events:none}.cell.disabled{cursor:default;opacity:.32;background:radial-gradient(circle,#07090c 0 43%,#030405 66%,#000 100%)}.cell.disabled::after{inset:28%;background:#05070a;transform:none;box-shadow:inset 0 2px 6px rgba(0,0,0,.95)}.cell.bad{animation:bad .22s ease}@keyframes bad{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}.toolbar{display:flex;gap:9px}.small-btn{font-size:.88rem}.status-card{min-height:70px;width:min(88vw,430px);display:flex;align-items:center;justify-content:center;text-align:center}.status-message{opacity:0;transform:translateY(6px);transition:.22s;pointer-events:none}.status-message.show{opacity:1;transform:none;pointer-events:auto}.status-message strong{display:block;margin-bottom:10px}.primary-btn{min-height:46px;border:1px solid rgba(126,200,255,.38);color:#fff;background:linear-gradient(180deg,#2f9cff,#0d66cd);border-radius:14px;padding:0 18px;cursor:pointer;font-weight:700;box-shadow:0 8px 26px rgba(47,156,255,.25)}footer{text-align:center;padding-top:14px;font-size:.78rem;color:#5f6a79}.modal-backdrop{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.72);backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:center;padding:20px;opacity:0;pointer-events:none;transition:.2s}.modal-backdrop.open{opacity:1;pointer-events:auto}.modal{width:min(92vw,390px);border:1px solid #202936;border-radius:22px;background:linear-gradient(180deg,rgba(17,22,30,.98),rgba(7,10,14,.98));box-shadow:0 24px 80px rgba(0,0,0,.65);padding:20px}.modal h2{margin:0 0 8px}.modal p{margin:0 0 18px;color:var(--muted);line-height:1.5}.modal-actions{display:flex;gap:9px;justify-content:flex-end;flex-wrap:wrap}.level-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:9px;margin-top:16px}.level-choice{aspect-ratio:1;border-radius:13px;border:1px solid var(--line);background:#0c1118;color:var(--text);font-weight:700;cursor:pointer}.level-choice.locked{color:#4b5664;cursor:not-allowed;background:#070a0e}.level-choice.completed{border-color:rgba(47,156,255,.42);color:var(--blue2)}.level-choice.current{background:#153b66;border-color:#397fbd}.lock{display:block;font-size:.7rem;opacity:.6}.intro-logo{text-align:center;letter-spacing:.2em;text-indent:.2em;font-size:1.65rem;font-weight:800;margin-bottom:10px}@media(max-height:720px){.game-shell{gap:8px}.board-wrap{width:min(69vh,86vw,380px)}.status-card{min-height:54px}footer{padding-top:6px}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="topbar"><a class="home-link" href="../index.html">← Volver a Home</a><div class="top-actions"><button class="icon-btn" id="soundBtn" aria-label="Sonido">🔊</button><button class="icon-btn" id="resetBtn" aria-label="Reiniciar">↻</button></div></div>
<main><section class="game-shell"><div class="title-wrap"><h1>MAGPAD</h1><div class="level-label" id="levelLabel"></div></div><div class="hint" id="hint"></div><div class="progress-dots" id="progressDots"></div><div class="board-wrap"><div class="board" id="board" role="grid" aria-label="Tablero MagPad"></div></div><div class="toolbar"><button class="small-btn" id="levelsBtn">Niveles</button></div><div class="status-card"><div class="status-message" id="statusMessage"></div></div></section></main>
<footer>Desarrollado por: Ángel Soto</footer>
<div class="modal-backdrop" id="introModal"><div class="modal"><div class="intro-logo">MAGPAD</div><p style="text-align:center">Crea una cadena continua. Solo puedes avanzar arriba, abajo, izquierda o derecha. Ilumina todas las vías activas sin cruzar tu propia cadena.</p><div class="modal-actions" style="justify-content:center"><button class="primary-btn" id="introPlayBtn">JUGAR</button></div></div></div>
<div class="modal-backdrop" id="levelsModal"><div class="modal"><h2>Niveles</h2><p>Selecciona un nivel desbloqueado.</p><div class="level-grid" id="levelGrid"></div><div class="modal-actions" style="margin-top:16px"><button class="small-btn" id="closeLevelsBtn">Cerrar</button></div></div></div>
<div class="modal-backdrop" id="confirmModal"><div class="modal"><h2>¿Reiniciar nivel?</h2><p>Se apagará toda la cadena.</p><div class="modal-actions"><button class="small-btn" id="cancelResetBtn">Cancelar</button><button class="primary-btn" id="confirmResetBtn">Reiniciar</button></div></div></div>
<script>
(()=>{"use strict";
const TOTAL=10,KEY="magpad-save-v2";
/* Cada nivel se construye a partir de una ruta solucionable. La máscara final contiene las casillas activas. */
const ROUTES=[
 [12,13,18,17,16,11,6],
 [0,1,6,7,8,3,4,9,14],
 [20,15,10,11,6,1,2,7,12,13,18,23],
 [4,3,2,1,0,5,10,11,12,7,8,9,14,19],
 [0,5,10,15,20,21,16,11,6,1,2,3,8,13,18,23,24],
 [4,9,14,19,24,23,22,17,12,13,8,3,2,1,6,11,16,15,20],
 [0,1,2,7,6,5,10,15,16,11,12,13,8,3,4,9,14,19,18,17],
 [20,21,16,15,10,5,0,1,6,11,12,7,2,3,4,9,8,13,18,17,22,23],
 [0,5,10,15,20,21,22,17,16,11,6,1,2,7,12,13,8,3,4,9,14,19,24,23],
 [0,1,2,3,4,9,8,7,6,5,10,11,12,13,14,19,18,17,16,15,20,21,22,23,24]
];
const LEVELS=ROUTES.map(route=>{const a=Array(25).fill(0);route.forEach(i=>a[i]=1);return a});
let state={currentLevel:0,unlockedLevel:0,completed:Array(TOTAL).fill(false),soundOn:true,introSeen:false},path=[],locked=false,audioCtx=null;
const $=id=>document.getElementById(id),board=$("board"),levelLabel=$("levelLabel"),hint=$("hint"),progressDots=$("progressDots"),soundBtn=$("soundBtn"),statusMessage=$("statusMessage"),introModal=$("introModal"),levelsModal=$("levelsModal"),confirmModal=$("confirmModal"),levelGrid=$("levelGrid");
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}
function load(){try{const x=JSON.parse(localStorage.getItem(KEY));if(x){state={...state,...x,completed:Array.from({length:TOTAL},(_,i)=>!!x.completed?.[i])}}}catch(e){}}
function audio(){if(!state.soundOn)return null;try{if(!audioCtx){const A=window.AudioContext||window.webkitAudioContext;if(!A)return null;audioCtx=new A()}if(audioCtx.state==="suspended")audioCtx.resume();return audioCtx}catch(e){return null}}
function beep(f,d=.06,v=.04,delay=0){const c=audio();if(!c)return;const o=c.createOscillator(),g=c.createGain(),t=c.currentTime+delay;o.frequency.value=f;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+.008);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+d+.02)}
function soundOn(){beep(720);beep(1080,.04,.02,.015)}function soundOff(){beep(330,.07,.035)}function soundBad(){beep(170,.055,.028)}function soundWin(fin=false){beep(523,.14,.05);beep(659,.14,.05,.11);beep(784,.22,.055,.22);if(fin)beep(1047,.28,.05,.36)}
function vibrate(ms){try{navigator.vibrate?.(ms)}catch(e){}}
function adjacent(a,b){const ar=Math.floor(a/5),ac=a%5,br=Math.floor(b/5),bc=b%5;return Math.abs(ar-br)+Math.abs(ac-bc)===1}
function activeCount(){return LEVELS[state.currentLevel].reduce((s,v)=>s+v,0)}
function renderProgress(){progressDots.innerHTML="";for(let i=0;i<TOTAL;i++){const d=document.createElement("span");d.className="dot"+(i<=state.unlockedLevel?" unlocked":"")+(state.completed[i]?" done":"")+(i===state.currentLevel?" current":"");progressDots.appendChild(d)}}
function render(){board.innerHTML="";const cfg=LEVELS[state.currentLevel],set=new Set(path),head=path[path.length-1];cfg.forEach((enabled,i)=>{const b=document.createElement("button");b.className="cell";b.dataset.i=i;b.setAttribute("role","gridcell");if(!enabled){b.classList.add("disabled");b.disabled=true;b.setAttribute("aria-label",`Celda ${i+1} anulada`)}else{if(set.has(i))b.classList.add("on");if(i===head)b.classList.add("head");b.setAttribute("aria-label",`Celda ${i+1} ${set.has(i)?"activada":"apagada"}`);b.addEventListener("click",()=>tap(i,b))}board.appendChild(b)});hint.textContent=path.length?`Cadena: ${path.length} / ${activeCount()}`:"Pulsa cualquier vía activa para empezar"}
function loadLevel(i){if(i<0||i>=TOTAL||i>state.unlockedLevel)return;state.currentLevel=i;path=[];locked=false;statusMessage.classList.remove("show");statusMessage.innerHTML="";levelLabel.textContent=`Nivel ${i+1} de ${TOTAL}`;render();renderProgress();save();board.animate([{opacity:.4,transform:"scale(.975)"},{opacity:1,transform:"scale(1)"}],{duration:240,easing:"ease-out"})}
function badMove(el,msg){el.classList.remove("bad");void el.offsetWidth;el.classList.add("bad");hint.textContent=msg;soundBad();vibrate(16)}
function tap(i,el){if(locked)return;audio();const cfg=LEVELS[state.currentLevel];if(!cfg[i])return;
 if(path.length===0){path=[i];soundOn();vibrate(9);render();check();return}
 const head=path[path.length-1],pos=path.indexOf(i);
 if(i===head){path.pop();soundOff();vibrate(7);render();return}
 if(pos!==-1){badMove(el,"No puedes atravesar la cadena iluminada");return}
 if(!adjacent(head,i)){badMove(el,"Solo puedes avanzar arriba, abajo, izquierda o derecha");return}
 path.push(i);soundOn();vibrate(9);render();check();
}
function check(){if(path.length===activeCount())complete()}
function complete(){if(locked)return;locked=true;const l=state.currentLevel,fin=l===TOTAL-1;state.completed[l]=true;if(!fin)state.unlockedLevel=Math.max(state.unlockedLevel,l+1);save();renderProgress();[...board.querySelectorAll(".cell.on")].forEach((c,i)=>setTimeout(()=>c.animate([{filter:"brightness(1)"},{filter:"brightness(1.7)",transform:"scale(1.08)"},{filter:"brightness(1)",transform:"scale(1)"}],{duration:300}),i*24));soundWin(fin);vibrate(fin?35:22);setTimeout(()=>{if(fin){statusMessage.innerHTML='<strong>¡MAGPAD COMPLETADO!</strong><div style="color:var(--muted);margin-bottom:12px">Has completado los 10 niveles</div><div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap"><button class="primary-btn" id="replayBtn">Volver a jugar</button><button class="small-btn" id="chooseBtn">Elegir nivel</button></div>';statusMessage.classList.add("show");$("replayBtn").onclick=()=>loadLevel(0);$("chooseBtn").onclick=openLevels}else{statusMessage.innerHTML='<strong>NIVEL COMPLETADO</strong><button class="primary-btn" id="nextBtn">Siguiente nivel</button>';statusMessage.classList.add("show");$("nextBtn").onclick=()=>loadLevel(l+1)}},420)}
function reset(){path=[];locked=false;statusMessage.classList.remove("show");statusMessage.innerHTML="";render()}
function openModal(m){m.classList.add("open")}function closeModal(m){m.classList.remove("open")}
function openLevels(){levelGrid.innerHTML="";for(let i=0;i<TOTAL;i++){const b=document.createElement("button");b.className="level-choice";if(i>state.unlockedLevel){b.classList.add("locked");b.disabled=true;b.innerHTML=`${i+1}<span class="lock">🔒</span>`}else{b.textContent=i+1;if(state.completed[i])b.classList.add("completed");if(i===state.currentLevel)b.classList.add("current");b.onclick=()=>{closeModal(levelsModal);loadLevel(i)}}levelGrid.appendChild(b)}openModal(levelsModal)}
soundBtn.onclick=()=>{state.soundOn=!state.soundOn;soundBtn.textContent=state.soundOn?"🔊":"🔇";if(state.soundOn)soundOn();save()};$("resetBtn").onclick=()=>path.length?openModal(confirmModal):reset();$("levelsBtn").onclick=openLevels;$("closeLevelsBtn").onclick=()=>closeModal(levelsModal);$("cancelResetBtn").onclick=()=>closeModal(confirmModal);$("confirmResetBtn").onclick=()=>{closeModal(confirmModal);reset()};$("introPlayBtn").onclick=()=>{audio();state.introSeen=true;save();closeModal(introModal)};[levelsModal,confirmModal].forEach(m=>m.onclick=e=>{if(e.target===m)closeModal(m)});document.addEventListener("keydown",e=>{if(e.key==="Escape"){closeModal(levelsModal);closeModal(confirmModal)}});
load();if(state.currentLevel>state.unlockedLevel)state.currentLevel=state.unlockedLevel;soundBtn.textContent=state.soundOn?"🔊":"🔇";loadLevel(state.currentLevel);if(!state.introSeen)requestAnimationFrame(()=>openModal(introModal));
})();
</script>
</body>
</html>
