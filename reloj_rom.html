<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Reloj Romano</title>
    <style>
        body {
            overflow: hidden;
        }

        .wrapper {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100vw;
            height: 100vh;
            font-size: clamp(30px, 5vw, 60px);
            font-family: serif;
        }

        #time-wrapper {
            transform-origin: center center;
        }

        #sumertime {
            text-align: center;
            width: clamp(200px, -40px + 40vw, 440px);
        }
    </style>
</head>
<body>

<div class="wrapper">
    <div id="time-wrapper">
        <div id="sumertime"></div>
    </div>
</div>

<script>
    // Conversión a números romanos
    function toRoman(num) {
        if (num === 0) return "N"; // No hay número romano para el cero
        const romanMap = [
            [1000, "M"], [900, "CM"], [500, "D"], [400, "CD"],
            [100, "C"], [90, "XC"], [50, "L"], [40, "XL"],
            [10, "X"], [9, "IX"], [5, "V"], [4, "IV"], [1, "I"]
        ];
        let result = "";
        for (let [value, numeral] of romanMap) {
            while (num >= value) {
                result += numeral;
                num -= value;
            }
        }
        return result;
    }

    function setTime() {
        const d = new Date();
        const hour = d.getHours();
        const minute = d.getMinutes();
        const second = d.getSeconds();

        document.getElementById("sumertime").innerHTML =
            toRoman(hour) + " : " + toRoman(minute) + " : " + toRoman(second);
    }

    setTime();
    setInterval(setTime, 1000);
</script>

</body>
</html>
