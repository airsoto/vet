<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Quiz de Fotos</title>
  <style>
    body {
      background-color: #121212;
      color: #f5f5f5;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }
    h1 {
      margin-bottom: 20px;
    }
    #quiz-container {
      text-align: center;
    }
    img {
      max-width: 300px;
      max-height: 300px;
      border-radius: 12px;
      margin-bottom: 20px;
      box-shadow: 0px 0px 15px rgba(0,0,0,0.7);
    }
    .options {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    button {
      background-color: #1e1e1e;
      color: #f5f5f5;
      border: 1px solid #444;
      border-radius: 8px;
      padding: 10px;
      cursor: pointer;
      font-size: 16px;
      transition: background 0.2s, transform 0.1s;
    }
    button:hover {
      background-color: #333;
      transform: scale(1.05);
    }
    .correct {
      background-color: #2e7d32 !important;
      border-color: #2e7d32;
    }
    .wrong {
      background-color: #c62828 !important;
      border-color: #c62828;
    }
    #next-btn {
      margin-top: 20px;
      display: none;
      background-color: #1976d2;
      border-color: #1976d2;
    }
  </style>
</head>
<body>
  <h1>¿Quién es?</h1>
  <div id="quiz-container">
    <img id="photo" src="" alt="Persona">
    <div class="options" id="options"></div>
    <button id="next-btn">Siguiente</button>
  </div>

  <script>
    const images = [
      "alexa.jpg", "ana pinel.jpg", "ana regordan.jpg", "basma.jpeg",
      "claudia de las heras.png", "claudia huerta.jpg", "claudia largo.jpg",
      "elena.JPG", "gonzalo.jpg", "laura.jpg", "lorena.jpg",
      "luna.jpg", "maria ortega.jpg", "maria.png", "michelle.jpeg",
      "miriam.jpg", "pilar.jpg", "raquel.jpg", "rut.jpg", "sofia.png"
    ];

    let currentAnswer = "";
    const photo = document.getElementById("photo");
    const optionsContainer = document.getElementById("options");
    const nextBtn = document.getElementById("next-btn");

    function getName(file) {
      return file.replace(/\.[^.]+$/, ""); // elimina extensión
    }

    function shuffle(array) {
      return array.sort(() => Math.random() - 0.5);
    }

    function loadQuiz() {
      optionsContainer.innerHTML = "";
      nextBtn.style.display = "none";

      // elegir foto aleatoria
      const chosenFile = images[Math.floor(Math.random() * images.length)];
      currentAnswer = getName(chosenFile);
      photo.src = "ach2526/" + chosenFile;

      // crear opciones
      let choices = [currentAnswer];
      while (choices.length < 4) {
        const random = getName(images[Math.floor(Math.random() * images.length)]);
        if (!choices.includes(random)) {
          choices.push(random);
        }
      }

      shuffle(choices);

      choices.forEach(choice => {
        const btn = document.createElement("button");
        btn.textContent = choice;
        btn.onclick = () => checkAnswer(btn, choice);
        optionsContainer.appendChild(btn);
      });
    }

    function checkAnswer(button, choice) {
      const buttons = optionsContainer.querySelectorAll("button");
      buttons.forEach(btn => {
        btn.disabled = true;
        if (btn.textContent === currentAnswer) {
          btn.classList.add("correct");
        }
      });

      if (choice !== currentAnswer) {
        button.classList.add("wrong");
      }

      nextBtn.style.display = "block";
    }

    nextBtn.onclick = loadQuiz;

    loadQuiz();
  </script>
</body>
</html>
