name: Actualizar HTML de Crayon Physics

on:
  push:
    paths:
      - .github/crayon-v2-trigger

permissions:
  contents: write

jobs:
  update-html:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Actualizar index.html
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('crayonphysics/index.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('<title>Crayon Physics —</title>', '<title>CRAYON PHYSICS — Dibuja. Construye. Resuelve.</title>')
          s = s.replace('<title>Crayon Orbit — Dibuja. Construye. Resuelve.</title>', '<title>CRAYON PHYSICS — Dibuja. Construye. Resuelve.</title>')
          s = s.replace('<h1>CRAYON<br>Physics</h1>', '<h1>CRAYON<br>PHYSICS</h1>')
          s = s.replace('<h1>CRAYON<br>ORBIT</h1>', '<h1>CRAYON<br>PHYSICS</h1>')
          s = s.replace('<h2>Crayon Orbit</h2><p><strong>Concepto y desarrollo web: Ángel Soto</strong></p>', '<h2>CRAYON PHYSICS</h2><p><strong>Concepto y desarrollo web: Ángel Soto</strong></p>')
          s = s.replace('Versión 1.0 · Un solo archivo HTML', 'Versión 2.0 · Física y dibujo inteligente')
          old_ink = '    <div class="ink-wrap"><div class="ink-label">TINTA <span id="inkText"></span></div><div class="ink-bar"><div id="inkFill" class="ink-fill"></div></div></div>'
          new_ink = '    <div class="ink-wrap hidden" aria-hidden="true"><div class="ink-label">TINTA <span id="inkText"></span></div><div class="ink-bar"><div id="inkFill" class="ink-fill"></div></div></div>\n    <div class="draw-mode-badge" aria-live="polite">✎ Dibujo inteligente · tinta ilimitada</div>'
          s = s.replace(old_ink, new_ink)
          old_tools = '''    <button class="tool-btn active" data-tool="draw" aria-label="Trazo">〰<span>Trazo</span></button>\n    <button class="tool-btn" data-tool="shape" aria-label="Forma cerrada">⬡<span>Forma</span></button>\n    <button class="tool-btn" data-tool="wheel" aria-label="Rueda">◉<span>Rueda</span></button>'''
          new_tools = '    <button class="tool-btn active" data-tool="smart" aria-label="Dibujo inteligente">✎<span>Dibujar</span></button>'
          s = s.replace(old_tools, new_tools)
          s = s.replace('<div class="field"><label>Tinta</label><input id="editorInk" type="number" min="100" max="5000" value="1200"></div>', '<div class="field ink-setting" hidden><label>Tinta</label><input id="editorInk" type="number" min="100" max="999999" value="999999"></div>')
          s = s.replace('''      <div><strong>〰 Trazo</strong><br>Rampas, puentes, barreras y palancas.</div>\n      <div><strong>⬡ Forma</strong><br>Cierra el dibujo para crear un peso sólido.</div>\n      <div><strong>◉ Rueda</strong><br>Dibuja un círculo. Puede rodar y empujar.</div>''', '''      <div><strong>✎ Dibujo inteligente</strong><br>Dibuja libremente: una línea crea una pieza, un contorno cerrado crea un sólido y un círculo crea una rueda.</div>''')
          s = s.replace('Elimina tus construcciones y recupera tinta.', 'Elimina cualquiera de tus construcciones.')
          s = s.replace('La primera se obtiene resolviendo el nivel; la segunda, usando poca tinta; la tercera, combinando mecanismos como ruedas, cuerdas o pivotes.', 'La primera se obtiene resolviendo el nivel; la segunda, con pocos objetos y buen tiempo; la tercera, combinando ruedas, sólidos, cuerdas o pivotes.')
          marker = '/* CRAYON PHYSICS V2 SOURCE UI */'
          if marker not in s:
              css = '''\n/* CRAYON PHYSICS V2 SOURCE UI */\n.draw-mode-badge{position:absolute;left:12px;top:10px;z-index:3;padding:7px 11px;border:2px dashed var(--blue);border-radius:13px;background:var(--panel);box-shadow:2px 3px 0 var(--shadow);font-size:.72rem;font-weight:900;pointer-events:none}.paper-card,.world-card,.level-card,.footer{border-width:3px}.game-toolbar{background-image:repeating-linear-gradient(-3deg,transparent 0 9px,rgba(45,95,134,.025) 10px 11px)}.tool-btn{border-width:3px}.tool-btn:after{content:"";position:absolute;inset:4px;border:1px dashed currentColor;border-radius:12px;opacity:.2;pointer-events:none}body.theme-dark .draw-mode-badge{background:rgba(25,32,39,.94)}\n'''
              s = s.replace('</style>', css + '\n</style>', 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Publicar cambios
        run: |
          if git diff --quiet -- crayonphysics/index.html; then
            echo "Sin cambios"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crayonphysics/index.html
          git commit -m "Actualiza HTML de Crayon Physics v2"
          git push
