name: Build index_v2206

on:
  push:
    branches: [main]
    paths:
      - index_v2206_payload_ready

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct validated HTML
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, gzip, hashlib

          marker = Path('index_v2206_payload_ready')
          chunks = sorted(Path('.').glob('index_v2206_payload_*.txt'))
          if not marker.exists() or not chunks:
              raise SystemExit('Payload marker or chunks not found')

          encoded = ''.join(chunk.read_text(encoding='utf-8').strip() for chunk in chunks)
          html = gzip.decompress(base64.b64decode(encoded))
          expected = '6e4afc2e6ad5a4feb9e09a58ee504749c73d72829d64290b1d0be639b45cd4b9'
          actual = hashlib.sha256(html).hexdigest()
          if actual != expected:
              raise SystemExit(f'Checksum mismatch: {actual}')

          Path('index_v2206.html').write_bytes(html)
          for chunk in chunks:
              chunk.unlink()
          marker.unlink()
          PY

      - name: Commit generated page
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index_v2206.html index_v2206_payload_ready index_v2206_payload_*.txt
          git commit -m "Add enhanced index_v2206 page"
          git push
