name: Actualizar barra de Crayon Orbit

on:
  push:
    paths:
      - '.github/workflows/crayon-toolbar-update.yml'

permissions:
  contents: write

jobs:
  update-toolbar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Mejorar botones sin alterar el juego
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('crayonphysics/index.html')
          text = path.read_text(encoding='utf-8')

          toolbar_css = '''.game-toolbar{min-height:94px;padding:9px 10px calc(9px + var(--safe-bottom));display:flex;gap:10px;align-items:center;overflow-x:auto;overscroll-behavior-x:contain;scroll-snap-type:x proximity;scroll-padding-inline:10px;-webkit-overflow-scrolling:touch;background:rgba(255,250,235,.98);border-top:2px solid rgba(36,51,66,.14);z-index:5;scrollbar-width:none}.game-toolbar::-webkit-scrollbar{display:none}
          .tool-btn{flex:0 0 76px;height:74px;border-radius:18px;background:#fff8e8;border:2.5px solid rgba(36,51,66,.28);box-shadow:0 3px 0 rgba(36,51,66,.14);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:5px 4px 4px;font-weight:1000;scroll-snap-align:center;transition:transform .1s,background .12s,border-color .12s,box-shadow .12s}.tool-btn:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(36,51,66,.14)}.tool-btn .tool-icon{width:40px;height:38px;display:grid;place-items:center;flex:0 0 auto;pointer-events:none}.tool-btn .tool-icon svg{width:36px;height:36px;display:block;fill:none;stroke:currentColor;stroke-width:2.35;stroke-linecap:round;stroke-linejoin:round;overflow:visible}.tool-btn .tool-label{display:block;max-width:100%;font-size:.69rem;line-height:1;letter-spacing:-.015em;white-space:nowrap;pointer-events:none}.tool-btn.tool-action{border-color:rgba(183,119,32,.55);background:#fff4d8}.tool-btn.active{background:var(--blue);color:white;border-color:var(--blue2);box-shadow:0 3px 0 rgba(23,63,97,.35),inset 0 0 0 2px rgba(255,255,255,.2)}'''

          text, n = re.subn(
              r'\.game-toolbar\{.*?\}\.game-toolbar::-webkit-scrollbar\{display:none\}\n\.tool-btn\{.*?\}\.tool-btn span\{.*?\}\.tool-btn\.active\{.*?\}',
              toolbar_css,
              text,
              count=1,
              flags=re.S,
          )
          if n != 1:
              raise SystemExit('No se localizó el CSS original de la barra')

          dark_anchor = 'body.theme-dark .crayon-btn.primary,body.theme-dark .tool-btn.active,body.theme-dark .icon-btn.active,body.theme-dark .editor-tools button.active{background:#315f80;color:#fff;border-color:#7bb8e1}'
          dark_extra = dark_anchor + '\nbody.theme-dark .tool-btn.tool-action{background:#28271f;border-color:rgba(241,198,90,.5)}'
          if 'body.theme-dark .tool-btn.tool-action' not in text:
              text = text.replace(dark_anchor, dark_extra, 1)

          old_mobile = '@media(max-width:420px){.home-actions{grid-template-columns:1fr}.home-actions .wide{grid-column:auto}.hero h1{font-size:3.1rem}.game-topbar{height:54px;min-height:54px}.icon-btn{width:44px;height:44px}.tool-btn{flex-basis:54px;height:54px}.world-grid{grid-template-columns:1fr}}'
          new_mobile = '@media(max-width:420px){.home-actions{grid-template-columns:1fr}.home-actions .wide{grid-column:auto}.hero h1{font-size:3.1rem}.game-topbar{height:54px;min-height:54px}.icon-btn{width:44px;height:44px}.game-toolbar{min-height:88px;gap:8px;padding-inline:8px}.tool-btn{flex-basis:70px;height:68px;border-radius:17px}.tool-btn .tool-icon{width:36px;height:34px}.tool-btn .tool-icon svg{width:33px;height:33px}.tool-btn .tool-label{font-size:.64rem}.world-grid{grid-template-columns:1fr}}'
          text = text.replace(old_mobile, new_mobile, 1)

          old_landscape = '@media(orientation:landscape) and (max-height:520px){.game-topbar{height:48px;min-height:48px}.game-toolbar{position:absolute;right:0;top:48px;bottom:0;width:70px;min-height:0;flex-direction:column;padding:6px calc(6px + var(--safe-right)) calc(6px + var(--safe-bottom)) 6px;border-top:0;border-left:2px solid rgba(36,51,66,.14)}.game-stage{margin-right:70px}.tool-btn{width:54px;min-height:51px;flex-basis:51px}.tool-btn span{display:none}.ink-wrap{top:7px}.context-tip{top:40px}.sandbox-bar{right:80px}.hero{transform:scale(.85)}}'
          new_landscape = '@media(orientation:landscape) and (max-height:520px){.game-topbar{height:48px;min-height:48px}.game-toolbar{position:absolute;right:0;top:48px;bottom:0;width:80px;min-height:0;flex-direction:column;padding:7px calc(7px + var(--safe-right)) calc(7px + var(--safe-bottom)) 7px;gap:7px;border-top:0;border-left:2px solid rgba(36,51,66,.14);scroll-snap-type:y proximity}.game-stage{margin-right:80px}.tool-btn{width:64px;min-height:60px;flex-basis:60px;padding:4px}.tool-btn .tool-icon{width:38px;height:38px}.tool-btn .tool-icon svg{width:35px;height:35px}.tool-btn .tool-label{display:none}.ink-wrap{top:7px}.context-tip{top:40px}.sandbox-bar{right:90px}.hero{transform:scale(.85)}}'
          text = text.replace(old_landscape, new_landscape, 1)

          toolbar_html = '''  <div class="game-toolbar" role="toolbar" aria-label="Herramientas de dibujo y acciones">
            <button class="tool-btn active" data-tool="draw" aria-label="Trazo" aria-pressed="true" title="Trazo">
              <span class="tool-icon" aria-hidden="true"><svg viewBox="0 0 40 40"><path d="M4 27c6-17 11 9 18-7s10 4 14-7"/></svg></span><span class="tool-label">Trazo</span>
            </button>
            <button class="tool-btn" data-tool="shape" aria-label="Forma cerrada" aria-pressed="false" title="Forma cerrada">
              <span class="tool-icon" aria-hidden="true"><svg viewBox="0 0 40 40"><path d="M20 4 34 12v16L20 36 6 28V12Z"/><path d="m10 13 9-5 11 6" opacity=".45"/></svg></span><span class="tool-label">Forma</span>
            </button>
            <button class="tool-btn" data-tool="wheel" aria-label="Rueda" aria-pressed="false" title="Rueda">
              <span class="tool-icon" aria-hidden="true"><svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="15"/><circle cx="20" cy="20" r="4"/><path d="M20 5v11m0 8v11M5 20h11m8 0h11M9.4 9.4l7.8 7.8m5.6 5.6 7.8 7.8m0-21.2-7.8 7.8m-5.6 5.6-7.8 7.8"/></svg></span><span class="tool-label">Rueda</span>
            </button>
            <button class="tool-btn" data-tool="pivot" aria-label="Pivote" aria-pressed="false" title="Pivote">
              <span class="tool-icon" aria-hidden="true"><svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="14"/><circle cx="20" cy="20" r="5"/><path d="M20 2v8m0 20v8M2 20h8m20 0h8"/></svg></span><span class="tool-label">Pivote</span>
            </button>
            <button class="tool-btn" data-tool="rope" aria-label="Cuerda" aria-pressed="false" title="Cuerda">
              <span class="tool-icon" aria-hidden="true"><svg viewBox="0 0 40 40"><circle cx="7" cy="11" r="3"/><circle cx="33" cy="29" r="3"/><path d="M9.5 13c9 0 4 15 13 15 5 0 5-6 8-6"/><path d="M12 16c6 2 3 9 9 10" opacity=".45"/></svg></span><span class="tool-label">Cuerda</span>
            </button>
            <button class="tool-btn" data-tool="erase" aria-label="Borrador" aria-pressed="false" title="Borrador">
              <span class="tool-icon" aria-hidden="true"><svg viewBox="0 0 40 40"><path d="m8 25 14-16a4 4 0 0 1 6 0l5 5a4 4 0 0 1 0 6L20 33H11l-4-4a3 3 0 0 1 1-4Z"/><path d="m17 15 12 11M19 33h16"/></svg></span><span class="tool-label">Borrar</span>
            </button>
            <button class="tool-btn tool-action" id="undoBtn" aria-label="Deshacer" title="Deshacer" aria-keyshortcuts="Control+Z Meta+Z">
              <span class="tool-icon" aria-hidden="true"><svg viewBox="0 0 40 40"><path d="M15 10 6 18l9 8"/><path d="M7 18h15c8 0 13 4 13 12"/></svg></span><span class="tool-label">Deshacer</span>
            </button>
            <button class="tool-btn tool-action" id="redoBtn" aria-label="Rehacer" title="Rehacer" aria-keyshortcuts="Control+Shift+Z Meta+Shift+Z">
              <span class="tool-icon" aria-hidden="true"><svg viewBox="0 0 40 40"><path d="m25 10 9 8-9 8"/><path d="M33 18H18C10 18 5 22 5 30"/></svg></span><span class="tool-label">Rehacer</span>
            </button>
            <button class="tool-btn tool-action" id="restartBtn" aria-label="Reiniciar nivel" title="Reiniciar nivel">
              <span class="tool-icon" aria-hidden="true"><svg viewBox="0 0 40 40"><path d="M31 11a15 15 0 1 0 3.5 15"/><path d="M31 4v9h-9"/></svg></span><span class="tool-label">Reiniciar</span>
            </button>
            <button class="tool-btn tool-action" id="hintBtn" aria-label="Pista" title="Pista">
              <span class="tool-icon" aria-hidden="true"><svg viewBox="0 0 40 40"><path d="M13 16a7 7 0 1 1 11 5.7c-2.5 1.8-4 3-4 6.3"/><path d="M20 34h.01"/></svg></span><span class="tool-label">Pista</span>
            </button>
          </div>'''

          text, n = re.subn(
              r'  <div class="game-toolbar" role="toolbar" aria-label="Herramientas">.*?  </div>\n</section>',
              toolbar_html + '\n</section>',
              text,
              count=1,
              flags=re.S,
          )
          if n != 1:
              raise SystemExit('No se localizó la barra HTML original')

          old_set_tool = "setTool(t){this.tool=t;this.points=[];this.ropeStart=null;$$('.tool-btn[data-tool]').forEach(b=>b.classList.toggle('active',b.dataset.tool===t));this.app.audio.click()}"
          new_set_tool = "setTool(t){this.tool=t;this.points=[];this.ropeStart=null;$$('.tool-btn[data-tool]').forEach(b=>{const on=b.dataset.tool===t;b.classList.toggle('active',on);b.setAttribute('aria-pressed',String(on))});this.app.audio.click()}"
          if old_set_tool not in text:
              raise SystemExit('No se localizó setTool original')
          text = text.replace(old_set_tool, new_set_tool, 1)

          if text.count('class="tool-icon"') != 10:
              raise SystemExit('La barra no contiene los 10 iconos esperados')
          if text.count('const LEVELS=[') != 1:
              raise SystemExit('La campaña ha sido alterada inesperadamente')

          path.write_text(text, encoding='utf-8')
          PY

      - name: Validar JavaScript
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html = Path('crayonphysics/index.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', html, flags=re.S)
          Path('/tmp/crayon-inline.js').write_text('\n'.join(scripts), encoding='utf-8')
          PY
          node --check /tmp/crayon-inline.js

      - name: Publicar actualización
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crayonphysics/index.html
          if git diff --cached --quiet; then
            echo "No hay cambios pendientes"
            exit 0
          fi
          git commit -m "Mejora accesibilidad de controles de Crayon Orbit"
          git push
