name: Update 2MVC worker

on:
  push:
    paths:
      - '.github/workflows/update-2mvc-worker.yml'

permissions:
  contents: write

jobs:
  update-worker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Rebuild optimized worker
        shell: bash
        run: |
          mkdir -p 2mvc
          cat > /tmp/worker.js.gz.b64 <<'EOF'
          
          EOF
          base64 -d /tmp/worker.js.gz.b64 | gzip -d > 2mvc/worker.js
      - name: Commit optimized worker
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 2mvc/worker.js
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Actualizar Worker 2MVC a 7.1"
          git push
