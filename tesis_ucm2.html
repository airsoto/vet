<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Buscador de Tesis Doctorales UCM</title>
  <style>
    body { background-color:#121212; color:#f0f0f0; font-family:'Georgia', serif; margin:0; padding:2em; }
    h1 { text-align:center; color:#90caf9; margin-bottom:0.5em; }
    .search-section { display:flex; gap:1em; justify-content:center; flex-wrap:wrap; margin-bottom:2em; }
    input, select, button { padding:0.5em; font-size:1em; border-radius:5px; border:none; }
    input, select { width:220px; background:#1f1f1f; color:#f0f0f0; }
    button { background-color:#1e88e5; color:white; cursor:pointer; }
    .results { margin-top:2em; display:grid; grid-template-columns:repeat(auto-fill, minmax(350px,1fr)); gap:1.5em; }
    .article { background:#1e1e1e; padding:1.5em; border-left:4px solid #90caf9; border-radius:8px; }
    .abstract-text { font-style:italic; text-align:justify; line-height:1.6; margin-top:1em; font-size:1.05em; }
    .meta { font-size:0.9em; margin-top:0.5em; color:#bbb; }
    .btn-row { display:flex; gap:.5em; flex-wrap:wrap; margin-top:0.75em; }
    .btn { display:inline-block; padding:0.5em 1em; border-radius:5px; text-decoration:none; font-size:0.9em; transition:filter .2s; }
    .btn:hover { filter:brightness(1.05); }
    .btn-primary { background:#1e88e5; color:white; }
    .btn-success { background:#43a047; color:white; }
    #result-count { text-align:center; font-size:1.1em; margin-top:1em; color:#90caf9; }
  </style>
</head>
<body>
  <h1>Buscador de Tesis Doctorales de la UCM</h1>

  <h2 style="text-align:center;">
    <span style="color:#ff9900;">Desarrollado por: Angel Soto</span>
  </h2>

  <p style="text-align:center; margin-top:-1em;">
    <a href="https://airsoto.github.io/vet/howtesis_ucm.html" target="_blank" style="color:#90caf9; text-decoration:underline;">
      (cómo está creada esta página)
    </a>
  </p>

  <div class="search-section">
    <select id="search-type" aria-label="Campo de búsqueda">
      <option value="title">Título</option>
      <option value="authors">Autor</option>
      <option value="subjects_ucm">Materia UCM</option>
      <option value="subjects_unesco">Materia UNESCO</option>
    </select>
    <input type="text" id="search-input" placeholder="Buscar..." aria-label="Texto a buscar">
    <button id="search-btn">Buscar</button>
  </div>

  <div id="result-count"></div>
  <div id="results" class="results"></div>

  <script>
    let tesis = [];
    let index = []; // índice normalizado para búsquedas rápidas
    const RENDER_LIMIT = 200; // para acelerar el pintado en listados muy largos
    let debounceTimer = null;

    async function cargarTesis() {
      try {
        const response = await fetch('json/tesis_ucm_v1.json');
        if (!response.ok) throw new Error('No se pudo cargar el archivo JSON');
        tesis = await response.json();

        // Construir índice normalizado
        index = tesis.map((t, i) => ({
          i,
          title: (t.title || '').toLowerCase(),
          authors: Array.isArray(t.authors) ? t.authors.map(a => (a || '').toLowerCase()) : [],
          subjects_ucm: Array.isArray(t.subjects_ucm) ? t.subjects_ucm.map(s => (s || '').toLowerCase()) : [],
          subjects_unesco: Array.isArray(t.subjects_unesco) ? t.subjects_unesco.map(s => (s || '').toLowerCase()) : [],
          link: t.link || '',
          pdf: t.pdf || ''
        }));
      } catch (error) {
        document.getElementById('results').innerHTML = '<p>Error al cargar las tesis.</p>';
        console.error(error);
      }
    }

    function getPdfUrl(t) {
      // Ajusta aquí si usas otra clave o patrón
      if (t.pdf && typeof t.pdf === 'string' && t.pdf.trim()) return t.pdf.trim();
      // Si no hay PDF directo, no intentamos deducirlo (depende del repositorio DSpace);
      // el botón "Ver ficha en Docta" cubrirá el acceso manual desde la página de la tesis.
      return null;
    }

    function matchRecord(rec, type, q) {
      if (!q) return true;
      if (type === 'authors' || type === 'subjects_ucm' || type === 'subjects_unesco') {
        const arr = rec[type] || [];
        return arr.some(v => v.includes(q));
      }
      // title u otros campos string
      return (rec[type] || '').includes(q);
    }

    function search() {
      const type = document.getElementById('search-type').value;
      const query = (document.getElementById('search-input').value || '').toLowerCase();
      const resultsContainer = document.getElementById('results');
      const countContainer = document.getElementById('result-count');

      // Filtrado sobre el índice normalizado
      const matchedIdx = [];
      for (const rec of index) {
        if (matchRecord(rec, type, query)) matchedIdx.push(rec.i);
      }

      const total = matchedIdx.length;
      const slice = matchedIdx.slice(0, RENDER_LIMIT);

      // Cabecera de resultados
      countContainer.innerHTML = total > RENDER_LIMIT
        ? `Mostrando <strong>${slice.length}</strong> de <strong>${total</strong>} tesis (limite por rendimiento).`
        : `Se encontraron <strong>${total}</strong> tesis.`;

      // Render eficiente
      resultsContainer.innerHTML = '';
      if (slice.length === 0) {
        resultsContainer.innerHTML = '<p>No se encontraron resultados.</p>';
        return;
      }

      const frag = document.createDocumentFragment();
      for (const idx of slice) {
        const t = tesis[idx];
        const authors = Array.isArray(t.authors) ? t.authors.filter(Boolean).join(', ') : '';
        const subjectsUcm = Array.isArray(t.subjects_ucm) && t.subjects_ucm.length ? `<p><strong>Materias UCM:</strong> ${t.subjects_ucm.join(', ')}</p>` : '';
        const subjectsUnesco = Array.isArray(t.subjects_unesco) && t.subjects_unesco.length ? `<p><strong>Materias UNESCO:</strong> ${t.subjects_unesco.join(', ')}</p>` : '';

        const pdfUrl = getPdfUrl(t);
        const linkUrl = t.link || '';

        const card = document.createElement('div');
        card.className = 'article';
        card.innerHTML = `
          <h2 style="text-align:center; color:#90caf9;">${t.title || ''}</h2>
          <p style="text-align:center; font-style:italic;">${authors}</p>
          <p class="meta">Fecha de publicación: ${t.pub_date || '-'}${t.defense_date ? ' | Defensa: ' + t.defense_date : ''}</p>
          <h3>Resumen</h3>
          <p class="abstract-text">${t.summary || ''}</p>
          ${subjectsUcm}
          ${subjectsUnesco}
          <div class="btn-row">
            ${linkUrl ? `<a class="btn btn-primary" href="${linkUrl}" target="_blank" rel="noopener noreferrer">Ver ficha en Docta</a>` : ''}
            ${pdfUrl ? `<a class="btn btn-success" href="${pdfUrl}" target="_blank" rel="noopener noreferrer">Abrir PDF en docta.ucm.es</a>` : ''}
          </div>
        `;
        frag.appendChild(card);
      }
      resultsContainer.appendChild(frag);
    }

    // Debounce para el input
    function debouncedSearch() {
      clearTimeout(debounceTimer);
      debounceTimer = setTimeout(search, 200);
    }

    // Listeners
    document.getElementById('search-btn').addEventListener('click', search);
    document.getElementById('search-input').addEventListener('input', debouncedSearch);
    document.getElementById('search-type').addEventListener('change', search);

    // Inicio
    cargarTesis().then(search);
  </script>
</body>
</html>

<div id="footer"></div>

<script>
  // Cargar footer.html y colocarlo en #footer
  fetch("footer.html")
    .then(response => {
      if (!response.ok) throw new Error("No se pudo cargar footer.html");
      return response.text();
    })
    .then(data => {
      document.getElementById("footer").innerHTML = data;
    })
    .catch(error => console.error("Error cargando el footer:", error));
</script>
