<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Buscador de Tesis Doctorales UCM</title>
  <style>
    body {
      background-color: #121212;
      color: #f0f0f0;
      font-family: 'Georgia', serif;
      margin: 0;
      padding: 2em;
    }
    h1 {
      text-align: center;
      color: #90caf9;
      font-size: 2.2em;
    }
    .search-section {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 1em;
      margin: 2em 0;
    }
    input, select {
      width: 260px;
      padding: 0.75em;
      font-size: 1.1em;
      border-radius: 8px;
      border: none;
      background-color: #1f1f1f;
      color: #f0f0f0;
    }
    .results {
      margin-top: 2em;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
      gap: 1.5em;
    }
    .article {
      background-color: #1e1e1e;
      padding: 1.5em;
      border-left: 5px solid #90caf9;
      border-radius: 10px;
    }
    .abstract-text {
      font-style: italic;
      text-align: justify;
      line-height: 1.6;
      margin-top: 1em;
      font-size: 1.1em;
    }
    .meta {
      font-size: 0.95em;
      margin-top: 0.5em;
      color: #bbb;
    }
    #result-count {
      text-align: center;
      font-size: 1.2em;
      margin-top: 1em;
      color: #90caf9;
    }
    .word-cloud {
      display: flex;
      flex-wrap: wrap;
      gap: 0.6em;
      justify-content: center;
      margin-top: 1em;
    }
    .word-cloud span {
      font-size: calc(0.8em + var(--size));
      color: #ffcc80;
    }
  </style>
</head>
<body>
  <h1>Buscador de Tesis Doctorales de la UCM</h1>
  <h2><span style="color: #ff9900;">Desarrollado por: Angel Soto</span></h2>
  <p style="text-align: center; margin-top: -1em;">
    <a href="https://airsoto.github.io/vet/howtesis_ucm.html" target="_blank" style="color: #90caf9;">
      (cómo está creada esta página)
    </a>
  </p>

  <div class="search-section" aria-label="Controles de búsqueda">
    <!-- NUEVO: desplegable con Materias UCM (desde subjects_ucm.txt) -->
    <select id="subject-ucm" aria-label="Materia UCM (lista)">
      <option value="">Materia UCM (todas)</option>
    </select>

    <input type="text" id="search-title" placeholder="Buscar por título..." aria-label="Buscar por título">
    <input type="text" id="search-author" placeholder="Buscar por autor..." aria-label="Buscar por autor">
    <input type="text" id="search-director" placeholder="Buscar por director..." aria-label="Buscar por director">

    <!-- Mantengo el campo libre para materias texto (UCM o UNESCO) por si quieres buscar por palabras -->
    <input type="text" id="search-subject" placeholder="Materia (texto libre UCM/UNESCO)..." aria-label="Buscar por materia texto">
    <input type="number" id="start-year" placeholder="Año desde" aria-label="Año inicial">
    <input type="number" id="end-year" placeholder="Año hasta" aria-label="Año final">
    <select id="sort">
      <option value="">Ordenar por...</option>
      <option value="title">Título A-Z</option>
      <option value="author">Autor A-Z</option>
      <option value="year">Fecha (más reciente)</option>
    </select>
  </div>

  <div id="result-count"></div>
  <!-- Eliminado: <div id="stats"></div> -->
  <div id="word-cloud" class="word-cloud"></div>
  <div id="results" class="results"></div>

  <script>
    let tesis = [];

    // Cargar JSON de tesis
    async function cargarTesis() {
      const res = await fetch('json/tesis_ucm_v1.json');
      tesis = await res.json();
      filtrar();
    }

    // Cargar materias UCM desde TXT (una por línea)
    async function cargarMateriasUCM() {
      try {
        const res = await fetch('json/subjects_ucm.txt'); // ajusta ruta si está en otra carpeta
        const txt = await res.text();

        // Parseo: líneas limpias, sin vacíos, sin duplicados, ordenadas
        const set = new Set(
          txt.split(/\r?\n/)
            .map(l => l.trim())
            .filter(l => l.length > 0)
        );
        const materias = Array.from(set).sort((a, b) => a.localeCompare(b, 'es', { sensitivity: 'base' }));

        const sel = document.getElementById('subject-ucm');
        materias.forEach(m => {
          const opt = document.createElement('option');
          opt.value = m;
          opt.textContent = m;
          sel.appendChild(opt);
        });
      } catch (e) {
        console.error('No se pudieron cargar las materias UCM desde subjects_ucm.txt', e);
      }
    }

    function filtrar() {
      const title = document.getElementById('search-title').value.toLowerCase();
      const author = document.getElementById('search-author').value.toLowerCase();
      const director = document.getElementById('search-director').value.toLowerCase();
      const subjectFree = document.getElementById('search-subject').value.toLowerCase();
      const subjectUCM = document.getElementById('subject-ucm').value.toLowerCase(); // seleccionado
      const startYear = parseInt(document.getElementById('start-year').value);
      const endYear = parseInt(document.getElementById('end-year').value);
      const sort = document.getElementById('sort').value;

      let filtradas = tesis.filter(t => {
        const titleMatch = !title || (t.title && t.title.toLowerCase().includes(title));
        const authorMatch = !author || (t.authors && t.authors.some(a => (a || '').toLowerCase().includes(author)));
        const directorMatch = !director || (t.directors && t.directors.some(d => (d || '').toLowerCase().includes(director)));

        // MATCH del desplegable Materia UCM (si hay selección, debe contener ese término exacto)
        const subjectsUcmLower = (t.subjects_ucm || []).map(s => (s || '').toLowerCase());
        const subjectUcmMatch = !subjectUCM || subjectsUcmLower.includes(subjectUCM);

        // MATCH del campo texto libre de materias (UCM o UNESCO)
        const subjectFreeMatch = !subjectFree ||
          (t.subjects_ucm && t.subjects_ucm.join(',').toLowerCase().includes(subjectFree)) ||
          (t.subjects_unesco && t.subjects_unesco.join(',').toLowerCase().includes(subjectFree));

        const pubYear = parseInt((t.pub_date || '').substring(0,4));
        const yearMatch = (!startYear || pubYear >= startYear) && (!endYear || pubYear <= endYear);

        return titleMatch && authorMatch && directorMatch && subjectUcmMatch && subjectFreeMatch && yearMatch;
      });

      if (sort === 'title') filtradas.sort((a,b) => a.title.localeCompare(b.title));
      if (sort === 'author') filtradas.sort((a,b) => (a.authors?.[0] || '').localeCompare(b.authors?.[0] || ''));
      if (sort === 'year') filtradas.sort((a,b) => (b.pub_date || '').localeCompare(a.pub_date || ''));

      mostrarResultados(filtradas);
      // Eliminado: mostrarEstadisticas(filtradas);
      mostrarNube(filtradas);
    }

    function mostrarResultados(lista) {
      const results = document.getElementById('results');
      const count = document.getElementById('result-count');
      results.innerHTML = '';
      count.innerHTML = `Se encontraron <strong>${lista.length}</strong> tesis.`;

      for (const t of lista) {
        const div = document.createElement('div');
        div.className = 'article';
        div.innerHTML = `
          <h2 style="color:#90caf9;">${t.title || ''}</h2>
          <p><em>${(t.authors || []).join(', ')}</em></p>
          <p class="meta">${t.pub_date || ''}</p>
          <p class="abstract-text">${t.summary || ''}</p>
        `;
        results.appendChild(div);
      }
    }

    function mostrarNube(lista) {
      const nube = document.getElementById('word-cloud');
      const frecuencias = {};
      for (const t of lista) {
        const palabras = (t.title || '').toLowerCase().split(/\s+/);
        for (const p of palabras) {
          if (p.length > 4) frecuencias[p] = (frecuencias[p] || 0) + 1;
        }
      }
      const top = Object.entries(frecuencias).sort((a,b) => b[1]-a[1]).slice(0,20);
      nube.innerHTML = top.map(([w,c]) => `<span style="--size: ${c/2}em">${w}</span>`).join(' ');
    }

    // Listeners
    document.querySelectorAll('input,select').forEach(el => el.addEventListener('input', filtrar));
    document.getElementById('subject-ucm').addEventListener('change', filtrar);

    // Inicialización
    Promise.all([cargarMateriasUCM(), cargarTesis()]);
  </script>

  <!-- Footer dinámico -->
  <div id="footer"></div>
  <script>
    fetch("footer.html")
      .then(response => {
        if (!response.ok) throw new Error("No se pudo cargar footer.html");
        return response.text();
      })
      .then(data => {
        document.getElementById("footer").innerHTML = data;
      })
      .catch(error => console.error("Error cargando el footer:", error));
  </script>
</body>
</html>
