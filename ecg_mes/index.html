<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07111f">
<title>ECG of the Month · Casos en español</title>
<style>
:root{color-scheme:dark;--bg:#07111f;--panel:#0e1a2b;--text:#eef4ff;--muted:#9fb0c8;--line:rgba(255,255,255,.12);--accent:#ff9d22;--accent2:#ffd18f}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:linear-gradient(180deg,#06101d,#091526 55%,#050b14);color:var(--text);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;line-height:1.55}.wrap{width:min(1180px,calc(100% - 24px));margin:auto;padding:18px 0 42px}header{border:1px solid var(--line);background:linear-gradient(135deg,#111f33,#08111e);border-radius:22px;padding:22px;position:sticky;top:8px;z-index:20;box-shadow:0 16px 50px rgba(0,0,0,.32)}h1{margin:0;font-size:clamp(28px,5vw,48px);line-height:1}.accent{color:var(--accent)}.sub{color:var(--muted);margin:10px 0 0}.searchrow{display:grid;grid-template-columns:1fr auto;gap:10px;margin-top:16px}input{width:100%;min-height:48px;border-radius:14px;border:1px solid var(--line);background:#07111f;color:var(--text);padding:0 14px;font-size:16px;outline:none}input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(255,157,34,.12)}button,.btn{min-height:44px;border:1px solid rgba(255,157,34,.35);border-radius:999px;background:linear-gradient(180deg,#ffb34c,#ff9412);color:#101826;font-weight:800;padding:9px 14px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}.btn.secondary,button.secondary{background:#122038;color:var(--text);border-color:var(--line)}.status{margin-top:10px;color:var(--muted);font-size:13px}.results{display:grid;gap:12px;margin-top:16px}.card{border:1px solid var(--line);border-radius:18px;background:rgba(14,26,43,.86);padding:15px;cursor:pointer;transition:.15s transform,.15s border-color}.card:hover{transform:translateY(-1px);border-color:rgba(255,157,34,.55)}.card h2{font-size:17px;margin:0 0 7px}.meta{display:flex;flex-wrap:wrap;gap:7px;color:var(--muted);font-size:12px}.tag{border:1px solid var(--line);border-radius:999px;padding:3px 8px}.preview{color:#d9e4f4;margin-top:10px;font-size:14px}.detail{margin-top:16px}.case{border:1px solid var(--line);border-radius:22px;background:rgba(14,26,43,.92);padding:18px}.case-head{display:flex;gap:12px;justify-content:space-between;align-items:flex-start;flex-wrap:wrap}.case h2{font-size:clamp(23px,4vw,38px);margin:0;line-height:1.05}.section{margin-top:15px;border-top:1px solid var(--line);padding-top:15px}.section h3{margin:0 0 8px;color:var(--accent2);font-size:16px}.text{white-space:pre-wrap}.translating{color:var(--muted);font-style:italic}.figures{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}.figure{border:1px solid var(--line);border-radius:16px;overflow:hidden;background:#08111d}.imagebox{background:#fff;min-height:180px;display:flex;align-items:center;justify-content:center}.imagebox img{width:100%;height:auto;max-height:500px;object-fit:contain;display:block}.figbody{padding:12px}.alt{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);color:#c7d3e4}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.empty{color:var(--muted);text-align:center;padding:28px}.loadmore{display:flex;justify-content:center;margin:16px 0}@media(max-width:650px){.wrap{width:100%;padding:8px}header{top:4px;border-radius:17px;padding:15px}.searchrow{grid-template-columns:1fr}.case{padding:13px;border-radius:17px}.figures{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
<header>
  <h1><span class="accent">ECG of the Month</span> · casos en español</h1>
  <p class="sub">Busca por texto, autor, diagnóstico, arritmia, especie o cualquier término presente en el caso.</p>
  <div class="searchrow"><input id="q" type="search" placeholder="Ej.: fibrilación, AV block, Rottweiler, síncope…" autocomplete="off"><button id="clear" class="secondary" type="button">Limpiar</button></div>
  <div class="status" id="status">Cargando <code>json/ecg_of_the_month.json</code>…</div>
</header>
<div class="results" id="results"></div>
<div class="loadmore" id="loadmore" hidden><button class="secondary" id="more">Mostrar más</button></div>
<div class="detail" id="detail"></div>
</div>
<script>
const JSON_URL='../json/ecg_of_the_month.json'; const PAGE_SIZE=24; let articles=[],filtered=[],visible=PAGE_SIZE,selected=null;
const $=id=>document.getElementById(id); const esc=s=>String(s??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#039;'); const clean=s=>String(s??'').replace(/\r/g,'').replace(/\n{3,}/g,'\n\n').trim(); const norm=s=>String(s??'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
function authors(a){return (Array.isArray(a.autores)?a.autores:[]).map(x=>x?.name).filter(Boolean)} function figures(a){return Array.isArray(a.figuras)?a.figuras:[]}
function searchable(a){return norm([a.title,a.doi,a.publication_date,a.volume,a.issue,a.pages,authors(a).join(' '),a.descripcion_del_caso,a.interpretacion_ecg,a.discusion,...figures(a).flatMap(f=>[f.label,f.descripcion_figura,f.alt_text,f.citation])].join(' '))}
const mapES=[['fibrilacion auricular','atrial fibrillation'],['aleteo auricular','atrial flutter'],['taquicardia ventricular','ventricular tachycardia'],['bloqueo auriculoventricular','atrioventricular block'],['bloqueo av','av block'],['tercer grado','third-degree'],['segundo grado','second-degree'],['primer grado','first-degree'],['marcapasos','pacemaker'],['sincope','syncope'],['perro','dog'],['gato','cat'],['caballo','horse'],['bradicardia','bradycardia'],['taquicardia','tachycardia'],['extrasistole','premature complex']];
function expandedQueries(q){const n=norm(q).trim();if(!n)return[];const qs=[n];for(const[es,en]of mapES){if(n.includes(norm(es)))qs.push(n.replace(norm(es),norm(en)))}return[...new Set(qs)]}
function imageCandidates(fig){const raw=[fig?.image_url_inline,fig?.image_url_full,fig?.image_download_url].filter(Boolean),extra=[];for(const u of raw){extra.push(u);if(/\.figure\.(\d+)\.jpg$/i.test(u))extra.push(u.replace(/\.figure\.(\d+)\.jpg$/i,(_,n)=>`.fig_${String(n).padStart(2,'0')}.jpg`));if(/\.fig_(\d+)\.jpg$/i.test(u))extra.push(u.replace(/\.fig_(\d+)\.jpg$/i,(_,n)=>`.figure.${Number(n)}.jpg`));if(u.includes('/full-'))extra.push(u.replace('/full-','/inline-'));if(u.includes('/inline-'))extra.push(u.replace('/inline-','/full-'))}return[...new Set(extra)].filter(u=>!(/\.(tif|tiff)$/i.test(u)))}
function imgTag(fig,label){const urls=imageCandidates(fig);if(!urls.length)return'<div class="empty">Imagen no disponible</div>';return `<img loading="lazy" decoding="async" referrerpolicy="no-referrer" src="${esc(urls[0])}" data-urls='${esc(JSON.stringify(urls))}' data-i="0" alt="${esc(label||'ECG')}" onerror="nextImage(this)">`}
function nextImage(img){try{const urls=JSON.parse(img.dataset.urls),i=Number(img.dataset.i||0)+1;if(i<urls.length){img.dataset.i=i;img.src=urls[i];return}}catch(e){}img.onerror=null;img.outerHTML='<div class="empty">Imagen no disponible desde AVMA</div>'}
function renderList(){const shown=filtered.slice(0,visible);$('results').innerHTML=shown.map(a=>{const idx=articles.indexOf(a);return `<article class="card" data-index="${idx}"><h2>${esc(a.title||'ECG of the Month')}</h2><div class="meta"><span class="tag">${esc(a.publication_date||'s/f')}</span>${a.doi?`<span class="tag">${esc(a.doi)}</span>`:''}${authors(a).slice(0,3).map(x=>`<span class="tag">${esc(x)}</span>`).join('')}<span class="tag">${figures(a).length} figura${figures(a).length===1?'':'s'}</span></div><div class="preview">${esc(clean(a.descripcion_del_caso).slice(0,260))}${clean(a.descripcion_del_caso).length>260?'…':''}</div></article>`}).join('')||'<div class="empty">No se encontraron casos.</div>';$('loadmore').hidden=filtered.length<=visible;document.querySelectorAll('.card').forEach(el=>el.addEventListener('click',()=>{selected=articles[Number(el.dataset.index)];renderDetail(selected);$('detail').scrollIntoView({behavior:'smooth',block:'start'})}));$('status').textContent=`${filtered.length} casos encontrados · ${articles.length} casos totales`}
async function translateChunk(text){const url='https://api.mymemory.translated.net/get?q='+encodeURIComponent(text)+'&langpair=en|es';const r=await fetch(url,{cache:'force-cache'});if(!r.ok)throw new Error('HTTP '+r.status);const d=await r.json(),t=d?.responseData?.translatedText;if(!t)throw new Error('Sin traducción');return String(t).replaceAll('&#39;',"'").replaceAll('&quot;','"').replaceAll('&amp;','&')}
function splitText(text,max=430){const t=clean(text);if(!t)return[];const out=[];for(const p0 of t.split(/\n{2,}/)){let p=p0.trim();while(p.length>max){let cut=p.lastIndexOf('. ',max);if(cut<120)cut=p.lastIndexOf(' ',max);if(cut<80)cut=max;out.push(p.slice(0,cut+1).trim());p=p.slice(cut+1).trim()}if(p)out.push(p)}return out}
function hash(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return(h>>>0).toString(36)}
async function translateText(text){const src=clean(text);if(!src)return'';const key='ecg_es_'+hash(src);try{const c=localStorage.getItem(key);if(c)return c}catch{}const out=[];for(const c of splitText(src))out.push(await translateChunk(c));const result=out.join('\n\n');try{localStorage.setItem(key,result)}catch{}return result}
async function fillTranslation(id,text){const el=$(id);if(!el)return;if(!clean(text)){el.textContent='—';return}el.innerHTML='<span class="translating">Traduciendo al español…</span>';try{el.textContent=await translateText(text)}catch(e){el.innerHTML=`<span class="translating">No se pudo traducir automáticamente. Se muestra el original:</span><br><br>${esc(text)}`}}
function figureHtml(fig,i){const alt=fig.alt_text||'',c=imageCandidates(fig),open=c[0]||fig.image_download_url||'';return `<article class="figure"><div class="imagebox">${imgTag(fig,fig.label||`Figura ${i+1}`)}</div><div class="figbody"><h3>${esc(fig.label||`Figura ${i+1}`)}</h3><div class="text" id="figcap${i}"><span class="translating">Traduciendo descripción…</span></div>${alt?`<div class="alt"><strong>Texto alternativo:</strong><div class="text" id="figalt${i}"><span class="translating">Traduciendo…</span></div></div>`:''}<div class="actions">${open?`<a class="btn secondary" href="${esc(open)}" target="_blank" rel="noopener noreferrer">Abrir imagen</a>`:''}</div></div></article>`}
function renderDetail(a){const fs=figures(a);$('detail').innerHTML=`<article class="case"><div class="case-head"><div><h2>${esc(a.title||'ECG of the Month')}</h2><div class="meta" style="margin-top:9px"><span class="tag">${esc(a.publication_date||'s/f')}</span>${a.doi?`<span class="tag">${esc(a.doi)}</span>`:''}${authors(a).map(x=>`<span class="tag">${esc(x)}</span>`).join('')}</div></div><div class="actions">${a.article_url?`<a class="btn secondary" href="${esc(a.article_url)}" target="_blank" rel="noopener">Artículo AVMA</a>`:''}</div></div><section class="section"><h3>Descripción del caso</h3><div class="text" id="caseEs"><span class="translating">Traduciendo al español…</span></div></section><section class="section"><h3>Interpretación del ECG</h3><div class="text" id="interpEs"><span class="translating">Traduciendo al español…</span></div></section><section class="section"><h3>ECG y figuras</h3><div class="figures">${fs.map(figureHtml).join('')||'<div class="empty">Sin figuras.</div>'}</div></section><section class="section"><h3>Discusión</h3><div class="text" id="discEs"><span class="translating">Traduciendo al español…</span></div></section></article>`;fillTranslation('caseEs',a.descripcion_del_caso||'');fillTranslation('interpEs',a.interpretacion_ecg||'');fillTranslation('discEs',a.discusion||'');fs.forEach((f,i)=>{fillTranslation(`figcap${i}`,f.descripcion_figura||'');if(f.alt_text)fillTranslation(`figalt${i}`,f.alt_text)})}
function applySearch(){const qs=expandedQueries($('q').value);filtered=!qs.length?[...articles]:articles.filter(a=>qs.some(x=>a.__search.includes(x)));visible=PAGE_SIZE;filtered.sort((a,b)=>String(b.publication_date||'').localeCompare(String(a.publication_date||'')));renderList()}
async function init(){try{const r=await fetch(JSON_URL,{cache:'no-store'});if(!r.ok)throw new Error(`${r.status} ${r.statusText}`);const data=await r.json();articles=(Array.isArray(data)?data:(data.articles||[])).map(a=>({...a,__search:searchable(a)}));applySearch()}catch(e){$('status').textContent='Error cargando el JSON: '+e.message;$('results').innerHTML='<div class="empty">Comprueba que el archivo esté exactamente en <b>json/ecg_of_the_month.json</b>.</div>'}}
$('q').addEventListener('input',applySearch);$('clear').addEventListener('click',()=>{$('q').value='';applySearch();$('q').focus()});$('more').addEventListener('click',()=>{visible+=PAGE_SIZE;renderList()});init();
</script>
</body>
</html>
