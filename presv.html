<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Galería de Imágenes</title>
  <style>
    body {
      font-family: sans-serif;
      margin: 0;
      background-color: #111;
      color: white;
    }

    #back-button {
      padding: 1rem;
      background-color: #222;
      cursor: pointer;
      font-size: 1.2rem;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      padding: 10px;
    }

    .grid img {
      width: 100%;
      border-radius: 8px;
      cursor: pointer;
      transition: transform 0.2s;
    }

    .grid img:hover {
      transform: scale(1.05);
    }

    #overlay {
      position: fixed;
      display: none;
      top: 0; left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0,0,0,0.9);
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    #overlay img {
      max-width: 90%;
      max-height: 90%;
      border-radius: 10px;
    }

    .email-section {
      text-align: center;
      padding: 20px;
    }

    .email-section button {
      background-color: #28a745;
      color: white;
      padding: 12px 20px;
      font-size: 1rem;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      margin-top: 10px;
    }

    .email-section button:hover {
      background-color: #218838;
    }
  </style>
</head>
<body>
  <div id="back-button" onclick="goBack()">
    ⬅ Volver
  </div>

  <div class="grid" id="gallery">
    <img src="118cb7cb-52d1-40b4-8cb6-48212904768e.png" onclick="expandImage(this)" />
    <img src="21 may 2025, 14_28_02.png" onclick="expandImage(this)" />
    <img src="28ac8842-811e-4afc-81a3-3e9d7e17c13a.png" onclick="expandImage(this)" />
    <img src="8afb41a9-e190-498c-9dd1-9132d37677b3.png" onclick="expandImage(this)" />
    <img src="ChatGPT Image 21 may 2025, 14_32_57.png" onclick="expandImage(this)" />
    <img src="ChatGPT Image 21 may 2025, 14_38_49.png" onclick="expandImage(this)" />
    <img src="ChatGPT Image 21 may 2025, 14_46_36.png" onclick="expandImage(this)" />
    <img src="ChatGPT Image 21 may 2025, 14_51_53.png" onclick="expandImage(this)" />
    <img src="ChatGPT Image 21 may 2025, 14_58_33.png" onclick="expandImage(this)" />
    <img src="ChatGPT Image 21 may 2025, 15_04_22.png" onclick="expandImage(this)" />
    <img src="ChatGPT Image 21 may 2025, 15_21_31.png" onclick="expandImage(this)" />
  </div>

  <div class="email-section">
    <p>¿Quieres enviar una foto tuya disfrutando mientras usas PresVet? Puedes hacerlo pulsando aquí:</p>
    <button onclick="sendEmail()">Enviar Foto</button>
  </div>

  <div id="overlay" onclick="closeImage()">
    <img id="overlay-img" />
  </div>

  <script>
    function expandImage(img) {
      const overlay = document.getElementById("overlay");
      const overlayImg = document.getElementById("overlay-img");
      overlayImg.src = img.src;
      overlay.style.display = "flex";
    }

    function closeImage() {
      const overlay = document.getElementById("overlay");
      overlay.style.display = "none";
    }

    function goBack() {
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function sendEmail() {
      const email = "airsoto@gmail.com";
      const subject = encodeURIComponent("Yo disfrutando de PRESVET");
      const body = encodeURIComponent("Adjunto una foto disfrutando mientras uso PresVet.");
      window.location.href = `mailto:${email}?subject=${subject}&body=${body}`;
    }
  </script>
</body>
</html>
