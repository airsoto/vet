<!DOCTYPE html>
<html>
<script defer src="goat.js"></script>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Reloj Egipcio Antiguo</title>
    <style>
        body {
            overflow: hidden;
            background: #fdf6e3;
        }

        .wrapper {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100vw;
            height: 100vh;
            font-size: clamp(30px, 5vw, 60px);
            font-family: 'Segoe UI', serif;
        }

        #time-wrapper {
            transform-origin: center center;
        }

        #sumertime {
            text-align: center;
            width: clamp(200px, -40px + 40vw, 440px);
        }
    </style>
</head>
<body>

<div class="wrapper">
    <div id="time-wrapper">
        <div id="sumertime"></div>
    </div>
</div>

<script>
    // Símbolos jeroglíficos egipcios
    const unit = "𓏤"; // 1
    const ten = "𓎆";  // 10

    function toEgyptian(num) {
        if (num === 0) return "N"; // No hay jeroglífico para 0, usamos "N" (latino)
        let result = "";
        let t = Math.floor(num / 10);
        let u = num % 10;
        result += ten.repeat(t);
        result += unit.repeat(u);
        return result;
    }

    function setTime() {
        const d = new Date();
        const hour = d.getHours();
        const minute = d.getMinutes();
        const second = d.getSeconds();

        document.getElementById("sumertime").innerHTML =
            toEgyptian(hour) + " : " + toEgyptian(minute) + " : " + toEgyptian(second);
    }

    setTime();
    setInterval(setTime, 1000);
</script>

</body>
</html>
