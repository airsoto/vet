<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Vet Calc – Menú</title>

  <style>
    :root{
      --bg: #0b0f14;
      --panel: rgba(255,255,255,0.06);
      --panel2: rgba(255,255,255,0.08);
      --border: rgba(255,255,255,0.10);
      --text: rgba(255,255,255,0.92);
      --muted: rgba(255,255,255,0.72);

      --pad: 14px;
      --gap: 12px;
      --tile-h: 120px; /* JS lo ajusta a 6 filas por pantalla */
      --radius: 16px;
      --shadow: 0 10px 24px rgba(0,0,0,0.35);
    }

    *{ box-sizing: border-box; }
    html, body{ height: 100%; }
    body{
      margin: 0;
      background: radial-gradient(1200px 800px at 20% 0%, rgba(255,255,255,0.06), transparent 60%),
                  radial-gradient(900px 600px at 90% 10%, rgba(255,255,255,0.04), transparent 55%),
                  var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      -webkit-tap-highlight-color: transparent;
      overflow-x: hidden;
    }

    /* Contenedor general (sin header, solo grid) */
    .wrap{
      padding:
        calc(var(--pad) + env(safe-area-inset-top))
        var(--pad)
        calc(var(--pad) + env(safe-area-inset-bottom))
        var(--pad);
      min-height: 100svh;
    }

    .grid{
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      grid-auto-rows: var(--tile-h);
      gap: var(--gap);
      align-content: start;
    }

    .tile{
      appearance: none;
      border: 1px solid var(--border);
      background: linear-gradient(180deg, var(--panel2), var(--panel));
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 10px 10px 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      cursor: pointer;
      text-align: center;
      user-select: none;
      touch-action: manipulation;
      transition: transform 0.08s ease, border-color 0.12s ease, background 0.12s ease;
    }

    .tile:active{
      transform: scale(0.985);
      border-color: rgba(255,255,255,0.18);
      background: linear-gradient(180deg, rgba(255,255,255,0.10), rgba(255,255,255,0.06));
    }

    .tile img{
      width: 52px;
      height: 52px;
      object-fit: contain;
      display: block;
      filter: drop-shadow(0 4px 10px rgba(0,0,0,0.35));
    }

    .tile .label{
      font-size: 12.5px;
      line-height: 1.15;
      letter-spacing: 0.1px;
      color: var(--text);
      font-weight: 650;
      max-width: 100%;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      word-break: break-word;
    }

    .tile .sub{
      display: none;
    }

    /* Modal */
    .modal{
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      padding:
        calc(18px + env(safe-area-inset-top))
        14px
        calc(18px + env(safe-area-inset-bottom))
        14px;
      background: rgba(0,0,0,0.55);
      backdrop-filter: blur(6px);
      z-index: 999;
    }
    .modal.show{ display: flex; }

    .modal-card{
      width: min(560px, 100%);
      border-radius: 18px;
      border: 1px solid rgba(255,255,255,0.12);
      background: rgba(18, 24, 33, 0.92);
      box-shadow: 0 30px 70px rgba(0,0,0,0.55);
      overflow: hidden;
    }

    .modal-head{
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 14px 14px 10px;
      border-bottom: 1px solid rgba(255,255,255,0.10);
    }
    .modal-title{
      margin: 0;
      font-size: 15px;
      font-weight: 800;
      letter-spacing: 0.2px;
      color: var(--text);
    }

    .modal-close{
      appearance: none;
      border: 1px solid rgba(255,255,255,0.12);
      background: rgba(255,255,255,0.06);
      color: var(--text);
      width: 36px;
      height: 36px;
      border-radius: 12px;
      cursor: pointer;
      font-size: 20px;
      line-height: 1;
    }
    .modal-close:active{ transform: scale(0.98); }

    .modal-body{
      padding: 12px 14px 14px;
      display: grid;
      gap: 10px;
    }

    .modal-link{
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 12px 12px;
      border-radius: 14px;
      border: 1px solid rgba(255,255,255,0.10);
      background: rgba(255,255,255,0.06);
      color: var(--text);
      text-decoration: none;
      font-weight: 700;
      font-size: 14px;
    }
    .modal-link small{
      color: var(--muted);
      font-weight: 650;
      font-size: 12px;
    }
    .modal-link:active{ transform: scale(0.99); }

    /* Desktop: un poco más de aire */
    @media (min-width: 900px){
      :root{ --pad: 18px; --gap: 14px; }
      .tile img{ width: 56px; height: 56px; }
      .tile .label{ font-size: 13px; }
    }

    /* Si la pantalla es muy estrecha (iPhone SE en vertical), mantenemos 4 columnas, pero ajustamos letra */
    @media (max-width: 360px){
      .tile .label{ font-size: 11.5px; }
      .tile img{ width: 48px; height: 48px; }
    }
  </style>
</head>

<body>
  <main class="wrap">
    <section class="grid" id="grid" aria-label="Menú de herramientas"></section>
  </main>

  <!-- Modal -->
  <div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal-card">
      <div class="modal-head">
        <h2 class="modal-title" id="modalTitle">Opciones</h2>
        <button class="modal-close" id="modalClose" aria-label="Cerrar">×</button>
      </div>
      <div class="modal-body" id="modalBody"></div>
    </div>
  </div>

  <script>
    // ---------------------------
    // Datos del menú
    // ---------------------------
    const ICON_BASE = "/vet_calc_icons/";

    const items = [
      { icon: "hematology.png", title: "Valores hematología", link: "valores_as.html" },

      {
        icon: "laboratorial_abnormalities.png",
        title: "Valores bioquímica sanguínea",
        modalTitle: "Alteraciones bioquímica sanguínea",
        modal: [
          { text: "Alteraciones bioquímica sanguínea", href: "valores_as.html" },
          { text: "Calculadora de GASOMETRÍA ARTERIAL", href: "gasom.html" }
        ]
      },

      {
        icon: "ambulancia (1).png",
        title: "Urgencias",
        modalTitle: "Urgencias",
        modal: [
          { text: "Intoxicaciones", href: "intox.html" },
          { text: "Calculadora de Transfusión", href: "transf.html" }
        ]
      },

      {
        icon: "general_symptoms.png",
        title: "General",
        modalTitle: "General",
        modal: [
          { text: "Calculadora de Necesidades Energéticas", href: "mer.html" },
          { text: "Calculadora edad perros/gatos", href: "age.html" },
          { text: "Escala de Calidad de Vida", href: "calidad_de_vida.html" },
          { text: "Valoración de dolor", href: "glasgow_escala.html" },
          { text: "Encuesta de Evaluación Cognitiva para Perros", href: "SDC.html" },
          { text: "Escala de Dolor Tipo Glasgow", href: "glasgow_dolor.html" },
          { text: "Calculadora de Porcentaje de Deshidratación", href: "deshid.html" },
          { text: "Calculadora Escala Grimace para Gatos", href: "grimface.html" }
        ]
      },

      {
        icon: "cardiorespiratory.png",
        title: "Cardiorrespiratorio",
        modalTitle: "Cardiorrespiratorio",
        modal: [
          { text: "Calculadora MINE Score", href: "minescale.html" },
          { text: "Evaluación orientativa de hipertensión pulmonar en perros", href: "htp.html" },
          { text: "Clasificación de estadio y tratamiento en DCVM", href: "dcvm.html" },
          { text: "Corazón de pitón: anatomía y ecocardiografía", href: "circpiton.html" },
          { text: "Calculadora de frecuencia respiratoria", href: "fr.html" }
        ]
      },

      {
        icon: "electrocardiography.png",
        title: "Electrocardiografía",
        modalTitle: "Electrocardiografía",
        modal: [
          { text: "Calculadora de EJE ELÉCTRICO MEDIO", href: "eje.html" }
        ]
      },

      {
        icon: "medicamentos.png",
        title: "Medicación",
        modalTitle: "MedFármacos",
        modal: [
          { text: "Verificador de Compatibilidad de Fármacos", href: "comparador_fcos_vet.html" }
        ]
      },

      { icon: "oncology.png", title: "Oncología", link: "oncologia.html" },
      { icon: "abdominal_ultrasound.png", title: "Ecografía abdominal", link: "ecografiaabdominal.html" },
      { icon: "infectious.png", title: "Enfermedades infecciosas", link: "enfermedadesinfecciosas.html" },
      { icon: "neurology.png", title: "Neurología", link: "neurologia.html" },
      { icon: "nephrology.png", title: "Nefrología", link: "nefrologia.html" },
      { icon: "dermatology.png", title: "Dermatología", link: "dermatologia.html" },
      { icon: "echocardiography.png", title: "Ecocardiografía", link: "ecocardiografia.html" },
      { icon: "ophthalmology.png", title: "Oftalmología", link: "oftalmologia.html" },
      { icon: "endocrine.png", title: "Endocrino", link: "endocrino.html" },
      { icon: "gastrointestinal.png", title: "Gastrointestinal", link: "gastrointestinal.html" },
      { icon: "thoracic_radiology.png", title: "Radiografía torácica", link: "radiografiatoracica.html" },
      { icon: "traumatology.png", title: "Traumatología", link: "traumatologia.html" },
      { icon: "theriogenology.png", title: "Teriogenología", link: "teriogenologia.html" }
    ];

    // ---------------------------
    // Render grid
    // ---------------------------
    const grid = document.getElementById("grid");

    function iconSrc(filename){
      // Encode por si hay espacios (ambulancia (1).png)
      return ICON_BASE + encodeURIComponent(filename).replace(/%2F/g, "/");
    }

    function render(){
      grid.innerHTML = "";
      items.forEach((it, idx) => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "tile";
        btn.setAttribute("aria-label", it.title);

        const img = document.createElement("img");
        img.src = iconSrc(it.icon);
        img.alt = it.title;
        img.loading = "lazy";
        img.decoding = "async";

        const label = document.createElement("div");
        label.className = "label";
        label.textContent = it.title;

        btn.appendChild(img);
        btn.appendChild(label);

        btn.addEventListener("click", () => {
          if (it.link){
            window.location.href = it.link;
            return;
          }
          if (it.modal && it.modal.length){
            openModal(it.modalTitle || it.title, it.modal);
          }
        });

        grid.appendChild(btn);
      });
    }

    // ---------------------------
    // Modal
    // ---------------------------
    const modal = document.getElementById("modal");
    const modalTitle = document.getElementById("modalTitle");
    const modalBody = document.getElementById("modalBody");
    const modalClose = document.getElementById("modalClose");

    function openModal(title, links){
      modalTitle.textContent = title;
      modalBody.innerHTML = "";

      links.forEach(l => {
        const a = document.createElement("a");
        a.className = "modal-link";
        a.href = l.href;

        const left = document.createElement("span");
        left.textContent = l.text;

        const right = document.createElement("small");
        right.textContent = "Abrir";

        a.appendChild(left);
        a.appendChild(right);

        modalBody.appendChild(a);
      });

      modal.classList.add("show");
      document.body.style.overflow = "hidden";
    }

    function closeModal(){
      modal.classList.remove("show");
      document.body.style.overflow = "";
    }

    modalClose.addEventListener("click", closeModal);
    modal.addEventListener("click", (e) => {
      if (e.target === modal) closeModal();
    });
    window.addEventListener("keydown", (e) => {
      if (e.key === "Escape" && modal.classList.contains("show")) closeModal();
    });

    // ---------------------------
    // 4 columnas x 6 filas por pantalla (tile height dinámico)
    // ---------------------------
    function getSafeAreaInsets(){
      // Truco: leer env(safe-area-inset-*) como px computados
      const probe = document.createElement("div");
      probe.style.cssText = `
        position: fixed;
        inset: 0;
        padding-top: env(safe-area-inset-top);
        padding-bottom: env(safe-area-inset-bottom);
        padding-left: env(safe-area-inset-left);
        padding-right: env(safe-area-inset-right);
        pointer-events:none;
        visibility:hidden;
      `;
      document.body.appendChild(probe);
      const cs = getComputedStyle(probe);
      const top = parseFloat(cs.paddingTop) || 0;
      const bottom = parseFloat(cs.paddingBottom) || 0;
      document.body.removeChild(probe);
      return { top, bottom };
    }

    function setTileHeight(){
      const rows = 6;
      const pad = parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--pad")) || 14;
      const gap = parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--gap")) || 12;

      const { top, bottom } = getSafeAreaInsets();

      // Altura disponible: pantalla - padding vertical - safe area - gaps entre filas
      const available = window.innerHeight - (pad * 2) - top - bottom - (gap * (rows - 1));

      // Altura por tile (mínimo para que no se aplaste demasiado)
      const tileH = Math.max(88, Math.floor(available / rows));

      document.documentElement.style.setProperty("--tile-h", tileH + "px");
    }

    // Init
    render();
    setTileHeight();

    window.addEventListener("resize", () => {
      setTileHeight();
    }, { passive: true });

    window.addEventListener("orientationchange", () => {
      setTimeout(setTileHeight, 50);
    }, { passive: true });
  </script>
</body>
</html>
