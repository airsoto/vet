<!DOCTYPE html>
<html lang="es">
<head>
    <script defer src="goat.js"></script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Página en mantenimiento</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      overflow: hidden;
      background: radial-gradient(circle at top, #1d1d1d 0%, #050505 65%, #000 100%);
      color: #f5f5f5;
      font-family: Arial, Helvetica, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .maintenance-box {
      position: relative;
      z-index: 10;
      max-width: 950px;
      padding: 3rem 2rem;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 32px;
      background: rgba(20, 20, 20, 0.72);
      backdrop-filter: blur(14px);
      box-shadow: 0 0 60px rgba(255, 255, 255, 0.06), inset 0 0 30px rgba(255, 255, 255, 0.03);
    }

    h1 {
      font-size: clamp(3.2rem, 9vw, 8rem);
      line-height: 0.95;
      letter-spacing: -0.06em;
      text-transform: uppercase;
      color: #ffffff;
      text-shadow: 0 0 22px rgba(255, 255, 255, 0.25);
      margin-bottom: 1.5rem;
    }

    p {
      font-size: clamp(1.6rem, 4vw, 3.4rem);
      font-weight: 700;
      color: #d6d6d6;
      line-height: 1.2;
    }

    .small-note {
      margin-top: 1.5rem;
      font-size: clamp(1rem, 2vw, 1.4rem);
      color: #999;
      font-weight: 400;
    }

    .hair {
      position: fixed;
      top: -40px;
      width: var(--hair-width);
      height: var(--hair-height);
      background: var(--hair-color);
      border-radius: 50%;
      opacity: var(--hair-opacity);
      z-index: 4;
      pointer-events: none;
      transform-origin: center;
      animation: fall var(--fall-duration) linear forwards;
      box-shadow: 0 0 3px rgba(0, 0, 0, 0.8);
    }

    .hair::before,
    .hair::after {
      content: "";
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: inherit;
      opacity: 0.8;
    }

    .hair::before {
      transform: rotate(35deg) translateX(2px);
    }

    .hair::after {
      transform: rotate(-35deg) translateX(-2px);
    }

    @keyframes fall {
      0% {
        transform: translate3d(0, -40px, 0) rotate(0deg);
      }
      50% {
        transform: translate3d(var(--drift), 50vh, 0) rotate(280deg);
      }
      100% {
        transform: translate3d(calc(var(--drift) * -0.3), calc(100vh - var(--pile-height)), 0) rotate(620deg);
      }
    }

    .floor {
      position: fixed;
      left: 0;
      bottom: 0;
      width: 100%;
      height: 25vh;
      z-index: 3;
      pointer-events: none;
      background: linear-gradient(to top, rgba(0, 0, 0, 0.8), transparent);
    }

    .pile-hair {
      position: absolute;
      bottom: var(--bottom);
      left: var(--left);
      width: var(--hair-width);
      height: var(--hair-height);
      background: var(--hair-color);
      border-radius: 50%;
      opacity: 0.9;
      transform: rotate(var(--rotation));
      box-shadow: 0 0 4px rgba(0, 0, 0, 0.7);
    }

    .pile-hair::before,
    .pile-hair::after {
      content: "";
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: inherit;
    }

    .pile-hair::before {
      transform: rotate(40deg) translateX(2px);
    }

    .pile-hair::after {
      transform: rotate(-40deg) translateX(-2px);
    }

    .broom-status {
      position: fixed;
      bottom: 1.2rem;
      left: 50%;
      transform: translateX(-50%);
      z-index: 20;
      padding: 0.7rem 1.2rem;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.08);
      color: #ccc;
      font-size: 0.95rem;
      border: 1px solid rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(10px);
    }

    .glow {
      position: fixed;
      width: 420px;
      height: 420px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.055);
      filter: blur(80px);
      pointer-events: none;
      z-index: 1;
      animation: floatGlow 8s ease-in-out infinite alternate;
    }

    .glow.one {
      top: -120px;
      left: -100px;
    }

    .glow.two {
      right: -120px;
      bottom: -140px;
      animation-delay: 2s;
    }

    @keyframes floatGlow {
      from {
        transform: translate(0, 0) scale(1);
      }
      to {
        transform: translate(40px, 30px) scale(1.15);
      }
    }

    @media (max-width: 600px) {
      .maintenance-box {
        margin: 1rem;
        padding: 2rem 1.2rem;
        border-radius: 24px;
      }

      .broom-status {
        width: calc(100% - 2rem);
      }
    }
  </style>
</head>
<body>
  <div class="glow one"></div>
  <div class="glow two"></div>

  <main class="maintenance-box">
    <h1>Página en mantenimiento</h1>
    <p>Estará de nuevo operativa cuando sea limpiada.</p>
    <div class="small-note">Disculpa las molestias.</div>
  </main>

  <div class="floor" id="floor"></div>
  <div class="broom-status" id="status"></div>

  <script>
    const floor = document.getElementById('floor');
    const status = document.getElementById('status');
    let hairCount = 0;
    const maxPileHairs = 450;

    const hairColors = [
      '#1b130f',
      '#2a1d17',
      '#3b2a21',
      '#5a4638',
      '#7a6a58',
      '#b8a58c',
      '#d8d0c0'
    ];

    function random(min, max) {
      return Math.random() * (max - min) + min;
    }

    function createFallingHair() {
      const hair = document.createElement('div');
      hair.className = 'hair';

      const size = random(3, 9);
      const length = random(16, 42);
      const left = random(0, window.innerWidth);
      const pileHeight = random(8, window.innerHeight * 0.22);

      hair.style.left = `${left}px`;
      hair.style.setProperty('--hair-width', `${size}px`);
      hair.style.setProperty('--hair-height', `${length}px`);
      hair.style.setProperty('--hair-color', hairColors[Math.floor(Math.random() * hairColors.length)]);
      hair.style.setProperty('--hair-opacity', random(0.45, 0.95));
      hair.style.setProperty('--fall-duration', `${random(4, 9)}s`);
      hair.style.setProperty('--drift', `${random(-180, 180)}px`);
      hair.style.setProperty('--pile-height', `${pileHeight}px`);

      document.body.appendChild(hair);

      hair.addEventListener('animationend', () => {
        addHairToPile(left, pileHeight, size, length, hair.style.getPropertyValue('--hair-color'));
        hair.remove();
      });
    }

    function addHairToPile(x, y, width, height, color) {
      hairCount++;
      status.textContent = `${hairCount}`;

      const pileHair = document.createElement('div');
      pileHair.className = 'pile-hair';

      const spread = random(-70, 70);
      const finalLeft = Math.max(0, Math.min(window.innerWidth - 20, x + spread));
      const bottom = Math.max(0, y - random(0, 40));

      pileHair.style.setProperty('--left', `${finalLeft}px`);
      pileHair.style.setProperty('--bottom', `${bottom}px`);
      pileHair.style.setProperty('--hair-width', `${width}px`);
      pileHair.style.setProperty('--hair-height', `${height}px`);
      pileHair.style.setProperty('--hair-color', color);
      pileHair.style.setProperty('--rotation', `${random(0, 360)}deg`);

      floor.appendChild(pileHair);

      if (floor.children.length > maxPileHairs) {
        floor.removeChild(floor.firstElementChild);
      }
    }

    function startHairRain() {
      createFallingHair();
      const nextHair = random(80, 260);
      setTimeout(startHairRain, nextHair);
    }

    startHairRain();

    window.addEventListener('click', () => {
      floor.innerHTML = '';
      hairCount = 0;
      status.textContent = 'Pelos acumulados: 0';
    });
  </script>
</body>
</html>
