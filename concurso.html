<!DOCTYPE html>
<html lang="es">
<script defer src="goat.js"></script>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Enigma | Ángel Soto</title>
  <style>
    :root{
      --bg:#0b0f14;
      --panel:#121821;
      --panel-2:#0f141c;
      --text:#f3f4f6;
      --muted:#9ca3af;
      --line:#1f2937;
      --accent:#ff9900;
      --accent-soft:rgba(255,153,0,.14);
      --ok:#22c55e;
      --shadow:0 20px 60px rgba(0,0,0,.35);
      --radius:22px;
    }

    *{box-sizing:border-box}

    body{
      margin:0;
      min-height:100vh;
      font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Ubuntu,"Helvetica Neue",Arial,sans-serif;
      background:
        radial-gradient(circle at top, rgba(255,153,0,.08), transparent 30%),
        linear-gradient(180deg, #0b0f14 0%, #0a0d12 100%);
      color:var(--text);
      display:flex;
      align-items:center;
      justify-content:center;
      padding:24px;
    }

    .wrap{
      width:min(920px, 100%);
    }

    .card{
      background:linear-gradient(180deg, rgba(18,24,33,.98), rgba(12,17,24,.98));
      border:1px solid var(--line);
      border-radius:var(--radius);
      box-shadow:var(--shadow);
      padding:28px;
    }

    h1{
      margin:0 0 6px 0;
      font-size:clamp(28px, 5vw, 44px);
      line-height:1.05;
      letter-spacing:-0.02em;
    }

    .sub{
      margin:14px 0 22px 0;
      color:var(--muted);
      font-size:clamp(14px, 2.2vw, 16px);
      line-height:1.6;
    }

    .home a{
      color:var(--text);
      text-decoration:none;
      opacity:.92;
    }

    .home a:hover{
      color:var(--accent);
    }

    form{
      display:grid;
      gap:18px;
      margin-top:22px;
    }

    textarea{
      width:100%;
      min-height:240px;
      resize:vertical;
      border-radius:18px;
      border:1px solid #273142;
      background:var(--panel-2);
      color:var(--text);
      padding:24px;
      outline:none;
      box-shadow:inset 0 1px 0 rgba(255,255,255,.03);
      font-size:clamp(28px, 5vw, 56px);
      line-height:1.15;
      font-weight:800;
      letter-spacing:-0.02em;
    }

    textarea::placeholder{
      color:#6b7280;
      font-weight:700;
    }

    textarea:focus{
      border-color:var(--accent);
      box-shadow:0 0 0 4px var(--accent-soft);
    }

    .actions{
      display:flex;
      gap:12px;
      flex-wrap:wrap;
    }

    button{
      appearance:none;
      border:0;
      cursor:pointer;
      border-radius:14px;
      padding:14px 22px;
      font-size:16px;
      font-weight:700;
      background:var(--accent);
      color:#111827;
      transition:transform .15s ease, filter .15s ease, box-shadow .15s ease;
      box-shadow:0 10px 30px rgba(255,153,0,.16);
    }

    button:hover{
      filter:brightness(1.04);
      transform:translateY(-1px);
    }

    button:active{
      transform:translateY(0);
    }

    .result{
      margin-top:22px;
      padding:20px;
      border-radius:18px;
      border:1px solid var(--line);
      background:rgba(255,255,255,.02);
      min-height:88px;
    }

    .result-label{
      margin:0 0 10px 0;
      color:var(--muted);
      font-size:13px;
      text-transform:uppercase;
      letter-spacing:.08em;
      font-weight:800;
    }

    .result-text{
      margin:0;
      font-size:clamp(18px, 2.6vw, 24px);
      line-height:1.5;
      font-weight:700;
      word-break:break-word;
    }

    .ok{
      color:#dcfce7;
      background:rgba(34,197,94,.08);
      border-color:rgba(34,197,94,.28);
    }

    .err{
      color:#e5e7eb;
      background:rgba(255,255,255,.02);
    }

    .footer-note{
      margin-top:12px;
      color:var(--muted);
      font-size:13px;
    }
  </style>
</head>
<body>
  <main class="wrap">
    <section class="card">
      <h1>Enigma</h1>

      <div style="margin:10px 0 0 0;">
        <h2 style="margin:0; font-size:clamp(13px,3vw,14px); font-weight:600;">
          <span style="color:#ff9900;">Desarrollado por: Ángel Soto</span>
        </h2>
        <p class="home" style="margin:0; font-size:clamp(12px,2.8vw,13px);">
          <a href="https://airsoto.github.io/vet/" target="_blank" rel="noopener">
            🏠 <span>volver a página de inicio</span>
          </a>
        </p>
      </div>

      <p class="sub">
        Escribe tu respuesta en grande y pulsa enviar.
      </p>

      <form id="enigmaForm">
        <textarea
          id="entrada"
          placeholder="Escribe aquí..."
          autocomplete="off"
          autocapitalize="off"
          spellcheck="false"
        ></textarea>

        <div class="actions">
          <button type="submit">Enviar</button>
        </div>
      </form>

      <div id="resultado" class="result err">
        <p class="result-label">Respuesta</p>
        <p id="resultadoTexto" class="result-text">Todavía no has enviado ninguna respuesta.</p>
      </div>

      <p class="footer-note">
        Solo se mostrará la respuesta si escribes 2 o más elementos del campo contestacion, en cualquier orden.
      </p>
    </section>
  </main>

  <script>
    const form = document.getElementById("enigmaForm");
    const entrada = document.getElementById("entrada");
    const resultado = document.getElementById("resultado");
    const resultadoTexto = document.getElementById("resultadoTexto");

    let datosEnigma = [];

    function normalizarTexto(texto) {
      return (texto || "")
        .toString()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .toLowerCase()
        .replace(/[^\p{L}\p{N}\s]/gu, " ")
        .replace(/\s+/g, " ")
        .trim();
    }

    function obtenerPalabras(texto) {
      const limpio = normalizarTexto(texto);
      return limpio ? limpio.split(" ").filter(Boolean) : [];
    }

    function obtenerContestacion(item) {
      return item.contestacion ?? item.solucion ?? "";
    }

    async function cargarJSON() {
      try {
        const res = await fetch("json/enigma.json", { cache: "no-store" });
        if (!res.ok) throw new Error("No se pudo cargar json/enigma.json");
        const data = await res.json();
        datosEnigma = Array.isArray(data) ? data : [];
      } catch (error) {
        console.error(error);
        resultado.className = "result err";
        resultadoTexto.textContent = "Error al cargar el archivo json/enigma.json";
      }
    }

    function contarCoincidencias(textoUsuario, textoContestacion) {
      const palabrasUsuario = [...new Set(obtenerPalabras(textoUsuario))];
      const palabrasContestacion = [...new Set(obtenerPalabras(textoContestacion))];

      let total = 0;

      for (const palabra of palabrasContestacion) {
        if (palabrasUsuario.includes(palabra)) {
          total++;
        }
      }

      return total;
    }

    function buscarCoincidencia(textoUsuario) {
      let mejorMatch = null;
      let mejorPuntuacion = 0;

      for (const item of datosEnigma) {
        const contestacion = obtenerContestacion(item);
        const coincidencias = contarCoincidencias(textoUsuario, contestacion);

        if (coincidencias >= 2 && coincidencias > mejorPuntuacion) {
          mejorPuntuacion = coincidencias;
          mejorMatch = item;
        }
      }

      return mejorMatch;
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();

      if (!datosEnigma.length) {
        await cargarJSON();
      }

      const texto = entrada.value.trim();

      if (!texto) {
        resultado.className = "result err";
        resultadoTexto.textContent = "Escribe algo antes de enviar.";
        return;
      }

      const match = buscarCoincidencia(texto);

      if (match) {
        resultado.className = "result ok";
        resultadoTexto.textContent = match.respuesta || "Coincidencia encontrada, pero falta el campo respuesta en el JSON.";
      } else {
        resultado.className = "result err";
        resultadoTexto.textContent = "Respuesta incorrecta. Vuelve a intentarlo.";
      }
    });

    cargarJSON();
  </script>
</body>
</html>
