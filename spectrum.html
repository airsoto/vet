<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Emulador BASIC Retro</title>
<style>
  body {
    background: #000;
    color: #0f0;
    font-family: "Courier New", monospace;
    margin: 0;
    display: flex;
    flex-direction: column;
    height: 100vh;
  }
  #screen {
    flex: 1;
    padding: 10px;
    white-space: pre-wrap;
    overflow-y: auto;
  }
  #inputLine {
    display: inline;
  }
  #cursor {
    display: inline;
    background: #0f0;
    color: #000;
    animation: blink 1s steps(1) infinite;
  }
  @keyframes blink {
    50% { background: #000; color: #0f0; }
  }
  canvas {
    border: 1px solid #0f0;
    background: #000;
    margin: 10px auto;
  }
</style>
</head>
<body>
<div id="screen"></div>
<canvas id="gfx" width="320" height="200"></canvas>

<script>
let program = {};
let vars = {};
let screen = document.getElementById("screen");
let inputBuffer = "";
const canvas = document.getElementById("gfx");
const ctx = canvas.getContext("2d");

function printLine(text="") {
  screen.innerHTML += text + "\n";
  screen.scrollTop = screen.scrollHeight;
}

function newPrompt() {
  screen.innerHTML += '<div id="inputLine"></div><div id="cursor">&nbsp;</div>';
}

function beep(freq = 440, duration = 200) {
  const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = "square";
  osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
  gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
  osc.connect(gain).connect(audioCtx.destination);
  osc.start();
  osc.stop(audioCtx.currentTime + duration / 1000);
}

function cls() {
  screen.innerHTML = "";
  ctx.clearRect(0,0,canvas.width,canvas.height);
}

function interpret(line) {
  if (/^\d+ /.test(line)) {
    let num = parseInt(line.split(" ")[0]);
    let code = line.slice(line.indexOf(" ")+1);
    if (code.trim()==="") delete program[num];
    else program[num] = code;
    return;
  }
  let parts = line.trim().split(" ");
  let cmd = parts.shift().toUpperCase();
  switch(cmd) {
    case "PRINT":
      printLine(parts.join(" ").replace(/"/g,""));
      break;
    case "BEEP":
      beep(); break;
    case "SOUND":
      beep(parseInt(parts[0]), parseInt(parts[1])); break;
    case "CLS":
      cls(); break;
    case "RUN":
      runProgram();
      break;
    case "LIST":
      let out="";
      Object.keys(program).sort((a,b)=>a-b).forEach(n=>{
        out += n+" "+program[n]+"\n";
      });
      printLine(out);
      break;
    case "NEW":
      program = {};
      printLine("Nuevo programa cargado.");
      break;
    default:
      printLine("Comando desconocido: "+cmd);
  }
}

async function runProgram() {
  vars = {};
  let lines = Object.keys(program).map(n=>parseInt(n)).sort((a,b)=>a-b);
  for (let ln of lines) {
    let code = program[ln];
    interpret(code);
    await new Promise(r=>setTimeout(r,10));
  }
}

document.addEventListener("keydown", e => {
  let inputLine = document.getElementById("inputLine");
  if (!inputLine) return;
  if (e.key.length === 1 && !e.ctrlKey) {
    inputBuffer += e.key;
    inputLine.textContent = inputBuffer;
  } else if (e.key === "Backspace") {
    inputBuffer = inputBuffer.slice(0,-1);
    inputLine.textContent = inputBuffer;
  } else if (e.key === "Enter") {
    screen.innerHTML = screen.innerHTML.replace('<div id="cursor">&nbsp;</div>',"");
    printLine();
    interpret(inputBuffer);
    inputBuffer = "";
    newPrompt();
  }
});

// iniciar
printLine("GW-BASIC 2.0 EMULATOR");
printLine("1985 (C) Microsoft");
newPrompt();
</script>
</body>
</html>
