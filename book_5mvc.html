<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>5MVC Navigator | Medicina veterinaria</title>
  <link rel="stylesheet" href="book_5mvc.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <header class="brand">
        <div>
          <h1>5MVC Navigator</h1>
          <p>Navegador didáctico del JSON</p>
        </div>
        <button id="themeBtn" class="icon-btn" title="Cambiar tema">☾</button>
      </header>

      <section class="search-panel">
        <label for="searchInput">Buscar tema, signo, tratamiento o palabra clave</label>
        <div class="search-row">
          <input id="searchInput" type="search" placeholder="Ej.: cough, mitral, anemia..." autocomplete="off" />
          <button id="clearBtn" title="Limpiar búsqueda">×</button>
        </div>

        <div class="filters">
          <button class="chip active" data-kind="all">Todo</button>
          <button class="chip" data-kind="topic">Temas</button>
          <button class="chip" data-kind="appendix">Apéndices</button>
          <button class="chip" data-kind="table">Tablas</button>
          <button class="chip" data-kind="procedure">Procedimientos</button>
        </div>

        <div class="filters species">
          <button class="chip active" data-species="all">Todas</button>
          <button class="chip" data-species="dog">Perro</button>
          <button class="chip" data-species="cat">Gato</button>
        </div>
      </section>

      <nav class="letters" id="letters" aria-label="Índice alfabético"></nav>

      <section class="results">
        <div class="results-head">
          <span id="resultCount">0 resultados</span>
          <button id="randomBtn" class="mini-btn" title="Abrir tema al azar">Azar</button>
        </div>
        <div id="chapterList" class="chapter-list"></div>
      </section>
    </aside>

    <main class="viewer">
      <div class="topbar">
        <button id="menuBtn" class="icon-btn mobile-only">☰</button>
        <div id="breadcrumbs" class="breadcrumbs">Cargando…</div>
        <div class="top-actions">
          <button id="prevBtn" class="mini-btn">← Anterior</button>
          <button id="nextBtn" class="mini-btn">Siguiente →</button>
          <button id="copyBtn" class="mini-btn">Copiar</button>
        </div>
      </div>

      <article id="content" class="content-card">
        <div class="loading">
          <div class="spinner"></div>
          <p>Cargando <code>/json/book_5mvc.json</code>…</p>
        </div>
      </article>
    </main>
  </div>

  <template id="emptyTemplate">
    <div class="empty">
      <h2>No hay resultados</h2>
      <p>Prueba con otra palabra o elimina algún filtro.</p>
    </div>
  </template>

  <script src="book_5mvc.js"></script>
</body>
</html>
