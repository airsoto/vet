 {
  "cita": "Lolita, luz de mi vida, fuego de mis entrañas. Mi pecado, mi alma. Lo-lee-ta: la punta de la lengua recorre tres pasos por el paladar para tocar, a los tres, los dientes. Lo. Lee. Ta. Era Lo, la simple Lo, por la mañana, de un metro ochenta con un solo calcetín. Era Lola con pantalones. Era Dolly en la escuela. Era Dolores en la línea punteada. Pero en mis brazos siempre fue Lolita. ¿Tuvo una precursora? Sí que la tuvo, sí que la tuvo. De hecho, quizá no habría existido Lolita si no hubiera amado, un verano, a una niña inicial. En un principado junto al mar. ¿Cuándo? Casi tantos años antes de que naciera Lolita como yo tenía ese verano. Siempre se puede contar con un asesino por su elegante prosa. Damas y caballeros del jurado, la prueba número uno es lo que envidiaron los serafines, los serafines desinformados, simples y de nobles alas. Miren esto. “maraña de espinas.”",

  "cita": "Nadie le dice esto a quienes empiezan, ojalá alguien me lo dijera. Todos los que nos dedicamos al trabajo creativo nos metemos en él porque tenemos buen gusto. Pero existe esta brecha. Durante los primeros dos años que haces cosas, simplemente no son tan buenas. Intentas ser bueno, tiene potencial, pero no lo es. Pero tu gusto, lo que te metió en el negocio, sigue siendo genial. Y tu gusto es la razón por la que tu trabajo te decepciona. Mucha gente nunca supera esta fase, abandona. La mayoría de las personas que conozco que hacen trabajos interesantes y creativos pasaron años por esto. Sabemos que nuestro trabajo no tiene ese toque especial que queremos que tenga. Todos pasamos por esto. Y si estás empezando o todavía estás en esta fase, debes saber que es normal y que lo más importante que puedes hacer es trabajar mucho. Ponte una fecha límite para terminar una historia cada semana. Solo revisando un volumen de trabajo podrás cerrar esa brecha, y tu trabajo estará a la altura de tus ambiciones. Y yo tardé más en... Descubrir cómo hacer esto es más difícil que cualquier otra persona que haya conocido. Tomará un tiempo. Es normal que tome un tiempo. Solo tienes que luchar para salir adelante.",

 },

  "cita": " Por cierto, me encantan los libros, mucho más que las películas. Las películas te dicen qué pensar. Un buen libro te permite elegir algunas ideas. Las películas te muestran la casa rosa. Un buen libro te dice que hay una casa rosa y te permite pintar algunos de los toques finales, quizás elegir el estilo del techo, aparcar tu propio coche delante. Mi imaginación siempre ha superado cualquier cosa que una película pudiera crear. Por ejemplo, esas malditas películas de Harry Potter. Así no se veía para nada esa chica medio veela, Fleur Delacour.",

 {
  "cita": "Por tanto, querido señor, ama tu soledad y trata de cantar con el dolor que te causa. Porque quienes están cerca están lejos... y esto demuestra que el espacio a tu alrededor comienza a ensancharse... alégrate de tu crecimiento, en el que, por supuesto, no puedes llevar a nadie contigo, y sé amable con quienes se quedan; ten confianza y calma frente a ellos, y no los atormentes con tus dudas ni los asustes con tu fe o alegría, que no podrían comprender. Busca algún sentimiento simple y verdadero de lo que tienes en común con ellos, que no necesariamente tiene que cambiar cuando tú mismo cambias una y otra vez; cuando los veas, ama la vida en una forma que no es la tuya y sé indulgente con quienes envejecen, que temen la soledad en la que confías... y no esperes comprensión; cree en un amor que se te reserva como una herencia, y ten fe en que en este amor hay una fuerza y una bendición tan grandes que puedes llegar tan lejos como desees. sin tener que salir de ella”.",

 {
  "cita": " Hay tantas maneras de ser valiente en este mundo. A veces, la valentía implica dar la vida por algo más grande que uno mismo, o por alguien más. A veces implica renunciar a todo lo que has conocido, o a todos los que has amado, por algo más grande. Pero a veces no. A veces no es más que apretar los dientes ante el dolor y el trabajo diario, el lento camino hacia una vida mejor. Esa es la valentía que necesito ahora.",

 },
 {

  "autor": " Cassandra Clare,",

 },
 {
  "cita": " \"Voy a despertar a Peeta\", le digo. \"No, espera\", dice Finnick. \"Hagámoslo juntos. Pongamos nuestras caras justo delante de la suya\". Bueno, me quedan tan pocas oportunidades para divertirme en la vida, coincido. Nos colocamos a cada lado de Peeta, nos inclinamos hasta que nuestras caras están a centímetros de su nariz y lo sacudimos. \"Peeta. Peeta, despierta\", le digo con voz suave y cantarina. Sus párpados se abren de golpe y da un salto como si lo hubiéramos apuñalado. \"¡Aa!\" Finnick y yo nos desplomamos en la arena, partiéndonos de risa. Cada vez que intentamos parar, vemos el intento de Peeta de mantener una expresión de desdén y eso nos vuelve a hacer estallar.",
  "autor": " Suzanne Collins,",
  " etiquetas": " ['gracioso', 'humor', 'broma']"
 },

  "autor": " J. D. Salinger,"

 {
  "cita": " Sobre todo, te odio porque pienso en ti. A menudo. Es repugnante y no puedo parar.",

  " etiquetas": " ['cardan', 'jude', 'lujuria', 'el-príncipe-cruel']"
 },
 {
  "cita": " Me acusó de ser un hombre de Dumbledore de pies a cabeza. Qué grosero de su parte. Le dije que sí. Dumbledore abrió la boca para hablar, pero la volvió a cerrar. Fawkes, el fénix, dejó escapar un grito bajo, suave y musical. Para gran vergüenza de Harry, de repente se dio cuenta de que los brillantes ojos azules de Dumbledore parecían bastante llorosos y miraban fijamente su propia rodilla. Sin embargo, cuando Dumbledore habló, su voz sonó firme. «Estoy muy conmovido, Harry».",
  "autor": " J. K. Rowling,",
  " etiquetas": " ['dumbledore', 'harry-potter', 'conmovedor']"
 },

 },
 {
  "cita": " Los recuerdos, incluso los más preciados, se desvanecen sorprendentemente rápido. Pero no lo soporto. Los recuerdos que más valoro, nunca los veo desvanecerse.",

  " etiquetas": " ['memoria']"
 },
 {
  "cita": " \"Soy un hombre de negocios\", le había dicho. \"Ni más ni menos\". \"Eres un ladrón, Kaz\". \"¿No es eso lo que acabo de decir?\"",
  "autor": " Leigh Bardugo,"
 },
 {
  "cita": " “Éramos como dioses en los albores del mundo, y nuestra alegría era tan brillante que no podíamos ver nada más que lo otro”.",
  "autor": " Madeline Miller,"
 },
 {
  "cita": "Siempre le digo \"Me alegro de haberte conocido\" a alguien que no me alegro nada de haber conocido. Pero si quieres seguir vivo, tienes que decirlo.",
  "autor": " J. D. Salinger,",
  " etiquetas": " ['amistad', 'falta de sinceridad', 'modales']"
 },
 {
  "cita": "“Había una medianoche lúgubre, mientras reflexionaba, débil y cansado, sobre muchos volúmenes pintorescos y curiosos de sabiduría olvidada, mientras asentía, casi dormitando, de repente se oyó un golpeteo, como si alguien golpeara suavemente, golpeara la puerta de mi habitación. Es algún visitante\", murmuré, \"golpeando a la puerta de mi habitación. Solo esto, y nada más\". Ah, recuerdo claramente que era el sombrío diciembre, y cada brasa moribunda forjaba su fantasma en el suelo. Ansiosamente deseaba el mañana; — En vano había buscado prestado De mis libros un alivio al dolor — dolor por la perdida Lenore — Por la rara y radiante doncella a quien los ángeles llaman Lenore — Sin nombre aquí para siempre. Y el susurro sedoso, triste e incierto de cada cortina púrpura Me estremecía — me llenaba de fantásticos terrores nunca antes sentidos; Así que ahora, para acallar los latidos de mi corazón, repetía, Es algún visitante que ruega por entrar en la puerta de mi habitación — Algún visitante tardío que ruega por entrar en la puerta de mi habitación; — Esto es, y nada más.\" Al poco tiempo mi alma se fortaleció; sin dudar más, Señor\", dije, \"o Señora, de verdad imploro su perdón; Pero el hecho es que estaba dormitando, y tan suavemente llamaste, Y tan débilmente llamaste, llamaste a la puerta de mi habitación, Que apenas estaba seguro de haberte oído\" — Aquí abrí la puerta de par en par; —Oscuridad allí, y nada más. Escudriñando profundamente esa oscuridad, me quedé allí largo tiempo preguntándome, temiendo, dudando, soñando sueños que ningún mortal se había atrevido a soñar antes; pero el silencio era inquebrantable, y la quietud no daba señales, y la única palabra allí pronunciada fue la palabra susurrada, \"¿Lenore?\" Esto susurré, y un eco murmuró de vuelta la palabra, \"¡Lenore!\" —Solo esto, y nada más. De vuelta a la habitación, con toda mi alma ardiendo dentro de mí, pronto oí de nuevo un golpeteo algo más fuerte que antes. Seguramente\", dije, \"seguramente eso es algo en la celosía de mi ventana: déjame ver, entonces, qué hay allí, y explorar este misterio —Que mi corazón se aquiete un momento y explore este misterio; — Es el viento y nada más.\" Abrí de golpe la contraventana, cuando, con muchos coqueteos y aleteos, entró un cuervo majestuoso de los santos días de antaño; no hizo la menor reverencia; no se detuvo ni se detuvo un minuto; sino que, con porte de señor o dama, se posó sobre la puerta de mi habitación, posado sobre un busto de Palas justo encima de la puerta de mi habitación, se posó y se sentó, y nada más. Entonces este pájaro de ébano sedujo a mi triste fantasía a sonreír, por el decoro grave y severo de su semblante. Aunque tu cresta esté rapada y rapada, tú\", dije, \"seguro que no eres un cobarde, cuervo espantoso, sombrío y antiguo que vaga desde la orilla nocturna. ¡Dime cuál es tu señorial nombre en la orilla plutoniana de la noche!\" Dijo el cuervo: «Nunca más». Me maravillé mucho de que esta desgarbada ave oyera un discurso tan claro, aunque su respuesta tuviera poco sentido, poca relevancia; pues no podemos dejar de estar de acuerdo en que ningún ser humano vivo jamás tuvo la bendición de ver un pájaro sobre la puerta de su habitación, pájaro o bestia sobre el busto esculpido sobre la puerta de su habitación, con un nombre como «Nunca más».",
  "autor": " Edgar Allan Poe,",
  " etiquetas": "['desesperanza', 'dolor']"
 },
 {
  "cita": " Él se había ido, y no tuve tiempo de decirle lo que acababa de comprender: que lo perdonaba, que ella nos perdonaba, y que teníamos que perdonar para sobrevivir en el laberinto. Muchos de nosotros tendríamos que vivir con lo hecho y lo dejado de hacer ese día. Cosas que no salieron bien, cosas que parecían estar bien en ese momento porque no podíamos ver el futuro. Ojalá pudiéramos ver la interminable cadena de consecuencias que resultan de nuestras más pequeñas acciones. Pero no podemos saber más hasta que saber más es inútil. Y mientras caminaba de regreso para entregarle la nota de Takumi al Coronel, comprendí que nunca lo sabría. Nunca la conocería lo suficiente como para comprender sus pensamientos en esos últimos minutos, nunca sabría si nos dejó a propósito. Pero el desconocimiento no me impediría sentir cariño, y siempre amaría a Alaska Young, mi vecina corrupta, con todo mi corazón corrupto.",
  "autor": " Juan Verde,",
  " etiquetas": " ['el laberinto de simón_bolivar']"
 },
 {
  "cita": "Desde la infancia no he existido. Como otros fueron, no he visto. Como otros vieron, no pude despertar. Mi corazón se alegró al mismo ritmo. Y a todo lo que amé, lo amé solo.",

 {
  "cita": " Leí una vez que los antiguos egipcios tenían cincuenta palabras para la arena y los esquimales cien para la nieve. Ojalá tuviera mil palabras para el amor, pero solo me viene a la mente la forma en que te mueves contra mí mientras duermes, y no hay palabras para eso.",

 {
  "cita": " Y todos los libros que has leído han sido leídos por otras personas. Y todas las canciones que te han encantado han sido escuchadas por otras personas. Y esa chica que te parece bonita es bonita para otros. Y que si miraras estos hechos cuando fueras feliz, te sentirías genial porque estás describiendo la 'unidad'.",

 {

 {
  "cita": " Me gustan demasiadas cosas y me confundo y me obsesiono corriendo de una estrella fugaz a otra hasta caer rendido. Esta es la noche, lo que te hace. No tenía nada que ofrecer a nadie excepto mi propia confusión.",

 {
  "cita": "\"No puedo ir a la escuela hoy\", dijo la pequeña Peggy Ann McKay. \"Tengo sarampión y paperas, un corte, un sarpullido y bultos morados. Tengo la boca húmeda, la garganta seca. Me estoy quedando ciega del ojo derecho. Tengo las amígdalas enormes como piedras, he contado dieciséis casos de varicela. Y hay uno más, que son diecisiete. ¿Y no crees que tengo la cara verde? Tengo una herida en la pierna, mis ojos azules, podría ser una gripe instantánea. Toso, estornudo, jadeo y me ahogo, estoy segura de que tengo la pierna izquierda rota. Me duele la cadera al mover la barbilla, se me hunde el ombligo. Tengo la espalda torcida, el tobillo torcido, me duele el péndulo cada vez que llueve. Tengo los dedos de los pies fríos, entumecidos, tengo una astilla en el pulgar. Tengo el cuello rígido, la voz débil, apenas susurro al hablar. Tengo la lengua Me llena la boca de sangre, creo que se me está cayendo el pelo. Tengo el codo doblado, la columna no está recta, tengo 1.8 grados de fiebre. Mi cerebro está encogido, no oigo, tengo un agujero en la oreja. Tengo un padrastro, y el corazón... ¿Qué? ¿Qué es eso? ¿Qué dices? ¿Dices que hoy es sábado? ¡Adiós, voy a jugar!",
  "autor": " Shel Silverstein",
  " etiquetas": "['niños', 'gracioso', 'poema']"
 },

 {
  "cita": " El amor perdido sigue siendo amor. Adopta una forma diferente, eso es todo. No puedes ver su sonrisa, ni traerles comida, ni despeinarles, ni moverlos por la pista de baile. Pero cuando esos sentidos se debilitan, otro se intensifica. El recuerdo. El recuerdo se convierte en tu compañero. Lo nutres. Lo sostienes. Bailas con él.",

 },
 {
  "cita": "“Las mujeres bonitas se preguntan dónde está mi secreto. No soy lindo ni estoy hecho para adaptarse al tamaño de una modelo, pero cuando empiezo a decírselo, creen que estoy diciendo mentiras. Yo digo que está en el alcance de mis brazos, la extensión de mis caderas, la zancada de mi paso, la curva de mis labios. Soy una mujer fenomenal. Una mujer fenomenal, esa soy yo”.",

 },

  "autor": " Juan Boyne"
 },
 {
  "cita": " “Me da fuerza tener a alguien por quien luchar; nunca podría luchar por mí mismo, pero por otros sí puedo matar”.",

 {
  "cita": "El hechizo. Víctor dijo que tenías que desearme... que te importara... para que funcionara. Al ver que no decía nada, intenté agarrarle la camisa, pero mis dedos estaban demasiado débiles. \"¿En serio? ¿Me deseabas?\", sus palabras salieron con fuerza. \"Sí, Roza. Te deseaba. Todavía te deseo. Ojalá... pudiéramos estar juntos.\" \"¿Entonces por qué me mentiste?\", murmuré de nuevo. Sin soltarme, me miró. Oí voces y pasos que se acercaban. \"Porque no podemos estar juntos.\", pregunté. \"¿Por lo de la edad?\", me secó suavemente con la yema del dedo una lágrima que se me había escapado por la mejilla. \"En parte\", dijo. Pero también... bueno, tú y yo seremos los guardianes de Lissa algún día. Necesito protegerla a toda costa. Si viene una manada de Strogoi, tengo que interponerme entre ellos y ella. «Lo sé. Claro que tienes que hacerlo». Los destellos negros danzaban ante mis ojos de nuevo. Me estaba desvaneciendo. «No. Si me permito amarte, no me lanzaré ante ella. Me lanzaré ante ti».",
  "autor": " Richelle Mead,",
  " etiquetas": "['dimitri', 'rosa', 'academia de vampiros']"
 },

 {
  "cita": "Las palabras, creo, son criaturas tan impredecibles. Ningún arma, ninguna espada, ningún ejército ni rey será jamás más poderoso que una sentencia. Las espadas pueden cortar y matar, pero las palabras apuñalarán y se quedarán, enterrándose en nuestros huesos para convertirse en cadáveres que llevamos al futuro, excavando sin cesar y sin lograr arrancar sus esqueletos de nuestra carne.",

 },
 {

 },
 {

 },
 {
  "cita": " La amistad, según mi definición, se basa en dos cosas: respeto y confianza. Ambos elementos deben estar presentes. Y debe ser mutua. Puedes respetar a alguien, pero si no tienes confianza, la amistad se desmoronará.",

 {

  "autor": " EE Cummings",
  " etiquetas": " ['decisiones', 'amor', 'estrellas', 'arriesgarse']"
 },
 {
  "cita": "Nunca te disculpes con un autor por comprar algo en rústica ni por sacarlo de una biblioteca (para eso están. Usa tu biblioteca). No te disculpes con este autor por comprar libros de segunda mano, ni por conseguirlos en bookcrossing ni por pedirle prestado el ejemplar a un amigo. Lo importante para mí es que la gente lea los libros y los disfrute, y que, en algún momento, alguien los haya comprado. Y que a quienes les gusta algo, se lo cuenten a otros. Lo más importante es que la gente lea...",
  "autor": " Neil Gaiman",
  " etiquetas": " ['libros', 'bibliotecas', 'biblioteca', 'lectura']"
 },
 {
  "cita": "1. Sé Impecable con Tus Palabras. Habla con integridad. Di solo lo que piensas. Evita usar la palabra para hablar en tu contra o para chismear sobre los demás. Usa el poder de tu palabra en dirección a la verdad y el amor. 2. No te tomes nada personal. Nada de lo que hacen los demás es por ti. Lo que otros dicen y hacen es una proyección de su propia realidad, su propio sueño. Cuando eres inmune a las opiniones y acciones de los demás, no serás víctima de sufrimiento innecesario. 3. No des suposiciones. Encuentra el coraje para hacer preguntas y expresar lo que realmente quieres. Comunícate con los demás con la mayor claridad posible para evitar malentendidos, tristeza y drama. Con solo este acuerdo, puedes transformar tu vida por completo. 4. Siempre da lo mejor de ti. Tu mejor versión cambiará de un momento a otro; será diferente cuando estés sano que cuando estés enfermo. En cualquier circunstancia, simplemente da lo mejor de ti y evitarás el autojuicio, el automaltrato y el arrepentimiento.",

  " etiquetas": "['espiritualidad', 'sabiduría tolteca']"
 },
 {

  " etiquetas": " ['inspirador']"
 },
 {
  "cita": " Soy demasiado inteligente, demasiado exigente y demasiado ingenioso para que alguien pueda controlarme por completo. Nadie me conoce ni me ama por completo. Solo me tengo a mí mismo.",

  " etiquetas": " ['familia']"
 },
 {
  "cita": " ¿Puedes entender? ¿Alguien, en algún lugar, puede comprenderme un poco, amarme un poco? A pesar de toda mi desesperación, a pesar de todos mis ideales, a pesar de todo eso, amo la vida. Pero es difícil, y tengo muchísimo que aprender.",

 },
 {
  "cita": " “Al hombre sólo le gusta contar sus problemas",

  "Column4": " ['felicidad', 'hombre', 'problema']"
 },
 {
  "cita": "Por primera vez he encontrado lo que realmente puedo amar: te he encontrado a ti. Eres mi compasión, mi mejor versión, mi ángel bueno. Un fuerte apego a ti me une. Te considero buena, dotada, encantadora: una pasión ferviente y solemne se concibe en mi corazón; se inclina hacia ti, te atrae hacia mi centro y fuente de vida, te envuelve en mi existencia y, ardiendo en una llama pura y poderosa, nos funde en uno solo.",
  "autor": " Charlotte Brontë,"
 },

 {
  "cita": " “Deja de compararte con otras personas, simplemente elige ser feliz y vivir tu propia vida”.",

 {
  "cita": "Espero que este año que viene cometas errores. Porque si cometes errores, entonces estás creando cosas nuevas, probando cosas nuevas, aprendiendo, viviendo, superándote, cambiándote, cambiando tu mundo. Estás haciendo cosas que nunca antes has hecho, y lo más importante, estás Haciendo Algo. Así que ese es mi deseo para ti, y para todos nosotros, y mi deseo para mí. Comete nuevos errores. Comete errores gloriosos e increíbles. Comete errores que nadie ha cometido antes. No te paralices, no te detengas, no te preocupes si no es lo suficientemente bueno, o si no es perfecto, sea lo que sea: arte, amor, trabajo, familia o vida. Sea lo que sea que te dé miedo hacer, hazlo. Comete tus errores, el año que viene y para siempre.",
  "autor": " Neil Gaiman"
 },
 {
  "cita": " “Las cargas son para hombros lo suficientemente fuertes como para soportarlas”.",
  "autor": " Margaret Mitchell,"
 },

  " etiquetas": " ['demonio']"

 {
  "cita": " Nos arrancamos tanto de nosotros mismos para curarnos de las cosas más rápido de lo debido que nos arruinamos a los treinta y tenemos menos que ofrecer cada vez que empezamos con alguien nuevo. Pero no sentir nada para no sentir nada... ¡qué desperdicio!",

 {

 },

 },
 {
  "cita": " Te amaré siempre. Cuando este pelo rojo se vuelva blanco, seguiré amándote. Cuando la tersura de la juventud sea reemplazada por la delicada suavidad de la edad, seguiré queriendo tocar tu piel. Cuando tu rostro esté lleno de las arrugas de cada sonrisa que hayas sonreído, de cada sorpresa que haya visto pasar por tus ojos, cuando cada lágrima que hayas derramado haya dejado su huella en tu rostro, te atesoraré aún más, porque estuve allí para verlo todo. Compartiré tu vida contigo, Meredith, y te amaré hasta que el último aliento abandone tu cuerpo o el mío.",

 {

  "cita": "La soledad es la condición humana. Cultívala. La forma en que se arraiga en ti permite que tu alma crezca. Nunca esperes superar la soledad. Nunca esperes encontrar gente que te comprenda, alguien que llene ese vacío. Una persona inteligente y sensible es la excepción, la gran excepción. Si esperas encontrar gente que te comprenda, te volverás un asesino de decepción. Lo mejor que puedes hacer es comprenderte a ti mismo, saber qué es lo que quieres y no dejar que el ganado se interponga en tu camino.",

 {
  "cita": "Dios mío, la vida es soledad, a pesar de todos los opiáceos, a pesar de la estridente alegría de las fiestas sin propósito, a pesar de las falsas sonrisas que todos ponemos. Y cuando por fin encuentras a alguien a quien sientes que puedes abrirle tu alma, te quedas paralizado ante las palabras que pronuncias: son tan oxidadas, tan feas, tan insignificantes y débiles por haber estado guardadas en la pequeña y estrecha oscuridad de tu interior durante tanto tiempo. Sí, hay alegría, plenitud y compañía, pero la soledad del alma, en su aterradora timidez, es horrible y abrumadora.",

 },
 {
  "cita": "“Cuando Dios creó a las madres” Cuando Dios estaba creando a las madres, iba por su sexto día de \"horas extra\" cuando se le apareció el ángel y le dijo: \"Estás haciendo muchos ajustes con esta\". Y Dios dijo: \"¿Has leído las especificaciones de este pedido?\" Tiene que ser completamente lavable, pero no de plástico. Tiene que tener 180 piezas móviles... todas reemplazables. Tiene que funcionar con café negro y sobras. Tiene que tener un regazo que desaparece al levantarse. Un beso que puede curar cualquier cosa, desde una pierna rota hasta una decepción amorosa. Y seis pares de manos. El ángel negó con la cabeza lentamente y dijo: \"Seis pares de manos... de ninguna manera\". \"No son las manos las que me están causando problemas\", comentó Dios, \"son los tres pares de ojos que las madres deben tener\". \"¿Eso es del modelo estándar?\", preguntó el ángel. Dios asintió. Un par que ve a través de puertas cerradas cuando ella pregunta: \"¿Qué hacen ahí dentro, niños?\". Cuando ya lo sabe. Otro aquí en el fondo de su mente que ve lo que no debería, pero que debe saber, y, por supuesto, los de aquí al frente, que pueden mirar a un niño cuando comete un error y decirle: \"Te entiendo y te amo\" sin siquiera pronunciar una palabra. \"Dios\", dijo el ángel tocándole la manga suavemente, \"Descansa mañana...\". \"No puedo\", dijo Dios, \"Estoy tan cerca de crear algo tan cercano a mí. Ya tengo una que se cura sola cuando está enferma... puede alimentar a una familia de seis con medio kilo de hamburguesa... y puede hacer que un niño de nueve años se ponga de pie bajo la ducha\". El ángel rodeó el modelo de una madre muy lentamente. \"Es demasiado blanda\", suspiró. \"¡Pero es fuerte!\", dijo Dios con entusiasmo. \"Imagínate lo que esta madre puede hacer o soportar\". \"¿Puede pensar?\". \"No solo puede pensar, sino que puede razonar y llegar a acuerdos\", dijo el Creador. Finalmente, el ángel se inclinó y le pasó el dedo por la mejilla. \"Hay una fuga\", sentenció. \"Te dije que estabas intentando poner demasiado en este modelo.\" \"No es una fuga\", dijo el Señor, \"es una lágrima\". \"¿Para qué es?\" \"Es para la alegría, la tristeza, la decepción, el dolor, la soledad y el orgullo.\" \"Eres un genio\", dijo el ángel. Con tristeza, Dios dijo: \"Yo no lo puse ahí\".",
  "autor": "Erma Bombeck,",
  " etiquetas": " ['niños', 'familia', 'humor', 'amor', 'madres', 'día de la madre', 'tristeza']"
 },
 {

 {
  "cita": " Nos sentamos en silencio y observamos el mundo que nos rodea. Nos ha llevado toda una vida aprender esto. Parece que solo los mayores son capaces de sentarse juntos, callarse y aun así sentirse contentos. Los jóvenes, impulsivos e impacientes, siempre deben romper el silencio. Es un desperdicio, porque el silencio es puro. El silencio es sagrado. Une a las personas porque solo quienes se sienten cómodos juntos pueden sentarse sin hablar. Esta es la gran paradoja.",

  " etiquetas": " ['percepción', 'silencio']"
 },
 {
  "cita": "“Amar a otra persona es ver el rostro de Dios”.",
  "autor": " Víctor Hugo,"
 },
 {
  "cita": " Quiero ser la amiga de la que te enamoras perdidamente. La que abrazas, la que llevas a tu cama y la que llevas a ese mundo privado que mantienes atrapado en tu cabeza. Quiero ser esa clase de amiga. La que memorizará lo que dices, así como la forma de tus labios al decirlo. Quiero conocer cada curva, cada peca, cada temblor de tu cuerpo. Quiero saber dónde tocarte, quiero saber cómo tocarte. Quiero convencerte de que diseñes una sonrisa solo para mí. Sí, quiero ser tu amiga. Quiero ser tu mejor amiga en el mundo entero.",

  " etiquetas": " ['amar']"
 },
 {

 {
  "cita": " Sé que estamos jodidos, ¿vale? Soy impulsivo y de mal carácter, y me sacas de quicio como nadie. Actúas como si me odiaras un minuto y al siguiente me necesitaras. Nunca me sale nada bien, y no te merezco... pero te quiero, Abby. Te quiero más de lo que he querido a nadie ni a nada en mi vida. Cuando estás cerca, no necesito alcohol, ni dinero, ni peleas, ni rollos de una noche...",

 {
  "cita": " veces es mucho más fácil ignorar las cosas. Las cosas cambian y los amigos se van. Y la vida no se detiene para nadie. Quería reír. O tal vez enojarme. O tal vez encogerme de hombros ante lo extraños que eran todos, especialmente yo. Creo que la idea es que cada persona tiene que vivir su propia vida y luego elegir compartirla con otras personas. No puedes simplemente sentarte y poner la vida de los demás por delante de la tuya y pensar que eso cuenta como amor. Simplemente no puedes. Tienes que hacer cosas. Voy a hacer lo que quiero hacer. Voy a ser quien realmente soy. Y voy a averiguar qué es eso. Y todos podríamos sentarnos y preguntarnos y sentirnos mal unos con otros y culpar a mucha gente por lo que hicieron o no hicieron o por lo que no sabían. No lo sé. Supongo que siempre podría haber alguien a quien culpar. Simplemente es diferente. Tal vez sea bueno poner las cosas en perspectiva, pero a veces, creo que la única perspectiva es estar realmente presente. Porque está bien Sentí cosas. Estuve realmente allí. Y eso fue suficiente para hacerme sentir infinito. Me siento infinito.",

  " etiquetas": " ['vida', 'tiempo']"
 },
 {
  "cita": " En tu luz aprendo a amar. En tu belleza, a hacer poemas. Bailas en mi pecho donde nadie te ve, pero a veces yo sí, y esa visión se convierte en arte.",
  "autor": " Rumi",
  " etiquetas": " ['amar']"
 },
 {
  "cita": " “Entre dos males, siempre elijo el que nunca he probado antes”.",
  "autor": " Mae West",
  " etiquetas": " ['mal', 'tentación']"
 },
 {
  "cita": "Mañana, y mañana, y mañana, se arrastra a este paso mezquino día tras día, hasta la última sílaba del tiempo registrado; y todos nuestros ayeres han iluminado a los necios el camino a la muerte polvorienta. ¡Fuera, fuera, pequeña vela! La vida no es más que una sombra andante, un pobre actor, que se pavonea y se inquieta durante su hora en el escenario, y luego ya no se oye nada. Es un cuento contado por un idiota, lleno de ruido y furia, que no significa nada.",
  "autor": " William Shakespeare,",
  " etiquetas": " ['inspirador']"
 },
 {
  "cita": " Supongo que eso es parte de amar a la gente: tienes que renunciar a cosas. A veces, incluso tienes que renunciar a ellas.",
  "autor": " Lauren Oliver,",
  " etiquetas": " ['dar', 'amar', 'sacrificio']"
 },
 {
  "cita": " “Cierra los ojos y mira.”",
  "autor": " James Joyce"
 },
 {
  "cita": " “Prefiero morir en una aventura que vivir estancado.”",
  "autor": " V. E. Schwab,"
 },
 {
  "cita": " “Ser completamente honesto con uno mismo es un buen ejercicio”.",
  "autor": " Sigmund Freud"
 },
 {
  "cita": "Tengo fe en que Dios te mostrará la respuesta. Pero debes entender que a veces lleva tiempo reconocer lo que Dios quiere que hagas. Así suele ser. La voz de Dios no suele ser más que un susurro, y hay que escuchar con mucha atención para oírla. Pero otras veces, en esos momentos tan excepcionales, la respuesta es obvia y resuena con fuerza.",
  "autor": " Nicolás Sparks,",
  " etiquetas": " ['dios']"
 },
 {

 },
 {

 },

  " etiquetas": " ['mañana', 'despertar']"
 },
 {
  "cita": " “Errar es humano, perdonar, divino.”",
  "autor": " Alejandro Papa,",
  " etiquetas": "['fracaso', 'perdón', 'humanidad', 'errores']"
 },
 {
  "cita": " “Pero amo tus pies sólo porque caminaron sobre la tierra, sobre el viento y sobre las aguas, hasta que me encontraron.”",
  "autor": "Pablo Neruda"
 },
 {
  "cita": " Cuando nos sentimos incompletos, siempre buscamos a alguien que nos complete. Cuando, tras unos años o meses de relación, descubrimos que seguimos insatisfechos, culpamos a nuestras parejas y buscamos a alguien más prometedor. Esto puede continuar indefinidamente —la poligamia en serie— hasta que admitimos que, si bien una pareja puede enriquecer nuestras vidas, cada uno de nosotros es responsable de su propia plenitud. Nadie más puede proporcionárnosla, y creer lo contrario es engañarnos peligrosamente y programar el fracaso en cada relación que emprendamos.",
  "autor": " Tom Robbins",
  " etiquetas": " ['relaciones']"
 },
 {
  "cita": "El hombre que dicta la sentencia debe blandir la espada. Si le quitas la vida a un hombre, le debes mirarlo a los ojos y escuchar sus últimas palabras. Y si no puedes soportarlo, entonces quizás ese hombre no merezca morir.",
  "autor": " George R. R. Martín,",
  " etiquetas": " ['honor', 'justicia', 'responsabilidad personal', 'responsabilidad']"
 },
 {
  "cita": " No importa. Tengo libros, libros nuevos, y puedo soportar cualquier cosa mientras haya libros.",
  "autor": " Jo Walton,",
  " etiquetas": " ['libros']"
 },
 {
  "cita": " “Prefiero ser odiado por quien soy, que amado por quien no soy”.",
  "autor": " Kurt Cobain",
  " etiquetas": " ['inspirador']"
 },
 {
  "cita": " Tus visiones solo se aclararán cuando puedas mirar dentro de tu corazón. Quien mira afuera, sueña; quien mira adentro, despierta.",
  "autor": " C. G. Jung",
  " etiquetas": " ['introspección', 'psicoterapeuta', 'secretos', 'autoconciencia', 'visiones']"
 },
 {
  "cita": "Fantasías masculinas, fantasías masculinas, ¿todo está gobernado por fantasías masculinas? En un pedestal o de rodillas, todo es una fantasía masculina: que eres lo suficientemente fuerte para aguantar lo que te den, o demasiado débil para hacer algo al respecto. Incluso fingir que no estás satisfaciendo las fantasías masculinas es una fantasía masculina: fingir que no te ven, fingir que tienes vida propia, que puedes lavarte los pies y peinarte sin ser consciente del observador omnipresente que mira por el ojo de la cerradura, que mira por el ojo de la cerradura de tu propia cabeza, si no por ningún otro lugar. Eres una mujer con un hombre dentro observando a una mujer. Eres tu propia voyeur.",
  "autor": " Margaret Atwood,"
 },
 {
  "cita": " “Si realmente soy parte de tu sueño, volverás algún día”.",
  "autor": " Paulo Coelho"
 },
 {
  "cita": " “La única prisión real es el miedo, y la única libertad real es estar libre del miedo”",
  "autor": " Aung San Suu Kyi",
  " etiquetas": " ['derechos civiles']"
 },
 {
  "cita": "En mi próxima vida quiero vivir al revés. Empiezas muerto y te quitas eso de encima. Luego te despiertas en una residencia de ancianos sintiéndote mejor cada día. Te echan por tener demasiada salud, vas a cobrar tu pensión y, al empezar a trabajar, te dan un reloj de oro y una fiesta el primer día. Trabajas 40 años hasta que eres lo suficientemente joven para disfrutar de tu jubilación. Te das una fiesta, bebes alcohol y, en general, eres promiscuo, y luego estás listo para el instituto. Luego vas a la primaria, te conviertes en un niño, juegas. No tienes responsabilidades, te conviertes en un bebé hasta que naces. Y luego pasas tus últimos 9 meses flotando en un lujoso spa con calefacción central y servicio de habitaciones de barril, habitaciones más grandes todos los días y ¡voilá! ¡Terminas como un orgasmo!",
  "autor": " Woody Allen"
 },
 {
  "cita": " “Siento una sensación cálida entre mis libros”.",
  "autor": " Anthony Powell"
 },
 {
  "cita": "El dolor es como aprendemos a amar. Tu corazón no se rompe. Duele porque se agranda. Cuanto más grande se agranda, más amor alberga.",
  "autor": " Rita Mae Brown,",
  " etiquetas": " ['amar']"
 },
 {
  "cita": " “La voz del mar habla al alma”.",
  "autor": " Kate Chopin,"
 },
 {
  "cita": " Tomar la mano de Eleanor era como sostener una mariposa. O un latido. Como sostener algo completo y completamente vivo.",
  "autor": " Arcoiris Rowell,",
  " etiquetas": " ['amistad', 'instituto', 'amor', 'relaciones', 'dulce', 'amor adolescente']"
 },
 {
  "cita": " “Sólo las personas capaces de amar fuertemente pueden también sufrir grandes dolores, pero esta misma necesidad de amar sirve para contrarrestar su dolor y los sana.”",
  "autor": " León Tolstoi",
  " etiquetas": " ['dolor', 'inspirador']"
 },
 {
  "cita": " “Siempre que sientas ganas de criticar a alguien... recuerda que no todas las personas de este mundo han tenido las ventajas que tú has tenido”.",

  " etiquetas": " ['empatía', 'agradecido', 'comprensión', 'comprensión-de-los-demás']"
 },
 {
  "cita": "No era una mascota, ni una muñeca, ni un animal. Era una sobreviviente y fuerte. No volvería a ser débil ni indefensa. No podría ser quebrantada. Domada.",
  "autor": " Sarah J. Maas,",
  " etiquetas": " ['una corte de niebla y furia', 'acomaf', 'feyre']"
 },
 {
  "cita": " “La marca del hombre inmaduro es que quiere morir noblemente por una causa, mientras que la marca del hombre maduro es que quiere vivir humildemente por una causa.”",
  "autor": " J. D. Salinger,",
  " etiquetas": " ['atribuido', 'creciendo', 'wilhelm-stekel']"
 },
 {
  "cita": " “Segunda estrella a la derecha y recto hasta la mañana”.",
  "autor": " J. M. Barrie,",
  " etiquetas": " ['recuerdo de la infancia']"
 },
 {
  "cita": " “Cada uno de nosotros es su propio demonio y hacemos de este mundo nuestro infierno”.",
  "autor": " Oscar Wilde",
  " etiquetas": " ['diablo', 'infierno', 'mundo']"
 },
 {
  "cita": "Se despertaba cada mañana con el deseo de hacer lo correcto, de ser una persona buena y significativa, de ser, por simple que pareciera y por imposible que fuera, feliz. Y a lo largo de cada día, su corazón descendía del pecho al estómago. Al principio de la tarde, lo invadía la sensación de que nada estaba bien, o que nada estaba bien para él, y el deseo de estar solo. Al anochecer, se sentía realizado: solo en la magnitud de su dolor, solo en su culpa sin sentido, solo incluso en su soledad. No estoy triste, se repetía una y otra vez, no estoy triste. Como si algún día pudiera convencerse a sí mismo. O engañarse a sí mismo. O convencer a los demás: lo único peor que estar triste es que los demás sepan que estás triste. No estoy triste. No estoy triste. Porque su vida tenía un potencial ilimitado de felicidad, en la medida en que era una habitación blanca y vacía. Se dormía con el corazón a los pies de la cama, como un animal doméstico que no formaba parte de él. Y cada mañana se despertaba con él de nuevo en el armario de Su caja torácica, un poco más pesada, un poco más débil, pero aún bombeaba. Y a media tarde, de nuevo lo invadió el deseo de estar en otro lugar, en otra persona, en otra persona, en otro lugar. No estoy triste.",
  "autor": " Jonathan Safran Foer,",
  " etiquetas": "['tristeza']"
 },
 {
  "cita": " “La gente tiende a complicarse la vida, como si vivir no fuera ya suficientemente complicado.”",
  "autor": " Carlos Ruiz Zafón,",
  " etiquetas": " ['lecciones de vida']"
 },
 {
  "cita": " “No estropees lo que tienes deseando lo que no tienes",
  "autor": " Recuerda que lo que ahora tienes alguna vez estuvo entre las cosas que sólo esperabas.”",
  " etiquetas": " Epicuro",
  "Column4": " ['deseo', 'gratitud', 'esperanza']"
 },
 {
  "cita": " “Las únicas mentiras por las que somos verdaderamente castigados son las que nos decimos a nosotros mismos”.",
  "autor": " VS Naipaul,"
 },
 {
  "cita": " \"Eh... ¿está domesticado?\", dijo Frank. El caballo relinchó furioso. \"No lo creo\", supuso Percy. \"Solo dijo: 'Te voy a pisotear hasta la muerte, tonto bebé chino-canadiense'\".",
  "autor": " Rick Riordan,",
  " etiquetas": " ['gracioso', 'tonto-chino-canadiense-bebé-hombre']"
 },
 {
  "cita": " “Si te gustó ser adolescente, hay algo realmente mal contigo”.",
  "autor": " Stephen King"
 },
 {
  "cita": "Cuando digo que me gustas, me refiero a esa parte de ti que sabe que la vida es mucho más que cualquier cosa que puedas ver, oír o tocar. Esa parte profunda de ti que te permite defender aquello sin lo cual la humanidad no puede sobrevivir. El amor que vence al odio, la paz que triunfa sobre la guerra y la justicia que demuestra ser más poderosa que la codicia.",
  "autor": " Fred Rogers",
  " etiquetas": " ['amigos', 'amistad', 'amor', 'paz']"
 },
 {
  "cita": " Quizás hubo gente que vivió esas vidas. Quizás esta chica era una de ellas. ¿Pero qué hay del resto de nosotras? ¿Qué hay de los don nadie y los nada, las chicas invisibles? Aprendemos a mantener la cabeza como si lleváramos coronas. Aprendemos a extraer magia de lo ordinario. Así sobreviviste cuando no fuiste elegida, cuando no corrías sangre real. Cuando el mundo no te debía nada, le exigías algo de todos modos.",
  "autor": " Leigh Bardugo,",
  " etiquetas": " ['reino-torcido', 'grisha', 'inej-ghafa', 'seis-de-cuervos']"
 },
 {
  "cita": "¿Es el hombre un simple error de Dios? ¿O Dios un simple error del hombre?",
  "autor": " Friedrich Nietzsche",
  " etiquetas": " ['ateísmo', 'religión organizada', 'paradoja', 'religión']"
 },
 {
  "cita": " “Sin dolientes. Sin funerales”.",
  "autor": " Leigh Bardugo,"
 },
 {
  "cita": " \"Los trenes son unas cosas geniales, sucias y llenas de humo\", dijo Will. \"No te va a gustar\". Tessa permaneció impasible. \"No sabré si me gusta hasta que lo pruebe, ¿verdad?\". \"Nunca he nadado desnuda en el Támesis, pero sé que no me gustaría\". \"Pero piensa en lo entretenido que sería para los turistas\", dijo Tessa, y vio a Jem agachar la cabeza para ocultar una breve sonrisa.",
  "autor": " Cassandra Clare,",
  " etiquetas": " ['príncipe mecánico', 'humor', 'jem carstairs', 'burla', 'tessa gray', 'will herondale']"
 },
 {
  "cita": "“أي علم هذا الذي لم يستطع حتى الآن أن يضع أصوات من نحب في أقراص ، أو زجاجة دواء نتناولها سرًّا ، عندما نصاب بوعكة عاطفية بدون أن يدري صاحبها كم نحن نحتاجه”",
  "autor": " El hombre más rico ,"
 },
 {
  "cita": " Nuestras vidas no nos pertenecen. Estamos ligados a otros, del pasado y del presente, y con cada crimen y cada acto de bondad, construimos nuestro futuro.",
  "autor": " David Mitchell,"
 },
 {
  "cita": " Conozco una cura para todo: agua salada... de una forma u otra. Sudor, lágrimas o el mar salado.",
  "autor": " Karen Blixen"
 },
 {
  "cita": " “El último enemigo que será destruido será la muerte.”",

 },

 {

 },
 {

 {

 },
 {

  " etiquetas": " ['inspiración']"
 },
 {

 },
 {

  " etiquetas": " ['libros', 'inspirador', 'lectura']"
 },
 {
  "cita": " ¿Y el Arte? Es una enfermedad. ¿El Amor? Una ilusión. ¿La Religión? El sustituto de moda de la Creencia. Eres escéptico. ¡Jamás! El escepticismo es el principio de la Fe. ¿Qué eres? Definir es limitar.",
  "autor": " Oscar Wilde,"
 },
 {
  "cita": " “Los padres sólo pueden dar buenos consejos o guiarlos por el camino correcto, pero la formación final del carácter de una persona está en sus propias manos”.",

  " etiquetas": " ['crecer', 'inocencia', 'inspirador', 'crianza', 'responsabilidad personal', 'derecho de paso', 'autodeterminación', 'autorresponsabilidad']"
 },
 {

  " etiquetas": " ['mentalidad de rebaño', 'inspiración', 'Patton']"
 },
 {
  "cita": " “La mejor manera de animarte a ti mismo es intentar animar a alguien más”.",

  " etiquetas": " ['felicidad']"
 },
 {

  "autor": " Marie Curie",

 },
 {

  "autor": " Franz Kafka,"
 },
 {
  "cita": " “Si la luna sonriera, se parecería a ti.Dejas la misma impresión, de algo bello, pero aniquilador.”",
  "autor": " Sylvia Plath,"
 },
 {
  "cita": "“Contener la ira es un veneno... Te consume por dentro... Creemos que al odiar a alguien le hacemos daño... Pero el odio es una espada curva... y el daño que hacemos a los demás... también nos lo hacemos a nosotros mismos”.",
  "autor": " Mitch Albom,",
  " etiquetas": " ['rubi-ira']"
 },
 {
  "cita": " “No sé quién inventó los tacones altos, ¡pero todas las mujeres le deben mucho!”",
  "autor": " Marilyn Monroe",
  " etiquetas": " ['moda']"
 },
 {
  "cita": " “Hay placer en los bosques sin senderos, hay éxtasis en la orilla solitaria, hay compañía donde nadie se entromete, junto al mar profundo y la música en su rugido: no amo menos al hombre, sino más a la Naturaleza”",
  "autor": " Señor Byron",
  " etiquetas": " ['naturaleza', 'poesía', 'soledad']"
 },
 {
  "cita": " “Los libros sirven para mostrarle a un hombre que sus pensamientos originales no son muy nuevos después de todo”.",
  "autor": "Abraham Lincoln",
  " etiquetas": " ['libros', 'originalidad', 'único']"
 },
 {
  "cita": " “Ha descubierto que los libros son una forma de vivir mil vidas... o de encontrar fuerza en una vida muy larga”.",
  "autor": " V. E. Schwab,"
 },
 {
  "cita": "Ciertamente tienen derecho a pensar eso, y tienen derecho a que se respeten plenamente sus opiniones... pero antes de poder vivir con los demás, tengo que vivir conmigo mismo. Lo único que no se rige por la regla de la mayoría es la conciencia de una persona.",
  "autor": " Harper Lee,",
  " etiquetas": " ['integridad']"
 },
 {
  "cita": " “La cuestión no es lo que miras, sino lo que ves”.",
  "autor": " Henry David Thoreau",
  " etiquetas": " ['inspirador']"
 },
 {
  "cita": " “Paciencia, saltamontes”, dijo Maia. “Lo bueno se hace esperar”. “Siempre pensé que era ‘Lo bueno se hace esperar’”, dijo Simon. “Con razón he estado tan confundido toda mi vida”.",

  " etiquetas": " ['maia', 'paciencia', 'simon', 'ingenio']"
 },
 {

  "autor": " Friedrich Nietzsche",
  " etiquetas": " ['corrupción', 'individualidad', 'presión de grupo', 'juventud']"
 },
 {
  "cita": " “Todos somos el monstruo de alguien”.",
  "autor": " Leigh Bardugo,",
  " etiquetas": " ['Matías']"
 },

  "autor": " Hafiz",
  " etiquetas": " ['vida', 'amor', 'cielo', 'sol']"
 },
 {
  "cita": " “Tal vez nuestras novias sean nuestras almas gemelas y los chicos sólo sean personas con quienes divertirse”.",
  "autor": " Candace Bushnell,",
  " etiquetas": " ['citas', 'humor', 'relaciones', 'almas gemelas']"
 },
 {
  "cita": " “Al final del día, podemos soportar mucho más de lo que creemos que podemos”.",
  "autor": " Frida Kahlo"
 },
 {
  "cita": " “¿Alguna vez te has preguntado: los monstruos hacen la guerra o la guerra crea monstruos?”",
  "autor": " Laini Taylor,"
 },
 {
  "cita": " Todos los buenos libros se parecen en que son más veraces que si hubieran sucedido realmente, y después de leer uno, sentirás que todo lo que te sucedió, y después, te pertenece: lo bueno y lo malo, el éxtasis, el remordimiento y la tristeza, la gente, los lugares y el clima. Si logras transmitir eso a la gente, entonces eres un escritor.",
  "autor": " Ernest Hemingway",
  " etiquetas": "['autores', 'buenos libros', 'verdad', 'escritores']"
 },
 {
  "cita": " Hay tres preguntas que toda mujer debería poder responder afirmativamente antes de comprometerse con un hombre. Si respondes que no a cualquiera de las tres, ¡sal corriendo! [...] \"¿Te trata con respeto en todo momento? Esa es la primera pregunta. La segunda pregunta es: si dentro de veinte años fuera la misma persona que hoy, ¿seguirías queriendo casarte con él? Y, por último, ¿te inspira a ser mejor persona? Si encuentras a alguien a quien puedas responder afirmativamente a las tres, habrás encontrado a un buen hombre\".",
  "autor": " Colleen Hoover,"

  "cita": "Dignidad\/ˈdignitē\/ sustantivo 1. El momento en que te das cuenta de que la persona que cuidabas no tiene nada intelectual ni espiritualmente que ofrecerte, excepto un dolor de cabeza. 2. El momento en que te das cuenta de que Dios tenía planes más grandes para ti que no implican llorar por la noche o citas tristes de Pinterest. 3. El momento en que dejas de compararte con los demás porque socava tu valor, tu educación y la sabiduría de tus padres. 4. El momento en que vives tus sueños, no por lo que probará o te traerá, sino porque eso es todo lo que quieres hacer. Las opiniones de la gente no importan. 5. El momento en que te das cuenta de que nadie es tu enemigo, excepto tú mismo. 6. El momento en que te das cuenta de que puedes tener todo lo que quieres en la vida. Sin embargo, se necesita tiempo, el corazón correcto, las acciones correctas, la pasión correcta y la voluntad de arriesgarlo todo. Si no es tuyo, es porque realmente no lo querías, no lo necesitabas o Dios lo impidió. 7. El momento en que te das cuenta de que el fantasma de tus antepasados se interpuso entre tú y la persona que amabas. Realmente no quieren que arruines la línea familiar con alguien que actúa de forma poco honorable. 8. El momento en que te das cuenta de que la felicidad nunca se trató de conseguir a una persona. Solo son una ayuda para lograr tu misión en la vida. 9. El momento en que crees que el amor no se trata de perder ni ganar. Son solo unos instantes, seguidos de una eternidad de situaciones de las que crecer. 10. El momento en que te das cuenta de que siempre fuiste la persona correcta. Solo la gente ignorante se aleja de la grandeza.",
  "autor": "Shannon L. Alder"
 },

 {
  "cita": "Te amaré como un ladrón ama una galería y como un cuervo ama un asesinato, como una nube ama a los murciélagos y como un campo ama a los brezos. Te amaré como la desgracia ama a los huérfanos, como el fuego ama la inocencia y como la justicia ama sentarse a observar mientras todo sale mal. Te amaré como un campo de batalla ama a los jóvenes y como las mentas aman tus alergias, y te amaré como la cáscara de plátano ama el zapato de un hombre que acaba de ser golpeado por una teja que se desprendió de una casa. Te amaré como un departamento de bomberos voluntarios ama entrar corriendo en edificios en llamas y como los edificios en llamas aman perseguirlos, y como un paracaídas ama dejar un dirigible y como un operador de dirigible ama perseguirlo. Te amaré como una daga ama la espalda de cierta persona, y como cierta persona ama usar túnicas a prueba de dagas, y como una túnica a prueba de dagas ama ir a cierta tintorería, y como cierto empleado de una tintorería ama Quedarse despierto hasta tarde con binoculares, vigilando una fábrica de dagas durante horas con la esperanza de atrapar a un ladrón, y como a un ladrón le encanta escabullirse con binoculares tras la gente, dándose cuenta de repente de que ha dejado su daga en casa. Te amaré como un cajón ama un compartimento secreto, y como un compartimento secreto ama un secreto, y como un secreto ama hacer que alguien se quede sin aliento, y como una persona que se queda sin aliento ama una copa de brandy para calmar los nervios, y como una copa de brandy ama romperse en el suelo, y como el ruido del cristal al romperse ama hacer que alguien se quede sin aliento, y como alguien que se queda sin aliento ama un escritorio cercano en el que apoyarse, incluso si al apoyarse en él se presiona una palanca que encanta abrir un cajón y revelar un compartimento secreto. Te amaré hasta que todos esos compartimentos sean descubiertos y abiertos, y hasta que todos los secretos hayan desaparecido por completo. Te amaré hasta que todos los códigos y corazones se hayan roto y hasta que cada anagrama y huevo se haya descifrado. Te amaré hasta que cada fuego se extinga y hasta que cada hogar se reconstruya con la madera más hermosa y susceptible, y hasta que cada criminal sea esposado por el policía más perezoso. Amaré hasta que M. odie las serpientes y J. odie la gramática, y te amaré hasta que C. se dé cuenta de que S. no es digno de su amor y N. se dé cuenta de que no es digno de la V. Te amaré hasta que el pájaro odie el nido y el gusano odie la manzana, y hasta que la manzana odie el árbol y el árbol odie el nido, y hasta que un pájaro odie el árbol y una manzana odie el nido, aunque honestamente no puedo imaginar que eso último ocurra por mucho que lo intente. Te amaré cuando envejezcamos, lo cual acaba de suceder, y ha vuelto a suceder, y sucedió hace varios días, continuamente, y luego varios años antes, y seguirá sucediendo mientras las manecillas de cada reloj y las páginas de cada calendario marcan el paso del tiempo, excepto los relojes a los que la gente ha olvidado dar cuerda y los calendarios a los que la gente ha olvidado colocar. En un área muy visible. Te amaré a medida que nos alejamos cada vez más, donde una vez estuvimos tan cerca que podíamos deslizar la pajita curva y la cuchara larga y delgada entre nuestros labios y dedos, respectivamente. Te amaré hasta que las posibilidades de que nos encontremos pasen de escasas a nulas, y hasta que tu rostro esté empañado por un recuerdo lejano, y tu recuerdo enfrentado por una niebla lejana, y tu niebla memorizada por un rostro lejano, y tu distancia distanciada por el recuerdo memorizado de una niebla brumosa. Te amaré sin importar a dónde vayas y a quién veas, sin importar a dónde evites y a quién no veas, y sin importar quién te vea evitando a dónde vas. Te amaré sin importar lo que te suceda, y sin importar cómo descubra lo que te sucede, y sin importar lo que me suceda al descubrir esto, y ahora sin importar cómo me descubran después de lo que me suceda al descubrir esto.",
  "autor": " Lemony Snicket",
  " etiquetas": "['las-cartas-de-beatrice']"

 {
  "cita": " “لا تجالس أنصاف العشاق، ولا تصادق أنصاف الأصدقاء، لا تقرأ لأنصاف الموهوبين،لا تعش نصف حياة، ولا تمت نصف موت،لا تختر نصف حل، ولا تقف في منتصف الحقيقة, لا تحلم نصف حلم، ولا تتعلق بنصف أمل، إذا صمتّ ..فاصمت حتى النهاية، وإذا تكلمت .. فتكلّم حتى النهاية, لا تصمت كي تتكلم، ولا تتكلم كي تصمت . إذا رضيت فعبّر عن رضاك، لا تصطنع نصف رضا، وإذا رفضت .. فعبّر عن رفضك، لأن نصف الرفض قبول .. النصف هو حياة لم تعشها، وهو كلمة لم تقلها،وهو ابتسامة أجّلتها، وهو حب لم تصل إليه، وهو صداقة لم تعرفها .. النصف هو ما يجعلك غريباً عن أقرب الناس إليك، وهو ما يجعل أقرب الناس إليك غرباء عنك . النصف هو أن تصل وأن لاتصل، أن تعمل وأن لا تعمل،أن تغيب وأن تحضر .. النصف هو أنت، عندما لا تكون أنت ..لأنك لم تعرف من أنت، النصف هو أن لا تعرف من أنت .. ومن تحب ليس نصفك الآخر .. هو أنت في مكان آخر في الوقت نفسه . نصف شربة لن تروي ظمأك، ونصف وجبة لن تشبع جوعك،نصف طريق لن يوصلك إلى أي مكان، ونصف فكرة لن تعطي لك نتيجة النصف هو لحظة عجزك وأنت لست Dios .. لأنك لست نصف إنسان . أنت إنسان وجدت كي تعيش الحياة، وليس كي تعيش نصف حياة ليست حقيقة الإنسان بما يظهره لك .. بل بما لا يستطيع أن يظهره، لذلك .. إذا أردت أن تعرفه فلا تصغي إلى ما يقوله .. بل إلى ما لا يقوله .\"",
  "autor": " جبران خليل جبران"
 },

  "cita": "Catherine Earnshaw, que no descanses mientras yo viva. Dijiste que te maté; atorméceme entonces. Los asesinados atormentan a sus asesinos. Creo, sé que los fantasmas han vagado por la tierra. Acompáñame siempre, adopta cualquier forma, no me vuelvas loco. ¡Pero no me abandones en este abismo, donde no puedo encontrarte! ¡Oh, Dios! ¡Es indescriptible! ¡No puedo vivir sin mi vida! ¡No puedo vivir sin mi alma!",

  "cita": " Los sueños siempre son devastadores cuando no se hacen realidad. Pero son los sueños sencillos los que suelen ser más dolorosos porque parecen tan personales, tan razonables, tan alcanzables. Siempre estás lo suficientemente cerca como para tocarte, pero nunca lo suficientemente cerca como para abrazarte, y eso te rompe el corazón.",

 },
 {
  "cita": "Crees que porque no te quiere no vales nada. Crees que porque ya no te quiere tiene razón, que su juicio y opinión sobre ti son correctos. Si te echa, eres basura. Crees que te pertenece porque tú quieres pertenecerle. No lo hagas. \"Pertenecer\" es una mala palabra. Especialmente cuando lo pones con alguien a quien amas. El amor no debería ser así. ¿Alguna vez viste cómo las nubes aman a una montaña? La rodean; a veces ni siquiera puedes ver la montaña por las nubes. ¿Pero sabes qué? Subes a la cima y ¿qué ves? Su cabeza. Las nubes nunca la cubren. Su cabeza se asoma, porque las nubes se lo permiten; no la envuelven. Le permiten mantener la cabeza en alto, libre, sin nada que lo oculte o lo ate. No puedes poseer a un ser humano. No puedes perder lo que no posees. Supongamos que lo poseyeras. ¿De verdad podrías amar a alguien que no es absolutamente nadie sin ti? ¿De verdad quieres a alguien así? ¿Alguien que se desmorona cuando sales por la puerta? No, ¿verdad? Y él tampoco. Le estás entregando toda tu vida. Toda tu vida, chica. Y si significa tan poco para ti que puedes regalarla, entregársela, ¿por qué debería significar más para él? No puede valorar “Te valoras más de lo que te valoras a ti mismo.”",
  "autor": " Toni Morrison",
  " etiquetas": "['emoción', 'amor', 'autoestima', 'valor']"
 },

 {
  "cita": "Un día, Atticus le dijo a Jem: «Preferiría que dispararas a las latas del patio, pero sé que irás tras los pájaros. Dispara a todos los arrendajos azules que quieras, si puedes acertarles, pero recuerda que es pecado matar a un ruiseñor». Esa fue la única vez que oí a Atticus decir que era pecado hacer algo, y le pregunté a la señorita Maudie al respecto. «Tu padre tiene razón», dijo. «Los ruiseñores no hacen nada más que componer música para que la disfrutemos. No se comen los jardines de la gente, no anidan en los graneros, no hacen nada más que cantar con todo el corazón para nosotros. Por eso es pecado matar a un ruiseñor».",
  "autor": " Harper Lee,",
  " etiquetas": " ['explorar']"
 },

  "cita": "“Lo superarás…” Son los clichés los que causan el problema. Perder a alguien a quien amas es cambiar tu vida para siempre. No lo superas porque “eso” es la persona que amabas. El dolor se acaba, hay gente nueva, pero la brecha nunca se cierra. ¿Cómo podría? La particularidad de alguien que importó lo suficiente como para llorarlo no se vuelve anodina con la muerte. Este vacío en mi corazón tiene la forma de ti y nadie más puede llenarlo. ¿Por qué querría que lo hicieran?”",

  "cita": " \"¿Estás bien?\", preguntó. \"¿No te han comido los monstruos?\". \"Ni un poquito\". Le mostré que aún tenía los dos brazos y las dos piernas, y Tyson aplaudió felizmente. \"¡Sí!\", dijo. \"¡Ahora podemos comer sándwiches de mantequilla de cacahuete y montar ponis de pescado! ¡Podemos luchar contra monstruos, ver a Annabeth y hacer que todo explote!\". Esperaba que no se refiriera a todo a la vez, pero le dije que sin duda, que nos lo pasaríamos genial este verano.",

 {
  "cita": " No aspires al éxito. Cuanto más lo busques y lo conviertas en un objetivo, más lo perderás. Porque el éxito, como la felicidad, no se puede perseguir; debe surgir, y solo lo hace como efecto secundario imprevisto de la dedicación personal a una causa superior a uno mismo o como consecuencia de la entrega a alguien que no eres tú. La felicidad debe suceder, y lo mismo ocurre con el éxito: debes dejar que suceda sin importarle. Quiero que escuches lo que tu conciencia te manda hacer y que lo lleves a cabo lo mejor que puedas. Entonces verás que a la larga —¡a la larga, digo!— el éxito te seguirá precisamente porque olvidaste pensar en él.",
  "autor": " Víctor E. Frankl,",
  " etiquetas": " ['felicidad', 'éxito']"
 },
 {
  "cita": "Viruela, ay, viruela. ¿Cómo se contrae? Hay que ir a la parte mala de la ciudad hasta cansarse. Viruela, ay, viruela, la tuve desde siempre. No la viruela, idiotas, me refiero a esta misma canción. ¡Porque yo tenía razón y ustedes no! —¡Will! —gritó Charlotte por encima del ruido—. ¿Has PERDIDO LA CABEZA? ¡PARA ESE BARRIL INFERNAL! Jem... Jem, poniéndose de pie, tapó la boca de Will con las manos. —¿Prometes callarte? —susurró al oído de su amigo. Will asintió, con sus ojos azules encendidos. Tessa lo miraba con asombro; todos lo estaban. Había visto a Will de muchas maneras: divertido, amargado, condescendiente, enfadado, compasivo, pero nunca aturdido. Jem lo soltó. —De acuerdo, entonces. Will se deslizó al suelo, con la espalda contra el sillón, y alzó los brazos. —¡Una viruela demoníaca en todas sus casas! —anunció, y bostezó—. ¡Dios mío, semanas de chistes sobre viruela! —dijo Jem—. ¡Nos espera una buena!",

  " etiquetas": "['demonio', 'viruela', 'voluntad']"
 },

  "cita": " Jane, quédate quieta; no te resistas como un pájaro salvaje y frenético, que se rasga las plumas en su desesperación. No soy un pájaro; ni ninguna red me atrapa; soy un ser humano libre, con una voluntad propia; y ahora me esfuerzo por dejarte.",

 {
  "cita": " “El papel de un escritor no es decir lo que todos podemos decir, sino lo que no somos capaces de decir”.",

  " etiquetas": " ['escribiendo']"
 },
 {
  "cita": "Vives así, resguardado, en un mundo delicado, y crees vivir. Entonces lees un libro… o haces un viaje… y descubres que no vives, que estás hibernando. Los síntomas de la hibernación son fácilmente detectables: primero, inquietud. El segundo síntoma (cuando la hibernación se vuelve peligrosa y puede degenerar en muerte): ausencia de placer. Eso es todo. Parece una enfermedad inocua. Monotonía, aburrimiento, muerte. Millones viven así (o mueren así) sin saberlo. Trabajan en oficinas. Conducen. Hacen picnics con sus familias. Crían hijos. Y entonces, una terapia de choque, una persona, un libro, una canción, los despierta y los salva de la muerte. Algunos nunca despiertan.",

  " etiquetas": " ['anais', 'nin']"
 },

 {
  "cita": "Cuando vas a urgencias, una de las primeras cosas que te piden es que califiques tu dolor en una escala del uno al diez, y a partir de ahí deciden qué medicamentos usar y con qué rapidez. Me han hecho esta pregunta cientos de veces a lo largo de los años, y recuerdo una vez, al principio, cuando no podía respirar y sentía como si me ardía el pecho, llamas lamiendo el interior de mis costillas luchando por salir de mi cuerpo. Mis padres me llevaron a urgencias. La enfermera me preguntó sobre el dolor, y como ni siquiera podía hablar, levanté nueve dedos. Más tarde, después de que me dieran algo, entró la enfermera y me acarició la cabeza mientras me tomaba la presión arterial, y dijo: \"¿Sabes cómo sé que eres un luchador? Dijiste que un diez era un nueve. Pero no era del todo cierto. Dije un nueve porque estaba ahorrando mi diez. Y ahí estaba, el gran y terrible diez, golpeándome una y otra vez mientras yacía inmóvil y solo en mi cama, mirando al techo. Las olas me lanzaban contra las rocas y luego me arrastraban mar adentro para lanzarme de nuevo contra la pared irregular del acantilado, dejándome flotando boca arriba en el agua, sin ahogarme.",
  "autor": " Juan Verde,"
 },

  "cita": " “Dar placer a un solo corazón con un solo acto es mejor que mil cabezas inclinadas en oración”.",

  " etiquetas": " ['inspiración']"

 {
  "cita": "\"¡Deja de luchar!\", dijo, intentando tirar del brazo que sujetaba. Él mismo estaba en una posición precaria, a horcajadas sobre la barandilla, intentando inclinarse lo suficiente para alcanzarme y sujetarme. \"¡Suéltame!\", grité. Pero era demasiado fuerte y logró arrastrarme casi por encima de la barandilla, lo suficiente como para que no corriera peligro de caer de nuevo. Mira, la cuestión es la siguiente: en ese momento, antes de soltarme, había estado contemplando mi muerte. Lo había aceptado. Sin embargo, también sabía que Dimitri podría hacer algo así. Era así de rápido y así de bueno. Por eso sostenía mi estaca en la mano que colgaba libre. Lo miré a los ojos. \"Siempre te amaré\". Entonces le clavé la estaca en el pecho. No fue un golpe tan preciso como me hubiera gustado, no con la habilidad con la que esquivaba. Luché por clavarle la estaca lo suficientemente profundo en el corazón, sin estar seguro de poder hacerlo desde este ángulo. Entonces, cesó su forcejeo. Me miró fijamente, atónito, y sus labios se entreabrieron, casi formando una sonrisa, aunque macabra y dolorosa. «Eso es lo que se suponía que debía decir...», jadeó. Esas fueron sus últimas palabras.",
  "autor": " Richelle Mead,",
  " etiquetas": "['sangre', 'puente', 'muerte', 'dhampir', 'dimitri', 'amor', 'magia', 'promesa', 'rosa', 'estaca', 'strigoi']"
 },

  "cita": "La pasión hace que uno deje de comer, dormir, trabajar y sentirse en paz. Mucha gente se asusta porque, cuando aparece, destruye todo lo viejo que encuentra a su paso. Nadie quiere que su vida se convierta en un caos. Por eso muchos controlan esa amenaza y, de alguna manera, son capaces de sostener una casa o una estructura que ya está podrida. Son los arquitectos de lo superado. Otros piensan exactamente lo contrario: se entregan sin pensarlo dos veces, esperando encontrar en la pasión la solución a todos sus problemas. Responsabilizan a la otra persona de su felicidad y la culpan de su posible infelicidad. Están eufóricos porque ha sucedido algo maravilloso o deprimidos porque algo inesperado acaba de arruinarlo todo. Controlar la pasión o entregarse ciegamente a ella: ¿cuál de estas dos actitudes es la menos destructiva? No lo sé.",

  "cita": "Idealmente, lo que se debería decir a cada niño, repetidamente, a lo largo de su vida escolar es algo como esto: “Están siendo adoctrinados. Aún no hemos desarrollado un sistema educativo que no sea un sistema de adoctrinamiento. Lo sentimos, pero es lo mejor que podemos hacer. Lo que se les enseña aquí es una amalgama de prejuicios actuales y las decisiones de esta cultura en particular. Un vistazo rápido a la historia mostrará cuán efímeras deben ser. Están siendo educados por personas que han sabido adaptarse a un régimen de pensamiento establecido por sus predecesores. Es un sistema que se autoperpetúa. A aquellos de ustedes que sean más fuertes e individuales que otros se les animará a irse y a encontrar maneras de educarse, de educar sus propios juicios. Quienes se queden deben recordar, siempre y en todo momento, que están siendo moldeados y modelados para adaptarse a las necesidades específicas de esta sociedad”.",

 {
  "cita": " Puedes contar una historia que se arraigue en el alma de alguien, que se convierta en su esencia, en su ser y en su propósito. Esa historia los conmoverá y los motivará, y quién sabe si lo harán gracias a ella, gracias a tus palabras. Ese es tu papel, tu don.",

  "cita": " Si hiciéramos caso a nuestro intelecto, nunca tendríamos una aventura amorosa. Nunca tendríamos una amistad. Nunca entraríamos en el mundo de los negocios porque seríamos cínicos: \"Va a salir mal\". O \"Me va a hacer daño\". O \"He tenido un par de malas aventuras amorosas, así que...\". Bueno, eso es una tontería. Vas a extrañar la vida. Tienes que saltar del precipicio todo el tiempo y construir tus alas mientras caes.",

 },
 {
  "cita": " Esto es lo que llamamos amor. Cuando eres amado, puedes hacer cualquier cosa en la creación. Cuando eres amado, no hay necesidad alguna de entender lo que sucede, porque todo sucede dentro de ti.",
  "autor": " Paulo Coelho,",
  " etiquetas": " ['amar']"
 },
 {
  "cita": " “En medio de la dificultad se encuentra la oportunidad”",
  "autor": " Albert Einstein"
 },
 {
  "cita": "Si tuviera una hija… En vez de “Mamá”, me llamará “Punto B”. Porque así sabe que, pase lo que pase, al menos siempre podrá encontrarme. Y le pintaré el sistema solar en el dorso de las manos para que tenga que aprenderse el universo entero antes de decir: “Ay, lo conozco como la palma de mi mano”. Aprenderá que esta vida te golpeará, fuerte, en la cara, esperando a que te levantes para patearte el estómago. Pero dejarte sin aliento es la única forma de recordarles a tus pulmones cuánto les gusta el sabor del aire. Hay un dolor aquí que no se cura con curitas ni poesía, así que la primera vez que se dé cuenta de que la Mujer Maravilla no va a venir, me aseguraré de que sepa que no tiene que usar la capa ella sola. Porque por mucho que estires los dedos, tus manos siempre serán demasiado pequeñas para contener todo el dolor que quieres sanar. Créeme, lo he intentado. Y \"Cariño\", le diré, \"no te quedes con la nariz en alto así, conozco ese truco, solo estás oliendo humo para poder seguir el rastro de vuelta a una casa en llamas para que puedas encontrar al chico que lo perdió todo en el incendio para ver si puedes salvarlo. O si no, encuentra al chico que inició el fuego en primer lugar para ver si puedes cambiarlo\". Pero sé que de todos modos lo hará, así que en lugar de eso siempre tendré un suministro extra de chocolate y barquitos de lluvia cerca, porque no hay desamor que el chocolate no pueda arreglar. Vale, hay algunos desamores que el chocolate no puede arreglar. Pero para eso están las botas de lluvia, porque la lluvia se lo llevará todo si lo permites. Quiero que vea el mundo a través de la parte inferior de un barco con fondo de cristal, que mire a través de una lupa las galaxias que existen en la punta de una mente humana. Porque así es como me enseñó mi madre. Que habrá días como este, \"Habrá días como este, dijo mi mamá\", cuando abras las manos para atrapar algo y termines solo con ampollas y moretones. Cuando salgas de la cabina telefónica e intentes volar y las mismas personas que quieres salvar sean las que estén de pie sobre tu capa. Cuando tus botas se llenen de lluvia y estés hasta las rodillas de decepción y esos son los días en que tienes más razones para decir \"gracias\", porque no hay nada más hermoso que la forma en que el océano se niega a dejar de besar la costa sin importar cuántas veces lo despidan. Pondrás el \"viento\" en ganar algunas veces perder algunas, pondrás la \"estrella\" en empezar una y otra vez, y no importa cuántas minas terrestres estallen en un minuto, asegúrate de que tu mente aterrice en la belleza de este lugar extraño llamado vida. Y sí, en una escala del uno al exceso de confianza, soy bastante ingenuo, pero quiero que sepa que este mundo está hecho de azúcar. Se puede desmoronar tan fácilmente, pero no tengas miedo de sacar la lengua y probarlo. \"Cariño\", le diré, \"recuerda que tu mamá es una preocupona, pero tu papá es un guerrero y tú eres la niña con manos pequeñas y ojos grandes que nunca deja de pedir más\". Recuerda que las cosas buenas vienen de tres en tres, y también las cosas malas, y siempre discúlpate cuando hayas hecho algo mal, pero nunca te disculpes por la forma en que tus ojos se niegan a dejar de brillar. Tu voz es pequeña, pero nunca dejes de cantar y cuando finalmente te den angustia, deslicen odio y guerra bajo tu puerta y te den limosnas en las esquinas del cinismo y la derrota, diles que realmente deberían conocer a tu madre\".",
  "autor": "Sarah Kay",
  " etiquetas": " ['inspirador', 'poema']"
 },
