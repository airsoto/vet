 },
 {

  " etiquetas": " ['gatos', 'humor', 'mujeres']"
 },
 {
  "cita": " “No vemos las cosas como son, las vemos como somos”.",
  "autor": " Anaïs Nin"
 },
 {
  "cita": "Puede que no seas su primero, su último ni su único amor. Ella amó antes de poder volver a amar. Pero si te ama ahora, ¿qué importa? Ella no es perfecta, tú tampoco, y puede que nunca seáis perfectos juntos, pero si puede hacerte reír, hacerte reflexionar y admitir que eres humano y que cometes errores, aférrate a ella y dale lo mejor de ti. Puede que no piense en ti cada segundo del día, pero te dará una parte de ella que sabe que puedes romper: su corazón. Así que no la lastimes, no la cambies, no la analices ni esperes más de lo que puede dar. Sonríe cuando te haga feliz, hazle saber cuando te haga enojar y extráñala cuando no esté.",
  "autor": "Bob Marley",
  " etiquetas": " ['amar']"
 },
 {
  "cita": " “A veces las preguntas son complicadas y las respuestas son simples”.",
  "autor": " Dr. Seuss",
  " etiquetas": " ['vida']"
 },

 {

 },

 {

 },

 },
 {
  "cita": " Si quieres que tus hijos sean inteligentes, léeles cuentos de hadas. Si quieres que sean más inteligentes, léeles más cuentos de hadas.",

  " etiquetas": " ['niños', 'cuentos de hadas']"
 },
 {
  "cita": "\"Estoy enamorado de ti\", dijo en voz baja. \"Augusto\", dije. \"Lo estoy\", dijo. Me miraba fijamente, y pude ver cómo se le arrugaban los ojos. \"Estoy enamorado de ti, y no me importa negarme el simple placer de decir la verdad. Estoy enamorado de ti, y sé que el amor es solo un grito al vacío, y que el olvido es inevitable, y que todos estamos condenados y que llegará un día en que todo nuestro esfuerzo se habrá convertido en polvo, y sé que el sol se tragará la única tierra que tendremos, y estoy enamorado de ti\".",
  "autor": " Juan Verde,",
  " etiquetas": " ['condenado', 'inevitable', 'amor', 'olvido', 'placer', 'simple']"
 },
 {
  "cita": " “La lógica te llevará de la A a la Z",

  " etiquetas": " Albert Einstein",
  "Column4": " ['imaginación']"
 },
 {
  "cita": "\"¿Ya te has enamorado de la persona equivocada?\", dijo Jace. \"Por desgracia, Señora del Refugio, mi único y verdadero amor sigue siendo yo misma\". \"Al menos\", dijo, \"no tienes que preocuparte por el rechazo, Jace Wayland\". \"No necesariamente. A veces me rechazo, solo para mantener el interés\".",

  " etiquetas": " ['ciudad de huesos', 'jace']"
 },
 {
  "cita": " “Siempre que siento la necesidad de hacer ejercicio, me acuesto hasta que desaparece”.",
  "autor": " Pablo Terry",
  " etiquetas": " ['ejercicio', 'humor', 'pereza', 'atribuido erróneamente a Hutchins']"
 },
 {
  "cita": " No soy nada especial, de eso estoy seguro. Soy un hombre común con ideas comunes y he llevado una vida común. No hay monumentos dedicados a mí y mi nombre pronto será olvidado, pero he amado a otra persona con todo mi corazón y alma, y para mí, esto siempre ha sido suficiente.",
  "autor": " Nicolás Sparks,",
  " etiquetas": " ['amar']"
 },
 {
  "cita": "“A veces la gente es bella. No en su apariencia. No en lo que dicen. Solo en lo que son”.",
  "autor": " Markus Zusak,",
  " etiquetas": " ['belleza', 'vida']"
 },
 {
  "cita": " La verdad es que todos te van a hacer daño. Solo tienes que encontrar a aquellos por quienes vale la pena sufrir.",
  "autor": "Bob Marley",
  " etiquetas": " ['amistad']"
 },
 {
  "cita": " El amor no mira con los ojos, sino con la mente; y por eso se pinta a Cupido, el alado, ciego. Ni la mente del amor tiene juicio ni gusto; alas y ausencia de ojos representan una prisa descuidada; y por eso se dice que el amor es un niño, porque a menudo se deja engañar en sus elecciones.",
  "autor": " William Shakespeare,",
  " etiquetas": " ['amar']"
 },
 {
  "cita": " No puedes elegir si te hacen daño en este mundo... pero sí puedes decidir quién te hace daño. Me gustan mis decisiones.",
  "autor": " Juan Verde,",
  " etiquetas": " ['satisfacción', 'autodeterminación']"
 },
 {

  "autor": " Dr. Seuss,",
  " etiquetas": " ['aprendizaje', 'lectura', 'seuss']"
 },
 {
  "cita": " “La gente suele ser tan feliz como decide serlo”.",

  " etiquetas": " ['felicidad']"
 },
 {

  " etiquetas": " ['inspirador']"
 },
 {

  " etiquetas": " ['libros', 'amigos', 'citas de novelistas']"
 },
 {
  "cita": " La historia hasta ahora: En el principio se creó el Universo. Esto ha enfadado mucho a mucha gente y se ha considerado ampliamente como una mala decisión.",
  "autor": " Douglas Adams,",
  " etiquetas": " ['humor', 'ciencia ficción']"
 },
 {

  "autor": "Bob Marley",
  " etiquetas": " ['música']"
 },
 {

  " etiquetas": " ['valentía', 'coraje', 'fracaso', 'inspirador', 'éxito']"

  " etiquetas": " ['libros', 'humor', 'lectura', 'televisión']"
 },
 {

 },
 {

  " etiquetas": " ['atribuido erróneamente a la Madre Teresa', 'parafraseado']"
 },
 {
  "cita": " “Cuando una puerta de la felicidad se cierra, otra se abre; pero a menudo miramos tanto tiempo la puerta cerrada que no vemos la que se ha abierto para nosotros”.",
  "autor": " Helen Keller",
  " etiquetas": " ['inspirador']"
 },
 {
  "cita": " Así es mi vida. Y quiero que sepas que estoy feliz y triste a la vez, y que todavía intento comprender cómo es posible.",
  "autor": " Esteban Chbosky,",
  " etiquetas": " ['Charlie', 'libros favoritos', 'inspirador', 'triste', 'introspectivo', 'alhelí']"
 },
 {
  "cita": " Escucha lo que no debo hacer, niña. Escucha lo que no debo hacer. Escucha lo que no debería hacer, lo imposible, lo que no quiero hacer. Escucha lo que nunca he hecho, y luego escúchame atentamente... Todo puede pasar, niña. Todo puede ser.",
  "autor": " Shel Silverstein",
  " etiquetas": "['todo puede ser', 'esperanza', 'imposible', 'inspirador', 'no debo', 'posibilidades', 'no debería', 'no lo haré']"
 },
 {
  "cita": " No hay nada que no haría por mis verdaderos amigos. No me gusta amar a la gente a medias; no es mi naturaleza.",
  "autor": " Jane Austen,",
  " etiquetas": " ['amistad', 'amor']"
 },
 {
  "cita": " “Si vives cien años, yo quiero vivir cien años menos un día para no tener que vivir nunca sin ti”.",
  "autor": " Joan Powers,",
  " etiquetas": " ['amistad', 'atribuido erróneamente a aa-milne']"
 },
 {
  "cita": " La vida es como andar en bicicleta. Para mantener el equilibrio, hay que seguir adelante.",
  "autor": " Albert Einstein",
  " etiquetas": " ['vida', 'símil']"
 },
 {
  "cita": " Hay gente que nunca se vuelve loca. ¡Qué vidas tan horribles deben llevar!",
  "autor": " Charles Bukowski",
  " etiquetas": " ['humor']"
 },
 {
  "cita": "La gente cree que un alma gemela es la persona perfecta para ti, y eso es lo que todos desean. Pero un alma gemela verdadera es un espejo, la persona que te muestra todo lo que te frena, la persona que te atrae para que puedas cambiar tu vida. Un alma gemela verdadera es probablemente la persona más importante que conocerás, porque derriba tus muros y te despierta de golpe. ¿Pero vivir con un alma gemela para siempre? No. Es demasiado doloroso. Las almas gemelas llegan a tu vida solo para revelarte otra faceta de ti mismo y luego se van. El propósito de un alma gemela es sacudirte, desgarrar un poco tu ego, mostrarte tus obstáculos y adicciones, abrirte el corazón para que entre nueva luz, hacerte sentir tan desesperado y fuera de control que tengas que transformar tu vida, y luego presentarte a tu maestro espiritual...",
  "autor": " Elizabeth Gilbert,",
  " etiquetas": " ['amar']"
 },
 {
  "cita": " “No amas a alguien porque sea perfecto, lo amas a pesar de que no lo sea”.",
  "autor": " Jodi Picoult,",
  " etiquetas": "['imperfecto', 'amor']"
 },
 {
  "cita": " Decir 'Me doy cuenta de que eres un friki' es como decir: 'Oye, me doy cuenta de que prefieres ser inteligente a ser estúpido, que prefieres ser considerado a ser insulso, que crees que hay cosas más importantes que el historial de arrestos de Lindsay Lohan. ¿Por qué?'. De hecho, me parece que la mayoría de los insultos contemporáneos son bastante flojos. Incluso 'flojo' es medio flojo. Decir 'Eres flojo' es como decir 'Cojeas'. Sí, da igual, 50 Cent también, y le ha ido bien.",
  "autor": " Juan Verde",
  " etiquetas": " ['humor', 'combatientes nerd']"
 },
 {
  "cita": " Lo que realmente me impresiona es un libro que, al terminar de leerlo, desearías que el autor fuera un gran amigo tuyo y poder llamarlo cuando quisieras. Aunque eso no pasa a menudo.",
  "autor": " J. D. Salinger,",
  " etiquetas": "['autores', 'libros', 'literatura', 'lectura', 'escritura']"
 },
 {
  "cita": " “Lo que importa no es con qué nace alguien, sino en qué se convierte.”",
  "autor": " J. K. Rowling,",
  " etiquetas": " ['Dumbledore']"
 },
 {
  "cita": " El amor nunca muere de muerte natural. Muere porque no sabemos cómo reponer su fuente. Muere de ceguera, errores y traiciones. Muere de enfermedad y heridas; muere de cansancio, de marchitamiento, de deslustre.",
  "autor": " Anaïs Nin",
  " etiquetas": " ['muerte', 'amor']"
 },
 {
  "cita": " “La diferencia entre el genio y la estupidez es: el genio tiene sus límites”.",
  "autor": " Alejandro Dumas hijo",
  " etiquetas": " ['atribuido erróneamente a Einstein']"
 },
 {
  "cita": " “Si puedes hacer reír a una mujer, puedes hacer que haga cualquier cosa”.",
  "autor": " Marilyn Monroe",
  " etiquetas": " ['chicas', 'amor']"
 },
 {
  "cita": " Todos somos un poco raros. Y la vida es un poco rara. Y cuando encontramos a alguien cuya rareza es compatible con la nuestra, nos unimos a él y caemos en una rareza mutuamente satisfactoria, y lo llamamos amor, amor verdadero.",
  "autor": " Roberto Fulghum,",
  " etiquetas": "['amor', 'rareza']"
 },
 {
  "cita": " “Es lo que lees cuando no tienes por qué hacerlo lo que determina lo que serás cuando no puedas evitarlo”.",
  "autor": " Oscar Wilde",
  " etiquetas": " ['libros', 'lectura']"
 },
 {
  "cita": " “No todos los que vagan están perdidos.”",

  " etiquetas": " ['bilbo', 'viaje', 'perdido', 'búsqueda', 'viaje', 'vagar']"
 },
 {

  " etiquetas": " ['amistad', 'amor']"
 },
 {

  " etiquetas": " ['humor', 'mente abierta', 'pensamiento']"
 },
 {

  "autor": " Eleanor Roosevelt",

 },

 {

  " etiquetas": " ['mujer']"
 },
 {
  "cita": " “Algunos infinitos son más grandes que otros infinitos”.",

 },
 {

  "autor": " Cassandra Clare,",
  " etiquetas": " ['libros']"
 },
 {
  "cita": " “La realidad sigue arruinando mi vida”.",
  "autor": " Bill Watterson,",
  " etiquetas": " ['calvin y hobbes', 'humor', 'vida']"
 },
 {

  " etiquetas": " ['felicidad', 'atribuido erróneamente a John Lennon', 'procrastinación', 'tiempo']"
 },
 {
  "cita": " Las cosas cambian. Y los amigos se van. La vida no se detiene para nadie.",
  "autor": " Esteban Chbosky,",
  " etiquetas": " ['cambio', 'vida']"
 },
 {
  "cita": "—No hay forma de fingir —dijo Jace con absoluta claridad—. Te amo y te amaré hasta la muerte, y si hay vida después de eso, te amaré entonces.",
  "autor": " Cassandra Clare,",
  " etiquetas": " ['mortales', 'romance', 'fantasía adolescente']"
 },
 {
  "cita": " “Ojalá no hubiera sucedido en mi época”, dijo Frodo. “Yo también”, dijo Gandalf, “y también todos los que viven para ver momentos así. Pero no les corresponde a ellos decidirlo. Lo único que tenemos que decidir es qué hacer con el tiempo que se nos ha dado”.",

  " etiquetas": " ['aventura', 'muerte', 'tiempo']"
 },
 {
  "cita": " “Si hay un libro que quieres leer, pero aún no ha sido escrito, entonces debes escribirlo”.",
  "autor": " Toni Morrison",
  " etiquetas": " ['libros', 'escritura']"
 },
 {
  "cita": " “¿Quién eres tú para juzgar la vida que vivo? Sé que no soy perfecto, y no vivo para serlo, pero antes de empezar a señalar con el dedo... ¡asegúrate de tener las manos limpias!”",
  "autor": "Bob Marley",
  " etiquetas": " ['juez', 'vida', 'vivir', 'perfección']"
 },
 {
  "cita": "“El verdadero amante es el hombre que puede emocionarte besándote la frente, sonriéndote a los ojos o simplemente mirando al vacío”.",
  "autor": " Marilyn Monroe",
  " etiquetas": " ['amar']"
 },
 {
  "cita": " Amar es ser vulnerable. Ama cualquier cosa y tu corazón se retorcerá y posiblemente se romperá. Si quieres asegurarte de conservarlo intacto, no debes dárselo a nadie, ni siquiera a un animal. Envuélvelo cuidadosamente con aficiones y pequeños lujos; evita cualquier enredo. Enciérralo en el ataúd de tu egoísmo. Pero en ese ataúd, seguro, oscuro, inmóvil, sin aire, cambiará. No se romperá; se volverá irrompible, impenetrable, irredimible. Amar es ser vulnerable.",
  "autor": " C. S. Lewis,",
  " etiquetas": " ['amar']"
 },
 {
  "cita": " ¡Afirmo que, después de todo, no hay placer como la lectura! ¡Cuánto más rápido se cansa uno de cualquier cosa que de un libro! —Cuando tenga casa propia, seré miserable si no tengo una excelente biblioteca.",
  "autor": " Jane Austen,",
  " etiquetas": " ['libros', 'biblioteca', 'lectura']"

 {
  "cita": " “Los libros que el mundo llama inmorales son libros que muestran al mundo su propia vergüenza”.",

  " etiquetas": " ['libros', 'moralidad', 'lectura']"
 },
 {
  "cita": "Deberías salir con una chica que lea. Sal con una chica que lea. Sal con una chica que gaste su dinero en libros en lugar de ropa, que tenga problemas de espacio en el armario porque tiene demasiados libros. Sal con una chica que tenga una lista de libros que quiere leer, que tenga una tarjeta de biblioteca desde los doce años. Encuentra a una chica que lea. Sabrás que lee porque siempre tendrá un libro sin leer en su bolso. Es la que mira con cariño los estantes de la librería, la que grita en silencio cuando encuentra el libro que quiere. ¿Ves a esa chica rara oliendo las páginas de un libro viejo en una librería de segunda mano? Esa es la lectora. Nunca pueden resistirse a oler las páginas, especialmente cuando están amarillas y desgastadas. Es la chica que lee mientras espera en esa cafetería calle abajo. Si le echas un vistazo a su taza, la crema vegetal flota encima porque ya está absorta. Perdida en un mundo creado por el autor. Siéntate. Ella Podrías fulminarte con la mirada, ya que a la mayoría de las chicas que leen no les gusta que las interrumpan. Pregúntale si le gusta el libro. Invítala a otro café. Hazle saber lo que realmente piensas de Murakami. Averigua si terminó el primer capítulo de La Comunidad del Mundo. Entiende que si dice que entendió el Ulises de James Joyce, solo lo dice para parecer inteligente. Pregúntale si ama a Alicia o si le gustaría ser Alicia. Es fácil salir con una chica que lee. Regálale libros para su cumpleaños, para Navidad, para aniversarios. Regálale el don de las palabras, en poesía y en canciones. Regálale a Neruda, Pound, Sexton, Cummings. Hazle saber que entiendes que las palabras son amor. Entiende que ella conoce la diferencia entre los libros y la realidad, pero por Dios, intentará que su vida se parezca un poco a su libro favorito. Nunca será tu culpa si lo hace. Tiene que intentarlo de alguna manera. Miéntele. Si entiende la sintaxis, entenderá tu necesidad de mentir. Detrás Las palabras son otras cosas: motivación, valor, matices, diálogo. No será el fin del mundo. Frásale. Porque una chica que lee sabe que el fracaso siempre lleva al clímax. Porque las chicas que leen entienden que todo tiene un final, pero que siempre se puede escribir una secuela. Que puedes empezar una y otra vez y seguir siendo el héroe. Que la vida está destinada a tener uno o dos villanos. ¿Por qué tener miedo de todo lo que no eres? Las chicas que leen entienden que las personas, como los personajes, se desarrollan. Excepto en la saga Crepúsculo. Si encuentras a una chica que lee, mantenla cerca. Cuando la encuentres despierta a las 2 de la madrugada agarrando un libro contra el pecho y llorando, prepárale una taza de té y abrázala. Puede que la pierdas un par de horas, pero siempre volverá a ti. Hablará como si los personajes del libro fueran reales, porque durante un tiempo, siempre lo son. Le pedirás matrimonio en un globo aerostático. O durante un concierto de rock. O de forma muy informal la próxima vez que esté enferma. Por Skype. Sonreirás tanto que... Me pregunto por qué su corazón no ha estallado y desangrado aún. Escribirán la historia de sus vidas, tendrán hijos con nombres raros y gustos aún más extraños. Ella les presentará a sus hijos al Gato con Sombrero y a Aslan, quizás el mismo día. Caminarán juntos los inviernos de su vejez y ella recitará a Keats en voz baja mientras ustedes se sacuden la nieve de las botas. Sal con una chica que lea porque te lo mereces. Mereces una chica que te dé la vida más colorida imaginable. Si solo puedes darle monotonía, horas monótonas y propuestas a medias, entonces estarás mejor solo. Si quieres el mundo y los mundos más allá, sal con una chica que lea. O mejor aún, sal con una chica que escriba.",
  "autor": "Rosemarie Urquico"
 },
 {

  "autor": " Mark Twain",

 {
  "cita": "Nuestro miedo más profundo no es ser incompetentes. Nuestro miedo más profundo es ser inmensamente poderosos. Es nuestra luz, no nuestra oscuridad, lo que más nos aterra. Nos preguntamos: \"¿Quién soy yo para ser brillante, hermoso, talentoso, fabuloso?\". En realidad, ¿quién eres tú para no serlo? Eres un hijo de Dios. Que te hagas el pequeño no le sirve al mundo. No hay nada de iluminado en encogerte para que los demás no se sientan inseguros a tu alrededor. Todos estamos destinados a brillar, como los niños. Nacimos para manifestar la gloria de Dios que reside en nosotros. No está solo en algunos; está en todos. Y al dejar que nuestra propia luz brille, inconscientemente damos permiso a los demás para que hagan lo mismo. Al liberarnos de nuestro propio miedo, nuestra presencia libera automáticamente a los demás.",

 {
  "cita": "Hay infinitos números entre el 0 y el 1. Hay 0,1, 0,12, 0,112 y una colección infinita de otros. Por supuesto, hay un conjunto infinito mayor de números entre el 0 y el 2, o entre el 0 y un millón. Algunos infinitos son mayores que otros. Un escritor que nos gustaba nos lo enseñó. Hay días, muchos, en que me molesta el tamaño de mi conjunto ilimitado. Quiero más números de los que probablemente pueda conseguir, y Dios mío, quiero más números para Augustus Waters de los que él consiguió. Pero, Gus, mi amor, no te puedo expresar lo agradecida que estoy por nuestro pequeño infinito. No lo cambiaría por nada del mundo. Me diste una eternidad dentro de los días contados, y te lo agradezco.",

  "cita": "Él no es perfecto. Tú tampoco, y nunca lo serán. Pero si te hace reír al menos una vez, te hace pensar dos veces, y si admite ser humano y cometer errores, aférrate a él y dale lo mejor de ti. No te recitará poesía, no pensará en ti a cada momento, pero te dará una parte de él que sabe que podrías romper. No lo lastimes, no lo cambies, y no esperes más de lo que puede dar. No analices. Sonríe cuando te haga feliz, grita cuando te enfade y extráñalo cuando no esté. Ámalo con todas tus fuerzas cuando lo quieras. Porque los chicos perfectos no existen, pero siempre hay uno perfecto para ti.",

  "cita": " “[...] las únicas personas para mí son las locas, las que están locas por vivir, locas por hablar, locas por salvarse, deseosas de todo al mismo tiempo, las que nunca bostezan ni dicen nada común, sino que arden, arden, arden como fabulosas velas romanas amarillas explotando como arañas entre las estrellas y en el medio ves la luz central azul estallar y todo el mundo dice \"¡Awww!\"",
  "autor": " Jack Kerouac,",
  " etiquetas": " ['librepensador', 'inspirador', 'loco']"
 },
 {
  "cita": "“Haz lo que sientes en tu corazón que es correcto, porque de todas formas serás criticado”.",
  "autor": " Eleanor Roosevelt",
  " etiquetas": " ['inspirador']"
 },
 {
  "cita": " “Entonces, te amo porque el universo entero conspiró para ayudarme a encontrarte”.",
  "autor": " Paulo Coelho,",
  " etiquetas": " ['amar']"
 },
 {
  "cita": " Amar es necesitar a alguien. Amar es soportar las malas cualidades de alguien porque, de alguna manera, te complementa.",
  "autor": " Sarah Dessen,",
  " etiquetas": " ['amar']"
 },
 {
  "cita": " El amor es paciente, es bondadoso. No tiene envidia, no se jacta, no es orgulloso. No es grosero, no busca su propio beneficio, no se enoja fácilmente, no guarda rencor. El amor no se deleita en la maldad, sino que se regocija con la verdad. Siempre protege, siempre confía, siempre espera, siempre persevera.",
  "autor": " Anónimo,",
  " etiquetas": " ['biblia', 'amor']"
 },
 {
  "cita": " “No puedo darte una fórmula infalible para el éxito, pero sí puedo darte una fórmula para el fracaso: intentar complacer a todos todo el tiempo”.",
  "autor": " Herbert Bayard Swope",
  " etiquetas": " ['fracaso', 'inspirador', 'atribuido erróneamente a Bill Cosby', 'éxito']"
 },
 {
  "cita": "“A veces puedo oír mis huesos tensarse bajo el peso de todas las vidas que no estoy viviendo”.",
  "autor": " Jonathan Safran Foer,",
  " etiquetas": " ['vida']"
 },
 {
  "cita": " “Esta vida es dura, pero es más difícil si eres estúpido”.",
  "autor": " Jorge V. Higgins,",
  " etiquetas": " ['humor', 'vida', 'atribuido erróneamente a John Wayne']"
 },
 {
  "cita": " “Me niego a responder a esa pregunta porque no sé la respuesta”",
  "autor": " Douglas Adams",
  " etiquetas": " ['humor', 'atribuido erróneamente a Douglas Adams', 'ingenio']"
 },
 {
  "cita": " Nunca duden de que un pequeño grupo de ciudadanos reflexivos y comprometidos puede cambiar el mundo. De hecho, es lo único que lo ha logrado.",
  "autor": " Margaret Mead",
  " etiquetas": " ['activismo', 'cambio', 'inspiración', 'vida', 'filosofía', 'mundo']"
 },
 {
  "cita": " “La muerte acaba con una vida, no con una relación”.",
  "autor": " Mitch Albom,",
  " etiquetas": " ['muerte', 'vida']"
 },
 {
  "cita": "Que tu próximo año esté lleno de magia, sueños y buenas locuras. Espero que leas buenos libros y beses a alguien que te considere maravillosa, y no olvides crear algo de arte: escribe, dibuja, construye, canta o vive como solo tú puedes. Y espero que, en algún momento del próximo año, te sorprendas a ti misma.",
  "autor": " Neil Gaiman"
 },
 {
  "cita": " “¿Qué sentido tiene estar vivo si al menos no intentas hacer algo extraordinario?”",
  "autor": " Juan Verde,"
 },
 {
  "cita": " “Nunca memorices algo que puedas consultar.”",
  "autor": " Albert Einstein",
  " etiquetas": " ['humor', 'ciencia']"
 },
 {
  "cita": "“Llevo tu corazón conmigo (lo llevo en mi corazón) Nunca estoy sin él (adondequiera que vaya, tú vas, querida; y todo lo que solo yo haga es obra tuya, mi amor) No temo al destino (porque tú eres mi destino, mi dulce) No quiero ningún mundo (porque hermosa eres mi mundo, mi verdad) y eres tú lo que una luna siempre ha significado y lo que un sol siempre cantará eres tú aquí está el secreto más profundo que nadie conoce (aquí está la raíz de la raíz y el brote del brote y el cielo del cielo de un árbol llamado vida; que crece más alto de lo que el alma puede esperar o la mente puede ocultar) y esta es la maravilla que mantiene separadas a las estrellas Llevo tu corazón (lo llevo en mi corazón)”",
  "autor": " EE Cummings",
  " etiquetas": " ['amor', 'poesía']"
 },
 {
  "cita": " A veces despiertas. A veces la caída te mata. Y a veces, al caer, vuelas.",
  "autor": " Neil Gaiman,",
  " etiquetas": " ['inspiración']"
 },
 {
  "cita": " “Tal vez nuestras citas favoritas digan más sobre nosotros que sobre las historias y las personas que citamos”.",
  "autor": " Juan Verde",
  " etiquetas": " ['vlog']"
 },
 {
  "cita": "“Aférrate a tus sueños,porque si los sueños mueren,la vida es un pájaro con las alas rotas,que no puede volar”.",
  "autor": " Langston Hughes",
  " etiquetas": " ['sueños', 'esperanza', 'inspiración', 'conocimiento', 'sabiduría']"
 },
 {
  "cita": " Cuenta tu edad por tus amigos, no por tus años. Cuenta tu vida por tus sonrisas, no por tus lágrimas.",
  "autor": " John Lennon",
  " etiquetas": " ['felicidad', 'atemporalidad', 'sabiduría']"
 },
 {
  "cita": " La felicidad no es algo prefabricado. Surge de tus propias acciones.",
  "autor": " Dalai Lama XIV",
  " etiquetas": " ['felicidad', 'inspirador']"
 },
 {
  "cita": " “Hablas cuando dejas de estar en paz con tus pensamientos”.",
  "autor": " Khalil Gibran,",
  " etiquetas": " ['filosofía', 'poesía']"
 },
 {

  " etiquetas": " ['ánimo', 'gandalf']"
 },
 {

  "autor": " Juan Verde,",
  " etiquetas": " ['ciudades de papel']"
 },
 {
  "cita": " “Todo lo que vemos o parecemos no es más que un sueño dentro de un sueño”.",
  "autor": " Edgar Allan Poe",
  " etiquetas": "['soñar', 'sueños', 'percepción']"
 },
 {
  "cita": " “La indiferencia y el descuido a menudo causan mucho más daño que la simple aversión”.",
  "autor": " J. K. Rowling,",
  " etiquetas": " ['humanidad', 'amabilidad', 'relaciones']"
 },
 {
  "cita": " “El cristiano no piensa que Dios nos amará porque seamos buenos, sino que Dios nos hará buenos porque nos ama”.",
  "autor": " C. S. Lewis",
  " etiquetas": " ['cristianismo', 'dios', 'religión']"
 },
 {
  "cita": " “El ingenio sin medida es el mayor tesoro del hombre”.",
  "autor": " J. K. Rowling,",
  " etiquetas": " ['ingenio']"
 },
 {
  "cita": " Me gusta la noche. Sin la oscuridad, nunca veríamos las estrellas.",
  "autor": " Stephenie Meyer,",
  " etiquetas": " ['bella-swan', 'sueños', 'edward', 'esperanza', 'noche', 'estrellas']"
 },
 {
  "cita": " “Somos tan fuertes como estamos unidos, tan débiles como estamos divididos”.",
  "autor": " J. K. Rowling,",
  " etiquetas": " ['dumbledore', 'fuerza', 'unidad']"
 },
 {
  "cita": " Los débiles jamás pueden perdonar. El perdón es el atributo de los fuertes.",
  "autor": " Mahatma Gandhi,",
  " etiquetas": " ['perdón', 'fuerza', 'debilidad']"
 },
 {
  "cita": "No leas, como hacen los niños, para divertirte, ni como los ambiciosos, para instruirte. No, lee para vivir.",
  "autor": " Gustave Flaubert",
  " etiquetas": " ['libros', 'inspiración', 'vida', 'lectura']"
 },
 {
  "cita": " “Lo único peor que un chico que te odia: un chico que te ama.”",
  "autor": " Markus Zusak,",
  " etiquetas": " ['chicos', 'odio', 'amor']"
 },
 {
  "cita": " “La paz comienza con una sonrisa..”",
  "autor": " Madre Teresa",
  " etiquetas": " ['inspirador', 'paz', 'sonrisa', 'sonriente']"
 },
 {
  "cita": " “Si fueras la mitad de gracioso de lo que crees, serías el doble de gracioso de lo que realmente eres”.",
  "autor": " HN Turteltaub,",
  " etiquetas": " ['mal atribuido-cassandra-clare', 'mal atribuido-jace']"
 },
 {
  "cita": " “En lo más profundo del invierno, finalmente aprendí que dentro de mí yacía un verano invencible”.",
  "autor": "Albert Camus",
  " etiquetas": " ['estaciones', 'fuerza', 'prueba', 'triunfo']"
 },
 {
  "cita": "Así que, supongo que somos quienes somos por muchas razones. Y quizá nunca conozcamos la mayoría. Pero aunque no tengamos el poder de elegir de dónde venimos, sí podemos elegir adónde vamos. Podemos hacer cosas. Y podemos intentar sentirnos bien con ellas.",
  "autor": " Esteban Chbosky,",
  " etiquetas": " ['las ventajas de ser tímido']"
 },
 {
  "cita": " “Para quienes miran las estrellas y desean, Rhys.” Rhys chocó su copa contra la mía. “Para las estrellas que escuchan y los sueños que se cumplen.”",
  "autor": " Sarah J. Maas,",
  " etiquetas": " ['una corte de niebla y furia', 'acomaf', 'feyre', 'rhysand']"
 },
 {
  "cita": " Imaginar el futuro es una especie de nostalgia. (...) Te pasas la vida atrapado en el laberinto, pensando en cómo escaparás de él algún día, y en lo maravilloso que será, e imaginar ese futuro te impulsa a seguir adelante, pero nunca lo haces. Simplemente usas el futuro para escapar del presente.",
  "autor": " Juan Verde,",
  " etiquetas": " ['inspirador']"
 },
 {
  "cita": "Eres mi mejor amigo y mi amante, y no sé qué lado de ti disfruto más. Valoro cada lado, como he valorado nuestra vida juntos.",
  "autor": " Nicolás Sparks,",
  " etiquetas": " ['amistad', 'amor']"
 },
 {
  "cita": " “Eres y siempre has sido mi sueño”.",
  "autor": " Nicolás Sparks,",
  " etiquetas": " ['amar']"
 },
 {
  "cita": " Te encontrarás con personas en tu vida que dirán las palabras adecuadas en el momento oportuno. Pero al final, siempre son sus acciones las que deben juzgarlos. Son las acciones, no las palabras, lo que importa.",
  "autor": " Nicolás Sparks,",
  " etiquetas": " ['amigos', 'juicio']"
 },
 {
  "cita": " “¿Es cierto que le gritaste a la profesora Umbridge?” “Sí.” “¿La llamaste mentirosa?” “Sí.” “¿Le dijiste que El-Que-No-Debe-Ser-Nombrado-Había-vuelto?” “Sí.” “Toma una galleta, Potter.”",
  "autor": " J. K. Rowling,",
  " etiquetas": " ['galleta', 'humor', 'rebelión']"
 },
 {
  "cita": " —Venimos a ver a Jace. ¿Está bien? —No lo sé —dijo Magnus—. ¿Normalmente se queda tirado en el suelo así, sin moverse?",
  "autor": " Cassandra Clare,",
  " etiquetas": "['clary-fray', 'jace', 'magnus-bane']"
 },
 {
  "cita": " Sobre todo, no te mientas a ti mismo. Quien se miente y escucha su propia mentira llega a un punto en que no puede distinguir la verdad dentro de sí mismo ni a su alrededor, y así pierde todo respeto por sí mismo y por los demás. Y al no tener respeto, deja de amar.",
  "autor": " Fiódor Dostoievski,",
  " etiquetas": " ['mentiras', 'amor', 'respeto', 'autoengaño', 'verdad']"
 },
 {
  "cita": " El Sr. Lunático saluda al Profesor Snape y le ruega que mantenga su nariz anormalmente grande fuera de los asuntos de los demás. El Sr. Cornamenta coincide con el Sr. Lunático y añade que el Profesor Snape es un tipo feo. El Sr. Canuto deja constancia de su asombro por el hecho de que un idiota como él haya llegado a ser profesor. El Sr. Colagusano le desea un buen día al Profesor Snape y le aconseja que se lave el pelo, el muy canalla.",
  "autor": " J. K. Rowling,",
  " etiquetas": "['harry potter', 'humor', 'james potter', 'remus lupin', 'sirius black', 'snape', 'cola de gusano']"
 },
 {
  "cita": " “Siempre prefiero ser feliz que digno.”",
  "autor": " Charlotte Brontë,",
  " etiquetas": " ['amor', 'orgullo', 'mujeres']"
 },
 {
  "cita": " “La amistad es innecesaria, como la filosofía, como el arte... No tiene valor de supervivencia; más bien, es una de esas cosas que le dan valor a la supervivencia.”",
  "autor": " C. S. Lewis,",
  " etiquetas": " ['amistad', 'inspirador']"
 },
 {
  "cita": " “Espero que sea una tonta. Eso es lo mejor que una chica puede ser en este mundo, una hermosa y pequeña tonta”.",
  "autor": "F. Scott Fitzgerald,",
  " etiquetas": " ['inspiradoras', 'mujeres']"
 },
 {
  "cita": " “En una buena librería sientes, de una manera misteriosa, que estás absorbiendo la sabiduría contenida en todos los libros a través de tu piel, sin siquiera abrirlos”.",
  "autor": " Mark Twain",
  " etiquetas": " ['sala de libros', 'libros', 'bibliotecas', 'sabiduría']"
 },
 {
  "cita": " Siempre me querrás. Represento para ti todos los pecados que nunca te atreviste a cometer.",
  "autor": " Oscar Wilde,",
  " etiquetas": "['pecado']"
 },
 {
  "cita": " “Los hechos no dejan de existir porque se los ignore”.",
  "autor": " Aldous Huxley,",
  " etiquetas": " ['hecho', 'ignorancia', 'verdad']"
 },
 {
  "cita": " Para unos labios atractivos, di palabras de bondad. Para unos ojos encantadores, busca lo bueno en las personas. Para una figura esbelta, comparte tu comida con los hambrientos. Para un cabello hermoso, deja que un niño pase sus dedos por él una vez al día. Para el aplomo, camina con la certeza de que nunca caminarás solo... Te dejamos una tradición con futuro. El tierno y amoroso cuidado de los seres humanos nunca quedará obsoleto. Las personas, incluso más que las cosas, tienen que ser restauradas, renovadas, revividas, reclamadas y redimidas, redimidas y redimidas. Nunca deseches a nadie. Recuerda, si alguna vez necesitas una mano amiga, la encontrarás al final de tu brazo. A medida que envejeces, descubrirás que tienes dos manos: una para ayudarte a ti mismo, la otra para ayudar a los demás. Tus \"buenos viejos tiempos\" aún están por delante, que tengas muchos de ellos.",
  "autor": " Sam Levenson,",
  " etiquetas": "['belleza', 'caridad', 'inspirador', 'amabilidad', 'atribuido erróneamente a Audrey Hepburn']"
 },
 {
  "cita": " “No pienses ni juzgues, sólo escucha”.",
  "autor": " Sarah Dessen,",
  " etiquetas": " ['citas inspiradoras']"
 },
 {
  "cita": " “Puede correr más rápido que Severus Snape enfrentado al champú”.",
  "autor": " J. K. Rowling,",
  " etiquetas": " ['humor', 'champú']"
 },
 {
  "cita": " “Y aquellos que fueron vistos bailando fueron considerados locos por aquellos que no podían oír la música”.",
  "autor": " Friedrich Nietzsche",
  " etiquetas": " ['baile', 'música']"
 },
 {
  "cita": "Prométete ser tan fuerte que nada pueda perturbar tu paz mental. Hablar de salud, felicidad y prosperidad a cada persona que conozcas. Hacer que todos tus amigos sientan que hay algo en ellos. Ver el lado positivo de todo y hacer realidad tu optimismo. Pensar solo lo mejor, trabajar solo por lo mejor y esperar solo lo mejor. Ser tan entusiasta con el éxito de los demás como con el tuyo propio. Olvidar los errores del pasado y perseguir los mayores logros del futuro. Lucir un semblante alegre en todo momento y sonreír a todo ser viviente que conozcas. Dedicar tanto tiempo a tu propio desarrollo que no tengas tiempo para criticar a los demás. Ser demasiado grande para la preocupación, demasiado noble para la ira, demasiado fuerte para el miedo y demasiado feliz para permitir la presencia de los problemas. Pensar bien de ti mismo y proclamarlo al mundo, no con palabras, sino con grandes acciones. Vivir con la fe de que todo el mundo está de tu lado mientras seas fiel a lo mejor que hay en ti.",
  "autor": "Christian D. Larson,",
  " etiquetas": " ['felicidad', 'inspiración', 'amor', 'optimismo', 'fuerza']"
 },
 {
  "cita": " “No puedes encontrar la paz evitando la vida”.",
  "autor": " Michael Cunningham,",
  " etiquetas": " ['vida', 'paz']"
 },
 {
  "cita": " El dolor no te cambia, Hazel. Te revela.",
  "autor": " Juan Verde,",
  " etiquetas": " ['cambio', 'dolor', 'pérdida', 'revelación']"
 },
 {
  "cita": " “Si más de nosotros valoráramos la comida, la alegría y la música más que el oro acumulado, sería un mundo más feliz”.",
  "autor": " J. R. R. Tolkien",
  " etiquetas": " ['comida', 'felicidad']"
 },
 {
  "cita": " ¡Felices Juegos del Hambre! Y que la suerte siempre esté de tu lado.",
  "autor": " Suzanne Collins,",
  " etiquetas": " ['los-juegos-del-hambre']"
 },
 {
  "cita": " Quien controla el pasado controla el futuro. Quien controla el presente controla el pasado.",
  "autor": " George Orwell,",
  " etiquetas": " ['inspirador']"
 },
 {
  "cita": "—Y ahora te miro —dijo—, y me preguntas si todavía te deseo, como si pudiera dejar de amarte. Como si quisiera renunciar a lo que me hace más fuerte que cualquier otra cosa. Nunca me atreví a entregarme a nadie —pedacitos de mí a los Lightwood, a Isabelle y a Alec, pero me llevó años hacerlo—, pero, Clary, desde la primera vez que te vi, te pertenezco por completo. Todavía te pertenezco. Si me deseas.",
  "autor": " Cassandra Clare,",
  " etiquetas": " ['cassandra-clare', 'ciudad-de-cristal', 'clary', 'jace', 'amor', 'mortales-instruments']"
 },
 {
  "cita": " “Un buen amigo siempre te apuñalará por el frente”.",
  "autor": " Oscar Wilde",
  " etiquetas": " ['traición de amigos']"
 },
 {
  "cita": " Cuando estés en la cárcel, un buen amigo intentará sacarte de apuros. Un mejor amigo estará en la celda de al lado diciéndote: \"¡Rayos, qué divertido fue!\".",
  "autor": " Groucho Marx",
  " etiquetas": " ['amigos', 'humor', 'cárcel']"
 },
 {
  "cita": " “El hombre es la única criatura que se niega a ser lo que es”.",
  "autor": "Albert Camus",
  " etiquetas": "['naturaleza humana', 'hombre', 'humanidad', 'filosofía']"
 },
 {
  "cita": " “Aquellos que creen en la telequinética, levanten la mano”.",
  "autor": " Kurt Vonnegut",
  " etiquetas": " ['humor', 'telequinética']"
 },
 {
  "cita": " Algunos humanos harían lo que fuera por ver si era posible. Si se colocara un interruptor grande en alguna cueva, con un letrero que dijera \"Interruptor del Fin del Mundo. NO TOCAR\", la pintura ni siquiera tendría tiempo de secarse.",
  "autor": " Terry Pratchett,",
  " etiquetas": " ['humor']"
 },
 {
  "cita": " “Que vivas cada día de tu vida.”",
  "autor": " Jonathan Swift",
  " etiquetas": " ['inspirador', 'vida', 'filosofía', 'sabiduría']"
 },
 {
  "cita": " “Seas lo que seas, sé bueno”.",
  "autor": "Abraham Lincoln",
  " etiquetas": " ['inspirador']"
 },
 {
  "cita": " Y una vez que pase la tormenta, no recordarás cómo la superaste, cómo lograste sobrevivir. Ni siquiera estarás seguro de si la tormenta realmente terminó. Pero una cosa es segura: cuando salgas de ella, no serás la misma persona que entró. De eso se trata esta tormenta.",
  "autor": " Haruki Murakami,",
  " etiquetas": "['adversidad', 'inspirador', 'lecciones de vida', 'problemas', 'pruebas']"
 },
 {
  "cita": " Por ejemplo, en el planeta Tierra, el hombre siempre había asumido que era más inteligente que los delfines porque había logrado muchísimo —la rueda, Nueva York, guerras, etc.— mientras que los delfines solo se dedicaban a entretenerse en el agua. Pero, a la inversa, los delfines siempre habían creído ser mucho más inteligentes que el hombre, precisamente por las mismas razones.",
  "autor": " Douglas Adams,",
  " etiquetas": " ['humor']"
 },
 {
  "cita": " Quería un final perfecto. Ahora he aprendido, a las malas, que algunos poemas no riman y algunas historias no tienen un principio, un desarrollo ni un final claros. La vida se trata de no saber, de tener que cambiar, de aprovechar el momento y sacarle el máximo provecho, sin saber qué va a pasar después. Deliciosa Ambigüedad.",
  "autor": " Gilda Radner",
  " etiquetas": " ['ambigüedad', 'vida', 'historias', 'incertidumbre', 'imprevisibilidad']"
 },
 {
  "cita": "“Las bibliotecas estaban llenas de ideas, quizás las armas más peligrosas y poderosas de todas”.",
  "autor": " Sarah J. Maas,",
  " etiquetas": " ['ideas', 'bibliotecas', 'sarah-j-maas', 'trono de cristal']"
 },
 {
  "cita": " “Sé amable, porque cada persona que conoces está librando una batalla más difícil”.",
  "autor": " Platón",
  " etiquetas": " ['compasión', 'bondad']"
 },
 {
  "cita": " —No toques ninguna de mis armas sin mi permiso. —Bueno, ahí se acabó mi plan de venderlas todas en eBay —murmuró Clary—. ¿Venderlas en qué? —Clary le sonrió con indiferencia—. Un lugar mítico de gran poder mágico.",
  "autor": " Cassandra Clare,",
  " etiquetas": " ['clary-fray', 'ebay', 'jace-wayland', 'mito']"
 },
 {
  "cita": " Cuando cortejas a una chica guapa, una hora parece un segundo. Cuando te sientas sobre brasas al rojo vivo, un segundo parece una hora. Eso es relatividad.",
  "autor": " Albert Einstein",
  " etiquetas": " ['humor']"
 },
 {
  "cita": " Hay una delgada línea entre la genialidad y la locura. He borrado esa línea.",
  "autor": " Oscar Levant",
  " etiquetas": " ['genio', 'humor', 'locura']"
 },
 {
  "cita": "“Las mujeres están hechas para ser amadas, no para ser comprendidas”.",
  "autor": " Oscar Wilde,",
  " etiquetas": " ['esfinge sin secreto']"
 },
 {
  "cita": " “Dormir es bueno”, dijo, “y leer es mejor”.",
  "autor": " George R. R. Martin",
  " etiquetas": " ['libros', 'lectura']"
 },
 {
  "cita": " Prométeme que siempre lo recordarás: eres más valiente de lo que crees, más fuerte de lo que pareces y más inteligente de lo que piensas.",

 {

 },
 {
  "cita": " Me di cuenta de que no se puede forzar el amor. Está ahí o no está. Si no está, hay que admitirlo. Si está ahí, hay que hacer lo que sea necesario para proteger a quienes se aman.",
  "autor": " Richelle Mead,",
  " etiquetas": " ['ficción', 'romance']"
 },
 {
  "cita": "Vi mi vida ramificándose ante mí como la higuera verde del cuento. Desde la punta de cada rama, como un higo morado y grueso, un futuro maravilloso me llamaba y guiñaba el ojo. Un higo era un esposo, un hogar feliz e hijos, y otro era un poeta famoso, y otro era un profesor brillante, y otro era Ee Gee, el asombroso editor, y otro era Europa, África y Sudamérica, y otro era Constantino, Sócrates, Atila y un grupo de otros amantes con nombres raros y profesiones poco convencionales, y otro era una campeona olímpica de remo, y más allá de estos higos había muchos más que no podía distinguir. Me vi sentada en la horquilla de esta higuera, muriéndome de hambre, solo porque no podía decidirme por cuál de los higos elegiría. Los quería a todos y cada uno de ellos, pero elegir uno significaba perder a todos los demás, y, mientras estaba sentada allí, sin poder decidirme, los higos comenzaron a arrugarse y se volvieron negros y, uno a uno, cayeron al suelo a mis pies”.",
  "autor": " Sylvia Plath,",
  " etiquetas": "['opciones de vida-higueras']"
 },
 {
  "cita": " Si alguna vez llega un mañana en que no estemos juntos... hay algo que siempre debes recordar. Eres más valiente de lo que crees, más fuerte de lo que pareces y más inteligente de lo que crees. Pero lo más importante es que, aunque estemos separados... siempre estaré contigo.",
  "autor": " Carter Crocker",
  " etiquetas": " ['confianza']"
 },

 {
  "cita": "\"Busquemos el chiringuito de la presa\", dijo Zoe. \"Deberíamos comer mientras podamos\". Grover esbozó una sonrisa. \"¿El chiringuito de la presa?\" Zoe parpadeó. \"Sí. ¿Qué es gracioso?\" \"Nada\", dijo Grover, intentando mantener la cara seria. \"Me vendrían bien unas papas fritas\". Incluso Thalia sonrió. \"Y necesito usar el baño de la presa\"... Empecé a reírme a carcajadas, y Thalia y Grover se unieron, mientras Zoe me miraba. \"No entiendo\". \"Quiero usar la fuente de la presa\", dijo Grover. \"Y...\" Thalia intentó recuperar el aliento. \"Quiero comprar una camiseta de la presa\".",

 },
 {
  "cita": " “Solo después de haberlo perdido todo somos libres de hacer cualquier cosa”.",
  "autor": " Chuck Palahniuk,",
  " etiquetas": " ['pérdida']"
 },
 {
  "cita": " Hay dos fuerzas motivadoras básicas: el miedo y el amor. Cuando tenemos miedo, nos apartamos de la vida. Cuando estamos enamorados, nos abrimos a todo lo que la vida nos ofrece con pasión, entusiasmo y aceptación. Necesitamos aprender a amarnos primero, en toda nuestra gloria y en nuestras imperfecciones. Si no podemos amarnos a nosotros mismos, no podemos abrirnos plenamente a nuestra capacidad de amar a los demás ni a nuestro potencial creativo. La evolución y todas las esperanzas de un mundo mejor residen en la valentía y la visión abierta de quienes abrazan la vida.",
  "autor": " John Lennon",
  " etiquetas": "['beatles', 'miedo', 'vida', 'amor']"
 },
 {
  "cita": " “Tu tarea no es buscar el amor, sino simplemente buscar y encontrar todas las barreras dentro de ti que has construido contra él”.",
  "autor": " Rumi",
  " etiquetas": " ['amor inspirador']"
 },
 {
  "cita": "Puedo creer en cosas ciertas y falsas, y en cosas que nadie sabe si son ciertas o no. Puedo creer en Papá Noel, en el Conejo de Pascua, en los Beatles, en Marilyn Monroe, en Elvis Presley y en Mister Ed. Escucha, creo que las personas son perfeccionables, que el conocimiento es infinito, que el mundo está gobernado por cárteles bancarios secretos y que extraterrestres lo visitan con regularidad, los buenos que parecen lémures arrugados y los malos que mutilan ganado y quieren nuestra agua y a nuestras mujeres. Creo que el futuro es una mierda, y creo que el futuro es genial, y creo que un día la Mujer Búfalo Blanco volverá y nos pateará el trasero a todos. Creo que todos los hombres son solo niños grandes con graves problemas de comunicación y que el declive del buen sexo en Estados Unidos coincide con el declive de los autocines en todos los estados. Creo que todos los políticos son unos delincuentes sin principios y sigo creyendo que son mejores que la alternativa. Creo que California se hundirá en el mar cuando la gran... Uno viene, mientras Florida se disolverá en la locura, los caimanes y los desechos tóxicos. Creo que el jabón antibacteriano está destruyendo nuestra resistencia a la suciedad y las enfermedades, de modo que un día todos seremos aniquilados por un resfriado común como los marcianos en La Guerra de los Mundos. Creo que los grandes poetas del siglo pasado fueron Edith Sitwell y Don Marquis, que el jade es esperma de dragón seco, y que hace miles de años, en una vida anterior, fui un chamán siberiano manco. Creo que el destino de la humanidad está en las estrellas. Creo que los dulces sabían mejor cuando era niño, que es aerodinámicamente imposible que un abejorro vuele, que la luz es una onda y una partícula, que hay un gato en una caja en algún lugar que está vivo y muerto al mismo tiempo (aunque si nunca abren la caja para alimentarlo, al final solo serán dos tipos diferentes de muertos), y que hay estrellas en el universo miles de millones de años más antiguas que el universo mismo. Creo en un dios personal que se preocupa por mí y se preocupa y supervisa todo lo que hago. Creo en un dios impersonal que puso en marcha el universo y se fue a pasar el rato con sus amigas, sin siquiera saber que estoy viva. Creo en un universo vacío e impío, lleno de caos causal, ruido de fondo y pura suerte ciega. Creo que quien diga que el sexo está sobrevalorado simplemente no lo ha practicado como es debido. Creo que quien diga saber lo que ocurre también mentirá en los detalles. Creo en la honestidad absoluta y en las mentiras sociales sensatas. Creo en el derecho de la mujer a elegir, en el derecho de un bebé a vivir, en que si bien toda vida humana es sagrada, no hay nada malo en la pena de muerte si se puede confiar plenamente en el sistema legal, y en que nadie, salvo un imbécil, confiaría jamás en el sistema legal. Creo que la vida es un juego, que la vida es una broma cruel, y que la vida es lo que pasa cuando estás vivo, y que más vale relajarse y disfrutarla.",
  "autor": " Neil Gaiman,",
  " etiquetas": "['creencia']"
 },

 {
  "cita": " Amar. Ser amado. Nunca olvidar tu propia insignificancia. Nunca acostumbrarte a la violencia indescriptible ni a la vulgar disparidad de la vida que te rodea. Buscar la alegría en los lugares más tristes. Perseguir la belleza hasta su refugio. Nunca simplificar lo complicado ni complicar lo simple. Respetar la fuerza, nunca el poder. Sobre todo, observar. Intentar comprender. Nunca apartar la mirada. Y nunca, nunca olvidar.",

  "cita": " “El azar es quizás el seudónimo de Dios cuando no quiere firmar.”",
  "autor": " Théophile Gautier",
  " etiquetas": " ['atribuido erróneamente a Einstein']"
 },
 {
  "cita": "“Leamos y bailemos; estos dos entretenimientos nunca harán daño al mundo”.",
  "autor": " Voltaire",
  " etiquetas": " ['bailar', 'bailando', 'leyendo']"
 },
 {
  "cita": " “Y así el león se enamoró del cordero…”, murmuró. Aparté la mirada, tapándome los ojos mientras me emocionaba al oír la palabra. “Qué cordero tan estúpido”, suspiré. “Qué león tan enfermo y masoquista”.",
  "autor": " Stephenie Meyer,",
  " etiquetas": " ['bella', 'edward', 'amor']"
 },
 {
  "cita": " “La señal de una mente educada es ser capaz de albergar un pensamiento sin aceptarlo”.",
  "autor": " Aristóteles,",
  " etiquetas": " ['sabiduría']"
 },
 {
  "cita": " ¿Eres prefecto? ¡Ay, Ronnie! ¡Es toda la familia! ¿Qué somos Fred y yo? ¿Vecinos de al lado?",
  "autor": " J. K. Rowling,",
  " etiquetas": " ['fred weasley', 'george weasley', 'ron weasley']"
 },
 {

  "autor": " Elizabeth Gilbert,",
  " etiquetas": " ['dolor de corazón', 'amor']"
 },
 {
  "cita": " Cualquier tonto puede saberlo. La cuestión es entenderlo.",
  "autor": " Albert Einstein",
  " etiquetas": "['conocimiento', 'aprendizaje', 'comprensión', 'sabiduría']"
 },
 {
  "cita": " —¡ME DA UN GOLPE! —les gritó Harry, agarrando un lunascopio y arrojándolo a la chimenea—. ¡BASTA! ¡BASTA! ¡QUIERO SALIR, QUIERO QUE ESTO ACABE! ¡YA NO ME IMPORTA! —Sí que os importa —dijo Dumbledore. No se inmutó ni hizo un solo movimiento para impedir que Harry destrozara su despacho. Su expresión era tranquila, casi distante—. Os importa tanto que sentís que os vais a desangrar de dolor.",
  "autor": " J. K. Rowling,",
  " etiquetas": " ['dolor', 'muerte', 'dumbledore', 'harry-potter', 'herida', 'vida', 'dolor']"
 },
 {
  "cita": " \"¿Y se supone que debo quedarme sentado mientras sales con chicos, te enamoras de otra y te casas...?\" Su voz se tensó. \"Y mientras tanto, moriré un poco más cada día, observando\".",
  "autor": " Cassandra Clare,",
  " etiquetas": " ['mortales', 'romance', 'fantasía adolescente']"
 },
 {
  "cita": "Para quienes creen en Dios, la mayoría de las grandes preguntas tienen respuesta. Pero para quienes no podemos aceptar fácilmente la fórmula divina, las grandes respuestas no son inamovibles. Nos adaptamos a las nuevas condiciones y descubrimientos. Somos flexibles. El amor no tiene por qué ser una orden ni la fe un dictado. Soy mi propio dios. Estamos aquí para desaprender las enseñanzas de la iglesia, el estado y nuestro sistema educativo. Estamos aquí para beber cerveza. Estamos aquí para acabar con la guerra. Estamos aquí para reírnos de las adversidades y vivir nuestras vidas tan bien que la muerte tiemblaría al llevarnos.",
  "autor": " Charles Bukowski",
  " etiquetas": " ['ateísmo', 'religión']"
 },
 {
  "cita": " El planeta está bien. La gente está jodida.",
  "autor": " George Carlin",
  " etiquetas": " ['gracioso', 'humanidad', 'humor']"
 },
 {
  "cita": " A menos que a alguien como tú le importe muchísimo, nada va a mejorar. No lo hará.",
  "autor": " Dr. Seuss,",
  " etiquetas": " ['activismo']"
 },
 {
  "cita": " “Todo santo tiene un pasado y todo pecador tiene un futuro”.",
  "autor": " Oscar Wilde",
  " etiquetas": " ['santo pecador']"
 },
 {
  "cita": "Todos deberíamos empezar a vivir antes de envejecer. El miedo es estúpido. Y también lo son los arrepentimientos.",
  "autor": " Marilyn Monroe"
 },
 {
  "cita": " Llegará un día en que todos estaremos muertos. Todos. Llegará un día en que no quedará ningún ser humano que recuerde que alguien existió o que nuestra especie hizo algo. No quedará nadie que recuerde a Aristóteles o Cleopatra, y mucho menos a ti. Todo lo que hicimos, construimos, escribimos, pensamos y descubrimos será olvidado, y todo esto habrá sido en vano. Quizás ese día llegue pronto, quizás falten millones de años, pero incluso si sobrevivimos al colapso de nuestro sol, no sobreviviremos para siempre. Hubo tiempo antes de que los organismos experimentaran consciencia, y habrá tiempo después. Y si la inevitabilidad del olvido humano te preocupa, te animo a que lo ignores. Dios sabe que eso es lo que hacen los demás.",
  "autor": " Juan Verde,",
  " etiquetas": " ['existencia', 'vida']"
 },
 {
  "cita": " “El secreto de la vida, sin embargo, es caer siete veces y levantarse ocho veces”.",
  "autor": " Paulo Coelho,",
  " etiquetas": " ['sabiduría']"
 },
 {
  "cita": "Hay gente que se preocupa demasiado. Creo que eso se llama amor.",
  "autor": " A. A. Milne,"
 },
 {
  "cita": " “Nunca te rías de los dragones vivos”.",
  "autor": " J. R. R. Tolkien",
  " etiquetas": " ['dragones', 'sabiduría']"
 },
 {
  "cita": " “Cuando tengo un poco de dinero, compro libros; y si me queda, compro comida y ropa”.",
  "autor": " Desiderio Erasmo Roterodamo",
  " etiquetas": " ['libros']"
 },
 {
  "cita": " “Algunos libros deben ser saboreados, otros devorados, pero sólo unos pocos deben ser masticados y digeridos a fondo”.",
  "autor": " Señor Francis Bacon",
  " etiquetas": " ['libros', 'lectura']"
 },
 {
  "cita": " Cuanto más conozco el mundo, más me convenzo de que nunca encontraré un hombre al que pueda amar de verdad. ¡Necesito tanto!",
  "autor": " Jane Austen,",
  " etiquetas": " ['amor', 'requisitos']"
 },
 {
  "cita": " “En lo profundo del prado, escondido muy lejosUn manto de hojas, un rayo de lunaOlvida tus penas y deja que tus problemas descansenY cuando vuelva a amanecer, se iránAquí es seguro, aquí es cálidoAquí las margaritas te protegen de todo dañoAquí tus sueños son dulces y el mañana los hará realidadAquí es el lugar donde te amo”.",
  "autor": " Suzanne Collins,",
  " etiquetas": " ['katniss', 'rue', 'canción']"
 },
 {
  "cita": "“La esperanza es esa cosa con plumas que se posa en el alma y canta la melodía sin palabras y nunca se detiene en absoluto”.",
  "autor": " Emily Dickinson",
  " etiquetas": " ['plumas', 'esperanza', 'inspiración', 'almas']"
 },
 {
  "cita": " “La vida sólo puede entenderse al revés",
  "autor": " pero debe vivirse hacia adelante”.",
  " etiquetas": " Søren Kierkegaard",
  "Column4": " ['futuro', 'vida', 'pasado', 'reflexión', 'comprensión']"
 },
 {
  "cita": " Podría reconocerlo solo por el tacto, por el olfato; lo reconocería a ciegas, por la forma en que respiraba y sus pies tocaban la tierra. Lo reconocería en la muerte, en el fin del mundo.",
  "autor": " Madeline Miller,"
 },
 {
  "cita": "Tenía muchísimas ganas de tumbarme a su lado en el sofá, abrazarla y dormir. No follar, como en esas películas. Ni siquiera tener sexo. Simplemente dormir juntos, en el sentido más inocente de la palabra. Pero me faltaba el valor, y ella tenía novio, y yo era desgarbado, y ella guapísima, y yo era un aburrimiento irremediable, y ella infinitamente fascinante. Así que volví a mi habitación y me desplomé en la litera de abajo, pensando que si la gente era lluvia, yo era llovizna y ella, huracán.",
  "autor": " Juan Verde,",
  " etiquetas": " ['amor no correspondido']"
 },
 {
  "cita": " “Por los libros, las vacaciones más baratas que puedes comprar”.",
  "autor": " Charlaine Harris",
  " etiquetas": " ['libros-vacaciones']"
 },
 {
  "cita": " Te escuché. No soy la romántica tonta que crees. No quiero el cielo ni las estrellas fugaces. No quiero piedras preciosas ni oro. Ya las tengo. Quiero… una mano firme. Un alma bondadosa. Quiero dormirme y despertar sabiendo que mi corazón está a salvo. Quiero amar y ser amada.",
  "autor": " Shana Abe",
  " etiquetas": " ['amor', 'romance']"
 },
 {
  "cita": "Creo en todo hasta que lo desmientan. Así que creo en las hadas, los mitos, los dragones. Todo existe, aunque esté en tu mente. ¿Quién dice que los sueños y las pesadillas no son tan reales como el aquí y ahora?",
  "autor": " John Lennon",
  " etiquetas": " ['beatles', 'dragones', 'soñadores', 'soñando', 'sueños', 'hadas', 'fe', 'mitología', 'pesadillas', 'realidad', 'verdad']"
 },
 {
  "cita": " “Es lo desconocido lo que tememos cuando contemplamos la muerte y la oscuridad, nada más”.",
  "autor": " J. K. Rowling,",
  " etiquetas": " ['miedo-desconocido']"
 },
 {
  "cita": " “Comer y leer son dos placeres que combinan admirablemente”.",
  "autor": " C. S. Lewis",
  " etiquetas": " ['comer-leer']"
 },
 {
  "cita": " Uno, recuerda mirar hacia las estrellas y no hacia tus pies. Dos, nunca abandones el trabajo. El trabajo te da sentido y propósito, y la vida está vacía sin él. Tres, si tienes la suerte de encontrar el amor, recuerda que está ahí y no lo desperdicies.",
  "autor": " Stephen Hawking",
  " etiquetas": " ['filosofía', 'ciencia']"
 },
 {
  "cita": "Leer es una forma de escape. Correr para salvar la vida es otra.",
  "autor": " Lemony Snicket",
  " etiquetas": " ['lectura de humor']"
 },
 {
  "cita": " “A veces te levantas de la cama por la mañana y piensas: \"No lo lograré\", pero te ríes por dentro, recordando todas las veces que te has sentido así\".",
  "autor": " Charles Bukowski",
  " etiquetas": " ['humor']"
 },
 {
  "cita": " “Puedes hablar con alguien durante años, todos los días, y aun así, no significará tanto como lo que puedes tener cuando te sientas frente a alguien, sin decir una palabra, pero sientes a esa persona con tu corazón, sientes que la conoces desde siempre... las conexiones se hacen con el corazón, no con la lengua”.",
  "autor": " C. JoyBell C.",
  " etiquetas": " ['afecto', 'comunicación', 'conmovedor', 'conexiones humanas', 'naturaleza humana', 'humanismo', 'humanidad', 'inspirador', 'vida inspiradora', 'amor inspirador', 'citas inspiradoras', 'relaciones']"
 },
 {
  "cita": "“Quienes sueñan de día conocen muchas cosas que escapan a quienes sueñan sólo de noche”.",
  "autor": " Edgar Allan Poe,",
  " etiquetas": " ['día', 'soñando', 'sueños', 'noche']"
 },
 {
  "cita": " Un chico y una chica pueden ser solo amigos, pero en algún momento u otro, se enamorarán el uno del otro... Tal vez temporalmente, tal vez en el momento equivocado, tal vez demasiado tarde, o tal vez para siempre.",
  "autor": " Banda de Dave Matthews",
  " etiquetas": " ['dave-matthews', 'amigos', 'amor', 'relaciones']"
 },
 {
  "cita": " “Infiel es aquel que dice adiós cuando el camino se oscurece.”",
  "autor": " J. R. R. Tolkien,",
  " etiquetas": " ['fe']"
 },
 {
  "cita": " “La realidad no es más que una ilusión, aunque muy persistente.”",
  "autor": " Albert Einstein",
  " etiquetas": " ['realidad']"
 },
 {
  "cita": " “El mundo es un libro y quien no viaja sólo lee una página.”",
  "autor": " San Agustín",
  " etiquetas": " ['alegoría', 'libros', 'amplitud mental', 'clásico', 'educación', 'imaginería', 'viajes', 'mundo']"
 },
 {
  "cita": "“Qué suerte tengo de haber conocido a alguien y algo de lo que despedirse es tan condenadamente horrible”.",
  "autor": " Evans G. Valens,",
  " etiquetas": " ['atribuido erróneamente a aa-milne']"
 },
 {
  "cita": " El dolor es inevitable. El sufrimiento es opcional.",
  "autor": " haruki murakami,",
  " etiquetas": " ['inspirador', 'corriendo']"
 },
 {

  "autor": " Roy T. Bennett,",
  " etiquetas": " ['creación', 'creativo', 'inspiración', 'inspirador', 'actitud inspiradora', 'vida inspiradora', 'citas inspiradoras', 'inspirar', 'inspirador', 'vida', 'vida y vivir', 'lecciones de vida', 'citas de vida', 'vivir', 'optimismo', 'optimista', 'positivo', 'afirmación positiva', 'vida positiva', 'pensamiento positivo', 'preocupación']"
 },
 {
  "cita": " “Un día encontraré las palabras adecuadas y serán sencillas”.",
  "autor": " Jack Kerouac,",
  " etiquetas": "['dharma', 'simplicidad', 'escritura']"
 },
 {
  "cita": " “Si supiéramos lo que hacemos, no se llamaría investigación, ¿verdad?”",
  "autor": " Albert Einstein",
  " etiquetas": " ['ciencia']"
 },
 {
  "cita": " —Puede que esté enamorado de ti —sonríe levemente—. Aunque esperaré a estar seguro para decírtelo.",
  "autor": " Verónica Roth,",
  " etiquetas": " ['humorístico']"
 },
 {
  "cita": " A veces te pones un poco de mal humor, pero creo que es porque te gusta leer. A la gente que le gusta leer siempre le va un poco la gota gorda.",
  "autor": " Pat Conroy,",
  " etiquetas": " ['libros', 'lectura']"
 },
 {
  "cita": " “Si estás leyendo esto...Felicidades, estás vivo. Si eso no es motivo de sonrisa, entonces no sé qué lo será”.",
  "autor": " Chad Sugg,",
  " etiquetas": " ['viva', 'felicitaciones', 'esperanza', 'humanidad', 'inspiración', 'inspirador', 'inspirar', 'vida', 'poesía', 'sonrisa', 'sabiduría']"
 },
 {
  "cita": " “Si un escritorio desordenado es señal de una mente desordenada, ¿de qué es señal, entonces, un escritorio vacío?”",
  "autor": " Laurence J. Peter",
  " etiquetas": "['humano', 'humor', 'Einstein mal atribuido', 'filosofía', 'estupidez']"
 },
 {
  "cita": " “La experiencia no es más que el nombre que los hombres dan a sus errores”.",
  "autor": " Oscar Wilde,",
  " etiquetas": " ['experiencia-errores-sabiduría']"
 },
 {
  "cita": " “No soy lo suficientemente joven para saberlo todo”.",
  "autor": " Oscar Wilde",
  " etiquetas": " ['edad']"
 },
 {
  "cita": " “No hay chicas buenas que se hayan equivocado, solo chicas malas que fueron descubiertas”.",
  "autor": " Mae West",
  " etiquetas": " ['mujer']"
 },
 {
  "cita": " \"¿Recuerdas cuando en el hotel prometiste que si sobrevivíamos, te pondrías un uniforme de enfermera y me darías un baño de esponja?\", preguntó Jace. \"Fue Simon quien te prometió el baño de esponja.\" \"En cuanto me recupere, guapo\", dijo Simon. \"Sabía que deberíamos haberte dejado una rata.\"",
  "autor": " Cassandra Clare,",
  " etiquetas": " ['baño', 'clary-fray', 'humor', 'jace-wayland', 'simon-lewis']"
 },
 {
  "cita": " No vayas por ahí diciendo que el mundo te debe la vida. El mundo no te debe nada. Llegó primero.",
  "autor": " Mark Twain",
  " etiquetas": " ['viviendo', 'mundo']"
 },
 {
  "cita": "Espero que este año que viene cometas errores. Porque si cometes errores... estás haciendo algo.",
  "autor": " Neil Gaiman"
 },
 {
  "cita": " Nunca te acuestes enojado. Mantente despierto y lucha.",
  "autor": " Phyllis Diller",
  " etiquetas": " ['ira', 'gracioso', 'dormir']"
 },
 {
  "cita": " Vivimos y respiramos palabras... Fueron los libros los que me hicieron sentir que quizás no estaba completamente sola. Podían ser sinceras conmigo, y yo con ellas. Al leer tus palabras, lo que escribías, lo sola que a veces te sentías y temerosa, pero siempre valiente; la forma en que veías el mundo, sus colores, texturas y sonidos, sentí... sentí lo que pensabas, esperabas, sentías, soñabas. Sentí que soñaba, pensaba y sentía contigo. Soñé lo que tú soñabas, quise lo que tú querías, y entonces comprendí que, en realidad, solo te deseaba a ti.",
  "autor": " Cassandra Clare,",
  " etiquetas": " ['sueños', 'cartas', 'amor', 'amor a primera vista', 'poder de las palabras', 'escritura']"
 },
 {
  "cita": "“Aprendí esto, al menos, con mi experimento: que si uno avanza con confianza en la dirección de sus sueños y se esfuerza por vivir la vida que ha imaginado, se encontrará con un éxito inesperado en las horas comunes”.",
  "autor": " Henry David Thoreau,"
 },
 {
  "cita": " No tengo ningún talento especial. Solo soy una apasionada curiosa.",
  "autor": " Albert Einstein",
  " etiquetas": " ['vida inspiradora']"
 },
 {
  "cita": " Los monstruos son reales, y los fantasmas también. Viven dentro de nosotros y, a veces, triunfan.",
  "autor": " Stephen King",
  " etiquetas": " ['vida']"
 },
 {
  "cita": " Crees que tu dolor y tu angustia no tienen precedentes en la historia del mundo, pero luego lees. Fueron los libros los que me enseñaron que lo que más me atormentaba era precisamente lo que me conectaba con todas las personas que estaban vivas, que alguna vez estuvieron vivas.",
  "autor": " James Baldwin",
  " etiquetas": " ['libros', 'empatía', 'dolor', 'lectura']"
 },
 {
  "cita": " “En tiempos de engaño, decir la verdad es un acto revolucionario”.",
  "autor": " George Orwell",
  " etiquetas": " ['verdad']"
 },
 {
  "cita": "“La mente es su propio lugar, y por sí misma puede hacer del infierno un cielo y del cielo un infierno…”",
  "autor": " Juan Milton,",
  " etiquetas": " ['inspirador', 'religión']"
 },
 {
  "cita": " Habría venido por ti. Y si no pudiera caminar, me arrastraría hasta ti, y por muy mal que estuviéramos, lucharíamos juntos para salir, con los cuchillos desenvainados y las pistolas encendidas. Porque eso es lo que hacemos. Nunca dejamos de luchar.",
  "autor": " Leigh Bardugo,",
  " etiquetas": " ['reino-torcido', 'inej-ghafa', 'kaz-brekker', 'seis-de-cuervos']"
 },
 {
  "cita": " Me gusta el trabajo: me fascina. Puedo sentarme a mirarlo durante horas.",
  "autor": " Jerome K. Jerome",
  " etiquetas": " ['humor', 'trabajo']"
 },
 {
  "cita": "Nunca me he sentido solo. He estado en una habitación... he tenido pensamientos suicidas. He estado deprimido. Me he sentido fatal, fatalísimo, pero nunca sentí que otra persona pudiera entrar en esa habitación y curar lo que me molestaba... ni que cualquier cantidad de personas pudiera entrar en esa habitación. En otras palabras, la soledad es algo que nunca me ha molestado porque siempre he tenido una terrible necesidad de soledad. Es estar en una fiesta, o en un estadio lleno de gente animando algo, que podría sentirme solo. Citaré a Ibsen: «Los hombres más fuertes son los más solos». Nunca he pensado: «Bueno, una rubia guapa entrará aquí, me hará una paja, me frotará las pelotas y me sentiré bien». No, eso no ayudará. Ya sabes, la típica multitud: «¡Guau, es viernes por la noche, ¿qué vas a hacer?». ¿Simplemente sentarme ahí? Bueno, sí. Porque no hay nada ahí fuera. Es una estupidez. Gente estúpida mezclándose con gente estúpida. Que se emborrachen. Nunca me ha molestado salir corriendo en la noche. Me escondía en bares porque no quería esconderme en fábricas. Eso es todo. Perdón por los millones, pero nunca me he sentido solo. Me quiero a mí mismo. Soy el mejor entretenimiento que tengo. ¡Bebamos más vino!",
  "autor": " Charles Bukowski",
  " etiquetas": "['soledad']"
 },
 {
  "cita": " Quería que vieras lo que es la verdadera valentía, en lugar de creer que es un hombre con una pistola en la mano. Es cuando sabes que estás derrotado antes de empezar, pero empiezas de todos modos y perseveras, pase lo que pase.",
  "autor": " Harper Lee,",
  " etiquetas": " ['atticus-finch', 'coraje']"
 },
 {
  "cita": " “Una vida dedicada a cometer errores no sólo es más honorable, sino más útil que una vida dedicada a no hacer nada”.",
  "autor": "George Bernard Shaw",
  " etiquetas": " ['arte', 'vida']"
 },
 {
  "cita": " Cuando tenía 5 años, mi madre siempre me decía que la felicidad era la clave de la vida. Cuando iba a la escuela, me preguntaron qué quería ser de mayor. Escribí \"feliz\". Me dijeron que no entendía la tarea, y yo les dije que ellos no entendían la vida.",
  "autor": " John Lennon",
  " etiquetas": " ['inspirador', 'vida']"
 },
 {
  "cita": " “Nos deleitamos con la belleza de la mariposa, pero rara vez admitimos los cambios que ha experimentado para alcanzar esa belleza”.",
  "autor": " Maya Angelou",
  " etiquetas": " ['inspiración']"
 },
 {
  "cita": " “Haz siempre lo que tienes miedo de hacer”.",
  "autor": " Ralph Waldo Emerson",
  " etiquetas": " ['inspirador']"
 },
 {
  "cita": "No hay felicidad ni miseria en el mundo; solo existe la comparación de un estado con otro, nada más. Quien ha sentido el dolor más profundo es el más capaz de experimentar la felicidad suprema. Debemos haber sentido lo que es morir, Morrel, para poder apreciar los placeres de la vida. Vivan, pues, y sean felices, amados hijos de mi corazón, y nunca olviden que hasta el día en que Dios se digne revelar el futuro al hombre, toda la sabiduría humana se encierra en estas dos palabras: \"Esperar y tener esperanza\".",
  "autor": " Alejandro Dumas",
  " etiquetas": " ['esperanza', 'inspiración', 'sabiduría']"
 },
 {
  "cita": "Es curioso morir a un ser querido. Todos sabemos que nuestro tiempo en este mundo es limitado y que, con el tiempo, todos acabaremos bajo una sábana, sin despertar jamás. Y, sin embargo, siempre es una sorpresa cuando le sucede a alguien conocido. Es como subir las escaleras a tu habitación a oscuras y pensar que hay un escalón más. Tu pie cae al suelo, por el aire, y hay un momento de sombría sorpresa mientras intentas reajustar tu forma de pensar.",
  "autor": " Lemony Snicket,",
  " etiquetas": " ['muerte']"
 },
 {
  "cita": " “He decidido aferrarme al amor... El odio es una carga demasiado grande para soportar.”",
  "autor": " Martin Luther King Jr.,",
  " etiquetas": " ['odio', 'amor']"
 },
 {
  "cita": " Dicen que una persona necesita solo tres cosas para ser verdaderamente feliz en este mundo: alguien a quien amar, algo que hacer y algo que esperar.",
  "autor": " Tom Bodett",
  " etiquetas": " ['felicidad', 'esperanza', 'alegría', 'amor', 'deseo']"
 },
 {

 {
  "cita": " \"¿Puedo verte otra vez?\", preguntó. Había un nerviosismo entrañable en su voz. Sonreí. \"Claro\". \"¿Mañana?\", preguntó. \"Paciencia, saltamontes\", le aconsejé. \"No querrás parecer demasiado ansiosa. \"Claro, por eso dije mañana\", dijo. \"Quiero verte esta noche. Pero estoy dispuesta a esperar toda la noche y gran parte de mañana\". Puse los ojos en blanco. \"Hablo en serio\", dijo. \"Ni siquiera me conoces\", dije. Cogí el libro de la consola central. \"¿Qué tal si te llamo cuando termine esto?\". \"Pero ni siquiera tienes mi número de teléfono\", dijo. \"Sospecho firmemente que lo escribiste en este libro\". Esbozó una sonrisa boba. \"Y dices que no nos conocemos\".",

  "cita": " No dejes que tu fuego se apague, chispa tras chispa irremplazable, en los pantanos desesperanzadores del no del todo, del todavía no y del nada en absoluto. No dejes que el héroe que llevas dentro perezca en la solitaria frustración por la vida que merecías y que nunca has podido alcanzar. El mundo que deseas se puede conquistar. Existe... es real... es posible... es tuyo.",

 {
  "cita": " No es el crítico quien cuenta; no es quien señala cómo tropieza el hombre fuerte, o dónde quien realiza las hazañas podría haberlas hecho mejor. El mérito pertenece al hombre que está realmente en la arena, con el rostro manchado de polvo, sudor y sangre; que se esfuerza valientemente; que yerra, que se queda corto una y otra vez, porque no hay esfuerzo sin error y deficiencia; pero que realmente se esfuerza por realizar las acciones; que conoce los grandes entusiasmos, las grandes devociones; que se entrega a una causa digna; que, en el mejor de los casos, conoce al final el triunfo del gran logro, y que, en el peor, si fracasa, al menos fracasa con gran osadía, para que su lugar nunca esté entre esas almas frías y tímidas que no conocen la victoria ni la derrota.",

 },
 {
  "cita": "Vuelvo a enfocar la vista cuando César le pregunta si tiene novia en casa. Peeta duda y luego niega con la cabeza de forma poco convincente. Un chico guapo como tú. Debe de haber una chica especial. Anda, ¿cómo se llama?, dice César. Peeta suspira. Bueno, hay una chica. He estado enamorado de ella desde que tengo memoria. Pero estoy bastante seguro de que no supo de mí hasta la cosecha. Se oyen expresiones de compasión entre la multitud. Un amor no correspondido con el que pueden identificarse. ¿Tiene otro chico?, pregunta César. No lo sé, pero a muchos chicos les gusta, dice Peeta. Así que, esto es lo que haces: si ganas, te vas a casa. —Entonces no puede rechazarte, ¿eh? —dice César animándolo. —No creo que vaya a funcionar. Ganar... no me servirá de nada —dice Peeta—. ¿Por qué no? —dice César, desconcertado. Peeta se sonroja y tartamudea—: Porque... porque... vino conmigo.",
  "autor": " Suzanne Collins,",
  " etiquetas": " ['Peeta']"
 },

 {
  "cita": "“LAS DIEZ PRIMERAS MENTIRAS QUE TE DICEN EN LA ESCUELA SECUNDARIA 1. Estamos aquí para ayudarte. 2. Tendrás tiempo para llegar a tu clase antes de que suene la campana. 3. Se hará cumplir el código de vestimenta. 4. No se permite fumar en las instalaciones de la escuela. 5. Nuestro equipo de fútbol ganará el campeonato este año. 6. Esperamos más de ti aquí. 7. Los consejeros de orientación siempre están disponibles para escuchar. 8. Tu horario fue creado contigo en mente. 9. La combinación de tu casillero es privada. 10. Estos serán los años que recordarás con cariño. DIEZ MENTIRAS MÁS QUE TE DICEN EN LA ESCUELA SECUNDARIA 1. Usarás álgebra en tu vida adulta. 2. Conducir a la escuela es un privilegio que te pueden quitar. 3. Los estudiantes deben permanecer en el campus durante el almuerzo. 4. Los nuevos libros de texto llegarán cualquier día de estos. 5. Las universidades se preocupan más por ti que por tus puntajes del SAT. 6. Estamos haciendo cumplir el código de vestimenta. 7. Pronto descubriremos cómo apagar la calefacción. 8. Nuestros conductores de autobús son profesionales altamente capacitados. 9. No hay nada malo en la escuela de verano. 10. Queremos escuchar lo que tienes que decir.",

  "cita": "Augustus Waters era un cabrón egocéntrico. Pero lo perdonamos. Lo perdonamos no porque tuviera un corazón tan bueno en sentido figurado como el suyo en sentido literal, ni porque supiera más de cómo sostener un cigarrillo que cualquier no fumador de la historia, ni porque le dieciocho años cuando debería haberle caído más. 'Diecisiete', corrigió Gus. 'Supongo que tienes tiempo, cabrón interrumpidor'. Te lo digo', continuó Isaac, 'Augustus Waters hablaba tanto que te interrumpiría en su propio funeral. Y era pretencioso: ¡Dios mío, ese chico nunca meaba sin reflexionar sobre las abundantes resonancias metafóricas de la producción de desechos humanos! Y era vanidoso: No creo haber conocido a una persona más atractiva físicamente que fuera más consciente de su propio atractivo físico'. Pero diré esto: cuando los científicos del futuro aparezcan en mi casa con ojos de robot y me digan que me los pruebe, les diré a los científicos que se fueran al diablo, porque no quiero ver un mundo sin él. Para entonces yo estaba medio llorando”.",

 {
  "cita": " Quiero pararme lo más cerca posible del borde sin pasarme. Desde el borde se ven cosas que no se ven desde el centro.",
  "autor": " Kurt Vonnegut,",
  " etiquetas": " ['vida de escritor']"
 },
 {
  "cita": "Si vas a intentarlo, ve hasta el final. Si no, ni siquiera empieces. Esto podría significar perder novias, esposas, familiares y tal vez hasta la cabeza. Podría significar no comer durante tres o cuatro días. Podría significar congelarte en un banco del parque. Podría significar la cárcel. Podría significar burla. Podría significar burla: aislamiento. El aislamiento es el regalo. Todas las demás son una prueba de tu resistencia, de cuánto realmente quieres hacerlo. Y lo harás, a pesar del rechazo y las peores probabilidades. Y será mejor que cualquier otra cosa que puedas imaginar. Si vas a intentarlo, ve hasta el final. No hay otra sensación como esa. Estarás a solas con los dioses, y las noches arderán con fuego. Cabalgarás la vida directo a la risa perfecta. Es la única buena lucha que existe.",

 },

 {
  "cita": "Pasé mi vida entre las páginas de los libros. En ausencia de relaciones humanas, forjé vínculos con personajes de papel. Viví el amor y la pérdida a través de historias entrelazadas en la historia; experimenté la adolescencia por asociación. Mi mundo es una red entrelazada de palabras, uniendo miembros, huesos y tendones, pensamientos e imágenes. Soy un ser compuesto de letras, un personaje creado por frases, un producto de la imaginación formado a través de la ficción.",

 {
  "cita": "Tengo un historial de tomar decisiones muy rápidas sobre los hombres. Siempre me he enamorado rápido y sin medir los riesgos. Tiendo no solo a ver lo mejor de cada persona, sino a asumir que todos son emocionalmente capaces de alcanzar su máximo potencial. Me he enamorado más veces de las que puedo contar del máximo potencial de un hombre, en lugar del hombre en sí, y me he aferrado a la relación durante mucho tiempo (a veces demasiado) esperando a que el hombre alcance su propia grandeza. Muchas veces, en el romance, he sido víctima de mi propio optimismo.",

  " etiquetas": " ['decepción', 'amor', 'romance']"
 },

  "cita": " “Sabes, podrías vivir mil vidas y no merecerlo”.",
  "autor": " Suzanne Collins,"
 },
 {
  "cita": " —Bueno, no voy a besar lo mundano —dijo Jace—. Prefiero quedarme aquí abajo y pudrirme. —¿Para siempre? —preguntó Simon—. Para siempre es muchísimo tiempo. Jace arqueó las cejas. —Lo sabía —dijo—. Quieres besarme, ¿verdad?",
  "autor": " Cassandra Clare,",
  " etiquetas": " ['humor', 'jace-wayland', 'simon-lewis']"
 },
 {
  "cita": " “No puedo vivir sin libros”.",
  "autor": " Thomas Jefferson",
  " etiquetas": " ['libros']"
 },
 {
  "cita": " Esperar es doloroso. Olvidar es doloroso. Pero no saber qué hacer es el peor sufrimiento.",
  "autor": " Paulo Coelho,",
  " etiquetas": " ['inspirador']"
 },
 {
  "cita": " ¿Qué es un amigo? Una sola alma que habita en dos cuerpos.",
  "autor": " Aristóteles",
  " etiquetas": " ['amistad', 'alma']"
 },
 {
  "cita": "El ser humano es parte de ese todo que llamamos universo, una parte limitada en el tiempo y el espacio. Se experimenta a sí mismo, a sus pensamientos y sentimientos como algo separado del resto, una especie de ilusión óptica de su conciencia. Esta ilusión es una especie de prisión para nosotros, que nos confina a nuestros deseos personales y al afecto por unas pocas personas cercanas. Nuestra tarea debe ser liberarnos de esta prisión ampliando nuestro círculo de compasión para abarcar a todas las criaturas vivientes y a la naturaleza en su totalidad y en toda su belleza.",
  "autor": " Albert Einstein",
  " etiquetas": " ['compasión', 'einstein', 'naturaleza', 'filosofía']"
 },
 {
  "cita": " “Los libros son espejos: en ellos sólo ves lo que ya tienes dentro de ti.”",
  "autor": " Carlos Ruiz Zafón,",
  " etiquetas": " ['libros', 'lectura', 'verdad']"
 },
 {
  "cita": " “Asume la responsabilidad de tu propia felicidad, nunca la pongas en manos de otras personas”.",
  "autor": " Roy T. Bennett,",
  " etiquetas": " ['felicidad', 'inspirador', 'responsabilidad']"
 },
 {
  "cita": "“No puedo imaginar a un hombre que realmente disfrute de un libro y lo leyera sólo una vez”.",

  " etiquetas": " ['lectura de libros']"
 },
 {
  "cita": " Para nosotros dos, el hogar no es un lugar. Es una persona. Y por fin estamos en casa.",
