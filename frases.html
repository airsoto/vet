  " etiquetas": " ['hogar', 'amor', 'relaciones', 'tocar']"
 },
 {
  "cita": " “Lo más importante es disfrutar la vida, ser feliz, es lo único que importa”.",
  "autor": " Audrey Hepburn",
  " etiquetas": " ['felicidad', 'vida']"
 },
 {
  "cita": " “Si tú me recuerdas, no me importa si todos los demás me olvidan”.",
  "autor": " Haruki Murakami,",
  " etiquetas": " ['inspirador', 'amor']"
 },
 {
  "cita": " El acto más valiente sigue siendo pensar por uno mismo. En voz alta.",
  "autor": " Coco Chanel",
  " etiquetas": " ['coraje', 'dignidad', 'empoderamiento', 'libertad', 'independencia', 'individualidad', 'juicio', 'autodeterminación', 'hablar', 'pensamiento']"
 },
 {
  "cita": " Nunca te dejes intimidar para callar. Nunca te conviertas en víctima. No aceptes la definición que nadie tenga de tu vida.",
  "autor": " “Defínete a ti mismo.”",
  " etiquetas": " Robert Frost"
 },
 {
  "cita": "La gente no es ni malvada ni noble. Son como ensaladas de chef, con cosas buenas y malas, picadas y mezcladas en una vinagreta de confusión y conflicto.",
  "autor": " Lemony Snicket,",
  " etiquetas": " ['vida']"
 },
 {
  "cita": " Ninguna relación es perfecta, jamás. Siempre hay maneras de ceder, de ceder, de renunciar a algo para obtener algo mejor... El amor que nos sentimos es más grande que estas pequeñas diferencias. Y esa es la clave. Es como un gran gráfico circular, y el amor en una relación tiene que ser la pieza más importante. El amor puede compensar mucho.",
  "autor": " Sarah Dessen,",
  " etiquetas": " ['amar']"
 },
 {
  "cita": " “La esencia misma del romance es la incertidumbre”.",
  "autor": " Oscar Wilde,",
  " etiquetas": " ['amor', 'romance']"
 },
 {
  "cita": " “Lo que más importa es lo bien que camines a través del fuego”",
  "autor": " Charles Bukowski"
 },
 {
  "cita": " —No todo gira en torno a ti —dijo Clary furiosa—. Es posible —dijo Jace—, pero tienes que admitir que la mayoría de las cosas sí.",
  "autor": " Cassandra Clare,",
  " etiquetas": " ['clary-fray', 'ego', 'jace-wayland']"
 },
 {
  "cita": "Quienes encuentran significados desagradables en las cosas bellas son corruptos sin ser encantadores. Esto es un defecto. Quienes encuentran significados hermosos en las cosas bellas son los cultos. Para ellos hay esperanza. Son los elegidos para quienes las cosas bellas solo significan Belleza. No existen libros con moraleja ni con inmoralidad. Los libros están bien escritos o mal escritos. Eso es todo.",
  "autor": " Oscar Wilde,",
  " etiquetas": " ['libros', 'moralidad', 'lectura', 'escritura']"
 },
 {
  "cita": " El amor siempre es paciente y bondadoso. Nunca es celoso. Nunca es jactancioso ni engreído. Nunca es grosero ni egoísta. No se ofende ni guarda rencor. El amor no se complace en los pecados ajenos, sino que se deleita en la verdad. Siempre está dispuesto a disculpar, a confiar, a esperar y a soportar lo que venga.",
  "autor": " Anónimo,",
  " etiquetas": " ['1-corintios-13', 'amor']"
 },
 {
  "cita": " Acéptate, ámate y sigue adelante. Si quieres volar, tienes que renunciar a lo que te pesa.",
  "autor": " Roy T. Bennett,",
  " etiquetas": "['acéptate', 'inspiración', 'inspirador', 'actitud inspiradora', 'vida inspiradora', 'citas inspiradoras', 'inspirar', 'inspirador', 'sigue adelante', 'soltar', 'vida', 'vida y vivir', 'lecciones de vida', 'citas de vida', 'vivir', 'ámate a ti mismo', 'optimismo', 'optimista', 'positivo', 'afirmación positiva', 'vida positiva', 'pensamiento positivo']"
 },
 {
  "cita": " Lee, lee, lee. Lee de todo: basura, clásicos, buenos y malos, y observa cómo lo hacen. Como un carpintero que trabaja como aprendiz y estudia al maestro. ¡Lee! Lo absorberás. Luego escribe. Si es bueno, lo descubrirás. Si no, tíralo por la ventana.",
  "autor": " William Faulkner",
  " etiquetas": " ['leyendo', 'escribiendo']"
 },
 {
  "cita": " Sé consciente. Sé agradecido. Sé positivo. Sé auténtico. Sé amable.",
  "autor": " Roy T. Bennett,",
  " etiquetas": "['gratitud', 'inspiración', 'inspirador', 'citas inspiradoras', 'amabilidad', 'vida', 'vida y vivir', 'citas de vida', 'vivir la vida', 'consciente', 'atención', 'optimismo', 'optimista', 'positivo', 'afirmación positiva', 'vida positiva', 'pensamiento positivo', 'verdad']"
 },
 {
  "cita": " Lo que me sucede puede cambiarme. Pero me niego a que me afecte. (Frase errónea y popular: «Puede que no controles todo lo que te sucede, pero puedes decidir no dejarte afectar por ello»).",
  "autor": "Maya Angelou,",
  " etiquetas": " ['sé tú mismo', 'inspirador', 'cita errónea', 'autodeterminación']"
 },
 {

  "autor": " Cassandra Clare,",
  " etiquetas": " ['brown', 'ciudad de cristal', 'clare', 'isabelle', 'jace']"
 },
 {

  "autor": " Roy T. Bennett",
  " etiquetas": " ['sentimientos', 'inspiración', 'citas inspiradoras']"
 },
 {
  "cita": " “El amor es tan corto, el olvido es tan largo.”",
  "autor": " Pablo Neruda,",
  " etiquetas": " ['amar']"
 },
 {
  "cita": "¿Alguna vez te has enamorado? Horrible, ¿verdad? Te hace tan vulnerable. Te abre el pecho y el corazón, y significa que alguien puede entrar en ti y hacerte daño. Construyes todas estas defensas, te construyes una armadura para que nada pueda hacerte daño, y entonces una persona estúpida, igual a cualquier otra estúpida, entra en tu estúpida vida... Le das un pedazo de ti. No lo pidió. Un día hizo algo estúpido, como besarte o sonreírte, y entonces tu vida ya no te pertenece. El amor toma rehenes. Se mete dentro de ti. Te consume y te deja llorando en la oscuridad, tan simple como una frase como \"quizás deberíamos ser solo amigos\" se convierte en una astilla de cristal que se abre paso hasta tu corazón. Duele. No solo en la imaginación. No solo en la mente. Es un dolor que duele en el alma, un dolor real que se te mete dentro y te destroza. Odio el amor.",
  "autor": " Neil Gaiman,",
  " etiquetas": " ['amar']"
 },
 {
  "cita": " “La vida no examinada no vale la pena vivirla”.",
  "autor": " Sócrates",
  " etiquetas": "['inspiración', 'verdad', 'sabiduría']"
 },
 {

 {

 {

 {

  " etiquetas": " ['inspirador']"
 },
 {
  "cita": " No coincidían en muchas cosas. De hecho, no coincidían en nada. Peleaban constantemente y se retaban a diario. Pero a pesar de sus diferencias, tenían algo importante en común: estaban locos el uno por el otro.",
  "autor": " Nicolás Sparks,",
  " etiquetas": " ['querido john', 'amor', 'nicholas sparks', 'romance', 'el cuaderno']"
 },
 {
  "cita": "No quería despertar. Dormía mucho mejor. Y eso es muy triste. Fue casi como una pesadilla al revés, como cuando despiertas de una pesadilla y sientes un gran alivio. Desperté en medio de una pesadilla.",
  "autor": " Ned Vizzini,",
  " etiquetas": " ['depresión', 'tristeza', 'suicidio']"
 },
 {

  " etiquetas": " ['granja de animales']"
 },

  " etiquetas": " ['verdad']"
 },
 {
  "cita": " No intentes convertirte en un hombre de éxito. Conviértete en un hombre de valor.",

  " etiquetas": " ['adultez', 'éxito', 'valor']"
 },
 {
  "cita": " Todos somos diferentes. No juzgues, sino comprende.",
  "autor": " Roy T. Bennett,",
  " etiquetas": " ['vida auténtica', 'ser auténtico', 'autenticidad', 'compasión']"
 },
 {
  "cita": "\"¿Es esta la parte donde dices que si la lastimo, me matarás?\" \"No\", dijo Simon. \"Si lastimas a Clary, ella es perfectamente capaz de matarte ella misma. Posiblemente con diversas armas\".",
  "autor": " Cassandra Clare,",
  " etiquetas": " ['ciudad de cristal', 'jace', 'simon']"
 },
 {
  "cita": " “Los buenos libros no revelan todos sus secretos de una vez”.",
  "autor": " Stephen King",
  " etiquetas": " ['libros']"
 },
 {
  "cita": " Creo que si algo he aprendido sobre la amistad es a perseverar, a mantener la conexión, a luchar por ellos y a dejar que luchen por ti. No te alejes, no te distraigas, no estés demasiado ocupado ni cansado, no los des por sentados. Los amigos son parte del pegamento que une la vida y la fe. Algo muy poderoso.",
  "autor": " Jon Katz",

 },

 },
 {

 {
  "cita": " Declaración de Derechos del Lector: 1. Derecho a no leer. 2. Derecho a saltarse páginas. 3. Derecho a no terminar. 4. Derecho a releer. 5. Derecho a leer cualquier cosa. 6. Derecho a la evasión. 7. Derecho a leer en cualquier lugar. 8. Derecho a hojear. 9. Derecho a leer en voz alta. 10. Derecho a no defender sus gustos.",

 {

 },
 {

 {
  "cita": "“Así que por favor, oh por favor, te lo rogamos, te lo rogamos, ve y tira tu televisor, y en su lugar puedes instalar una bonita estantería en la pared. Luego llena los estantes con muchos libros”.",
  "autor": " Roald Dahl,",
  " etiquetas": " ['libros', 'humor', 'televisión']"
 },
 {

  " etiquetas": " ['humor', 'inspirador', 'vida']"
 },
 {

  "autor": " J. K. Rowling,",
  " etiquetas": " ['ira', 'ira de Molly Weasley']"
 },
 {
  "cita": " Me alegró poder responder con prontitud, y así lo hice. Dije que no sabía.",
  "autor": " Mark Twain",
  " etiquetas": " ['humor', 'conocimiento']"
 },
 {
  "cita": " \"Podrías haber tenido cualquier otra cosa en el mundo, y me pediste a mí.\" Ella le sonrió. Sucio como estaba, cubierto de sangre y tierra, era lo más hermoso que jamás había visto. \"Pero no quiero nada más en el mundo.\"",
  "autor": " Cassandra Clare,",
  " etiquetas": "['clary-fray', 'jace-wayland', 'amor']"
 },
 {
  "cita": " “Nunca permitas que alguien sea tu prioridad mientras tú mismo seas su opción”.",
  "autor": " Mark Twain",
  " etiquetas": " ['desamor']"
 },
 {
  "cita": " “Escribe algo que valga la pena leer o haz algo que valga la pena escribir”.",
  "autor": " Benjamín Franklin",
  " etiquetas": " ['mmm']"
 },
 {
  "cita": "Una vez, en un papel amarillo con líneas verdes, escribió un poema. Lo llamó \"Chops\" porque así se llamaba su perro. De eso se trataba. Su maestra le dio una A y una estrella dorada. Su madre lo colgó en la puerta de la cocina y se lo leyó a sus tías. Ese fue el año en que el padre Tracy llevó a todos los niños al zoológico y los dejó cantar en el autobús. Su hermanita nació con uñas diminutas y sin pelo. Su madre y su padre se besaban mucho. La chica de la esquina le envió una tarjeta de San Valentín firmada con una fila de X y tuvo que preguntarle a su padre qué significaban las X. Su padre siempre lo arropaba por la noche y siempre estaba allí para hacerlo. Una vez, en un papel blanco con líneas azules, escribió un poema. Lo llamó \"Otoño\" porque ese era el nombre de la estación. De eso se trataba. Su maestra le dio una A y le pidió que escribiera con más claridad. Su madre nunca lo colgó en la puerta de la cocina por la pintura nueva. Los niños Le dijo que el padre Tracy fumaba puros y dejaba colillas en los bancos, y que a veces hacían agujeros. Ese fue el año en que su hermana compró gafas con cristales gruesos y montura negra. Y la chica de la esquina se rió cuando le pidió que fuera a ver a Papá Noel. Y los niños le contaron por qué su madre y su padre se besaban mucho, y su padre nunca lo arropaba por la noche, y su padre se enfadaba cuando lloraba para que lo hiciera. Una vez, en un papel arrancado de su cuaderno, escribió un poema. Y lo llamó \"Inocencia: una pregunta\" porque esa era la pregunta sobre su chica, y de eso se trataba. Y su profesor le puso una A y una extraña mirada fija, y su madre nunca lo colgó en la puerta de la cocina porque nunca se lo enseñó. Ese fue el año en que murió el padre Tracy, y olvidó cómo terminaba el Credo de los Apóstoles, y pilló a su hermana besándose en el porche trasero, y su madre y su padre nunca se besaron ni hablaron, y la chica de la esquina llevaba demasiado maquillaje, que lo hizo toser cuando la besó, pero la besó de todos modos porque era lo que se debía hacer. A las tres de la mañana se metió en la cama con su padre roncando profundamente. Por eso en el reverso de una bolsa de papel marrón intentó escribir otro poema y lo llamó \"Absolutamente nada\", porque de eso se trataba realmente. Y se puso una A y un corte en cada maldita muñeca. Y lo colgó en la puerta del baño porque esta vez no creía que pudiera llegar a la cocina.",
  "autor": " Esteban Chbosky,",
  " etiquetas": "['poema']"
 },
 {

 },
 {

 {

 {
  "cita": " —¡Por los imbéciles! —dijo, señalando a Brad—. Y por las chicas que te rompen el corazón —inclinó la cabeza hacia mí. Su mirada se desvió—. Y por el horror absoluto de perder a tu mejor amiga por ser tan estúpido como para enamorarte de ella.",

 {
  "cita": "La gente tiene miedo de sí misma, de su propia realidad; sobre todo de sus sentimientos. La gente habla de lo maravilloso que es el amor, pero eso es pura mentira. El amor duele. Los sentimientos son perturbadores. A la gente le enseñan que el dolor es malo y peligroso. ¿Cómo pueden lidiar con el amor si tienen miedo de sentir? El dolor está hecho para despertarnos. La gente intenta ocultar su dolor. Pero se equivocan. El dolor es algo que hay que llevar consigo, como una radio. Sientes tu fuerza en la experiencia del dolor. Todo está en cómo lo llevas. Eso es lo que importa. El dolor es un sentimiento. Tus sentimientos son parte de ti. Tu propia realidad. Si te avergüenzas de ellos y los ocultas, estás permitiendo que la sociedad destruya tu realidad. Deberías defender tu derecho a sentir tu dolor.",

  " etiquetas": " ['jim', 'vida', 'morrison', 'dolor', 'realidad']"
 },
 {

  "cita": "“UNA MUJER DEBERÍA TENER... suficiente dinero a su alcance para mudarse y alquilar un lugar propio, incluso si nunca quiere o necesita hacerlo... UNA MUJER DEBERÍA TENER... algo perfecto para usar si el empleador o la cita de sus sueños quiere verla en una hora... UNA MUJER DEBERÍA TENER... una juventud que esté contenta de dejar atrás.... UNA MUJER DEBERÍA TENER... un pasado lo suficientemente jugoso como para desear contarlo en su vejez.... UNA MUJER DEBERÍA TENER... un juego de destornilladores, un taladro inalámbrico y un sostén de encaje negro... UNA MUJER DEBERÍA TENER... una amiga que siempre la haga reír... y una que la deje llorar... UNA MUJER DEBERÍA TENER... un buen mueble que no haya sido propiedad de nadie más en su familia... UNA MUJER DEBERÍA TENER... ocho platos a juego, copas de vino con tallos y una receta para una comida que haga que sus invitados se sientan honrados... UNA MUJER DEBERÍA TENER... un sentimiento de control sobre su destino... TODA MUJER DEBERÍA SABER... cómo enamorarse sin perderse a sí misma.. TODA MUJER DEBERÍA SABER... CÓMO DEJAR UN TRABAJO, ROMPER CON UN AMANTE Y ENFRENTAR A UN AMIGO SIN ARRUINAR LA AMISTAD... TODA MUJER DEBERÍA SABER... cuándo esforzarse más... y CUÁNDO ALÉJARSE... TODA MUJER DEBERÍA SABER... que no puede cambiar la longitud de sus pantorrillas, el ancho de sus caderas o la naturaleza de sus padres. TODA MUJER DEBERÍA SABER... que su infancia puede no haber sido perfecta... pero se acabó... TODA MUJER DEBERÍA SABER... lo que haría y no haría por amor o más... TODA MUJER DEBERÍA SABER... cómo vivir sola... aunque no le guste... TODA MUJER DEBERÍA SABER... en quién puede confiar, en quién no y por qué no debería tomárselo como algo personal... TODA MUJER DEBERÍA SABER... a dónde ir... ya sea a la mesa de la cocina de su mejor amiga... o a una encantadora posada en el bosque... cuando su alma necesita consuelo... TODA MUJER DEBERÍA SABER... lo que puede y no puede lograr en un día... un mes... y un año   " etiquetas": " ['coraje', 'determinación', 'esperanza', 'riesgo']"

 {
  "cita": " Lo que quiero es que me necesiten. Lo que necesito es ser indispensable para alguien. A quien necesito es a alguien que absorba todo mi tiempo libre, mi ego, mi atención. Alguien adicto a mí. Una adicción mutua.",

 {
  "cita": "No te limites a aprender, experimenta. No te limites a leer, absorbe. No te limites a cambiar, transforma. No te limites a relacionarte, defiende. No te limites a prometer, demuestra. No te limites a criticar, anima. No te limites a pensar, reflexiona. No te limites a tomar, da. No te limites a ver, siente. No te limites a soñar, haz. No te limites a oír, escucha. No te limites a hablar, actúa. No te limites a contar, muestra. No te limites a existir, vive.",

  " etiquetas": " ['muerte', 'inspirador']"

 {
  "cita": " “El amor no consiste en mirarse el uno al otro, sino en mirar juntos hacia afuera en la misma dirección”.",

  " etiquetas": " ['amar']"

 {
  "cita": "No dejes que las expectativas y opiniones de los demás influyan en tus decisiones. Es tu vida, no la de ellos. Haz lo que más te importe; haz lo que te haga sentir vivo y feliz. No dejes que las expectativas e ideas de los demás limiten quién eres. Si dejas que otros te digan quién eres, estás viviendo su realidad, no la tuya. La vida es más que complacer a los demás. Es mucho más que seguir el camino que otros te han impuesto. Es mucho más que lo que experimentas ahora mismo. Necesitas decidir quién eres por ti mismo. Conviértete en un ser completo. Aventura.",

  " etiquetas": "['acción', 'aventura', 'vida auténtica', 'yo auténtico', 'autenticidad', 'confianza', 'experiencia', 'inspiración', 'inspirador', 'citas inspiradoras', 'inspirar', 'inspirador', 'vida', 'citas de vida', 'vivir', 'optimismo', 'optimista', 'positivo', 'afirmación positiva', 'vida positiva', 'pensamiento positivo', 'quién eres', 'ser completo']"

 {
  "cita": "Duele soltar. A veces parece que cuanto más te aferras a algo o a alguien, más quiere escapar. Te sientes como una especie de criminal por haber sentido, por haber deseado. Por haber querido ser deseado. Te confunde, porque crees que tus sentimientos estaban equivocados y te hace sentir tan pequeño porque es tan difícil contenerlo cuando lo dejas salir y no regresa. Te quedas tan solo que no puedes explicarlo. Maldita sea, no hay nada como eso, ¿verdad? He pasado por eso y tú también. Asientes con la cabeza.",

  " etiquetas": " ['beatles', 'inspirador', 'en vivo', 'amor', 'música']"

 {
  "cita": "Me gusta vivir. A veces me he sentido terriblemente desesperado y profundamente miserable, atormentado por la tristeza; pero a pesar de todo, sigo teniendo la certeza de que el simple hecho de estar vivo es algo grandioso.",

 {
  "cita": " Si no te llama, es porque no piensa en ti. Si te crea expectativas y luego no cumple con las cosas pequeñas, hará lo mismo con las grandes. Sé consciente de esto y comprende que no le importa decepcionarte. No estés con alguien que no hace lo que dice que va a hacer. Si decide no hacer un simple esfuerzo que te tranquilizaría y traería armonía a una pelea recurrente, entonces no respeta tus sentimientos ni tus necesidades. «Ocupado» es otra palabra para «imbécil». «Imbécil» es otra palabra para el chico con el que sales. Te mereces una maldita llamada.",

 {

  " etiquetas": " ['humor', 'gusto']"
 },
 {
  "cita": " Si la música es el alimento del amor, sigue tocándola; dame un exceso, para que, al saciarme, el apetito se desmaye y muera. ¡Otra vez esa melodía! Tuvo una caída moribunda: ¡Oh, llegó a mis oídos como el dulce sonido que respira sobre un banco de violetas, robando y despidiendo aroma! Basta; basta: ya no es tan dulce como antes. ¡Oh, espíritu de amor! Qué vivo y fresco eres, que, a pesar de tu capacidad de recibir como el mar, nada entra allí, de cualquier validez y profundidad, sino que cae en decadencia y bajo precio, incluso en un minuto: tan llena de formas está la fantasía que solo ella es altamente fantástica.",

  " etiquetas": " ['música', 'romance', 'amor no correspondido']"

 {

 },
 {

 {
  "cita": "¿Qué es una muerte instantánea? ¿Cuánto dura un instante? ¿Un segundo? ¿Diez? El dolor de esos segundos debió ser terrible: su corazón estalló, sus pulmones colapsaron, no le llegaba aire ni sangre al cerebro, solo puro pánico. ¿Qué demonios es instantáneo? Nada es instantáneo. El arroz instantáneo tarda cinco minutos, el pudín instantáneo una hora. Dudo que un instante de dolor cegador se sienta particularmente instantáneo.",
  "autor": " Juan Verde,",
  " etiquetas": " ['buscando-alaska']"
 },
 {
  "cita": " No estoy seguro de cómo será exactamente el cielo, pero sé que cuando muramos y llegue el momento de que Dios nos juzgue, no nos preguntará: \"¿Cuántas cosas buenas has hecho en tu vida?\", sino: \"¿Cuánto amor pusiste en lo que hiciste?\".",
  "autor": " Madre Teresa",
  " etiquetas": " ['inspirador', 'amor']"
 },
 {
  "cita": " “Ninguna medicina cura lo que la felicidad no puede.”",
  "autor": " Gabriel García Márquez",
  " etiquetas": " ['felicidad']"
 },
 {
  "cita": "La persona llamada 'psicóticamente deprimida' que intenta suicidarse no lo hace por pura 'desesperanza' ni por la convicción abstracta de que las ventajas y desventajas de la vida no cuadran. Y, desde luego, no porque la muerte parezca repentinamente atractiva. La persona en quien su agonía invisible alcanza un nivel insoportable se suicidará de la misma manera que una persona atrapada acabará saltando desde la ventana de un rascacielos en llamas. No se equivoquen sobre la gente que salta desde ventanas en llamas. Su terror a caer desde una gran altura sigue siendo tan grande como lo sería para usted o para mí parados especulativamente en la misma ventana contemplando la vista; es decir, el miedo a caer permanece constante. La variable aquí es el otro terror, las llamas del fuego: cuando las llamas se acercan lo suficiente, caer hasta la muerte se convierte en el terror ligeramente menos terrible de dos. No es desear la caída; es terror a las llamas. Y, sin embargo, nadie en la acera, mirando hacia arriba y gritando \"¡No!\" y \"¡Aguanta!\", pueden entender el salto. No realmente. Tendrías que haber estado atrapado y haber sentido las llamas para comprender de verdad un terror mucho más allá de la caída.",
  "autor": "David Foster Wallace",
  " etiquetas": " ['depresión', 'suicidio']"
 },
 {
  "cita": " Todos buscamos a esa persona especial que sea perfecta para nosotros. Pero si has tenido suficientes relaciones, empiezas a sospechar que no existe la persona ideal, solo diferentes tipos de errores. ¿Por qué? Porque tú mismo estás equivocado de alguna manera, y buscas parejas que estén equivocadas de alguna manera complementaria. Pero se necesita mucha experiencia para madurar plenamente en tu propia incorrección. Y no es hasta que finalmente te enfrentas a tus demonios más profundos, tus problemas irresolubles —los que te hacen verdaderamente quien eres— que estamos listos para encontrar una pareja para toda la vida. Solo entonces sabes finalmente lo que estás buscando. Estás buscando a la persona equivocada. Pero no a cualquier persona equivocada: tiene que ser la persona equivocada correcta, alguien a quien mires con amor y pienses: \"Este es el problema que quiero tener\". Encontraré a esa persona especial que no es adecuada para mí, de la manera correcta.",
  "autor": " Andrés Boyd,",
  " etiquetas": "['ser amado', 'compleción', 'inspirador', 'amor', 'relaciones']"
 },
 {
  "cita": " Las cosas más importantes son las más difíciles de decir. Son aquellas de las que te avergüenzas, porque las palabras las disminuyen; las palabras reducen a tamaño natural lo que parecía infinito cuando estaba en tu cabeza. Pero es más que eso, ¿no? Las cosas más importantes yacen demasiado cerca de dondequiera que esté enterrado tu corazón secreto, como puntos de referencia de un tesoro que a tus enemigos les encantaría robar. Y puedes hacer revelaciones que te cuesten caro solo para que la gente te mire con extrañeza, sin entender en absoluto lo que has dicho, ni por qué pensaste que era tan importante que casi lloraste al decirlo. Eso es lo peor, creo. Cuando el secreto se queda encerrado en tu interior no por falta de quien lo cuente, sino por falta de alguien que lo escuche.",
  "autor": " Stephen King",
  " etiquetas": " ['escribiendo']"
 },

 {
  "cita": "Que haya espacios en su unión, y que los vientos del cielo bailen entre ustedes. Ámense, pero no hagan del amor un lazo: que sea más bien un mar en movimiento entre las orillas de sus almas. Llénense la copa, pero no beban de la misma copa. Compartan su pan, pero no coman del mismo pan. Canten y bailen juntos y sean alegres, pero que cada uno esté solo, como las cuerdas de un laúd están solas aunque vibran con la misma música. Entreguen sus corazones, pero no al cuidado del otro. Porque solo la mano de la Vida puede contener sus corazones. Y permanezcan juntos, pero no demasiado cerca: porque los pilares del templo están separados, y el roble y el ciprés no crecen a la sombra del otro.",

 {
  "cita": "La vida no debería ser un viaje a la tumba con la intención de llegar sano y salvo en un cuerpo bonito y bien conservado, sino más bien derrapar de costado en una nube de humo, completamente agotado, totalmente desgastado, y proclamando a gritos \"¡Guau! ¡Menudo viaje!\".",

 {

 {
  "cita": "Los hombres siempre dicen eso como el cumplido definitivo, ¿verdad? Es una chica genial. Ser la Chica Genial significa que soy una mujer atractiva, brillante y divertida que adora el fútbol, el póker, los chistes verdes y eructar, que juega videojuegos, bebe cerveza barata, le encantan los tríos y el sexo anal, y se mete perritos calientes y hamburguesas en la boca como si fuera la anfitriona del gang bang culinario más grande del mundo mientras, de alguna manera, mantiene una talla 2, porque las Chicas Geniales son, sobre todo, atractivas. Atrevidas y comprensivas. Las Chicas Geniales nunca se enfadan; solo sonríen con disgusto y cariño, y dejan que sus hombres hagan lo que quieran. Anda, cálmate, no me importa, soy la Chica Genial. Los hombres de verdad creen que esta chica existe. Quizás se engañan porque tantas mujeres están dispuestas a fingir serlo. Durante mucho tiempo, Chica Genial me ofendió. Solía ver a hombres —amigos, compañeros de trabajo, desconocidos— entusiasmados con estas horribles impostoras, y me daban ganas de sentarme con ellos y decirles con calma: «No estás saliendo con una...» Mujer, estás saliendo con una mujer que ha visto demasiadas películas escritas por hombres socialmente torpes que les gustaría creer que este tipo de mujer existe y que podría besarlos. Me dan ganas de agarrar al pobre tipo por las solapas o la bandolera y decirle: «A esa zorra no le gustan tanto los perritos calientes con chili, ¡a nadie le gustan tanto!». Y las Chicas Guapas son aún más patéticas: ni siquiera fingen ser la mujer que quieren ser, fingen ser la mujer que un hombre quiere que sean. Ah, y si no eres una Chica Guapa, te ruego que no creas que tu hombre no quiere a la Chica Guapa. Puede ser una versión ligeramente diferente: quizá sea vegetariano, así que a la Chica Guapa le encanta el seitán y es genial con los perros; o quizá sea un artista hipster, así que la Chica Guapa es una nerd tatuada y con gafas que adora los cómics. Hay variaciones en la fachada, pero créeme, él quiere a la Chica Guapa, que es básicamente la chica a la que le gusta todo lo que a él le gusta y nunca... Quejarse. (¿Cómo sabes que no eres una chica cool? Porque dice cosas como: \"Me gustan las mujeres fuertes\". Si te dice eso, en algún momento se acostará con otra. Porque \"Me gustan las mujeres fuertes\" es código para \"Odio a las mujeres fuertes\").",
  "autor": "Gillian Flynn,",
  " etiquetas": " ['lo que los hombres realmente quieren']"
 },

  "autor": " A. A. Milne,",

 },
 {
  "cita": " veces el destino es como una pequeña tormenta de arena que cambia de dirección constantemente. Cambias de dirección, pero la tormenta te persigue. Giras de nuevo, pero la tormenta se ajusta. Repites esto una y otra vez, como una danza siniestra con la muerte justo antes del amanecer. ¿Por qué? Porque esta tormenta no es algo que haya llegado desde lejos, algo que no tenga nada que ver contigo. Esta tormenta eres tú. Algo dentro de ti. Así que todo lo que puedes hacer es rendirte, adentrarte en la tormenta, cerrando los ojos y tapándote los oídos para que no entre la arena, y atravesarla, paso a paso. Allí no hay sol, ni luna, ni dirección, ni sentido del tiempo. Solo arena blanca y fina que se arremolina en el cielo como huesos pulverizados. Ese es el tipo de tormenta de arena que necesitas imaginar. Y realmente tendrás que superar esa tormenta violenta, metafísica y simbólica. No importa cuán metafísica o simbólica sea, no te equivoques: cortará la carne como mil cuchillas de afeitar. La gente sangrará allí, y tú... También sangrará. Sangre caliente y roja. Te mancharás las manos con esa sangre, tu propia sangre y la de otros. Y cuando pase la tormenta, no recordarás cómo la superaste, cómo sobreviviste. Ni siquiera estarás seguro, de hecho, de si la tormenta ha terminado realmente. Pero una cosa es segura: cuando salgas de ella, no serás la misma persona que entró. De eso se trata esta tormenta.",
  "autor": " Haruki Murakami,"
 },
 {
  "cita": "Hay una soledad tan grande en este mundo que se puede ver en el lento movimiento de las manecillas de un reloj. Gente tan cansada, mutilada ya sea por amor o por falta de amor. Las personas simplemente no son buenas entre sí. Los ricos no son buenos con los ricos, los pobres no son buenos con los pobres. Tenemos miedo. Nuestro sistema educativo nos dice que todos podemos ser grandes ganadores. No nos ha hablado de las alcantarillas ni de los suicidios, ni del terror de una persona que se acuesta en un lugar, sola, intacta, sin que nadie le diga que riega una planta.",
  "autor": " Charles Bukowski,"
 },
 {

 {
  "cita": "“Nunca fracasas hasta que dejas de intentarlo”.",
  "autor": " Albert Einstein",
  " etiquetas": " ['inspirador']"
 },
 {
  "cita": "Para mí, los árboles siempre han sido los predicadores más penetrantes. Los venero cuando viven en tribus y familias, en bosques y arboledas. Y aún más los venero cuando están solos. Son como personas solitarias. No como ermitaños que se han escabullido por alguna debilidad, sino como grandes hombres solitarios, como Beethoven y Nietzsche. En sus ramas más altas susurra el mundo, sus raíces descansan en el infinito; pero no se pierden allí, luchan con todas las fuerzas de sus vidas por una sola cosa: realizarse según sus propias leyes, construir su propia forma, representarse a sí mismos. Nada es más sagrado, nada es más ejemplar que un árbol hermoso y fuerte. Cuando un árbol es talado y revela su herida mortal al sol, se puede leer toda su historia en el disco luminoso e inscrito de su tronco: en los anillos de sus años, sus cicatrices, toda la lucha, todo el sufrimiento, toda la enfermedad, toda la felicidad y la prosperidad están verdaderamente escritas, los años estrechos y Los años lujosos, los ataques soportados, las tormentas soportadas. Y todo joven campesino sabe que la madera más dura y noble tiene los anillos más estrechos, que en lo alto de las montañas y en constante peligro crecen los árboles más indestructibles, los más fuertes, los ideales. Los árboles son santuarios. Quien sabe cómo hablarles, quien sabe cómo escucharlos, puede aprender la verdad. No predican erudición ni preceptos, predican, sin inmutarse por los detalles, la antigua ley de la vida. Un árbol dice: «Hay una semilla escondida en mí, una chispa, un pensamiento, soy vida de la vida eterna. El intento y el riesgo que la madre eterna corrió conmigo son únicos, únicos la forma y las venas de mi piel, único el más mínimo juego de hojas en mis ramas y la más mínima cicatriz en mi corteza. Fui hecho para formar y revelar lo eterno en mi más mínimo detalle especial. Un árbol dice: «Mi fuerza es la confianza. No sé nada de mis padres, no sé nada de los mil hijos que cada año brotan de mí. Vivo el secreto de mi semilla hasta el final, y No me importa nada más. Confío en que Dios está en mí. Confío en que mi labor es santa. De esta confianza vivo. Cuando estamos afligidos y ya no podemos soportar nuestras vidas, entonces un árbol tiene algo que decirnos: ¡Callen! ¡Callen! ¡Mírenme! La vida no es fácil, la vida no es difícil. Esos son pensamientos infantiles. Deja que Dios hable dentro de ti y tus pensamientos se acallarán. Estás ansioso porque tu camino te aleja de la madre y del hogar. Pero cada paso y cada día te llevan de vuelta a la madre. El hogar no está ni aquí ni allá. El hogar está dentro de ti, o el hogar no está en ninguna parte. Un anhelo de vagar me desgarra el corazón cuando oigo el susurro de los árboles en el viento al atardecer. Si uno los escucha en silencio durante mucho tiempo, este anhelo revela su esencia, su significado. No se trata tanto de escapar del propio sufrimiento, aunque pueda parecerlo. Es un anhelo de hogar, de un recuerdo de la madre, de nuevas metáforas para la vida. Conduce a casa. Cada camino conduce a casa, cada paso es nacimiento, Cada paso es muerte, cada tumba es madre. Así susurra el árbol al anochecer, cuando nos detenemos inquietos ante nuestros pensamientos infantiles: los árboles tienen pensamientos largos, profundos y apacibles, como vidas más largas que las nuestras. Son más sabios que nosotros mientras no los escuchemos. Pero cuando aprendemos a escuchar a los árboles, la brevedad, la rapidez y la precipitación infantil de nuestros pensamientos alcanzan una alegría incomparable. Quien ha aprendido a escuchar a los árboles ya no quiere ser un árbol. No quiere ser nada más que lo que es. Eso es el hogar. Eso es la felicidad.",
  "autor": "Herman Hesse,",
  " etiquetas": " ['eternidad', 'miedo', 'bosques', 'historia', 'santidad', 'hogar', 'vida', 'anhelo', 'poeta', 'raíces', 'autodescubrimiento', 'espiritualidad', 'fuerza', 'árboles', 'confianza']"
 },

 {
  "cita": "Mira de nuevo ese punto. Eso es aquí. Eso es nuestro hogar. Eso somos nosotros. En él, todos los que amas, todos los que conoces, todos los que alguna vez oíste hablar, cada ser humano que existió, vivió su vida. El conjunto de nuestra alegría y sufrimiento, miles de religiones, ideologías y doctrinas económicas seguras de sí mismas, cada cazador y recolector, cada héroe y cobarde, cada creador y destructor de civilizaciones, cada rey y campesino, cada joven pareja enamorada, cada madre y padre, cada niño esperanzado, inventor y explorador, cada maestro de moral, cada político corrupto, cada \"superestrella\", cada \"líder supremo\", cada santo y pecador en la historia de nuestra especie vivió allí, en una mota de polvo suspendida en un rayo de sol. La Tierra es un escenario muy pequeño en una vasta arena cósmica. Piensa en las infinitas crueldades que los habitantes de un rincón de este píxel infligen a los habitantes apenas distinguibles de otro rincón, cuán frecuentes son sus malentendidos, cuán ansiosos están por matarse entre sí, cuán fervientes son sus odios. Piensa en los ríos. De la sangre derramada por todos esos generales y emperadores para que, en la gloria y el triunfo, pudieran convertirse en los dueños momentáneos de una fracción de punto. Nuestras posturas, nuestra supuesta autoimportancia, la ilusión de que tenemos una posición privilegiada en el Universo, se ven desafiadas por este punto de luz tenue. Nuestro planeta es una mota solitaria en la gran oscuridad cósmica que nos envuelve. En nuestra oscuridad, en toda esta inmensidad, no hay indicio de que llegue ayuda de otro lugar para salvarnos de nosotros mismos. La Tierra es el único mundo conocido hasta ahora que alberga vida. No hay ningún otro lugar, al menos en un futuro cercano, al que nuestra especie pueda migrar. Visitar, sí. Establecerse, todavía no. Nos guste o no, por el momento la Tierra es donde nos establecemos. Se ha dicho que la astronomía es una experiencia que nos hace humildes y que forma el carácter. Quizás no haya mejor demostración de la locura de las vanidades humanas que esta imagen distante de nuestro pequeño mundo. Para mí, subraya nuestra responsabilidad de tratarnos con más amabilidad unos a otros y de preservar y Apreciamos el punto azul pálido, el único hogar que hemos conocido”.",
  "autor": "Carl Sagan,",
  " etiquetas": " ['tierra', 'perspectiva', 'espacio']"
 },

 {
  "cita": " “El éxito es gustarte a ti mismo, gustarte lo que haces y gustarte cómo lo haces”.",
  "autor": " Maya Angelou"
 },
 {
  "cita": "La paradoja de nuestra época histórica es que tenemos edificios más altos, pero temperamentos más cortos; autopistas más anchas, pero perspectivas más estrechas. Gastamos más, pero tenemos menos; compramos más, pero disfrutamos menos. Tenemos casas más grandes y familias más pequeñas, más comodidades, pero menos tiempo. Tenemos más títulos, pero menos sentido común; más conocimiento, pero menos juicio; más expertos, pero más problemas; más medicina, pero menos bienestar. Bebemos demasiado, fumamos demasiado, gastamos demasiado imprudentemente, reímos muy poco, conducimos demasiado rápido, nos enojamos demasiado, nos desvelamos demasiado, nos levantamos demasiado cansados, leemos muy poco, vemos demasiada televisión y rezamos muy poco. Hemos multiplicado nuestras posesiones, pero reducido nuestros valores. Hablamos demasiado, amamos muy poco y odiamos con demasiada frecuencia. Hemos aprendido a ganarnos la vida, pero no a vivir. Hemos añadido años a la vida, no vida a los años. Hemos ido a la luna y de regreso, pero nos cuesta cruzar la calle para encontrarnos con un nuevo vecino. Conquistamos el espacio exterior, pero no el interior. Hemos hecho... Cosas más importantes, pero no mejores. Hemos limpiado el aire, pero contaminado el alma. Hemos conquistado el átomo, pero no nuestros prejuicios. Escribimos más, pero aprendemos menos. Planificamos más, pero logramos menos. Hemos aprendido a apresurarnos, pero no a esperar. Construimos más computadoras para almacenar más información, para producir más copias que nunca, pero nos comunicamos cada vez menos. Estos son tiempos de comida rápida y digestión lenta, hombres corpulentos y carácter pequeño, ganancias desorbitadas y relaciones superficiales. Estos son tiempos de dos sueldos, pero más divorcios, casas más lujosas, pero hogares rotos. Estos son tiempos de viajes rápidos, pañales desechables, moralidad desechable, relaciones de una noche, cuerpos con sobrepeso y pastillas que lo hacen todo, desde alegrar, calmar y matar. Es una época en la que hay mucho en el escaparate y nada en el almacén. Una época en la que la tecnología puede traerte esta carta, y una época en la que puedes elegir entre compartir esta idea o simplemente borrarla... Recuerda, pasa tiempo con tus seres queridos, porque ya no estarán. Para siempre. Recuerda, dile una palabra amable a alguien que te admira, porque esa personita pronto crecerá y se irá de tu lado. Recuerda abrazar con cariño a quien tienes a tu lado, porque ese es el único tesoro que puedes dar con el corazón y no cuesta nada. Recuerda decir \"Te amo\" a tu pareja y a tus seres queridos, pero sobre todo, dilo en serio. Un beso y un abrazo sanan el dolor cuando nacen de lo más profundo. Recuerda tomarse de la mano y atesorar el momento, porque algún día esa persona podría no estar. ¡Dale tiempo al amor, da tiempo a la palabra! Y da tiempo a compartir los pensamientos más preciados que tienes en la mente.",
  "autor": "Bob Moorehead,",
  " etiquetas": " ['mal atribuido a george carlin']"
 },

 {
  "cita": "Mamá, tengo algo que decirte. Soy un no-muerto. Sé que quizá tengas ideas preconcebidas sobre los no-muertos. Sé que quizá no te sientas cómoda con la idea de que sea un no-muerto. Pero estoy aquí para decirte que los no-muertos son como tú y como yo... bueno, vale. Quizás más como yo que tú.",

 },
 {
  "cita": "Ya no puedo escuchar en silencio. Debo hablarte por los medios a mi alcance. Me traspasas el alma. Soy mitad agonía, mitad esperanza. No me digas que llego demasiado tarde, que sentimientos tan preciosos se han ido para siempre. Me ofrezco a ti de nuevo con un corazón aún más tuyo que cuando casi lo rompiste, hace ocho años y medio. No te atrevas a decir que el hombre olvida antes que la mujer, que su amor tiene una muerte más temprana. No he amado a nadie más que a ti. Puede que haya sido injusto, débil y resentido, pero nunca inconstante. Solo tú me has traído a Bath. Solo para ti, pienso y planeo. ¿No lo has visto? ¿Es posible que no hayas comprendido mis deseos? Si no hubiera esperado ni siquiera estos diez días, ¿podría haber leído tus sentimientos, como creo que tú debiste haber penetrado los míos? Apenas puedo escribir. A cada instante oigo algo que me abruma. Bajas la voz, pero puedo distinguir los tonos de esa voz cuando otros los perderían. ¡Demasiado bueno, demasiado excelente criatura! Justicia para nosotros, en efecto. Crees que existe verdadero apego y constancia entre los hombres. Créelo ferviente, inquebrantable, en FWI. Debo partir, inseguro de mi destino; pero regresaré aquí, o seguiré a tu grupo, tan pronto como sea posible. Una palabra, una mirada, bastarán para decidir si entro en la casa de tu padre esta noche o nunca.",
  "autor": " Jane Austen,",
  " etiquetas": "['romance']"
 },

  "cita": "Se oyó un ruido metálico cuando los colmillos de basilisco cayeron en cascada de los brazos de Hermione. Corriendo hacia Ron, se los echó al cuello y lo besó en la boca. Ron arrojó los colmillos y la escoba que sostenía y respondió con tal entusiasmo que levantó a Hermione del suelo. \"¿Es este el momento?\", preguntó Harry débilmente, y cuando no ocurrió nada más que Ron y Hermione se abrazaron con más fuerza y se tambalearon en el sitio, alzó la voz. \"¡Oye! ¡Hay una guerra aquí! —Ron y Hermione se separaron, aún abrazados—. Ya lo sé, amigo —dijo Ron, que parecía como si le hubieran dado un golpe en la nuca con una bludger—. Así que es ahora o nunca, ¿no? —Olvídate de eso, ¿qué hay del Horrocrux? —gritó Harry—. ¿Crees que podrías simplemente... aguantarte hasta que tengamos la diadema? —Sí... claro... lo siento —dijo Ron, y él y Hermione se pusieron a recoger colmillos, ambos con la cara roja.",

 {
  "cita": " \"¿Se queda junto a la ventana murmurando sobre sangre?\", preguntó Simon. \"No\", dijo Jace. \"A veces se sienta en el sofá y lo hace\".",

 {
  "cita": "No me interesa a qué te dedicas. Quiero saber qué anhelas y si te atreves a soñar con satisfacer el anhelo de tu corazón. No me interesa tu edad. Quiero saber si te arriesgarás a parecer un tonto por amor, por tu sueño, por la aventura de estar vivo. No me interesa qué planetas están en cuadratura con tu luna. Quiero saber si has tocado el centro de tu propio dolor, si las traiciones de la vida te han abierto o si te has marchitado y cerrado por miedo a más dolor. Quiero saber si puedes soportar el dolor, el mío o el tuyo, sin moverte para ocultarlo, atenuarlo o arreglarlo. Quiero saber si puedes estar con la alegría, la mía o la tuya, si puedes bailar con desenfreno y dejar que el éxtasis te llene hasta la punta de los dedos de las manos y los pies sin advertirnos que tengamos cuidado, que seamos realistas, que recordemos las limitaciones de ser humanos. No me interesa si la historia que me cuentas es verdadera. Quiero saber si puedes decepcionar a otro para ser fiel a ti mismo; si puedes soportar la acusación de traición y no traicionar tu propia alma; si puedes ser infiel y, por lo tanto, digno de confianza. Quiero saber si puedes ver la belleza incluso cuando no es bonita, todos los días, y si puedes encontrar tu propia vida en su presencia. Quiero saber si puedes vivir con el fracaso, el tuyo y el mío, y aun así pararte al borde del lago y gritarle a la plateada luna llena: \"¡Sí!\". No me interesa saber dónde vives ni cuánto dinero tienes. Quiero saber si puedes levantarte, después de una noche de dolor y desesperación, cansado y magullado hasta los huesos, y hacer lo necesario para alimentar a los niños. No me interesa a quién conoces ni cómo llegaste aquí. Quiero saber si estarás en el centro del fuego conmigo y no te acobardarás. No me interesa dónde, qué ni con quién has estudiado. Quiero saber qué te sostiene, desde dentro, cuando todo lo demás se derrumba. Quiero “Para saber si puedes estar solo contigo mismo y si realmente te gusta la compañía que tienes en los momentos vacíos”.",
  "autor": "Soñador de la montaña Oriah",
  " etiquetas": " ['inspirador']"
 },

  "cita": "Isabelle se acercó, con Jace a un paso detrás. Llevaba un vestido negro largo con botas y un abrigo aún más largo de suave terciopelo verde, color musgo. \"¡No puedo creer que lo hayas hecho!\", exclamó. \"¿Cómo conseguiste que Magnus dejara irse a Jace?\" \"Lo intercambiaste por Alec\", dijo Clary. Isabelle pareció algo alarmada. \"¿No para siempre?\" \"No\", dijo Jace. \"Solo por unas horas. A menos que no vuelva\", añadió pensativo. \"En ese caso, quizá sí se quede con Alec. Piénsalo como un contrato de arrendamiento con opción a compra\". Isabelle parecía dudosa. \"Mamá y papá no estarán contentos si se enteran\". \"¿Que liberaste a un posible criminal intercambiando a tu hermano con un brujo que parece un Sonic the Hedgehog gay y se viste como el Atrapa-Niño de Chitty Chitty Bang Bang?\", preguntó Simon. \"No, probablemente no\".",

 {
  "cita": " ¿Así que eres tú y una jeringa contra el Capitolio? ¿Ves? Por eso nadie te deja hacer los planes.",

  " etiquetas": " ['cita impresionante', 'haymitch']"

 {
  "cita": "Clary, a pesar de todo, no soporto la idea de perder este anillo para siempre, como tampoco soporto la idea de dejarte para siempre. Y aunque no tengo elección sobre lo uno, al menos puedo elegir sobre lo otro. Te dejo nuestro anillo familiar porque tienes tanto derecho a él como yo. Escribo esto viendo salir el sol. Duermes, los sueños se mueven tras tus párpados inquietos. Ojalá supiera lo que piensas. Ojalá pudiera colarme en tu cabeza y ver el mundo como tú lo ves. Ojalá pudiera verme a mí misma como tú lo ves. Pero quizá no quiero verlo. Quizá me haría sentir aún más de lo que ya siento, que estoy perpetuando una especie de Gran Mentira sobre ti, y no podría soportarlo. Te pertenezco. Podrías hacer lo que quisieras conmigo y yo te lo permitiría. Podrías pedirme lo que fuera y me rompería intentando hacerte feliz. Mi corazón me dice que esta es la mejor y más grande sensación que he tenido. Pero mi mente sabe la diferencia entre querer... Lo que no puedes tener y desear lo que no deberías querer. Y yo no debería quererte. Toda la noche te he visto dormir, he visto la luz de la luna ir y venir, proyectando sus sombras en blanco y negro sobre tu rostro. Nunca he visto nada más hermoso. Pienso en la vida que podríamos haber tenido si las cosas fueran diferentes, una vida donde esta noche no sea un evento singular, separado de todo lo demás real, sino cada noche. Pero las cosas no son diferentes, y no puedo mirarte sin sentir que te he engañado para que me ames. La verdad que nadie está dispuesto a decir en voz alta es que nadie tiene una oportunidad contra Valentine excepto yo. Puedo acercarme a él como nadie más. Puedo fingir que quiero unirme a él y me creerá, hasta ese último momento en que termine con todo, de una forma u otra. Tengo algo de Sebastian; puedo rastrearlo hasta donde se esconde mi padre, y eso es lo que voy a hacer. Así que te mentí anoche. Dije que solo quería una noche contigo. Pero quiero cada noche contigo. Y por eso tengo que escabullirme por tu ventana ahora, como un cobarde. Porque si tuviera que decírtelo en la cara, no podría irme. No te culpo si me odias, ojalá lo hicieras. Mientras pueda soñar, soñaré contigo. _Jace",

 {

  " etiquetas": " ['vida', 'filosofía', 'filosofía de la vida', 'progreso']"

 {

 },
 {
  "cita": " Y pensé en cuánta gente ha amado esas canciones. Y cuánta gente ha superado momentos difíciles gracias a ellas. Y cuánta gente ha disfrutado de buenos momentos con ellas. Y cuánto significan realmente. Creo que sería genial haber escrito una de esas canciones. Apuesto a que si escribiera una, estaría muy orgulloso. Espero que quienes escribieron esas canciones sean felices. Espero que sientan que es suficiente. De verdad que lo siento porque me han hecho feliz. Y soy solo una persona.",
  "autor": " Esteban Chbosky,",
  " etiquetas": " ['música', 'canciones']"
 },
 {
  "cita": " La vida, se dio cuenta, era como una canción. Al principio hay misterio, al final hay confirmación, pero es en el medio donde reside toda la emoción que hace que todo valga la pena.",
  "autor": " Nicolás Sparks,",
  " etiquetas": " ['vida', 'amor', 'música', 'símil', 'canción']"
 },
 {
  "cita": "“Aprendamos a mostrar nuestra amistad a un hombre cuando está vivo y no después de que esté muerto”.",
  "autor": "F. Scott Fitzgerald,"
 },
 {
  "cita": " No podría decirte si te amé la primera vez que te vi, o si fue la segunda, la tercera o la cuarta. Pero recuerdo el primer momento en que te vi caminando hacia mí y me di cuenta de que, de alguna manera, el resto del mundo parecía desvanecerse cuando estaba contigo.",
  "autor": " Cassandra Clare,",
  " etiquetas": " ['devoción', 'amor', 'amor a primera vista', 'amor verdadero']"
 },
 {
  "cita": "El amor es una locura pasajera, estalla como un volcán y luego se apaga. Y cuando se apaga, tienes que tomar una decisión. Tienes que descubrir si tus raíces se han entrelazado tanto que es inconcebible que alguna vez te separes. Porque esto es el amor. El amor no es ahogo, no es excitación, no es la promulgación de promesas de pasión eterna, no es el deseo de aparearse cada segundo del día, no es desvelarse imaginando que te besa cada rincón del cuerpo. No, no te sonrojes, te estoy diciendo algunas verdades. Eso es simplemente estar \"enamorado\", algo que cualquier tonto puede hacer. El amor mismo es lo que queda cuando el enamoramiento se desvanece, y esto es tanto un arte como un afortunado accidente.",
  "autor": " Shawn Slovo,",
  " etiquetas": " ['amar']"
 },
 {
  "cita": " ¿Qué es lo que expresas en tus ojos? Me parece más que todo lo que he leído en mi vida.",

  " etiquetas": " ['poesía']"
 },

 {

 {
  "cita": " Es solo que la mayoría de la gente guapa es estúpida, así que supero las expectativas. \"Claro, es sobre todo lo bueno que es\", dije. \"Puede ser un poco cegador\", dijo. \"De hecho, cegó a nuestro amigo Isaac\", dije. \"Qué tragedia. ¿Pero puedo evitar mi belleza mortal?\". \"No puedes\". \"Es mi carga, este hermoso rostro\". \"Por no hablar de tu cuerpo\". \"En serio, ni me hables de mi cuerpazo. No quieres verme desnudo, Dave. Verme desnudo dejó a Hazel Grace sin aliento\", dijo, señalando con la cabeza el tanque de oxígeno.",
  "autor": " Juan Verde,",
  " etiquetas": " ['john-green', 'bajo la misma estrella']"
 },
 {
  "cita": "Los cobardes mueren muchas veces antes de morir; los valientes solo prueban la muerte una vez. De todas las maravillas que he oído hasta ahora, me parece la más extraña que los hombres teman, ya que la muerte, un fin necesario, llegará cuando llegue.",

 {
  "cita": " “La felicidad de tu vida depende de la calidad de tus pensamientos”.",
  "autor": " Marco Aurelio,",
  " etiquetas": " ['felicidad']"
 },
 {
  "cita": "Ser o no ser: esa es la cuestión: ¿Es más noble para la mente sufrir los azotes y flechas de la infame fortuna o alzarse contra un mar de problemas y, al oponernos, acabar con ellos? Morir: dormir; nada más; y con un sueño decir que acabamos con la angustia y las mil conmociones naturales que hereda la carne, es una consumación que se desea con devoción. Morir, dormir; dormir: tal vez soñar: sí, ahí está el problema; pues en ese sueño de la muerte, ¿qué sueños pueden surgir cuando nos hayamos deshecho de este cuerpo mortal? Deben hacernos reflexionar: ahí está el respeto que convierte en calamidad una vida tan larga; pues ¿quién soportaría los azotes y las burlas del tiempo, la injusticia del opresor, la contumelia del hombre orgulloso, las angustias del amor despreciado, la demora de la ley, la insolencia del cargo y los desprecios, ese paciente mérito de... ¿Toma indigna, cuando él mismo podría dar su merecido con un simple punzón? ¿Quién soportaría cargas, gruñendo y sudando bajo una vida fatigosa, si el temor a algo después de la muerte, el país desconocido de cuyas fronteras ningún viajero regresa, no confunde la voluntad y nos hace preferir soportar los males que tenemos a huir hacia otros que desconocemos? Así la conciencia nos vuelve a todos cobardes; y así el tono natural de la resolución se empaña con el pálido tono del pensamiento, y las empresas de gran importancia e importancia, con esta consideración, desvían sus corrientes y pierden el nombre de acción. ¡Suavizaos ahora! ¡Hermosa Ofelia! ¡Ninfa, en tus oraciones, sean todos mis pecados recordados!",
  "autor": " William Shakespeare,",
  " etiquetas": "['muerte', 'existencia', 'vida']"
 },
 {

 {
  "cita": "La verdadera historia del Vellocino de Oro: había dos hijos de Zeus, Cadmo y Europa, ¿de acuerdo? Estaban a punto de ser ofrecidos como sacrificios humanos cuando le pidieron a Zeus que los salvara. Entonces Zeus envió un carnero mágico volador con lana dorada, que los recogió en Grecia y los llevó hasta Cólquida, en Asia Menor. Bueno, en realidad, llevó a Cadmo. Europa se cayó y murió en el camino, pero eso no importa. Probablemente sí lo era para ella.",

 },
 {

 {
  "cita": " “Lo mejor para estar triste”, respondió Merlín, empezando a resoplar, “es aprender algo. Eso es lo único que nunca falla. Puedes envejecer y temblar de dolor, puedes desvelarte escuchando el desorden de tus venas, puedes extrañar a tu único amor, puedes ver el mundo a tu alrededor devastado por lunáticos malvados, o saber que tu honor es pisoteado en las cloacas de mentes más bajas. Solo queda una cosa por hacer entonces: aprender. Aprender por qué el mundo se mueve y qué lo mueve. Eso es lo único que la mente nunca puede agotar, nunca alienar, nunca ser torturada por, nunca temer ni desconfiar, y nunca soñar con arrepentirse. Aprender es lo único para ti. Mira cuántas cosas hay por aprender”.",

 {
  "cita": "Quizás la mayor facultad que posee nuestra mente es la capacidad de afrontar el dolor. El pensamiento clásico nos enseña las cuatro puertas de la mente, que cada uno atraviesa según sus necesidades. La primera es la puerta del sueño. Dormir nos ofrece un refugio del mundo y todo su dolor. Dormir marca el paso del tiempo, distanciándonos de las cosas que nos han hecho daño. Cuando una persona resulta herida, a menudo cae inconsciente. De igual manera, alguien que escucha noticias traumáticas a menudo se desmaya. Esta es la forma en que la mente se protege del dolor al cruzar la primera puerta. La segunda es la puerta del olvido. Algunas heridas son demasiado profundas para sanar, o demasiado profundas para sanar rápidamente. Además, muchos recuerdos son simplemente dolorosos y no hay sanación que se pueda lograr. El dicho \"el tiempo cura todas las heridas\" es falso. El tiempo cura la mayoría de las heridas. El resto se esconde tras esta puerta. La tercera es la puerta de la locura. Hay momentos en que la mente recibe un golpe tan fuerte que se esconde en la locura. Aunque esto pueda no parecer beneficioso, lo es. Hay momentos Cuando la realidad no es más que dolor, y para escapar de ese dolor, la mente debe dejar atrás la realidad. Por último, está la puerta de la muerte. El último recurso. Nada puede hacernos daño después de la muerte, o eso nos han dicho.",

  "autor": " Douglas Adams,",
  " etiquetas": "['británico', 'humor', 'ciencia ficción', 'comentario social', 'pulgar', 'toalla']"
 },
 {
  "cita": " No crecemos de forma absoluta ni cronológica. A veces crecemos en una dimensión y no en otra; de forma desigual. Crecemos parcialmente. Somos relativos. Somos maduros en un ámbito, infantiles en otro. El pasado, el presente y el futuro se entremezclan y nos impulsan hacia atrás, hacia adelante o nos fijan en el presente. Estamos hechos de capas, células, constelaciones.",
  "autor": " Anaïs Nin",
  " etiquetas": " ['crecimiento', 'vida', 'madurez']"
 },

 {

  " etiquetas": " ['futuro', 'esperanza']"
 },
 {
  "cita": " “Sólo hay una cosa en el mundo peor que el hecho de que hablen de ti, y es que no hablen de ti”.",
  "autor": " Oscar Wilde,",
  " etiquetas": " ['humor']"
 },
 {
  "cita": "La única manera de vivir es si crecemos. La única manera de crecer es si cambiamos. La única manera de cambiar es si aprendemos. La única manera de aprender es si nos exponemos. Y la única manera de exponernos es si nos exponemos abiertamente. Hazlo. Lánzate.",

 {

  " etiquetas": " ['misterios']"
 },

  " etiquetas": " ['conocer a los demás', 'percepción', 'autoconciencia', 'comprensión']"
 },
 {
  "cita": " “Un propósito de la vida humana, sin importar quién la controle, es amar a quien esté cerca para ser amado”.",
  "autor": " Kurt Vonnegut,",
  " etiquetas": " ['vida', 'amor']"
 },
 {
  "cita": "—No me digas —dijo Jace—. Simon se ha convertido en un ocelote y quieres que haga algo antes de que Isabelle lo convierta en una estola. Bueno, tendrás que esperar a mañana. Estoy fuera de combate. —Se señaló a sí mismo: llevaba un pijama azul con un agujero en la manga—. Mira. Pijama. —Jace —dijo Clary—, esto es importante. —No me digas —dijo—. Tienes una emergencia de dibujo. Necesitas una modelo desnuda. Bueno, no estoy de humor. Siempre puedes preguntarle a Hodge —dijo como si se le ocurriera—. He oído que haría lo que fuera por un... —¡JACE! —lo interrumpió ella, alzando la voz hasta convertirse en un grito—. CÁLLATE UN SEGUNDO Y ESCUCHA, ¿quieres?",
  "autor": " Cassandra Clare,",
  " etiquetas": " ['clary-fray', 'jace-wayland', 'pijamas', 'sarcasmo']"
 },
 {
  "cita": "“Aún a la vuelta de la esquina puede esperar Un nuevo camino o una puerta secreta Y aunque a menudo los he pasado por alto Un día finalmente llegará cuando Tomaré los caminos ocultos que van al Oeste de la Luna, al Este del Sol.”",
  "autor": " J. R. R. Tolkien",
  " etiquetas": " ['libros', 'poesía']"
 },
 {
  "cita": " “Mi mejor amigo es una persona que me dará un libro que no he leído”.",

  " etiquetas": " ['libros']"
 },
 {
  "cita": " Parece tan serena, tan centrada, tan tranquila, pero su mirada permanece fija en el horizonte. Crees saberlo todo sobre ella al conocerla, pero todo lo que crees saber es erróneo. La pasión la recorre como un río de sangre. Solo apartó la mirada un instante, y la máscara se desvaneció, y caíste. Todos tus mañanas empiezan aquí.",
  "autor": " Neil Gaiman,",
  " etiquetas": " ['inspirador', 'poesía']"
 },
 {
  "cita": " Cualquiera que se enamora busca lo que le falta. Por eso, quien está enamorado se entristece al pensar en su pareja. Es como regresar a una habitación de la que guardas buenos recuerdos, una que no has visto en mucho tiempo.",
  "autor": "Murakami, Haruki",
  " etiquetas": " ['amar']"
 },
 {
  "cita": " “La belleza es sólo superficial, pero la fealdad llega hasta los huesos”.",

  " etiquetas": " ['belleza', 'insulto clásico', 'humor', 'fealdad']"
 },

  " etiquetas": " ['arte', 'amor', 'profundo']"
 },
 {
  "cita": " “La mejor parte de la vida de un buen hombre: sus pequeños y anónimos actos de bondad y amor, jamás recordados”.",
  "autor": " William Wordsworth,",
  " etiquetas": " ['final de middlemarch', 'abadía de tintern']"
 },
 {
  "cita": " “La música expresa aquello que no se puede decir y sobre lo cual es imposible callar.”",
  "autor": " Víctor Hugo,",
  " etiquetas": " ['música']"
 },
 {
  "cita": "He llegado a aceptar la sensación de no saber adónde voy. Y me he acostumbrado a amarla. Porque solo cuando estamos suspendidos en el aire sin un aterrizaje a la vista, forzamos nuestras alas a desplegarse y, ¡ay!, emprendemos el vuelo. Y mientras volamos, puede que aún no sepamos adónde vamos. Pero el milagro está en el despliegue de las alas. Puede que no sepas adónde vas, pero sabes que mientras despliegues tus alas, el viento te llevará.",
  "autor": " C. JoyBell C.",
  " etiquetas": " ['creencia', 'dirección', 'fe', 'vuelo', 'volar', 'espíritu de vuelo', 'esperanza', 'inspirador', 'vida inspiradora', 'citas inspiradoras', 'vida', 'vida y vida', 'vivir', 'confianza', 'edificante', 'vientos', 'vientos de vida', 'alas']"
 },

  "autor": " Juan Steinbeck,"
 },

 },

 },
 {
  "cita": " No existen las personas malas. Todos somos personas que a veces hacemos cosas malas.",

 },
 {

  " etiquetas": " ['verdad']"
 },
 {
  "cita": " “Se acerca el invierno.”",
  "autor": " George R. R. Martín,",
  " etiquetas": " ['pronóstico', 'lemas', 'invierno']"
 },
 {
  "cita": "Esto es lo que debes hacer: amar la tierra, el sol y los animales, despreciar las riquezas, dar limosna a quien pida, defender a los estúpidos y locos, dedicar tus ingresos y tu trabajo a los demás, odiar a los tiranos, no discutir sobre Dios, tener paciencia e indulgencia con el pueblo, quitarte el sombrero ante nada conocido o desconocido, ante cualquier hombre o grupo de hombres, relacionarte libremente con personas poderosas e incultas, con los jóvenes y con las madres de familia, leer estas hojas al aire libre en cada estación de cada año de tu vida, reexaminar todo lo que te han dicho en la escuela, la iglesia o en cualquier libro, desechar todo lo que insulte a tu propia alma, y tu propia carne será un gran poema y tendrá la más rica fluidez no solo en sus palabras, sino en las líneas silenciosas de tus labios y rostro, entre las pestañas de tus ojos y en cada movimiento y articulación de tu cuerpo.",
  "autor": " Walt Whitman",
  " etiquetas": " ['activismo', 'servicio']"
 },

 },

 },

  "autor": " Golda Meir",

 },
 {
  "cita": " Si tuviera un mundo propio, todo sería un sinsentido. Nada sería lo que es, porque todo sería lo que no es. Y, por el contrario, lo que es, no sería. Y lo que no fuera, sí lo sería. ¿Lo ves?",

 {
  "cita": " “Cuando todos saben que eres un monstruo, no necesitas perder el tiempo haciendo cada cosa monstruosa”.",
  "autor": " Leigh Bardugo,"
 },
 {
  "cita": "Busco amigos. ¿Qué significa domesticar? —Es un acto que se suele descuidar —dijo el zorro—. Significa crear lazos. —¿Crear lazos? —Eso mismo —dijo el zorro—. Para mí, no eres más que un niño pequeño, igual a cien mil niños. Y no te necesito. Y tú, por tu parte, no me necesitas. Para ti, no soy más que un zorro como cien mil zorros. Pero si me domesticas, nos necesitaremos mutuamente. Para mí, serás único en el mundo. Para ti, yo seré único en el mundo...",
  "autor": " Antoine de Saint-Exupéry,"
 },
 {
  "cita": " “Hay libros cuyas contraportadas y tapas son, con diferencia, lo mejor”.",
  "autor": " Charles Dickens,",
  " etiquetas": " ['libros', 'escritura']"
 },
 {
  "cita": " “Ya había descubierto que no era bueno estar solo, y así busqué compañía en lo que me rodeaba, a veces en el universo y a veces en mi insignificante yo; pero mis libros siempre fueron mis amigos, por mucho que todo lo demás fallara.”",
  "autor": " Josué Slocum,",
  " etiquetas": "['solo', 'libros', 'amigos', 'soledad']"
 },
 {

 },

 },

  "autor": " David Levitán,",

 },
 {
  "cita": " “Tal vez haya una bestia… tal vez seamos sólo nosotros”.",
  "autor": " William Golding,"
 },

  "cita": " Me enamoré de ti, listillo, porque eras uno de nosotros, porque no me tenías miedo y decidiste culminar tu espectacular victoria lanzándole ese hueso a Amarantha como una jabalina. Sentí el espíritu de Cassian a mi lado en ese momento, y podría haber jurado que lo oí decir: «Si no te casas con ella, imbécil, lo haré yo».",

  "autor": " Sylvia Plath,",
  " etiquetas": " ['escribiendo']"
 },
 {
  "cita": " Era el mejor amigo de mis padres. Es un asesino convicto, pero se fugó de una prisión de magos y está prófugo. Le gusta estar en contacto conmigo... estar al tanto de mis noticias... saber si estoy contenta...",
  "autor": " J. K. Rowling,",
  " etiquetas": " ['humor']"
 },
 {
  "cita": "Peeta, dijiste en la entrevista que estabas enamorado de mí desde siempre. ¿Cuándo empezó eso de \"para siempre\"? Ah, veamos. Supongo que el primer día de clase. Teníamos cinco años. Llevabas un vestido rojo a cuadros y el pelo... en dos trenzas en lugar de una. Mi padre te señaló cuando esperábamos para hacer la fila. \"¿Tu padre? ¿Por qué?\". Dijo: \"¿Ves a esa niña? Quería casarme con su madre, pero se escapó con un minero\". \"¿Qué? ¡Te lo estás inventando!\". No, es una historia real. Y yo dije: \"¿Un minero? ¿Para qué quería a un minero si podía tenerte?\". Y él dijo: \"Porque cuando canta... hasta los pájaros se paran a escuchar\".",
  "autor": " Suzanne Collins,"
 },

  "cita": " No hay pecado ni virtud. Solo son cosas que la gente hace.",

 },
 {
  "cita": " “¿No basta con ver que un jardín es bello sin tener que creer que también hay hadas en el fondo?”",
  "autor": " Douglas Adams,",
  " etiquetas": " ['ateísmo', 'religión', 'escéptico']"
 },
 {
  "cita": " —¿Qué es todo esto? —preguntó Clary—. Frascos de agua bendita, cuchillos benditos, hojas de acero y plata —dijo Jace, apilando las armas en el suelo junto a él—, alambre eléctrico (no sirve de mucho ahora, pero siempre viene bien tener repuestos), balas de plata, amuletos de protección, crucifijos, estrellas de David... —Dios mío —dijo Clary—. Dudo que quepa. —Jace. Clary estaba horrorizada.",
  "autor": " Cassandra Clare,",
  " etiquetas": " ['clary-fray', 'humor', 'ironía', 'jace-wayland', 'jesús']"
 },
 {
  "cita": "¿Sabías que durante casi toda la historia de la especie humana, la esperanza de vida promedio fue de menos de treinta años? Se podía contar con unos diez años de verdadera adultez, ¿verdad? No había planificación para la jubilación. No había planificación para una carrera. No había planificación. No había tiempo para planificar. No había tiempo para un futuro. Pero luego la esperanza de vida comenzó a alargarse y la gente empezó a tener cada vez más futuro. Y ahora la vida se ha convertido en el futuro. Cada momento de tu vida se vive para el futuro: vas al instituto para poder ir a la universidad, para conseguir un buen trabajo, para tener una buena casa, para poder enviar a tus hijos a la universidad, para que ellos consigan un buen trabajo, para tener una buena casa, para poder enviar a sus hijos a la universidad.",
  "autor": " Juan Verde,",
  " etiquetas": " ['patrón de vida']"
 },
 {

 },
 {
  "cita": " la gente le preocupa que los niños jueguen con armas y que los adolescentes vean vídeos violentos; tememos que se apodere de ellos algún tipo de cultura de la violencia. A nadie le preocupa que los niños escuchen miles, literalmente miles, de canciones sobre corazones rotos, rechazo, dolor, miseria y pérdida.",
  "autor": " Nick Hornby,",

 },
 {
  "cita": " “Amarse a uno mismo es el comienzo de un romance para toda la vida”.",
  "autor": " Oscar Wilde,",

 },
 {
  "cita": " “Yo soy oxígeno y él se muere por respirar”.",
  "autor": " Tahereh Mafi,",
  " etiquetas": " ['hermoso', 'parejas', 'beso', 'amor', 'metáfora', 'necesito', 'ya']"
 },
 {
  "cita": " “Iba a vivir para siempre o morir en el intento”.",
  "autor": " José Heller,"
 },
 {
  "cita": "Tess, Tess, Tessa. ¿Hubo alguna vez un sonido más hermoso que tu nombre? Pronunciarlo en voz alta hace que mi corazón resuene como una campana. Es extraño imaginarlo, ¿verdad? Un corazón que resuena, pero cuando me tocas, así es como se siente: como si mi corazón retumbara en mi pecho y el sonido me recorriera las venas y me destrozara los huesos de alegría. ¿Por qué he escrito estas palabras en este libro? Por ti. Me enseñaste a amar este libro cuando antes lo había despreciado. Cuando lo leí por segunda vez, con la mente y el corazón abiertos, sentí la más completa desesperación y envidia de Sydney Carton. Sí, Sydney, porque aunque no tuviera ninguna esperanza de que la mujer que amaba lo amara, al menos podía confesarle su amor. Al menos podía hacer algo para demostrarle su pasión, incluso si esa pasión era morir. Habría elegido la muerte por tener la oportunidad de decirte la verdad, Tessa, si hubiera tenido la seguridad de que la muerte sería la mía. Y por eso envidiaba. Sydney, porque era libre. Y ahora por fin soy libre, y por fin puedo decirte, sin temor a que te pongas en peligro, todo lo que siento en mi corazón. No eres el último sueño de mi alma. Eres el primer sueño, el único sueño que no pude evitar soñar. Eres el primer sueño de mi alma, y de ese sueño espero que nazcan todos los demás sueños, los de toda una vida. Con esperanza, al menos, Will Herondale.",
  "autor": " Cassandra Clare,",
  " etiquetas": "['cassandra-clare', 'príncipe-mecánico', 'tessa-gray', 'will-herondale', 'carta-de-will-a-tessa']"
 },
 {
  "cita": " “El mundo es un lugar peligroso para vivir, no por la gente malvada, sino por la gente que no hace nada al respecto”.",

 },
 {

  " etiquetas": " ['dios', 'dolor']"
 },
 {
  "cita": " No soy sentimental; soy tan romántico como tú. La idea, ya sabes, es que la persona sentimental cree que las cosas durarán; la persona romántica tiene una fe ciega en que no lo harán.",

 },

 {

 },
 {

  " etiquetas": " ['inspirador']"

 {
  "cita": " “Posees los cuerpos de otras personas.” Él aceptó la afirmación con un gesto. “¿Quieres poseer mi cuerpo?” “Quiero hacerle muchas cosas a tu cuerpo, pero esa no es una de ellas.”",
  "autor": " Becca Fitzpatrick,",
  " etiquetas": " ['humor', 'nora', 'parche']"
 },
 {
  "cita": " Se inclinó y contempló su rostro sin vida, y Leisel besó a su mejor amigo, Rudy Steiner, con suavidad y sinceridad en los labios. Sabía a polvo y a dulzura. Sabía a arrepentimiento en la sombra de los árboles y en el resplandor de la colección de trajes del anarquista. Lo besó larga y suavemente, y al apartarse, le rozó la boca con los dedos... No se despidió. Era incapaz, y tras unos minutos más a su lado, logró levantarse del suelo. Me asombra lo que los humanos pueden hacer, incluso cuando les corren ríos por la cara y se tambalean...",
  "autor": " Markus Zusak,",
  " etiquetas": "['amor', 'la-ladrona-de-libros']"
 },
 {
  "cita": " Por si sirve de algo: nunca es demasiado tarde ni, en mi caso, demasiado pronto para ser quien quieras ser. No hay límite de tiempo, puedes parar cuando quieras. Puedes cambiar o seguir igual, no hay reglas. Podemos sacarle el máximo provecho o el peor. Espero que lo aproveches al máximo. Y espero que veas cosas que te sorprendan. Espero que sientas cosas que nunca antes sentiste. Espero que conozcas gente con un punto de vista diferente. Espero que vivas una vida de la que te sientas orgulloso. Si descubres que no es así, espero que tengas el coraje de empezar de cero.",
  "autor": " Eric Roth,",
  " etiquetas": " ['benjamin-button', 'cambio', 'coraje', 'tiempo']"
 },
 {

 {
  "cita": " “Hay cosas que no se pueden compartir sin que terminen gustándose, y noquear a un troll de montaña de tres metros y medio es una de ellas”.",
  "autor": " J. K. Rowling,",
  " etiquetas": " ['impresionante', 'amistad', 'inspirador']"
 },
 {
  "cita": "En cierto modo, es bueno saber que existen dioses griegos, porque tienes a alguien a quien culpar cuando las cosas salen mal. Por ejemplo, cuando te alejas de un autobús que acaba de ser atacado por brujas monstruosas y volado por los aires por un rayo, y encima llueve, la mayoría de la gente podría pensar que es pura mala suerte; cuando eres mestizo, entiendes que alguna fuerza divina está intentando arruinarte el día.",
  "autor": " Rick Riordan,",
  " etiquetas": " ['libros', 'humor', 'olímpicos']"
 },
 {
  "cita": " No te enamores de gente como yo. Te llevaré a museos, parques y monumentos, y te besaré en cada lugar hermoso, para que nunca regreses sin sentir mi sabor a sangre en la boca. Te destruiré de la forma más hermosa posible. Y cuando me vaya, por fin entenderás por qué las tormentas llevan nombres de personas.",

 },

  "autor": " Antoine de Saint-Exupéry,",
  " etiquetas": " ['amistad', 'amor', 'responsabilidad']"
 },
 {
  "cita": " “Sólo aquellos que se arriesgan a ir demasiado lejos pueden descubrir hasta dónde se puede llegar”.",

  " etiquetas": " ['poesía']"
 },
 {
  "cita": " “El amor es la ausencia de juicio”.",
  "autor": " Dalai Lama XIV",
  " etiquetas": " ['inspiración']"
 },
 {
  "cita": " En el silencio que siguió, supe que cualquier cosa podía pasar. Podría ser demasiado tarde: otra vez, podría haber perdido mi oportunidad. Pero al menos sabría que lo intenté, que tomé mi corazón y extendí mi mano, fuera cual fuera el resultado. \"De acuerdo\", dijo. Respiró hondo. \"¿Qué harías si pudieras hacer cualquier cosa?\" Di un paso hacia él, acortando la distancia entre nosotros. \"Esto\", dije. Y luego lo besé.",
  "autor": " Sarah Dessen,",
  " etiquetas": "['romance']"
 },
 {
  "cita": "“La biblioteca está habitada por espíritus que salen de las páginas por la noche”.",
  "autor": " Isabel Allende",
  " etiquetas": " ['libros']"
 },
 {

  "autor": " Alan Moore,",

 },
 {

  "autor": " Gilda Radner"
 },
 {
  "cita": " “Las criaturas de afuera miraban del cerdo al hombre, y del hombre al cerdo, y del cerdo al hombre otra vez; pero ya era imposible decir cuál era cuál.”",

  " etiquetas": " ['rebelión en la granja', 'animales', 'línea de cierre', 'hombre', 'satírico']"
 },
 {

  " etiquetas": " ['humanidad', 'nada', 'sabiduría']"
 },
 {
  "cita": "“Una cosa que no puedes ocultar es cuando estás lisiado por dentro”.",
  "autor": " John Lennon",
  " etiquetas": " ['beatles', 'emociones', 'hipocresía', 'dolor', 'sufrimiento']"
 },
 {
  "cita": "Crees que mi primer instinto es protegerte. Porque eres pequeña, o una niña, o una estirada. Pero te equivocas. Acerca su rostro al mío y me rodea la barbilla con los dedos. Su mano huele a metal. ¿Cuándo fue la última vez que sostuvo una pistola o un cuchillo? Siento un hormigueo en la piel al tocarla, como si me transmitiera electricidad. «Mi primer instinto es empujarte hasta que te rompas, solo para ver con cuánta fuerza tengo que presionar», dice, apretando los dedos al oír la palabra «romper». Mi cuerpo se tensa al oír su voz, tan tensa como un resorte, que me olvido de respirar. Sus ojos oscuros se alzan hacia los míos y añade: «Pero me resisto». «¿Por qué...?». Trago saliva. «¿Por qué es ese tu primer instinto?». «El miedo no te paraliza; te despierta. Lo he visto. Es fascinante». Me suelta, pero no se aparta; su mano me roza la mandíbula, el cuello. A veces solo quiero volver a verlo. Quiero verte despierto.",
  "autor": " Verónica Roth,",
  " etiquetas": "['caballería']"
 },
 {
  "cita": " “Pero el que no se atreve a agarrar la espina nunca debe desear la rosa”.",
  "autor": " Anne Brontë",
  " etiquetas": " ['belleza', 'defensas', 'rosas', 'espinas']"
 },
 {
  "cita": " —Entonces, cuando la luna está solo parcialmente llena, ¿te sientes un poco como un lobo? —Se podría decir. —Bueno, puedes sacar la cabeza por la ventanilla si te apetece. —Soy un hombre lobo, no un golden retriever.",
  "autor": " Cassandra Clare",
  " etiquetas": " ['humor']"
 },
 {
  "cita": " “Tienes que saber lo que defiendes, no sólo lo que rechazas”.",
  "autor": "Laurie Halse Anderson,",
  " etiquetas": " ['defender']"
 },
 {
  "cita": " El éxito hace que mucha gente te odie. Ojalá no fuera así. Sería maravilloso disfrutar del éxito sin ver envidia en los ojos de quienes te rodean.",
  "autor": " Marilyn Monroe"
 },
 {
  "cita": " “Sólo los muertos han visto el final de la guerra”.",
  "autor": " Platón",
  " etiquetas": " ['muertos', 'lecciones de vida', 'guerra', 'guerreros']"
 },
 {
  "cita": "“Todos debemos dejar algo al morir”, decía mi abuelo. Un hijo, un libro, un cuadro, una casa, un muro construido, un par de zapatos. O un jardín plantado. Algo que tu mano tocó de alguna manera para que tu alma tenga un lugar adónde ir cuando mueras, y cuando la gente mire ese árbol o esa flor que plantaste, ahí estás. No importa lo que hagas, decía, siempre y cuando cambies algo de cómo era antes de tocarlo a algo que sea como tú después de quitar las manos. La diferencia entre el hombre que solo corta césped y un verdadero jardinero está en el toque, decía. El cortador de césped podría perfectamente no haber estado allí; el jardinero estará allí toda la vida”.",
  "autor": " Ray Bradbury,",
  " etiquetas": " ['morir', 'legado']"
 },
 {
  "cita": " Haz siempre lo correcto. Satisfacerá a la mitad de la humanidad y asombrará a la otra.",
  "autor": " Mark Twain",
  " etiquetas": " ['moralidad']"
 },
 {
  "cita": " “Había otra vida que podría haber tenido, pero estoy teniendo ésta”.",
  "autor": " Kazuo Ishiguro",
  " etiquetas": "['inspirador', 'oportunidades perdidas']"
 },
 {
  "cita": " Nunca podemos juzgar la vida de los demás, porque cada persona solo conoce su propio dolor y renuncia. Una cosa es sentir que vas por buen camino, pero otra muy distinta es pensar que el tuyo es el único.",

 },
 {
  "cita": " “Sigue sonriendo, porque la vida es algo hermoso y hay muchas razones para sonreír”.",

 },
 {

  "autor": " Shmuley Boteach",
  " etiquetas": " ['relaciones']"
 },
 {
  "cita": " Entonces me doy cuenta de lo que es. Es él. Hay algo en él que me hace sentir como si estuviera a punto de caer. O de convertirme en líquido. O de estallar en llamas.",
  "autor": " Verónica Roth,",
  " etiquetas": " ['amar']"
 },
 {
  "cita": " “Dime y lo olvido, enséñame y lo recuerdo, involúcrame y lo aprendo”.",
  "autor": " Benjamín Franklin",
  " etiquetas": " ['aprendizaje', 'mentoría', 'crianza', 'maestro']"
 },
 {
  "cita": "No entenderás lo que quiero decir ahora, pero algún día lo harás: el único truco de la amistad, creo, es encontrar personas mejores que tú —no más inteligentes ni más geniales, sino más amables, más generosas y más comprensivas— y luego apreciarlas por lo que pueden enseñarte, e intentar escucharlas cuando te digan algo sobre ti, por muy malo o bueno que sea, y confiar en ellas, que es lo más difícil de todo. Pero también lo mejor.",
  "autor": " Hanya Yanagihara,"

 {

  " etiquetas": " ['memoria']"
 },
 {
  "cita": " Me pregunto si la nieve ama los árboles y los campos, que los besa con tanta dulzura. Y luego los cubre con una manta blanca; y tal vez dice: \"Duerman, queridos, hasta que llegue el verano\".",

  "cita": "La mejor fantasía está escrita en el lenguaje de los sueños. Está viva como los sueños, más real que la realidad... al menos por un momento... ese largo instante mágico antes de despertar. La fantasía es plata y escarlata, índigo y azul celeste, obsidiana veteada de oro y lapislázuli. La realidad es madera contrachapada y plástico, pintada de marrón barro y verde oliva. La fantasía sabe a habaneros y miel, a canela y clavo, a carne roja poco hecha y a vinos dulces como el verano. La realidad es frijoles y tofu, y ceniza al final. La realidad son los centros comerciales de Burbank, las chimeneas de Cleveland, un estacionamiento en Newark. La fantasía son las torres de Minas Tirith, las antiguas piedras de Gormenghast, los pasillos de Camelot. La fantasía vuela en las alas de Ícaro, la realidad en Southwest Airlines. ¿Por qué nuestros sueños se vuelven mucho más pequeños cuando finalmente se hacen realidad? Leemos fantasía para reencontrar los colores, creo. Para saborear especias fuertes y escuchar las canciones de las sirenas. Hay Algo antiguo y verdadero en la fantasía que nos habla a algo profundo, al niño que soñó que un día cazaría en los bosques de la noche, se deleitaría bajo las colinas cóncavas y encontraría un amor eterno en algún lugar al sur de Oz y al norte de Shangri-La. Que conserven su paraíso. Cuando muera, preferiría ir a la Tierra Media.",

  " etiquetas": " ['libros de fantasía']"

  "cita": "Cuando me siento sola últimamente, pienso: Así que, Liz, siéntete sola. Aprende a manejar la soledad. Haz un mapa de ella. Acéptala, por una vez en tu vida. Bienvenida a la experiencia humana. Pero nunca más uses el cuerpo ni las emociones de otra persona como un poste para rascar tus propios anhelos insatisfechos.",
