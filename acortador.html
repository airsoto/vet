<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Acortador de Enlaces</title>

<style>
    body {
        font-family: Arial, sans-serif;
        background: #121212;
        color: #eee;
        margin: 0;
        padding: 40px;
        text-align: center;
    }
    h1 { color: #4CAF50; }

    .box {
        max-width: 500px;
        margin: auto;
        background: #1f1f1f;
        padding: 20px;
        border-radius: 10px;
        box-shadow: 0 0 10px #000;
    }

    input {
        width: 90%;
        padding: 10px;
        margin: 10px 0;
        border-radius: 5px;
        border: none;
        font-size: 16px;
    }

    button {
        padding: 10px 20px;
        background: #4CAF50;
        border: none;
        color: white;
        font-size: 18px;
        border-radius: 5px;
        cursor: pointer;
    }
    button:hover {
        background: #45a049;
    }

    #shortUrlBox {
        margin-top: 20px;
        padding: 10px;
        background: #222;
        border-radius: 5px;
        word-break: break-all;
    }
</style>

</head>
<body>

<h1>Acortador de Enlaces</h1>

<div class="box">
    <input type="text" id="longUrl" placeholder="Pega aquí el enlace largo">
    <button onclick="shorten()">Acortar</button>

    <div id="shortUrlBox" style="display:none;">
        <p><strong>Tu enlace acortado:</strong></p>
        <a id="shortUrl" href="#" target="_blank" style="color:#4CAF50;"></a>
    </div>
</div>

<script>
// Genera un ID corto aleatorio
function generateID(length = 6) {
    const chars = 'abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
    let out = '';
    for (let i = 0; i < length; i++) {
        out += chars[Math.floor(Math.random() * chars.length)];
    }
    return out;
}

// Función para acortar el enlace
function shorten() {
    const longUrl = document.getElementById("longUrl").value.trim();
    if (!longUrl) {
        alert("Introduce un enlace válido");
        return;
    }

    const id = generateID();

    // Guardar en localStorage
    localStorage.setItem("short_" + id, longUrl);

    // Construir el enlace acortado
    const shortLink = window.location.origin + window.location.pathname + "#" + id;

    // Mostrarlo en la página
    const a = document.getElementById("shortUrl");
    a.innerText = shortLink;
    a.href = shortLink;

    document.getElementById("shortUrlBox").style.display = "block";
}

// Cuando alguien visita un enlace acortado, redirige automáticamente
window.onload = () => {
    const hash = window.location.hash.slice(1);
    if (hash) {
        const url = localStorage.getItem("short_" + hash);
        if (url) window.location.href = url;
    }
};
</script>

</body>
</html>
