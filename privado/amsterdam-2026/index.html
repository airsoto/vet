<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#06101f">
  <meta name="color-scheme" content="dark">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="description" content="Itinerario interactivo del viaje a Ámsterdam 2026.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Amsterdam 2026">
  <meta name="format-detection" content="telephone=no">
  <title>Ámsterdam 2026 · Itinerario</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <section class="lock" id="lockScreen">
    <div class="lock-card">
      <div class="lock-badge">🇳🇱 Viaje privado</div>
      <h1>Ámsterdam<br><span>17–20 junio 2026</span></h1>
      <p>Introduce la contraseña para abrir el itinerario interactivo del viaje.</p>
      <form id="unlockForm" class="unlock-form">
        <label for="password">Contraseña</label>
        <div class="unlock-row">
          <input id="password" type="password" autocomplete="current-password" placeholder="Contraseña" required>
          <button type="submit">Entrar</button>
        </div>
        <label class="remember">
          <input id="rememberDevice" type="checkbox">
          <span>Recordar en este iPhone</span>
        </label>
      </form>
      <div class="lock-hint">El contenido está cifrado en el navegador. No guardes aquí datos más sensibles de lo necesario.</div>
      <div class="lock-error" id="lockError" role="alert"></div>
    </div>
  </section>

  <div class="app hidden" id="appShell">
    <header class="topbar">
      <div class="topbar-inner">
        <a class="brand" href="#overview" aria-label="Ir al resumen">
          <span class="brand-icon">🇳🇱</span>
          <span><strong>Ámsterdam 2026</strong><small id="topStatus">Itinerario familiar</small></span>
        </a>
        <button class="ghost small" id="lockAgain" type="button" aria-label="Cerrar itinerario">🔒</button>
      </div>
      <div class="search-wrap">
        <span>🔎</span>
        <input id="globalSearch" type="search" placeholder="Buscar: Van Gogh, Loetje, muelle, vuelo…" autocomplete="off">
      </div>
    </header>

    <main>
      <section id="overview" class="hero section"></section>
      <nav id="dayTabs" class="day-tabs" aria-label="Días del viaje"></nav>
      <section id="dayDetail" class="section"></section>
      <section id="searchResults" class="section hidden"></section>
      <section id="booking" class="section"></section>
      <section id="sites" class="section"></section>
      <section id="food" class="section"></section>
      <section id="flights" class="section"></section>
      <section id="planb" class="section"></section>
      <section id="budget" class="section"></section>
    </main>

    <nav class="bottom-nav" aria-label="Navegación rápida">
      <a href="#overview"><span>🏠</span><strong>Inicio</strong></a>
      <a href="#dayDetail"><span>📅</span><strong>Día</strong></a>
      <a href="#sites"><span>🧭</span><strong>Sitios</strong></a>
      <a href="#food"><span>🍽️</span><strong>Comer</strong></a>
      <a href="#planb"><span>☔</span><strong>Plan B</strong></a>
    </nav>
  </div>

  <script src="trip-data.enc.js"></script>
  <script src="app.js" defer></script>
</body>
</html>
