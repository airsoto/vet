-shadow:var(--shadow)}.hero-card:before{content:"";position:absolute;right:-90px;top:-110px;width:260px;height:260px;background:radial-gradient(circle,#e9b95838,transparent 66%)}.kicker{display:inline-flex;border:1px solid #e9b95838;background:#e9b95813;color:#ffe4a6;border-radius:999px;padding:7px 11px;font-size:.82rem;font-weight:900}.hero h2{margin:14px 0 7px;font-size:clamp(2rem,9vw,4.2rem);line-height:.98;letter-spacing:-.06em}.hero p{margin:0;color:var(--muted);max-width:780px}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-top:18px}.metric{min-height:80px;padding:12px;border:1px solid var(--line);border-radius:18px;background:var(--soft)}.metric span{display:block;color:var(--muted);font-size:.72rem;font-weight:800}.metric strong{display:block;margin-top:5px;font-size:.94rem}.alert{margin-top:13px;padding:13px 14px;border:1px solid #e9b95833;border-radius:18px;background:#e9b95812;color:#f4ddb0}.quick-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-top:13px}.quick{padding:13px;border:1px solid var(--line);border-radius:18px;background:var(--soft)}.quick span{display:block;color:var(--gold);font-size:.78rem;font-weight:900}.quick strong{display:block;margin:4px 0}.quick small{color:var(--muted)}.day-tabs{position:sticky;top:121px;z-index:30;width:min(var(--max),calc(100% - 24px));margin:auto;padding:10px 0;display:flex;gap:7px;overflow-x:auto;scrollbar-width:none}.day-tabs::-webkit-scrollbar{display:none}.day-tab{flex:0 0 auto;min-height:43px;padding:8px 13px;border:1px solid var(--line);border-radius:999px;background:#0c1720ed;color:var(--muted);font-weight:900;cursor:pointer}.day-tab.active{border-color:transparent;background:linear-gradient(135deg,var(--red),var(--gold));color:white}.section-title{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-bottom:12px}.section-title h2{margin:0;font-size:1.55rem;letter-spacing:-.03em}.section-title p{margin:3px 0 0;color:var(--muted);font-size:.9rem}.day-head{padding:20px;border:1px solid var(--line);border-radius:27px;background:linear-gradient(145deg,#ce43521c,#4c936c15)}.day-head h2{margin:9px 0 4px;font-size:1.8rem}.day-head p{margin:0;color:var(--muted)}.timeline{position:relative;display:grid;gap:10px;margin-top:14px}.timeline:before{content:"";position:absolute;left:25px;top:20px;bottom:20px;width:2px;background:linear-gradient(var(--gold),#70bce333)}.event{position:relative;display:grid;grid-template-columns:52px 1fr;gap:10px;padding:12px;border:1px solid var(--line);border-radius:21px;background:#ffffff0b}.event-dot{z-index:1}.event-icon{width:40px;height:40px;display:grid;place-items:center;border:1px solid var(--line);border-radius:14px;background:#15242e;font-size:1.12rem}.event-time{display:block;margin-top:5px;color:var(--gold);font-size:.68rem;font-weight:900;text-align:center}.event h3{margin:0 0 5px;font-size:1.01rem}.event p{margin:0;color:var(--muted);font-size:.88rem}.meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.actions{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}.actions a{display:inline-flex;align-items:center;min-height:34px;padding:7px 9px;border:1px solid var(--line);border-radius:11px;background:#ffffff0d;font-size:.79rem;font-weight:850}.actions a.web{border-color:#e9b95838;color:#ffe2a0}.meal{margin-top:18px}.meal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:9px}.meal-head h3{margin:0;font-size:1.08rem}.grid{display:grid;gap:11px}.two{grid-template-columns:repeat(2,1fr)}.three{grid-template-columns:repeat(3,1fr)}.card{padding:15px;border:1px solid var(--line);border-radius:var(--r);background:var(--panel);box-shadow:0 10px 27px #0003}.restaurant{display:grid;gap:6px}.restaurant h3{margin:0}.restaurant p{margin:0;color:var(--muted);font-size:.87rem}.restaurant .why{color:#dce5ea}.place-emoji{width:43px;height:43px;display:grid;place-items:center;border:1px solid var(--line);border-radius:14px;background:#ffffff10;font-size:1.2rem}.pick{padding:13px;border:1px solid #e9b95830;border-radius:18px;background:#e9b9580f}.pick strong{display:block;color:#ffe2a0}.pick span{display:block;margin-top:3px;color:var(--muted);font-size:.87rem}.place-list{display:grid;gap:10px}.place{display:grid;grid-template-columns:auto 1fr;gap:11px;padding:14px;border:1px solid var(--line);border-radius:20px;background:#ffffff0a}.place h3{margin:0 0 3px}.place p{margin:0;color:var(--muted);font-size:.87rem}.filters{display:flex;gap:7px;overflow-x:auto;margin-bottom:11px;scrollbar-width:none}.filter{flex:0 0 auto;border:1px solid var(--line);border-radius:999px;background:var(--soft);color:var(--muted);padding:8px 11px;font-weight:850;cursor:pointer}.filter.active{color:white;border-color:#70bce34d;background:#70bce31b}.flight{padding:16px;border:1px solid var(--line);border-radius:22px;background:var(--panel)}.flight h3{margin:0 0 10px}.data-row{display:grid;grid-template-columns:minmax(100px,.75fr) 1fr;gap:8px;padding:9px;border-top:1px solid var(--line)}.data-row span{color:var(--muted)}details{border:1px solid var(--line);border-radius:19px;background:var(--soft);overflow:hidden}summary{cursor:pointer;padding:14px 15px;font-weight:900}details ul{margin:0;padding:0 32px 15px;color:var(--muted)}.bottom{position:fixed;left:0;right:0;bottom:0;z-index:50;display:grid;grid-template-columns:repeat(5,1fr);gap:5px;padding:7px 9px calc(7px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:#071018e8;backdrop-filter:blur(20px)}.bottom a{display:grid;place-items:center;gap:2px;min-height:51px;border-radius:16px;color:var(--muted);font-size:.72rem;font-weight:900}.bottom a span{font-size:1.15rem}.bottom a:hover{background:var(--soft);color:white}.toast{position:fixed;left:50%;bottom:calc(var(--nav) + 18px);transform:translateX(-50%);z-index:80;padding:9px 13px;border-radius:999px;background:#f5f7f9;color:#071018;font-weight:900;box-shadow:var(--shadow)}main{padding-bottom:calc(var(--nav) + 24px)}@media(max-width:820px){.metrics,.quick-grid{grid-template-columns:repeat(2,1fr)}.three{grid-template-columns:1fr 1fr}}@media(max-width:600px){.section{width:calc(100% - 20px)}.unlock{grid-template-columns:1fr}.primary{width:100%}.day-tabs{top:120px}.two,.three{grid-template-columns:1fr}.event{grid-template-columns:48px 1fr}.quick-grid{grid-template-columns:1fr 1fr}.metrics{grid-template-columns:1fr 1fr}.bottom a{font-size:.67rem}}

<body>
<section class="lock" id="lock"><div class="lock-card"><div class="flag"></div><span class="badge">🔐 Viaje privado · 🇭🇺</span><h1>Budapest<span>9–12 octubre 2026</span></h1><p>Planning, visitas, restaurantes, vuelos y mapas en una sola guía.</p><form id="unlockForm"><div class="unlock"><input id="password" type="password" placeholder="Contraseña" autocomplete="current-password" required><button class="primary">Entrar</button></div><label class="remember"><input id="remember" type="checkbox"> Recordar en este dispositivo</label></form><div class="note">El itinerario se carga desde un único archivo <strong>trip-data.json</strong> situado junto a este index.html.</div><div class="error" id="error">Contraseña incorrecta.</div></div></section>
<div id="app" class="hidden"><header class="topbar"><div class="top"><a class="brand" href="#overview"><span class="brand-icon">🇭🇺</span><span><strong>Budapest 2026</strong><small id="status">9–12 octubre</small></span></a><div class="top-actions"><button class="icon" id="share" title="Compartir">↗</button><button class="icon" id="lockBtn" title="Cerrar">🔒</button></div></div><div class="search"><span>⌕</span><input id="search" type="search" placeholder="Buscar Parlamento, Menza, termas, mercado…"><button class="clear hidden" id="clear">×</button></div></header>
<main><section id="overview" class="section hero"></section><nav id="dayTabs" class="day-tabs"></nav><section id="dayDetail" class="section"></section><section id="searchResults" class="section hidden"></section><section id="places" class="section"></section><section id="food" class="section"></section><section id="hotel" class="section"></section><section id="flights" class="section"></section><section id="planb" class="section"></section></main>
<nav class="bottom"><a href="#overview"><span>⌂</span>Inicio</a><a href="#dayDetail"><span>▣</span>Día</a><a href="#places"><span>◇</span>Visitas</a><a href="#food"><span>♨</span>Comer</a><a href="#hotel"><span>🏨</span>Hotel</a></nav><div id="toast" class="toast hidden"></div></div>
<script>
const PASSWORD_HASH='b10199c47c2ba609f89b7951575278bf2c59dced73f0eef7cca444b7f33beb88';const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];let DATA,places,restaurants,currentDay;const enc=new TextEncoder();
async function sha256(t){const b=await crypto.subtle.digest('SHA-256',enc.encode(t));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}function esc(s=''){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function mapLinks(q){if(!q)return'';const x=encodeURIComponent(q);return`<div class="actions"><a target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query=${x}">📍 Google Maps</a><a target="_blank" rel="noopener" href="https://maps.apple.com/?q=${x}"> Apple Maps</a></div>`}function actions(x={}){let h=mapLinks(x.mapQuery);if(x.website){const w=`<a class="web" target="_blank" rel="noopener" href="${esc(x.website)}">↗ Web oficial</a>`;h=h?h.replace('</div>',w+'</div>'):`<div class="actions">${w}</div>`}return h}function target(i){return i.placeId?places.get(i.placeId):i}function emoji(t){return(String(t).match(/^([^\p{L}\p{N}]+)\s*/u)||[])[1]?.trim()||'•'}function strip(t){return String(t).replace(/^[^\p{L}\p{N}]+\s*/u,'')}function toast(t){$('#toast').textContent=t;$('#toast').classList.remove('hidden');setTimeout(()=>$('#toast').classList.add('hidden'),1800)}
async function load(){const r=await fetch('trip-data.json',{cache:'no-store'});if(!r.ok)throw Error('No se pudo cargar trip-data.json');DATA=await r.json();places=new Map(DATA.places.map(x=>[x.id,x]));restaurants=new Map(DATA.restaurants.map(x=>[x.id,x]));currentDay=DATA.days[0].id;renderAll()}
function renderOverview(){const m=DATA.meta,h=DATA.hotel;$('#overview').innerHTML=`<div class="hero-card"><span class="kicker">🇭🇺 ${esc(m.dateRange)}</span><h2>Budapest<br>bien ordenado</h2><p>${esc(m.planningNote)}</p><div class="metrics"><div class="metric"><span>Hotel</span><strong>${esc(h.name)}</strong></div><div class="metric"><span>Zona</span><strong>${esc(h.area)}</strong></div><div class="metric"><span>Ida</span><strong>IB 871 · 11:40</strong></div><div class="metric"><span>Vuelta</span><strong>IB 872 · 15:30</strong></div></div><div class="alert"><strong>Planning adaptado a los días reales:</strong> Mercado Central el lunes y Gran Sinagoga el domingo.</div><div class="quick-grid">${DATA.quickSummary.map((x,i)=>`<a class="quick" href="#dayDetail" data-i="${i}"><span>${esc(x.day)}</span><strong>${esc(x.title)}</strong><small>${esc(x.items)}</small></a>`).join('')}</div></div>`;$$('.quick').forEach(a=>a.onclick=()=>{currentDay=DATA.days[+a.dataset.i].id;renderTabs();renderDay()})}
function renderTabs(){$('#dayTabs').innerHTML=DATA.days.map(d=>`<button class="day-tab ${d.id===currentDay?'active':''}" data-id="${d.id}">${d.emoji} ${esc(d.shortLabel)}</button>`).join('');$$('.day-tab').forEach(b=>b.onclick=()=>{currentDay=b.dataset.id;renderTabs();renderDay();$('#dayDetail').scrollIntoView({behavior:'smooth'})})}
function eventCard(i){const p=target(i),x={...i,...p,mapQuery:p?.mapQuery||i.mapQuery,website:p?.website||i.website};return`<article class="event"><div class="event-dot"><div class="event-icon">${emoji(i.title)}</div><span class="event-time">${esc(i.time)}</span></div><div><h3>${esc(strip(i.title))}</h3><p>${esc(i.note)}</p><div class="meta"><span class="chip">${esc(i.travel)}</span><span class="chip">${esc(i.category)}</span></div>${actions(x)}</div></article>`}
function restCard(id){const r=restaurants.get(id);return r?`<article class="card restaurant"><div class="place-emoji">${r.emoji}</div><h3>${esc(r.name)}</h3><p>${esc(r.type)} · ${esc(r.area)}</p><p class="why">${esc(r.reason)}</p><span class="chip">Reserva: ${esc(r.reservation)}</span>${actions(r)}</article>`:''}
function renderDay(){const d=DATA.days.find(x=>x.id===currentDay);$('#dayDetail').innerHTML=`<div class="day-head"><span class="pill">${d.emoji} ${esc(d.weekday)} · ${esc(d.zone)}</span><h2>${esc(d.title)}</h2><p>${esc(d.headline)}</p><div class="meta"><span class="chip">🎯 ${esc(d.focus)}</span></div></div><div class="timeline">${d.timeline.map(eventCard).join('')}</div>${d.meals.map(m=>`<div class="meal"><div class="meal-head"><h3>${m.meal==='dinner'?'🍽️':'🥣'} ${esc(m.title)}</h3><span class="pill">Alternativas</span></div><div class="grid three">${m.options.map(restCard).join('')}</div></div>`).join('')}<div class="meal"><div class="grid two">${d.finalPick.map(p=>`<div class="pick"><strong>${esc(p.label)} · ${esc(p.choice)}</strong><span>${esc(p.reason)}</span></div>`).join('')}</div></div>`}
function renderPlaces(){const fs=['Todos','Buda','Pest','Noche','Mercado'];$('#places').innerHTML=`<div class="section-title"><div><h2>Visitas</h2><p>Google Maps, Apple Maps y web oficial en cada ficha.</p></div><span class="pill">${DATA.places.length} sitios</span></div><div class="filters">${fs.map((f,i)=>`<button class="filter ${i?'':'active'}" data-f="${f}">${f}</button>`).join('')}</div><div id="placeList" class="place-list"></div>`;function draw(f='Todos'){let a=DATA.places;if(f==='Buda')a=a.filter(x=>/buda|szentháromság|castle/i.test(x.area));if(f==='Pest')a=a.filter(x=>!/buda|castle/i.test(x.area));if(f==='Noche')a=a.filter(x=>/crucero|ruin|café/i.test(x.type));if(f==='Mercado')a=a.filter(x=>/mercado/i.test(x.type));$('#placeList').innerHTML=a.map(p=>`<article class="place"><div class="place-emoji">${p.emoji}</div><div><h3>${esc(p.name)}</h3><p>${esc(p.type)} · ${esc(p.area)}</p><p style="margin-top:5px">${esc(p.notes)}</p><div class="meta"><span class="chip">${esc(p.booking)}</span></div>${actions(p)}</div></article>`).join('')}draw();$$('.filter').forEach(b=>b.onclick=()=>{$$('.filter').forEach(x=>x.classList.remove('active'));b.classList.add('active');draw(b.dataset.f)})}
function renderFood(){$('#food').innerHTML=`<div class="section-title"><div><h2>Comer y cenar</h2><p>Opciones elegidas por proximidad al recorrido de cada día.</p></div><span class="pill">${DATA.restaurants.length} opciones</span></div><div class="grid three">${DATA.restaurants.map(r=>restCard(r.id)).join('')}</div>`}
function renderHotel(){const h=DATA.hotel;$('#hotel').innerHTML=`<div class="section-title"><div><h2>Hotel y transporte</h2><p>Base en Oktogon y opciones desde el aeropuerto.</p></div></div><div class="grid two"><article class="card restaurant"><div class="place-emoji">${h.emoji}</div><h3>${esc(h.name)}</h3><p>${esc(h.address)}<br>${esc(h.phone)}</p>${h.notes.map(n=>`<p class="why">${esc(n)}</p>`).join('')}${actions(h)}</article>${DATA.transport.map(t=>`<article class="card restaurant"><div class="place-emoji">${t.emoji}</div><h3>${esc(t.title)}</h3><p>${esc(t.bestFor)} · ${esc(t.time)}</p><p class="why">${esc(t.details||'')}</p>${actions(t)}</article>`).join('')}</div>`}
function renderFlights(){const c=f=>`<article class="flight"><h3>${f.emoji} ${esc(f.title)}</h3>${Object.entries(f.details).map(([k,v])=>`<div class="data-row"><span>${esc(k)}</span><strong>${esc(v)}</strong></div>`).join('')}</article>`;$('#flights').innerHTML=`<div class="section-title"><div><h2>Vuelos</h2><p>Horarios locales.</p></div><span class="pill">Iberia</span></div><div class="grid two">${c(DATA.flights.outbound)}${c(DATA.flights.return)}</div>`}
function renderPlanB(){$('#planb').innerHTML=`<div class="section-title"><div><h2>Plan B</h2><p>Qué recortar si hay retrasos, lluvia o colas.</p></div></div><div class="grid">${DATA.planB.map(p=>`<details><summary>${esc(p.title)} ＋</summary><ul>${p.items.map(i=>`<li>${esc(i)}</li>`).join('')}</ul></details>`).join('')}</div>`}
function renderSearch(q){q=q.trim().toLowerCase();if(!q){$('#searchResults').classList.add('hidden');return}const a=[];DATA.places.forEach(x=>{if(JSON.stringify(x).toLowerCase().includes(q))a.push({k:'Visita',n:x.name,s:x.notes,x})});DATA.restaurants.forEach(x=>{if(JSON.stringify(x).toLowerCase().includes(q))a.push({k:'Comer',n:x.name,s:x.reason,x})});DATA.days.forEach(d=>d.timeline.forEach(x=>{if(JSON.stringify(x).toLowerCase().includes(q))a.push({k:d.shortLabel,n:strip(x.title),s:x.note,x:target(x)||x})}));$('#searchResults').classList.remove('hidden');$('#searchResults').innerHTML=`<div class="section-title"><div><h2>Resultados</h2><p>${a.length} coincidencias para “${esc(q)}”.</p></div></div><div class="place-list">${a.slice(0,30).map(o=>`<article class="place"><div class="place-emoji">⌕</div><div><h3>${esc(o.n)}</h3><p>${esc(o.k)} · ${esc(o.s)}</p>${actions(o.x)}</div></article>`).join('')||'<div class="card">Sin resultados.</div>'}</div>`}
function renderAll(){renderOverview();renderTabs();renderDay();renderPlaces();renderFood();renderHotel();renderFlights();renderPlanB();$('#status').textContent=DATA.meta.dateRange}
async function unlock(pass,remember){if(await sha256(pass.trim())===PASSWORD_HASH){if(remember)localStorage.setItem('budapest-ok','1');$('#lock').classList.add('hidden');$('#app').classList.remove('hidden');try{await load()}catch(e){$('#app').innerHTML=`<main class="section"><div class="card"><h2>Error cargando trip-data.json</h2><p>${esc(e.message)}</p></div></main>`}}else{$('#error').style.display='block';$('#password').select()}}
$('#unlockForm').addEventListener('submit',e=>{e.preventDefault();unlock($('#password').value,$('#remember').checked)});$('#lockBtn').onclick=()=>{localStorage.removeItem('budapest-ok');location.reload()};$('#search').addEventListener('input',e=>{$('#clear').classList.toggle('hidden',!e.target.value);renderSearch(e.target.value)});$('#clear').onclick=()=>{$('#search').value='';$('#clear').classList.add('hidden');$('#searchResults').classList.add('hidden')};$('#share').onclick=async()=>{try{if(navigator.share)await navigator.share({title:'Budapest 2026',url:location.href});else{await navigator.clipboard.writeText(location.href);toast('Enlace copiado')}}catch(e){}};if(localStorage.getItem('budapest-ok')==='1')unlock('pachaso',true);
</script>
</body>
</html>
