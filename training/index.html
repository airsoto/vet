<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#f6f7fb" />
  <title>Training</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
  <style>
    :root{
      --accent:#2563eb;--bg:#f6f7fb;--card:#fff;--text:#111827;--muted:#6b7280;--line:#e5e7eb;
      --good:#16a34a;--warn:#d97706;--bad:#dc2626;--run:#2563eb;--work:#7c3aed;--shadow:0 10px 30px rgba(15,23,42,.08)
    }
    [data-theme="dark"]{--bg:#0b1020;--card:#12192b;--text:#eef2ff;--muted:#9aa4b2;--line:#263149;--shadow:0 10px 30px rgba(0,0,0,.28)}
    *{box-sizing:border-box} html{scroll-behavior:smooth} body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    button,input,select{font:inherit} button{cursor:pointer}.hidden{display:none!important}
    .app{min-height:100vh}.shell{max-width:1180px;margin:auto;padding:18px 18px 100px}.topbar{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
    .topbar-inner{max-width:1180px;margin:auto;padding:14px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{font-size:24px;font-weight:800;letter-spacing:-.03em}.sync{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:7px}.dot{width:8px;height:8px;border-radius:50%;background:var(--good);display:inline-block}.dot.warn{background:var(--warn)}.dot.bad{background:var(--bad)}
    .desktop-nav{display:flex;gap:8px}.nav-btn,.icon-btn,.ghost,.pill,.primary,.danger{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:14px;padding:10px 13px}.nav-btn.active{border-color:var(--accent);color:var(--accent);font-weight:700}.primary{background:var(--accent);color:white;border-color:var(--accent);font-weight:700}.ghost{background:transparent}.danger{color:var(--bad)}
    .grid{display:grid;gap:16px}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:18px;box-shadow:var(--shadow)}
    .hero{display:grid;grid-template-columns:1.15fr .85fr;gap:16px}.section-title{font-size:19px;font-weight:800;margin:0 0 12px}.small{font-size:12px;color:var(--muted)}.muted{color:var(--muted)}.big{font-size:36px;font-weight:850;letter-spacing:-.04em}.kpi{font-size:26px;font-weight:800}.row{display:flex;align-items:center;gap:10px}.between{justify-content:space-between}.wrap{flex-wrap:wrap}.stack{display:grid;gap:10px}
    .progress{height:10px;background:var(--line);border-radius:999px;overflow:hidden}.progress>span{display:block;height:100%;background:var(--accent);border-radius:inherit}.ring{--p:0; width:132px;height:132px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--accent) calc(var(--p)*1%),var(--line) 0)}.ring:before{content:"";width:96px;height:96px;background:var(--card);border-radius:50%;position:absolute}.ring-inner{position:relative;z-index:1;text-align:center}.ring-wrap{position:relative;display:inline-grid}
    .today-actions{display:flex;gap:10px;flex-wrap:wrap}.quick{padding:14px 16px;border-radius:16px;border:1px solid var(--line);background:var(--card);font-weight:750}.quick.run{border-color:color-mix(in srgb,var(--run) 35%,var(--line));color:var(--run)}.quick.work{border-color:color-mix(in srgb,var(--work) 35%,var(--line));color:var(--work)}
    .week-strip{display:grid;grid-template-columns:repeat(7,1fr);gap:7px}.daycell{border:1px solid var(--line);border-radius:16px;padding:10px 6px;text-align:center;min-height:72px}.daycell.today{outline:2px solid var(--accent)}.daycell .d{font-size:11px;color:var(--muted)}.daycell .n{font-weight:800;margin:3px 0}.activity-icons{font-size:13px;min-height:18px}
    .calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:7px}.cal-head{text-align:center;font-size:12px;color:var(--muted);padding:5px}.cal-day{min-height:92px;border:1px solid var(--line);border-radius:14px;padding:8px;background:var(--card)}.cal-day.off{opacity:.35}.cal-day.today{outline:2px solid var(--accent)}.cal-day .num{font-weight:800}.tag{display:inline-flex;align-items:center;gap:5px;padding:4px 7px;border-radius:999px;font-size:11px;margin:3px 3px 0 0;background:var(--line)}.tag.run{color:var(--run)}.tag.work{color:var(--work)}
    .exercise{border:1px solid var(--line);border-radius:18px;padding:14px;display:grid;grid-template-columns:64px 1fr auto;gap:12px;align-items:center}.exercise.done{opacity:.6}.exercise-art{width:64px;height:64px;border-radius:16px;background:color-mix(in srgb,var(--accent) 10%,var(--card));display:grid;place-items:center;overflow:hidden}.exercise-art svg{width:58px;height:58px}.pulse-arm{transform-origin:30px 26px;animation:moveArm 1.4s ease-in-out infinite alternate}@keyframes moveArm{to{transform:rotate(-18deg)}}
    .checkbox{width:28px;height:28px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;background:var(--card)}.checkbox.on{background:var(--good);border-color:var(--good);color:white}.timer{font-variant-numeric:tabular-nums;font-size:44px;font-weight:850;letter-spacing:-.04em}.restbar{padding:10px 12px;border-radius:14px;background:color-mix(in srgb,var(--accent) 8%,var(--card));border:1px solid var(--line)}
    .modal-back{position:fixed;inset:0;background:rgba(0,0,0,.45);display:grid;place-items:end center;z-index:50;padding:20px}.modal{width:min(680px,100%);max-height:90vh;overflow:auto;background:var(--card);border-radius:24px;padding:20px;border:1px solid var(--line);box-shadow:0 30px 70px rgba(0,0,0,.3)}
    .form-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.field{display:grid;gap:6px}.field label{font-size:12px;color:var(--muted)}.field input,.field select{width:100%;padding:12px;border:1px solid var(--line);border-radius:13px;background:var(--bg);color:var(--text)}
    .login{min-height:100vh;display:grid;place-items:center;padding:20px}.login-card{width:min(440px,100%)}.login-title{font-size:34px;font-weight:850;margin-bottom:6px}.login input{width:100%;padding:14px;border-radius:14px;border:1px solid var(--line);background:var(--bg);color:var(--text);margin:14px 0 10px}
    .bottom-nav{display:none;position:fixed;left:0;right:0;bottom:0;z-index:30;background:color-mix(in srgb,var(--card) 95%,transparent);border-top:1px solid var(--line);padding:8px max(8px,env(safe-area-inset-right)) calc(8px + env(safe-area-inset-bottom)) max(8px,env(safe-area-inset-left));grid-template-columns:repeat(5,1fr)}.bottom-nav button{background:none;border:0;color:var(--muted);font-size:11px;padding:7px 2px}.bottom-nav button.active{color:var(--accent);font-weight:800}.bottom-nav span{display:block;font-size:20px;margin-bottom:2px}
    .heatmap{display:grid;grid-template-columns:repeat(53,12px);gap:3px;overflow:auto;padding-bottom:8px}.heat-col{display:grid;grid-template-rows:repeat(7,12px);gap:3px}.heat{width:12px;height:12px;border-radius:3px;background:var(--line)}.heat.l1{background:color-mix(in srgb,var(--accent) 25%,var(--line))}.heat.l2{background:color-mix(in srgb,var(--accent) 50%,var(--line))}.heat.l3{background:color-mix(in srgb,var(--accent) 75%,var(--line))}.heat.l4{background:var(--accent)}
    .achievement{border:1px solid var(--line);border-radius:18px;padding:14px}.medal{font-size:32px}.toast{position:fixed;right:18px;bottom:88px;z-index:80;background:var(--text);color:var(--card);padding:12px 14px;border-radius:14px;box-shadow:var(--shadow)}
    .chart-wrap{height:320px}.subtabs{display:flex;gap:8px;margin-bottom:12px}.subtabs button{border:1px solid var(--line);background:var(--card);padding:8px 10px;border-radius:12px;color:var(--text)}.subtabs button.active{color:var(--accent);border-color:var(--accent);font-weight:700}
    @media(max-width:820px){.desktop-nav{display:none}.bottom-nav{display:grid}.shell{padding:14px 12px 105px}.hero,.g2,.g3,.g4,.form-grid{grid-template-columns:1fr}.ring{width:120px;height:120px}.cal-day{min-height:78px;padding:6px}.exercise{grid-template-columns:52px 1fr auto}.exercise-art{width:52px;height:52px}.timer{font-size:36px}.topbar-inner{padding:12px}.brand{font-size:21px}}
  </style>
</head>
<body>
<div id="loginView" class="login hidden">
  <div class="card login-card">
    <div class="login-title">Training</div>
    <div class="muted">Acceso personal mediante enlace mágico.</div>
    <input id="emailInput" type="email" placeholder="tu@email.com" autocomplete="email" />
    <button id="sendMagicBtn" class="primary" style="width:100%">Enviar enlace de acceso</button>
    <div id="loginMsg" class="small" style="margin-top:12px"></div>
  </div>
</div>

<div id="unauthorizedView" class="login hidden">
  <div class="card login-card">
    <div class="login-title">Autorizar usuario</div>
    <p class="muted">Has iniciado sesión correctamente, pero este usuario todavía no está en <code>allowed_users</code>.</p>
    <div class="field"><label>Tu UUID</label><input id="uuidBox" readonly /></div>
    <p class="small">Copia el UUID y añádelo en Supabase SQL Editor con:</p>
    <pre id="allowSql" style="white-space:pre-wrap;background:var(--bg);padding:12px;border-radius:12px;border:1px solid var(--line)"></pre>
    <div class="row wrap"><button id="recheckAuthBtn" class="primary">Ya lo he autorizado</button><button id="logoutUnauthorized" class="ghost">Cerrar sesión</button></div>
  </div>
</div>

<div id="mainApp" class="app hidden">
  <header class="topbar">
    <div class="topbar-inner">
      <div class="row"><div class="brand">Training</div><div id="syncStatus" class="sync"><span class="dot"></span><span>Sincronizado</span></div></div>
      <nav class="desktop-nav">
        <button class="nav-btn active" data-view="today">Hoy</button>
        <button class="nav-btn" data-view="calendar">Calendario</button>
        <button class="nav-btn" data-view="routines">Rutinas</button>
        <button class="nav-btn" data-view="stats">Estadísticas</button>
        <button class="nav-btn" data-view="settings">Ajustes</button>
      </nav>
    </div>
  </header>

  <main class="shell">
    <section id="view-today" class="view"></section>
    <section id="view-calendar" class="view hidden"></section>
    <section id="view-routines" class="view hidden"></section>
    <section id="view-stats" class="view hidden"></section>
    <section id="view-settings" class="view hidden"></section>
  </main>

  <nav class="bottom-nav">
    <button class="active" data-view="today"><span>⌂</span>Hoy</button>
    <button data-view="calendar"><span>▦</span>Calendario</button>
    <button data-view="routines"><span>🏋️</span>Rutinas</button>
    <button data-view="stats"><span>◔</span>Estadísticas</button>
    <button data-view="settings"><span>⚙</span>Ajustes</button>
  </nav>
</div>

<div id="modalHost"></div>
<div id="toast" class="toast hidden"></div>

<script>
const SUPABASE_URL='https://wadrqawvhuevziarqiye.supabase.co';
const SUPABASE_PUBLISHABLE_KEY='sb_publishable_6KGzgiXcoJquiyl4lXTbkQ_BWe60MrG';
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});

const DB={name:'training-offline-v1',store:'cache'};
const state={user:null,settings:null,runs:[],workouts:[],plans:[],planItems:[],specialWeeks:[],achievements:[],view:'today',calendarDate:new Date(),statsTab:'run',chart:null,sessionTimer:null,sessionStart:null,sessionElapsed:0,currentSession:null,restTimer:null,pending:[]};

const routinesDefault={
 A:[
  {name:'Press de pecho',reps:'2 × 10–12',rest:45,muscles:'Pectoral · tríceps · deltoides anterior',how:'Espalda apoyada. Empuja al frente sin bloquear los codos.',error:'No elevar los hombros.'},
  {name:'Jalón al pecho',reps:'2 × 10–12',rest:45,muscles:'Dorsal ancho · bíceps',how:'Pecho elevado. Lleva la barra hacia la parte alta del pecho.',error:'No tirar detrás de la nuca.'},
  {name:'Remo sentado · polea baja',reps:'2 × 10–12',rest:45,muscles:'Dorsal · romboides · bíceps',how:'Tronco estable. Lleva el agarre hacia el abdomen.',error:'No balancear el torso.'},
  {name:'Butterfly / mariposa',reps:'2 × 12–15',rest:30,muscles:'Pectoral mayor · deltoides anterior',how:'Brazos controlados. Junta los apoyos al frente sin golpear.',error:'No encoger los hombros.'},
  {name:'Curl de bíceps · polea baja',reps:'2 × 12–15',rest:30,muscles:'Bíceps · braquial',how:'Codos pegados al cuerpo. Flexiona sin mover el hombro.',error:'No impulsarse con la espalda.'},
  {name:'Extensión de tríceps · polea alta',reps:'2 × 12–15',rest:30,muscles:'Tríceps',how:'Codos fijos junto al cuerpo. Extiende hacia abajo.',error:'No abrir los codos.'}
 ],
 B:[
  {name:'Jalón al pecho · agarre alternativo',reps:'2 × 10–12',rest:45,muscles:'Dorsal ancho · bíceps',how:'Usa un agarre cómodo distinto al de A. Tira hacia el pecho.',error:'No arquear en exceso la espalda.'},
  {name:'Press de pecho',reps:'2 × 12–15',rest:30,muscles:'Pectoral · tríceps · hombro anterior',how:'Movimiento fluido, espalda apoyada y control al volver.',error:'No bloquear los codos.'},
  {name:'Remo al mentón · polea baja',reps:'2 × 12–15',rest:30,muscles:'Deltoides · trapecio',how:'Eleva el agarre hasta la zona alta del torso con control.',error:'No forzar si produce pinzamiento en el hombro.'},
  {name:'Remo sentado · polea baja',reps:'2 × 12–15',rest:30,muscles:'Dorsal · romboides · bíceps',how:'Mantén el pecho abierto y retrae escápulas al tirar.',error:'No redondear la espalda.'},
  {name:'Curl de bíceps con pupitre',reps:'2 × 10–12',rest:30,muscles:'Bíceps',how:'Apoya los brazos en el pupitre y flexiona de forma controlada.',error:'No despegar los brazos del apoyo.'},
  {name:'Extensión de tríceps · polea alta',reps:'2 × 10–12',rest:30,muscles:'Tríceps',how:'Extiende los codos manteniendo el brazo estable.',error:'No usar impulso del tronco.'}
 ]
};

function getRoutines(){try{return JSON.parse(localStorage.getItem('training_routines'))||routinesDefault}catch{return routinesDefault}}
function saveRoutines(r){localStorage.setItem('training_routines',JSON.stringify(r))}
const $=s=>document.querySelector(s); const $$=s=>[...document.querySelectorAll(s)];
const pad=n=>String(n).padStart(2,'0');
function isoLocal(d=new Date()){return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`}
function parseDate(s){const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)}
function mondayOf(d=new Date()){const x=new Date(d);x.setHours(0,0,0,0);const day=(x.getDay()+6)%7;x.setDate(x.getDate()-day);return x}
function addDays(d,n){const x=new Date(d);x.setDate(x.getDate()+n);return x}
function fmtDate(d,opt={day:'numeric',month:'short'}){return new Intl.DateTimeFormat('es-ES',opt).format(d)}
function clamp(n,a,b){return Math.max(a,Math.min(b,n))}
function escapeHtml(s=''){return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function toast(msg,ms=3200){const t=$('#toast');t.textContent=msg;t.classList.remove('hidden');clearTimeout(t._timer);t._timer=setTimeout(()=>t.classList.add('hidden'),ms)}
function closeModal(){const h=$('#modalHost');h.innerHTML=''}
function modal(html){$('#modalHost').innerHTML=`<div class="modal-back" id="modalBack"><div class="modal">${html}</div></div>`;$('#modalBack').onclick=e=>{if(e.target.id==='modalBack')closeModal()}}
function setSync(text,kind='good'){const e=$('#syncStatus');e.innerHTML=`<span class="dot ${kind==='warn'?'warn':kind==='bad'?'bad':''}"></span><span>${text}</span>`}

function openIDB(){return new Promise((res,rej)=>{const r=indexedDB.open(DB.name,1);r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains(DB.store))r.result.createObjectStore(DB.store)};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function cacheSet(k,v){try{const db=await openIDB();const tx=db.transaction(DB.store,'readwrite');tx.objectStore(DB.store).put(v,k)}catch{}}
async function cacheGet(k){try{const db=await openIDB();return await new Promise((res,rej)=>{const r=db.transaction(DB.store).objectStore(DB.store).get(k);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}catch{return null}}
async function loadCached(){const c=await cacheGet('snapshot');if(c){Object.assign(state,c);state.calendarDate=new Date(c.calendarDate||Date.now())}}
async function saveCached(){await cacheSet('snapshot',{settings:state.settings,runs:state.runs,workouts:state.workouts,plans:state.plans,planItems:state.planItems,specialWeeks:state.specialWeeks,achievements:state.achievements,calendarDate:state.calendarDate.toISOString()})}

async function init(){applyTheme(localStorage.getItem('training_theme')||'system');const {data:{session}}=await sb.auth.getSession();if(!session){showLogin();return}state.user=session.user;await afterAuth()}
function showLogin(){ $('#loginView').classList.remove('hidden');$('#unauthorizedView').classList.add('hidden');$('#mainApp').classList.add('hidden') }
async function afterAuth(){setSync('Comprobando…','warn');const {data,error}=await sb.rpc('is_allowed_user');if(error||!data){showUnauthorized();return}$('#loginView').classList.add('hidden');$('#unauthorizedView').classList.add('hidden');$('#mainApp').classList.remove('hidden');await ensureProfileAndSettings();await refreshAll();bindNav();renderAll();}
function showUnauthorized(){const u=state.user;$('#loginView').classList.add('hidden');$('#mainApp').classList.add('hidden');$('#unauthorizedView').classList.remove('hidden');$('#uuidBox').value=u.id;$('#allowSql').textContent=`insert into public.allowed_users (user_id)\nvalues ('${u.id}')\non conflict (user_id) do nothing;`;}

$('#sendMagicBtn').onclick=async()=>{const email=$('#emailInput').value.trim();if(!email)return;const b=$('#sendMagicBtn');b.disabled=true;$('#loginMsg').textContent='Enviando…';const {error}=await sb.auth.signInWithOtp({email,options:{emailRedirectTo:'https://airsoto.github.io/vet/training/'}});b.disabled=false;$('#loginMsg').textContent=error?error.message:'Enlace enviado. Revisa tu correo.'}
$('#recheckAuthBtn').onclick=()=>afterAuth();$('#logoutUnauthorized').onclick=async()=>{await sb.auth.signOut();location.reload()}
sb.auth.onAuthStateChange((event,session)=>{if(session){state.user=session.user}else if(event==='SIGNED_OUT'){showLogin()}})

async function ensureProfileAndSettings(){const uid=state.user.id;await sb.from('profiles').upsert({user_id:uid},{onConflict:'user_id'});let {data:s}=await sb.from('settings').select('*').eq('user_id',uid).maybeSingle();if(!s){const ins={user_id:uid,weekly_run_goal:30,weekly_workout_goal:3,min_run_km:9,max_run_km:10,run_days:[2,4,7],workout_days:[1,3,5],allow_double_activity:true,consistency_window:8,theme:'system',accent_color:'#2563eb'};await sb.from('settings').insert(ins);s=ins;await sb.from('goals_history').insert({user_id:uid,valid_from:isoLocal(),weekly_run_goal:30,weekly_workout_goal:3})}state.settings=s;applyTheme(s.theme||'system',s.accent_color)}
async function refreshAll(){setSync(navigator.onLine?'Sincronizando…':'Sin conexión','warn');if(!navigator.onLine){await loadCached();renderAll();setSync('Sin conexión','warn');return}const uid=state.user.id;const from=new Date();from.setFullYear(from.getFullYear()-3);const f=isoLocal(from);const q=await Promise.all([
 sb.from('settings').select('*').eq('user_id',uid).single(),
 sb.from('runs').select('*').eq('user_id',uid).is('deleted_at',null).gte('run_date',f).order('run_date'),
 sb.from('workout_sessions').select('*').eq('user_id',uid).is('deleted_at',null).gte('workout_date',f).order('workout_date'),
 sb.from('weekly_plans').select('*').eq('user_id',uid).gte('week_start',f).order('week_start'),
 sb.from('weekly_plan_items').select('*').eq('user_id',uid).gte('planned_date',f).order('planned_date'),
 sb.from('special_weeks').select('*').eq('user_id',uid).gte('week_start',f),
 sb.from('achievements').select('*').eq('user_id',uid)
 ]);if(q.some(x=>x.error)){await loadCached();setSync('Datos locales','warn');return}state.settings=q[0].data;state.runs=q[1].data||[];state.workouts=q[2].data||[];state.plans=q[3].data||[];state.planItems=q[4].data||[];state.specialWeeks=q[5].data||[];state.achievements=q[6].data||[];await saveCached();setSync('Sincronizado','good');}

function currentWeek(){const start=mondayOf();const end=addDays(start,6);const s=isoLocal(start),e=isoLocal(end);const runs=state.runs.filter(r=>r.run_date>=s&&r.run_date<=e);const workouts=state.workouts.filter(w=>w.workout_date>=s&&w.workout_date<=e&&w.completed);const km=runs.reduce((a,r)=>a+Number(r.km),0);return{start,end,s,e,runs,workouts,km}}
function currentGoals(){const w=currentWeek();const sw=state.specialWeeks.find(x=>x.week_start===w.s);return{run:Number(sw?.run_goal??state.settings?.weekly_run_goal??30),workout:Number(sw?.workout_goal??state.settings?.weekly_workout_goal??3),special:sw}}
function scoreWeek(km,wcount,goals=currentGoals()){const r=Math.min(km/goals.run,1),w=Math.min(wcount/goals.workout,1);return Math.round((r+w)/2*100)}
function scoreLabel(p){return p>=100?'Excelente':p>=80?'Bien':'Mejorable'}
function nextRoutine(){const done=[...state.workouts].filter(x=>x.completed).sort((a,b)=>a.workout_date.localeCompare(b.workout_date)||a.created_at.localeCompare(b.created_at));if(!done.length)return'A';return done.at(-1).routine==='A'?'B':'A'}
function plannedRunSuggestion(){const g=currentGoals(),w=currentWeek();const remaining=Math.max(0,g.run-w.km);if(!remaining)return 0;const today=new Date();const dayNum=((today.getDay()+6)%7)+1;const days=(state.settings.run_days||[]).filter(d=>d>=dayNum);if(!days.length)return Math.min(state.settings.max_run_km||10,Math.max(state.settings.min_run_km||9,remaining));const slots=days.length;let x=Math.ceil((remaining/slots)*2)/2;x=clamp(x,Number(state.settings.min_run_km||9),Number(state.settings.max_run_km||10));return x}
function quickDistances(){const s=plannedRunSuggestion()||10;return [...new Set([clamp(Math.round(s-1),1,99),Math.round(s),Math.round(s+1),Math.round(s+2)])]}
function todayPlan(){const dow=((new Date().getDay()+6)%7)+1;const run=(state.settings.run_days||[]).includes(dow);const workout=(state.settings.workout_days||[]).includes(dow);return{run,workout}}

function bindNav(){if(window.__navbound)return;window.__navbound=true;$$('[data-view]').forEach(b=>b.onclick=()=>switchView(b.dataset.view));}
function switchView(v){state.view=v;$$('.view').forEach(x=>x.classList.add('hidden'));$(`#view-${v}`).classList.remove('hidden');$$('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===v));renderView(v)}
function renderAll(){['today','calendar','routines','stats','settings'].forEach(renderView)}
function renderView(v){if(v==='today')renderToday();if(v==='calendar')renderCalendar();if(v==='routines')renderRoutines();if(v==='stats')renderStats();if(v==='settings')renderSettings()}

function renderToday(){const w=currentWeek(),g=currentGoals(),rp=Math.round(w.km/g.run*100),wp=Math.round(w.workouts.length/g.workout*100),score=scoreWeek(w.km,w.workouts.length,g),plan=todayPlan(),suggest=plannedRunSuggestion(),nr=nextRoutine();const remainKm=Math.max(0,g.run-w.km),remainW=Math.max(0,g.workout-w.workouts.length);const msg=remainKm||remainW?`Te faltan ${remainKm.toFixed(1).replace('.0','')} km y ${remainW} rutina${remainW===1?'':'s'} esta semana.`:'Objetivos semanales completados.';
 $('#view-today').innerHTML=`
  <div class="grid g3" style="margin-bottom:16px">
   <div class="card"><div class="small">CARRERA</div><div class="kpi">${w.km.toFixed(1).replace('.0','')} / ${g.run} km</div><div class="progress"><span style="width:${clamp(rp,0,100)}%"></span></div></div>
   <div class="card"><div class="small">POLEAS</div><div class="kpi">${w.workouts.length} / ${g.workout}</div><div class="progress"><span style="width:${clamp(wp,0,100)}%"></span></div></div>
   <div class="card"><div class="small">SEMANA</div><div class="kpi">${score}% · ${scoreLabel(score)}</div><div class="small">🔥 Racha global: ${calcStreak('global')} semanas</div></div>
  </div>
  <div class="hero">
   <div class="card">
    <div class="row between"><div><div class="small">HOY · ${fmtDate(new Date(),{weekday:'long',day:'numeric',month:'long'})}</div><h2 class="section-title" style="margin-top:6px">${plan.run||plan.workout?'Plan de hoy':'Día libre'}</h2></div><div class="ring-wrap"><div class="ring" style="--p:${clamp(score,0,100)}"><div class="ring-inner"><b>${score}%</b><div class="small">semana</div></div></div></div></div>
    <div class="stack" style="margin-top:12px">${plan.run?`<div><b>🏃 Carrera recomendada: ${suggest||'—'} km</b><div class="small">Rango habitual ${state.settings.min_run_km}–${state.settings.max_run_km} km</div></div>`:''}${plan.workout?`<div><b>🏋️ Próxima: Rutina ${nr}</b><div class="small">Alternancia basada en la última realizada</div></div>`:''}${!plan.run&&!plan.workout?`<div class="muted">No hay actividad planificada para hoy. Puedes registrar una carrera o iniciar una rutina igualmente.</div>`:''}</div>
    <div class="today-actions" style="margin-top:16px">${quickDistances().map(x=>`<button class="quick run" onclick="addRun(${x})">✓ ${x} km</button>`).join('')}<button class="quick run" onclick="openRunModal()">＋ km</button><button class="quick work" onclick="openWorkoutPreview('${nr}')">🏋️ Rutina ${nr}</button></div>
   </div>
   <div class="card"><h2 class="section-title">Qué falta</h2><div class="big">${remainKm.toFixed(1).replace('.0','')} km</div><div class="muted">${remainW} rutina${remainW===1?'':'s'} pendiente${remainW===1?'':'s'}</div><p>${msg}</p>${remainKm>0&&plannedRunSuggestion()>state.settings.max_run_km?'<div class="restbar">⚠️ Necesitas añadir otro día de carrera.</div>':''}</div>
  </div>
  <div class="card" style="margin-top:16px"><div class="row between"><h2 class="section-title">Últimos 7 días</h2><span class="small">vista compacta</span></div>${weekStrip()}</div>
  <div class="grid g2" style="margin-top:16px"><div class="card"><h2 class="section-title">Este mes</h2>${monthSummary()}</div><div class="card"><h2 class="section-title">Últimos registros</h2>${recentList()}</div></div>`;
}
function weekStrip(){const days=[];for(let i=6;i>=0;i--){const d=addDays(new Date(),-i),s=isoLocal(d);const km=state.runs.filter(r=>r.run_date===s).reduce((a,r)=>a+Number(r.km),0),ws=state.workouts.filter(w=>w.workout_date===s&&w.completed);days.push(`<div class="daycell ${i===0?'today':''}"><div class="d">${fmtDate(d,{weekday:'short'})}</div><div class="n">${d.getDate()}</div><div class="activity-icons">${km?`🏃 ${km.toFixed(0)}`:''}${ws.length?` 🏋️${ws.length}`:''}</div></div>`)}return `<div class="week-strip">${days.join('')}</div>`}
function monthSummary(){const n=new Date(),y=n.getFullYear(),m=n.getMonth();const runs=state.runs.filter(r=>{const d=parseDate(r.run_date);return d.getFullYear()===y&&d.getMonth()===m}),ws=state.workouts.filter(r=>{const d=parseDate(r.workout_date);return r.completed&&d.getFullYear()===y&&d.getMonth()===m}),km=runs.reduce((a,r)=>a+Number(r.km),0),mins=Math.round(ws.reduce((a,w)=>a+(w.duration_seconds||0),0)/60);return `<div class="grid g3"><div><div class="kpi">${km.toFixed(1)}</div><div class="small">km</div></div><div><div class="kpi">${ws.length}</div><div class="small">rutinas</div></div><div><div class="kpi">${mins}</div><div class="small">min poleas</div></div></div>`}
function recentList(){const arr=[...state.runs.map(r=>({date:r.run_date,html:`🏃 ${r.km} km`})),...state.workouts.filter(w=>w.completed).map(w=>({date:w.workout_date,html:`🏋️ Rutina ${w.routine} · ${fmtDuration(w.duration_seconds||0)}`}))].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,6);return arr.length?arr.map(x=>`<div class="row between" style="padding:8px 0;border-bottom:1px solid var(--line)"><span>${x.html}</span><span class="small">${fmtDate(parseDate(x.date))}</span></div>`).join(''):'<div class="muted">Aún no hay actividad.</div>'}

function renderCalendar(){const d=state.calendarDate,y=d.getFullYear(),m=d.getMonth(),first=new Date(y,m,1),last=new Date(y,m+1,0),start=mondayOf(first);let cells='';for(let i=0;i<42;i++){const x=addDays(start,i),s=isoLocal(x),km=state.runs.filter(r=>r.run_date===s).reduce((a,r)=>a+Number(r.km),0),ws=state.workouts.filter(w=>w.workout_date===s&&w.completed);cells+=`<div class="cal-day ${x.getMonth()!==m?'off':''} ${s===isoLocal()?'today':''}" onclick="openDay('${s}')"><div class="num">${x.getDate()}</div>${km?`<span class="tag run">🏃 ${km.toFixed(1).replace('.0','')} km</span>`:''}${ws.map(w=>`<span class="tag work">🏋️ ${w.routine}</span>`).join('')}</div>`}
 $('#view-calendar').innerHTML=`<div class="card"><div class="row between"><button class="ghost" onclick="changeMonth(-1)">←</button><h2 class="section-title" style="margin:0">${fmtDate(d,{month:'long',year:'numeric'})}</h2><button class="ghost" onclick="changeMonth(1)">→</button></div><div class="calendar" style="margin-top:12px">${['L','M','X','J','V','S','D'].map(x=>`<div class="cal-head">${x}</div>`).join('')}${cells}</div></div><div class="card" style="margin-top:16px"><h2 class="section-title">Actividad anual</h2>${heatmap()}</div><div class="grid g2" style="margin-top:16px"><div class="card"><h2 class="section-title">Historial de carreras</h2>${runHistory()}</div><div class="card"><h2 class="section-title">Historial de poleas</h2>${workHistory()}</div></div>`}
function changeMonth(n){state.calendarDate=new Date(state.calendarDate.getFullYear(),state.calendarDate.getMonth()+n,1);renderCalendar()}
function openDay(s){const runs=state.runs.filter(r=>r.run_date===s),ws=state.workouts.filter(w=>w.workout_date===s);modal(`<div class="row between"><h2>${fmtDate(parseDate(s),{weekday:'long',day:'numeric',month:'long',year:'numeric'})}</h2><button class="ghost" onclick="closeModal()">✕</button></div><div class="stack">${runs.map(r=>`<div class="row between"><span>🏃 ${r.km} km</span><span><button class="ghost" onclick="editRun('${r.id}')">Editar</button><button class="danger" onclick="deleteRun('${r.id}')">Borrar</button></span></div>`).join('')}${ws.map(w=>`<div class="row between"><span>🏋️ Rutina ${w.routine} · ${fmtDuration(w.duration_seconds||0)}</span><button class="danger" onclick="deleteWorkout('${w.id}')">Borrar</button></div>`).join('')||'<div class="muted">Sin actividad</div>'}</div>`)}
function heatmap(){const end=new Date(),start=addDays(end,-364);const map={};for(let i=0;i<365;i++){const d=addDays(start,i),s=isoLocal(d),km=state.runs.filter(r=>r.run_date===s).reduce((a,r)=>a+Number(r.km),0),w=state.workouts.filter(x=>x.workout_date===s&&x.completed).length;map[s]=km+w*5}let html='';for(let c=0;c<53;c++){html+='<div class="heat-col">';for(let r=0;r<7;r++){const d=addDays(start,c*7+r);if(d>end){html+='<div></div>';continue}const v=map[isoLocal(d)]||0,l=v===0?'':v<6?'l1':v<10?'l2':v<15?'l3':'l4';html+=`<div class="heat ${l}" title="${isoLocal(d)} · actividad ${v}"></div>`}html+='</div>'}return `<div class="heatmap">${html}</div>`}
function runHistory(){return [...state.runs].sort((a,b)=>b.run_date.localeCompare(a.run_date)).slice(0,40).map(r=>`<div class="row between" style="padding:8px 0;border-bottom:1px solid var(--line)"><span>${fmtDate(parseDate(r.run_date),{day:'2-digit',month:'short',year:'numeric'})}</span><span><b>${r.km} km</b> <button class="ghost" onclick="editRun('${r.id}')">✎</button><button class="ghost" onclick="deleteRun('${r.id}')">🗑</button></span></div>`).join('')||'<div class="muted">Sin carreras.</div>'}
function workHistory(){return [...state.workouts].filter(w=>w.completed).sort((a,b)=>b.workout_date.localeCompare(a.workout_date)).slice(0,40).map(w=>`<div class="row between" style="padding:8px 0;border-bottom:1px solid var(--line)"><span>${fmtDate(parseDate(w.workout_date),{day:'2-digit',month:'short',year:'numeric'})}</span><span><b>${w.routine}</b> · ${fmtDuration(w.duration_seconds||0)} · ${effortLabel(w.effort)} <button class="ghost" onclick="deleteWorkout('${w.id}')">🗑</button></span></div>`).join('')||'<div class="muted">Sin rutinas.</div>'}

function renderRoutines(){const r=getRoutines();$('#view-routines').innerHTML=`<div class="grid g2"><div class="card"><div class="row between"><div><div class="small">PRÓXIMA</div><h2 class="section-title">Rutina ${nextRoutine()}</h2></div><button class="primary" onclick="openWorkoutPreview('${nextRoutine()}')">▶ Iniciar</button></div><p class="muted">6 ejercicios · objetivo ~15 min · Marcy Eclipse HG3000</p></div><div class="card"><h2 class="section-title">Alternancia</h2><div class="big" style="font-size:28px">A → B → A</div><div class="muted">La siguiente se calcula desde la última realmente realizada.</div></div></div>${['A','B'].map(k=>`<div class="card" style="margin-top:16px"><div class="row between"><h2 class="section-title">Rutina ${k}</h2><div><button class="ghost" onclick="editRoutine('${k}')">Editar</button><button class="ghost" onclick="restoreRoutine('${k}')">Restaurar</button></div></div><div class="stack">${r[k].map((e,i)=>exerciseCard(e,i,false)).join('')}</div></div>`).join('')}`}
function exerciseSVG(i){return `<svg viewBox="0 0 64 64" aria-hidden="true"><rect x="7" y="6" width="5" height="52" rx="2" fill="currentColor" opacity=".22"/><circle cx="36" cy="13" r="6" fill="none" stroke="currentColor" stroke-width="3"/><path d="M36 19v17M36 27l-13 8M36 27l14 6M36 36l-10 18M36 36l11 18" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"/><path class="pulse-arm" d="M23 35L13 23" fill="none" stroke="var(--accent)" stroke-width="4" stroke-linecap="round"/><path d="M12 10v17" stroke="currentColor" stroke-width="2" opacity=".45"/></svg>`}
function exerciseCard(e,i,done){return `<div class="exercise ${done?'done':''}"><div class="exercise-art">${exerciseSVG(i)}</div><div><b>${i+1}. ${escapeHtml(e.name)}</b><div class="small">${escapeHtml(e.reps)} · descanso ${e.rest}s</div><div class="small">${escapeHtml(e.muscles)}</div><details style="margin-top:6px"><summary class="small">Cómo hacerlo</summary><div class="small" style="margin-top:6px">${escapeHtml(e.how)}<br><b>Error frecuente:</b> ${escapeHtml(e.error)}</div></details></div><div></div></div>`}
function editRoutine(k){const r=getRoutines();modal(`<div class="row between"><h2>Editar Rutina ${k}</h2><button class="ghost" onclick="closeModal()">✕</button></div><div class="stack">${r[k].map((e,i)=>`<div class="card" style="box-shadow:none"><b>${i+1}</b><div class="form-grid"><div class="field"><label>Ejercicio</label><input id="rn${i}" value="${escapeHtml(e.name)}"></div><div class="field"><label>Series/reps</label><input id="rr${i}" value="${escapeHtml(e.reps)}"></div><div class="field"><label>Descanso s</label><input id="rd${i}" type="number" value="${e.rest}"></div><div class="field"><label>Músculos</label><input id="rm${i}" value="${escapeHtml(e.muscles)}"></div></div></div>`).join('')}</div><button class="primary" style="margin-top:14px" onclick="saveRoutineEdit('${k}')">Guardar cambios</button>`)}
function saveRoutineEdit(k){const r=getRoutines();r[k]=r[k].map((e,i)=>({...e,name:$(`#rn${i}`).value,reps:$(`#rr${i}`).value,rest:Number($(`#rd${i}`).value||30),muscles:$(`#rm${i}`).value}));saveRoutines(r);closeModal();renderRoutines();toast('Rutina actualizada en este dispositivo')}
function restoreRoutine(k){const r=getRoutines();r[k]=structuredClone(routinesDefault[k]);saveRoutines(r);renderRoutines();toast('Rutina original restaurada')}

function openWorkoutPreview(k){const r=getRoutines()[k];if(state.settings.skip_workout_preview){startWorkout(k);return}modal(`<div class="row between"><div><div class="small">VISTA PREVIA</div><h2>Rutina ${k}</h2></div><button class="ghost" onclick="closeModal()">✕</button></div><div class="stack">${r.map((e,i)=>exerciseCard(e,i,false)).join('')}</div><div class="row between" style="margin-top:14px"><span class="small">6 ejercicios · ~15 min</span><button class="primary" onclick="startWorkout('${k}')">▶ Iniciar rutina</button></div>`)}
async function startWorkout(k){closeModal();state.currentSession={routine:k,done:new Set(),startedAt:Date.now()};state.sessionStart=Date.now();state.sessionElapsed=0;renderWorkoutSession();state.sessionTimer=setInterval(()=>{state.sessionElapsed=Math.floor((Date.now()-state.sessionStart)/1000);const t=$('#liveTimer');if(t)t.textContent=fmtDuration(state.sessionElapsed)},1000)}
function renderWorkoutSession(){const s=state.currentSession,r=getRoutines()[s.routine];modal(`<div class="row between"><div><div class="small">RUTINA ${s.routine}</div><div id="liveTimer" class="timer">${fmtDuration(state.sessionElapsed)}</div></div><button class="ghost" onclick="cancelWorkout()">Salir</button></div><div class="progress" style="margin:10px 0 16px"><span style="width:${s.done.size/6*100}%"></span></div><div class="stack">${r.map((e,i)=>`<div class="exercise ${s.done.has(i)?'done':''}"><div class="exercise-art">${exerciseSVG(i)}</div><div><b>${i+1}. ${escapeHtml(e.name)}</b><div class="small">${e.reps} · descanso ${e.rest}s</div><div class="small">${e.muscles}</div></div><button class="checkbox ${s.done.has(i)?'on':''}" onclick="toggleExercise(${i},${e.rest})">${s.done.has(i)?'✓':''}</button></div>`).join('')}</div><div id="restBox"></div><button class="primary" style="width:100%;margin-top:16px" onclick="finishWorkout()" ${s.done.size<6?'disabled':''}>✓ Finalizar rutina</button>`)}
function toggleExercise(i,rest){const s=state.currentSession;if(s.done.has(i))s.done.delete(i);else{s.done.add(i);startRest(rest)}renderWorkoutSession()}
function startRest(sec){clearInterval(state.restTimer);let left=sec;setTimeout(()=>{const b=$('#restBox');if(!b)return;b.innerHTML=`<div class="restbar row between"><span>Descanso opcional</span><b id="restTime">${left}s</b></div>`;state.restTimer=setInterval(()=>{left--;const x=$('#restTime');if(x)x.textContent=`${Math.max(0,left)}s`;if(left<=0)clearInterval(state.restTimer)},1000)},0)}
function cancelWorkout(){clearInterval(state.sessionTimer);clearInterval(state.restTimer);state.currentSession=null;closeModal()}
function finishWorkout(){clearInterval(state.sessionTimer);clearInterval(state.restTimer);const sec=state.sessionElapsed,k=state.currentSession.routine;modal(`<h2>Rutina ${k} completada</h2><div class="big">${fmtDuration(sec)}</div><p>6/6 ejercicios</p><div class="small">¿Cómo te ha resultado?</div><div class="today-actions" style="margin-top:12px"><button class="quick" onclick="saveWorkout('${k}',${sec},'easy')">😌 Fácil</button><button class="quick" onclick="saveWorkout('${k}',${sec},'adequate')">🙂 Adecuado</button><button class="quick" onclick="saveWorkout('${k}',${sec},'hard')">🥵 Difícil</button></div>`)}
async function saveWorkout(k,sec,effort){const w=currentWeek(),g=currentGoals(),extra=w.workouts.length>=g.workout,row={user_id:state.user.id,workout_date:isoLocal(),routine:k,duration_seconds:sec,effort,completed:true,exercises_completed:6,extra_session:extra};const {data,error}=await sb.from('workout_sessions').insert(row).select().single();if(error){toast(error.message);return}state.workouts.push(data);state.currentSession=null;closeModal();await saveCached();renderAll();toast(`Rutina ${k} guardada`);checkMicroAchievements()}

function openRunModal(){modal(`<div class="row between"><h2>Registrar carrera</h2><button class="ghost" onclick="closeModal()">✕</button></div><div class="field"><label>Kilómetros</label><input id="runKm" type="number" min="0.1" step="0.1" inputmode="decimal" autofocus></div><button class="primary" style="width:100%;margin-top:14px" onclick="addRun(Number($('#runKm').value))">Guardar</button>`)}
async function addRun(km){if(!km||km<=0)return;const row={user_id:state.user.id,run_date:isoLocal(),km};const {data,error}=await sb.from('runs').insert(row).select().single();if(error){toast(error.message);return}state.runs.push(data);closeModal();await saveCached();renderAll();toast(`${km} km registrados · Deshacer`,5000);$('#toast').onclick=()=>undoRun(data.id);checkMicroAchievements()}
async function undoRun(id){await deleteRun(id,true);$('#toast').onclick=null}
function editRun(id){const r=state.runs.find(x=>x.id===id);if(!r)return;modal(`<h2>Editar carrera</h2><div class="form-grid"><div class="field"><label>Fecha</label><input id="editRunDate" type="date" value="${r.run_date}"></div><div class="field"><label>Km</label><input id="editRunKm" type="number" step="0.1" value="${r.km}"></div></div><button class="primary" style="margin-top:14px" onclick="saveRunEdit('${id}')">Guardar</button>`)}
async function saveRunEdit(id){const patch={run_date:$('#editRunDate').value,km:Number($('#editRunKm').value)};const {error}=await sb.from('runs').update(patch).eq('id',id);if(error)return toast(error.message);Object.assign(state.runs.find(x=>x.id===id),patch);closeModal();renderAll();saveCached();toast('Carrera actualizada')}
async function deleteRun(id,silent=false){const {error}=await sb.from('runs').update({deleted_at:new Date().toISOString()}).eq('id',id);if(error)return toast(error.message);state.runs=state.runs.filter(x=>x.id!==id);closeModal();renderAll();saveCached();if(!silent)toast('Carrera eliminada · Deshacer',5000)}
async function deleteWorkout(id){const {error}=await sb.from('workout_sessions').update({deleted_at:new Date().toISOString()}).eq('id',id);if(error)return toast(error.message);state.workouts=state.workouts.filter(x=>x.id!==id);closeModal();renderAll();saveCached();toast('Rutina eliminada')}

function renderStats(){const totals=allTotals(),streakG=calcStreak('global'),streakR=calcStreak('run'),streakW=calcStreak('work'),cons=consistency(state.settings.consistency_window||8);$('#view-stats').innerHTML=`<div class="grid g4"><div class="card"><div class="small">KM HISTÓRICOS</div><div class="kpi">${totals.km.toFixed(1)}</div></div><div class="card"><div class="small">RUTINAS</div><div class="kpi">${totals.workouts}</div></div><div class="card"><div class="small">TIEMPO POLEAS</div><div class="kpi">${fmtHours(totals.seconds)}</div></div><div class="card"><div class="small">RACHA GLOBAL</div><div class="kpi">🔥 ${streakG}</div></div></div><div class="card" style="margin-top:16px"><div class="subtabs"><button class="${state.statsTab==='run'?'active':''}" onclick="setStatsTab('run')">Carrera</button><button class="${state.statsTab==='work'?'active':''}" onclick="setStatsTab('work')">Poleas</button><button class="${state.statsTab==='goals'?'active':''}" onclick="setStatsTab('goals')">Objetivos</button></div><div class="chart-wrap"><canvas id="mainChart"></canvas></div></div><div class="grid g3" style="margin-top:16px"><div class="card"><h2 class="section-title">Consistencia</h2><div class="kpi">${cons.global}%</div><div class="small">Global · ${state.settings.consistency_window} semanas</div><div style="margin-top:10px">🏃 ${cons.run}% · 🏋️ ${cons.work}%</div></div><div class="card"><h2 class="section-title">Rachas</h2><div>🔥 Global: <b>${streakG}</b></div><div>🏃 Carrera: <b>${streakR}</b></div><div>🏋️ Poleas: <b>${streakW}</b></div></div><div class="card"><h2 class="section-title">Duración de sesiones</h2>${sessionDurationStats()}</div></div><div class="grid g2" style="margin-top:16px"><div class="card"><h2 class="section-title">Récords personales</h2>${recordsHtml()}</div><div class="card"><h2 class="section-title">Logros</h2>${achievementsHtml()}</div></div>`;setTimeout(drawStatsChart,0)}
function setStatsTab(t){state.statsTab=t;renderStats()}
function allTotals(){return{km:state.runs.reduce((a,r)=>a+Number(r.km),0),workouts:state.workouts.filter(w=>w.completed).length,seconds:state.workouts.filter(w=>w.completed).reduce((a,w)=>a+(w.duration_seconds||0),0)}}
function weekBuckets(n=16){const out=[];for(let i=n-1;i>=0;i--){const s=addDays(mondayOf(),-i*7),e=addDays(s,6),ss=isoLocal(s),ee=isoLocal(e),km=state.runs.filter(r=>r.run_date>=ss&&r.run_date<=ee).reduce((a,r)=>a+Number(r.km),0),wc=state.workouts.filter(w=>w.completed&&w.workout_date>=ss&&w.workout_date<=ee).length,g={run:Number(state.settings.weekly_run_goal||30),workout:Number(state.settings.weekly_workout_goal||3)};out.push({label:fmtDate(s,{day:'numeric',month:'short'}),km,wc,score:scoreWeek(km,wc,g)})}return out}
function drawStatsChart(){const c=$('#mainChart');if(!c)return;if(state.chart)state.chart.destroy();const b=weekBuckets(16);let data,label;if(state.statsTab==='run'){data=b.map(x=>x.km);label='km/semana'}else if(state.statsTab==='work'){data=b.map(x=>x.wc);label='rutinas/semana'}else{data=b.map(x=>x.score);label='% cumplimiento'}state.chart=new Chart(c,{type:'line',data:{labels:b.map(x=>x.label),datasets:[{label,data,tension:.28,fill:false}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{y:{beginAtZero:true}}}})}
function consistency(n){const b=weekBuckets(n);const g={run:Number(state.settings.weekly_run_goal||30),workout:Number(state.settings.weekly_workout_goal||3)};const run=Math.round(b.reduce((a,x)=>a+Math.min(x.km/g.run,1),0)/n*100),work=Math.round(b.reduce((a,x)=>a+Math.min(x.wc/g.workout,1),0)/n*100);return{run,work,global:Math.round((run+work)/2)}}
function calcStreak(type){let n=0;for(let i=0;i<104;i++){const s=addDays(mondayOf(),-i*7),e=addDays(s,6),ss=isoLocal(s),ee=isoLocal(e),km=state.runs.filter(r=>r.run_date>=ss&&r.run_date<=ee).reduce((a,r)=>a+Number(r.km),0),wc=state.workouts.filter(w=>w.completed&&w.workout_date>=ss&&w.workout_date<=ee).length,g={run:Number(state.settings?.weekly_run_goal||30),workout:Number(state.settings?.weekly_workout_goal||3)};const ok=type==='run'?km>=g.run:type==='work'?wc>=g.workout:(km>=g.run&&wc>=g.workout);if(ok)n++;else if(i>0)break;else break}return n}
function sessionDurationStats(){const a=state.workouts.filter(w=>w.completed&&w.duration_seconds).map(w=>w.duration_seconds);if(!a.length)return'<div class="muted">Sin datos.</div>';const avg=Math.round(a.reduce((x,y)=>x+y,0)/a.length);return `<div>Media: <b>${fmtDuration(avg)}</b></div><div>Más corta: <b>${fmtDuration(Math.min(...a))}</b></div><div>Más larga: <b>${fmtDuration(Math.max(...a))}</b></div>`}
function recordsHtml(){const daily={};state.runs.forEach(r=>daily[r.run_date]=(daily[r.run_date]||0)+Number(r.km));const maxDay=Math.max(0,...Object.values(daily));const weeks=weekBuckets(104),maxWeek=Math.max(0,...weeks.map(x=>x.km)),maxW=Math.max(0,...weeks.map(x=>x.wc));return `<div>🏃 Mayor distancia diaria: <b>${maxDay.toFixed(1)} km</b></div><div>📅 Mejor semana: <b>${maxWeek.toFixed(1)} km</b></div><div>🏋️ Más rutinas/semana: <b>${maxW}</b></div><div>🔥 Mejor racha global: <b>${bestStreak()}</b></div>`}
function bestStreak(){const b=weekBuckets(156),g={run:Number(state.settings.weekly_run_goal||30),workout:Number(state.settings.weekly_workout_goal||3)};let best=0,cur=0;for(const x of b){if(x.km>=g.run&&x.wc>=g.workout){cur++;best=Math.max(best,cur)}else cur=0}return best}
function achievementsHtml(){const t=allTotals();const defs=[['Kilómetros I',100,t.km,'🥉'],['Kilómetros II',250,t.km,'🥈'],['Kilómetros III',500,t.km,'🥇'],['Rutinas I',25,t.workouts,'🥉'],['Rutinas II',50,t.workouts,'🥈'],['Rutinas III',100,t.workouts,'🥇'],['Racha',4,bestStreak(),'🔥']];return `<div class="grid">${defs.map(([name,target,val,ico])=>`<div class="achievement"><div class="row"><div class="medal">${val>=target?ico:'🔒'}</div><div style="flex:1"><b>${name}</b><div class="small">${Math.min(val,target).toFixed?Math.min(val,target).toFixed(name.startsWith('Kilómetros')?0:0):val} / ${target}</div><div class="progress"><span style="width:${clamp(val/target*100,0,100)}%"></span></div></div></div></div>`).join('')}</div>`}
function checkMicroAchievements(){const w=currentWeek(),g=currentGoals();if(w.km>=g.run||w.workouts.length>=g.workout)toast('✨ Objetivo semanal alcanzado')}

function renderSettings(){const s=state.settings;$('#view-settings').innerHTML=`<div class="card"><h2 class="section-title">Objetivos y planificación</h2><div class="form-grid"><div class="field"><label>Km por semana</label><input id="setWeekKm" type="number" step="0.5" value="${s.weekly_run_goal}"></div><div class="field"><label>Rutinas por semana</label><input id="setWeekWo" type="number" value="${s.weekly_workout_goal}"></div><div class="field"><label>Mínimo recomendado por salida</label><input id="setMinKm" type="number" step="0.5" value="${s.min_run_km}"></div><div class="field"><label>Máximo recomendado por salida</label><input id="setMaxKm" type="number" step="0.5" value="${s.max_run_km}"></div><div class="field"><label>Días de carrera (1=L … 7=D)</label><input id="setRunDays" value="${(s.run_days||[]).join(',')}"></div><div class="field"><label>Días de poleas</label><input id="setWorkDays" value="${(s.workout_days||[]).join(',')}"></div><div class="field"><label>Consistencia</label><select id="setCons"><option ${s.consistency_window==4?'selected':''}>4</option><option ${s.consistency_window==8?'selected':''}>8</option><option ${s.consistency_window==12?'selected':''}>12</option></select></div><div class="field"><label>Combinar carrera + poleas</label><select id="setDouble"><option value="true" ${s.allow_double_activity?'selected':''}>Sí</option><option value="false" ${!s.allow_double_activity?'selected':''}>No</option></select></div></div><button class="primary" style="margin-top:14px" onclick="saveSettings()">Guardar ajustes</button></div><div class="grid g2" style="margin-top:16px"><div class="card"><h2 class="section-title">Apariencia</h2><div class="form-grid"><div class="field"><label>Tema</label><select id="setTheme"><option value="system" ${s.theme==='system'?'selected':''}>Automático</option><option value="light" ${s.theme==='light'?'selected':''}>Claro</option><option value="dark" ${s.theme==='dark'?'selected':''}>Oscuro</option></select></div><div class="field"><label>Color principal</label><input id="setAccent" type="color" value="${s.accent_color||'#2563eb'}"></div></div></div><div class="card"><h2 class="section-title">Datos</h2><div class="today-actions"><button class="ghost" onclick="exportJSON()">Exportar JSON</button><button class="ghost" onclick="exportCSV()">Exportar CSV</button><label class="ghost" style="cursor:pointer">Importar carreras<input id="importFile" type="file" accept=".json,.csv" hidden onchange="importRuns(this.files[0])"></label></div></div></div><div class="card" style="margin-top:16px"><h2 class="section-title">Cuenta</h2><div class="small">${escapeHtml(state.user.email||'')}</div><button class="danger" style="margin-top:12px" onclick="logout()">Cerrar sesión</button></div>`}
async function saveSettings(){const p={weekly_run_goal:Number($('#setWeekKm').value),weekly_workout_goal:Number($('#setWeekWo').value),min_run_km:Number($('#setMinKm').value),max_run_km:Number($('#setMaxKm').value),run_days:parseDays($('#setRunDays').value),workout_days:parseDays($('#setWorkDays').value),consistency_window:Number($('#setCons').value),allow_double_activity:$('#setDouble').value==='true',theme:$('#setTheme').value,accent_color:$('#setAccent').value};const oldRun=Number(state.settings.weekly_run_goal),oldW=Number(state.settings.weekly_workout_goal);const {error}=await sb.from('settings').update(p).eq('user_id',state.user.id);if(error)return toast(error.message);Object.assign(state.settings,p);if(oldRun!==p.weekly_run_goal||oldW!==p.weekly_workout_goal)await sb.from('goals_history').insert({user_id:state.user.id,valid_from:isoLocal(),weekly_run_goal:p.weekly_run_goal,weekly_workout_goal:p.weekly_workout_goal});applyTheme(p.theme,p.accent_color);saveCached();renderAll();toast('Ajustes guardados')}
function parseDays(v){return [...new Set(v.split(',').map(x=>Number(x.trim())).filter(x=>x>=1&&x<=7))].sort()}
function applyTheme(theme='system',accent){localStorage.setItem('training_theme',theme);let actual=theme;if(theme==='system')actual=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';document.documentElement.dataset.theme=actual;if(accent)document.documentElement.style.setProperty('--accent',accent)}
async function logout(){await sb.auth.signOut();location.reload()}

function exportJSON(){const data={exported_at:new Date().toISOString(),settings:state.settings,runs:state.runs,workouts:state.workouts,plans:state.plans,planItems:state.planItems,specialWeeks:state.specialWeeks,achievements:state.achievements};download(`training-${isoLocal()}.json`,JSON.stringify(data,null,2),'application/json')}
function exportCSV(){const rows=['date,km',...state.runs.map(r=>`${r.run_date},${r.km}`)];download(`training-runs-${isoLocal()}.csv`,rows.join('\n'),'text/csv')}
function download(name,text,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
async function importRuns(file){if(!file)return;const text=await file.text();let rows=[];try{if(file.name.toLowerCase().endsWith('.json')){const j=JSON.parse(text);const arr=Array.isArray(j)?j:(j.runs||[]);rows=arr.map(x=>({run_date:x.run_date||x.fecha||x.date,km:Number(x.km||x.kilometros)}))}else{const lines=text.trim().split(/\r?\n/);const head=lines.shift().toLowerCase().split(',');const di=head.findIndex(x=>/date|fecha/.test(x)),ki=head.findIndex(x=>/km|kilomet/.test(x));rows=lines.map(l=>{const c=l.split(',');return{run_date:c[di],km:Number(c[ki])}})}rows=rows.filter(x=>/^\d{4}-\d{2}-\d{2}$/.test(x.run_date)&&x.km>0&&x.run_date<=isoLocal());if(!rows.length)return toast('No hay registros válidos');modal(`<h2>Importar ${rows.length} carreras</h2><p>Se han validado correctamente. Las carreras del mismo día se mantendrán separadas.</p><button class="primary" onclick='confirmImport(${JSON.stringify(rows)})'>Importar</button>`)}catch(e){toast('Archivo no válido: '+e.message)}}
async function confirmImport(rows){const payload=rows.map(x=>({...x,user_id:state.user.id,imported:true}));const {data,error}=await sb.from('runs').insert(payload).select();if(error)return toast(error.message);state.runs.push(...data);closeModal();renderAll();saveCached();toast(`${data.length} carreras importadas`)}

function fmtDuration(sec){sec=Math.max(0,Math.round(sec||0));return `${pad(Math.floor(sec/60))}:${pad(sec%60)}`}
function fmtHours(sec){const h=Math.floor(sec/3600),m=Math.round((sec%3600)/60);return h?`${h} h ${m} min`:`${m} min`}
function effortLabel(e){return e==='easy'?'😌 Fácil':e==='hard'?'🥵 Difícil':e==='adequate'?'🙂 Adecuado':'—'}

window.addEventListener('online',()=>refreshAll().then(renderAll));window.addEventListener('offline',()=>setSync('Sin conexión','warn'));
init();
</script>
