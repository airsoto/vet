<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Buscador de Tesis Doctorales UCM</title>
  <style>
    body{background:#121212;color:#f0f0f0;font-family:'Georgia',serif;margin:0;padding:2em}
    h1{text-align:center;color:#90caf9;margin-bottom:0.5em}
    .search-bar{display:flex;flex-wrap:wrap;gap:0.75em;justify-content:center;margin:1.25em 0}
    select,input,button{padding:0.6em 0.8em;font-size:1em;border-radius:8px;border:none;background:#1f1f1f;color:#f0f0f0}
    select, input{min-width:220px}
    button{background:#1e88e5;color:#fff;cursor:pointer}
    button:hover{filter:brightness(1.05)}
    .results{margin-top:1.25em;display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:1.25em}
    .card{background:#1e1e1e;border-left:4px solid #90caf9;border-radius:10px;padding:1.25em;transition:transform .2s, box-shadow .2s}
    .card:hover{transform:translateY(-2px);box-shadow:0 0 12px rgba(144,202,249,.35)}
    .meta{font-size:.92em;color:#bbb;margin:.35em 0}
    .abstract{font-style:italic;text-align:justify;line-height:1.55;margin-top:.6em}
    .pill{display:inline-block;background:#263238;color:#cde7ff;border:1px solid #375a7f;border-radius:999px;padding:.15em .6em;margin:.15em .25em 0 0;font-size:.82em}
    .btn{display:inline-block;background:#43a047;color:#fff;padding:.5em .9em;border-radius:7px;margin-top:.6em;text-decoration:none;font-size:.95em}
    .btn:hover{background:#2e7d32}
    .toolbar{display:flex;gap:.75em;justify-content:center;align-items:center;flex-wrap:wrap;margin-top:.75em}
    .count{font-size:1.05em;color:#90caf9;text-align:center;margin-top:.5em}
    .muted{opacity:.85}
    @media (max-width:480px){.results{grid-template-columns:1fr}}
  </style>
</head>
<body>
<h1>Buscador de Tesis Doctorales de la UCM</h1>

<div style="display:flex;justify-content:space-between;align-items:center;">
  <!-- Autor -->
  <h2 style="margin:0;">
    <span style="color:#ff9900;">Desarrollado por: Angel Soto</span>
  </h2>

  <!-- Enlace inicio -->
  <p style="margin:0; font-size:0.9em; text-align:right;">
    <a href="https://airsoto.github.io/vet/" 
       style="color:#90caf9; text-decoration:none; display:flex; align-items:center; gap:4px;">
      🏠 <span style="font-size:0.8em;">volver a página de inicio</span>
    </a>
  </p>
</div>

<p style="text-align:center; margin-top:-1em;">
  <a href="https://airsoto.github.io/vet/howtesis_ucm.html" target="_blank" style="color:#90caf9; text-decoration:underline;">
    (cómo está creada esta página)
  </a>
</p>

<h2 id="main-title">
  Encuentra una tesis de entre <span id="tesisCount">...</span>
</h2>


  <div class="search-bar">
    <select id="search-type" aria-label="Tipo de búsqueda">
      <option value="title">Título</option>
      <option value="authors">Autor</option>
      <option value="directors">Director/a</option>
      <option value="subjects_ucm">Materia UCM</option>
      <option value="subjects_unesco">Materia UNESCO</option>
    </select>

    <input id="search-input" type="text" placeholder="Buscar..." list="dynamic-datalist" aria-label="Texto a buscar">

    <select id="sort-by" aria-label="Ordenar por">
      <option value="">Ordenar por...</option>
      <option value="title">Título A-Z</option>
      <option value="author">Autor A-Z</option>
      <option value="year">Fecha (más reciente)</option>
    </select>

    <button id="btn-search">Buscar</button>
    <button id="btn-clear" title="Limpiar búsqueda">Limpiar</button>
  </div>

  <div class="toolbar muted" id="hints" style="display:none;"></div>
  <div class="count" id="result-count"></div>
  <div id="results" class="results"></div>

  <!-- Datalist dinámico para autocompletar según el tipo -->
  <datalist id="dynamic-datalist"></datalist>

  <script>
    let tesis = [];
    let subjectsUcmList = []; // de json/subjects_ucm.txt
    let authorsList = [];     // de JSON
    let directorsList = [];   // de JSON
    let subjectsUnescoList = []; // del JSON (opcional, se llena si hay)

    const els = {
      type: document.getElementById('search-type'),
      input: document.getElementById('search-input'),
      datalist: document.getElementById('dynamic-datalist'),
      sort: document.getElementById('sort-by'),
      btnSearch: document.getElementById('btn-search'),
      btnClear: document.getElementById('btn-clear'),
      results: document.getElementById('results'),
      count: document.getElementById('result-count'),
      hints: document.getElementById('hints')
    };

    // Utilidades
    const norm = s => (s || '').toString().normalize('NFD').replace(/\p{Diacritic}/gu,'').toLowerCase().trim();
    const uniq = arr => [...new Set(arr.filter(Boolean))];

    function parseBestDate(t){
      // Prioriza defense_date, luego pub_date; devuelve timestamp (ms) o 0
      const pick = t.defense_date || t.pub_date || t.pubYear || t.year;
      if(!pick) return 0;
      // Acepta 'YYYY', 'YYYY-MM', 'YYYY-MM-DD'
      const iso = /^\d{4}(-\d{2}){0,2}$/.test(pick) ? pick : (''+pick);
      const d = new Date(iso);
      return isNaN(d.getTime()) ? 0 : d.getTime();
    }

    function fillDatalist(options){
      els.datalist.innerHTML = options.slice(0, 5000) // seguridad
        .map(v=>`<option value="${v.replaceAll('"','&quot;')}"></option>`).join('');
    }

    function updateDatalistByType(){
      const t = els.type.value;
      if(t === 'subjects_ucm'){
        fillDatalist(subjectsUcmList);
        els.hints.style.display = 'block';
        els.hints.textContent = 'Sugerencias cargadas desde subjects_ucm.txt';
      } else if(t === 'directors'){
        fillDatalist(directorsList);
        els.hints.style.display = 'block';
        els.hints.textContent = 'Sugerencias de directores detectadas en el JSON';
      } else if(t === 'authors'){
        fillDatalist(authorsList);
        els.hints.style.display = 'block';
        els.hints.textContent = 'Sugerencias de autores detectadas en el JSON';
      } else if(t === 'subjects_unesco'){
        fillDatalist(subjectsUnescoList);
        els.hints.style.display = 'block';
        els.hints.textContent = 'Sugerencias de materias UNESCO detectadas en el JSON';
      } else {
        fillDatalist([]);
        els.hints.style.display = 'none';
      }
    }

    async function loadSubjectsUcm(){
      try{
        const res = await fetch('json/subjects_ucm.txt');
        if(!res.ok) throw new Error('No se pudo cargar subjects_ucm.txt');
        const txt = await res.text();
        subjectsUcmList = uniq(txt.split(/\r?\n/).map(s => s.trim()).filter(Boolean));
      }catch(e){
        console.warn('subjects_ucm.txt no disponible:', e);
        subjectsUcmList = [];
      }
    }

    async function loadTesis(){
      const res = await fetch('json/tesis_ucm_v1.json');
      if(!res.ok) throw new Error('No se pudo cargar el archivo JSON');
      const data = await res.json();
      tesis = Array.isArray(data) ? data : [];
      // Derivar listas para autocompletar
      const a = [];
      const d = [];
      const su = [];
      for(const t of tesis){
        (t.authors || []).forEach(x => a.push(x));
        (t.directors || []).forEach(x => d.push(x));
        (t.subjects_unesco || []).forEach(x => su.push(x));
      }
      authorsList = uniq(a).sort((x,y)=>norm(x).localeCompare(norm(y)));
      directorsList = uniq(d).sort((x,y)=>norm(x).localeCompare(norm(y)));
      subjectsUnescoList = uniq(su).sort((x,y)=>norm(x).localeCompare(norm(y)));
    }

    function filterBy(type, query){
      const q = norm(query);
      if(!q) return [...tesis];

      return tesis.filter(t => {
        const field = t[type];
        if(Array.isArray(field)){
          return field.some(v => norm(v).includes(q));
        }
        return norm(field).includes(q);
      });
    }

    function sortResults(arr, by){
      if(!by) return arr;
      const copy = [...arr];
      if(by === 'title'){
        copy.sort((a,b)=>norm(a.title).localeCompare(norm(b.title)));
      } else if(by === 'author'){
        const fa = norm((a.authors && a.authors[0]) || '');
        const fb = norm((b.authors && b.authors[0]) || '');
        copy.sort((x,y)=>fa.localeCompare(fb));
      } else if(by === 'year'){
        copy.sort((a,b)=>parseBestDate(b) - parseBestDate(a)); // más reciente primero
      }
      return copy;
    }

    function render(list){
      els.results.innerHTML = '';
      els.count.innerHTML = list.length
        ? `Se encontraron <strong>${list.length}</strong> tesis.`
        : 'No se encontraron resultados.';

      for(const t of list){
        const title = t.title || '(Sin título)';
        const authors = (t.authors && t.authors.length) ? t.authors.join(', ') : '-';
        const directors = (t.directors && t.directors.length) ? t.directors.filter(Boolean).join(', ') : '-';
        const pub = t.pub_date || '-';
        const def = t.defense_date || '-';
        const abs = t.summary || '(Sin resumen)';
        const sucm = (t.subjects_ucm && t.subjects_ucm.length) ? t.subjects_ucm : [];
        const sunes = (t.subjects_unesco && t.subjects_unesco.length) ? t.subjects_unesco : [];
        const pdf = t.pdf;

        const wrap = document.createElement('div');
        wrap.className = 'card';
        wrap.innerHTML = `
          <h2 style="color:#90caf9;text-align:center;margin:0 0 .4em 0">${title}</h2>
          <div class="meta"><strong>Autores:</strong> ${authors}</div>
          <div class="meta"><strong>Directores:</strong> ${directors}</div>
          <div class="meta"><strong>Publicación:</strong> ${pub} &nbsp;|&nbsp; <strong>Defensa:</strong> ${def}</div>
          ${sucm.length ? `<div class="meta"><strong>Materias UCM:</strong> ${sucm.map(s=>`<span class="pill">${s}</span>`).join(' ')}</div>` : ''}
          ${sunes.length ? `<div class="meta"><strong>Materias UNESCO:</strong> ${sunes.map(s=>`<span class="pill">${s}</span>`).join(' ')}</div>` : ''}
          <h3 style="margin:.6em 0 0 0;">Resumen</h3>
          <p class="abstract">${abs}</p>
          ${pdf ? `<a class="btn" href="${pdf}" target="_blank" rel="noopener">Abrir PDF en docta.ucm.es</a>` : ''}
        `;
        els.results.appendChild(wrap);
      }
    }

    function runSearch(){
      const type = els.type.value;
      const q = els.input.value;
      const sortBy = els.sort.value;
      const filtered = filterBy(type, q);
      const ordered = sortResults(filtered, sortBy);
      render(ordered);
    }

    function clearSearch(){
      els.input.value = '';
      els.sort.value = '';
      runSearch();
      els.input.focus();
    }

    // Eventos
    els.type.addEventListener('change', () => { updateDatalistByType(); els.input.focus(); });
    els.btnSearch.addEventListener('click', runSearch);
    els.sort.addEventListener('change', runSearch);
    els.btnClear.addEventListener('click', clearSearch);
    els.input.addEventListener('keydown', e => { if(e.key === 'Enter') runSearch(); });

    // Carga inicial


      function updateTesisCount() {
    const count = tesis.filter(t => t.title).length; // cuenta solo las que tienen título
    document.getElementById('tesisCount').textContent = count.toLocaleString('es-ES');
  }

  // ... resto de funciones (filterBy, sortResults, runSearch, etc.)

  // === LLÁMALA EN init(), DESPUÉS DE CARGAR EL JSON ===
  (async function init(){
    await Promise.all([loadSubjectsUcm(), loadTesis()]);
    updateDatalistByType();
    render(tesis);
    updateTesisCount(); // 👈 actualiza el número del título
  })();
</script>

</body>
</html>
