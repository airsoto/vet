<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Reference points Scorpion varileg, opus 379 (with the permission of Robert J. Lang)</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      margin: 20px;
      background-color: #f9f9f9;
    }
    #controls {
      margin-bottom: 10px;
    }
    #canvasContainer {
      border: 1px solid #ccc;
      display: inline-block;
      background: #f0f0f0;
      position: relative;
    }
    canvas {
      background-color: #f0f0f0;
      cursor: grab;
    }
    input, button {
      margin: 5px;
      padding: 8px 16px;
      font-size: 16px;
    }
  </style>
</head>
<body>

<h2>Reference points Scorpion varileg, opus 379<br>(with the permission of Robert J. Lang)</h2>
<h3>You can move the square to position it on the DIN A4-sized page.</h3>
<h4 style="text-align: right; max-width: 800px; margin: 0 auto; text-align: right;">
  <a href="https://langorigami.com/artwork/scorpion-varileg-opus-379/" target="_blank" style="color: #0077cc; text-decoration: none;">
    (Based on the diagrams of Scorpion Varileg, Opus 379)
  </a>
</h4>


<div id="controls">
  <label for="squareSize">Side length (cm):</label>
  <input type="number" id="squareSize" value="10" step="0.1" min="1" onchange="draw()">
  <button onclick="downloadPDF()">Download PDF</button>
</div>

<div id="canvasContainer">
  <canvas id="a4Canvas" width="794" height="1123"></canvas>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<script>
const canvas = document.getElementById("a4Canvas");
const ctx = canvas.getContext("2d");

const pixelsPerCm = 37.8;

const basePoints = [
  {x: 0, y: 0.0743},
  {x: 0.2063, y: 0.2195},
  {x: 0.3306, y: 0},
  {x: 0, y: 0.3647},
  {x: 0, y: 0.6068},
  {x: 0.2535, y: 0.6350},
  {x: 0, y: 0.9486},
  {x: 0.0821, y: 1}
];

const connections = [
  [0, 2],
  [2, 1],
  [0, 1],
  [3, 1],
  [4, 5],
  [5, 7],
  [5, 6]
];

const mirroredPoints = basePoints.map(p => ({ x: 1 - p.x, y: p.y }));
const allPoints = basePoints.concat(mirroredPoints);

const mirroredConnections = connections.map(([a, b]) => [a + basePoints.length, b + basePoints.length]);

const allConnections = connections.concat(mirroredConnections).concat([
  [3, 12],
  [4, 11]
]);

let squareSizeCm = 10;
let squareX = 0;
let squareY = 0;
let dragging = false;
let dragOffsetX = 0;
let dragOffsetY = 0;

function calculateIntersection(p1, p2, p3, p4) {
  const a1 = p2.y - p1.y;
  const b1 = p1.x - p2.x;
  const c1 = a1 * p1.x + b1 * p1.y;

  const a2 = p4.y - p3.y;
  const b2 = p3.x - p4.x;
  const c2 = a2 * p3.x + b2 * p3.y;

  const denominator = a1 * b2 - a2 * b1;
  if (denominator === 0) return null;

  const x = (b2 * c1 - b1 * c2) / denominator;
  const y = (a1 * c2 - a2 * c1) / denominator;

  return { x, y };
}

function draw() {
  squareSizeCm = parseFloat(document.getElementById("squareSize").value);
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  const sidePx = squareSizeCm * pixelsPerCm;

  ctx.strokeStyle = "black";
  ctx.lineWidth = 2;
  ctx.strokeRect(squareX, squareY, sidePx, sidePx);

  ctx.strokeStyle = "black";
  ctx.lineWidth = 0.5;
  allConnections.forEach(([startIdx, endIdx]) => {
    const start = allPoints[startIdx];
    const end = allPoints[endIdx];
    ctx.beginPath();
    ctx.moveTo(squareX + start.x * sidePx, squareY + sidePx - start.y * sidePx);
    ctx.lineTo(squareX + end.x * sidePx, squareY + sidePx - end.y * sidePx);
    ctx.stroke();
  });

  const p3 = allPoints[3];
  const p12 = allPoints[12];
  const p4 = allPoints[4];
  const p11 = allPoints[11];
  const intersection = calculateIntersection(p3, p12, p4, p11);

  if (intersection) {
    const ix = squareX + intersection.x * sidePx;
    const iy = squareY + sidePx - intersection.y * sidePx;

    const specialPoints = [2, 7, 10, 15];
    ctx.strokeStyle = "black";
    ctx.lineWidth = 0.5;
    specialPoints.forEach(idx => {
      const p = allPoints[idx];
      const px = squareX + p.x * sidePx;
      const py = squareY + sidePx - p.y * sidePx;
      ctx.beginPath();
      ctx.moveTo(px, py);
      ctx.lineTo(ix, iy);
      ctx.stroke();
    });
  }

  ctx.strokeStyle = "black";
  ctx.lineWidth = 2;
  allPoints.forEach(p => {
    const px = squareX + p.x * sidePx;
    const py = squareY + sidePx - p.y * sidePx;
    const size = 8;
    ctx.beginPath();
    ctx.moveTo(px - size, py - size);
    ctx.lineTo(px + size, py + size);
    ctx.moveTo(px - size, py + size);
    ctx.lineTo(px + size, py - size);
    ctx.stroke();
  });
}

function downloadPDF() {
  const { jsPDF } = window.jspdf;
  const ladoCm = parseFloat(document.getElementById("squareSize").value);
  const sidePx = ladoCm * pixelsPerCm; // El tamaño real en píxeles
  const { width: canvasWidth, height: canvasHeight } = canvas;

  // Crear un canvas temporal del tamaño del cuadrado
  const tempCanvas = document.createElement("canvas");
  tempCanvas.width = sidePx;
  tempCanvas.height = sidePx;
  const tempCtx = tempCanvas.getContext("2d");

  // Copiar solo el área del cuadrado
  tempCtx.drawImage(
    canvas,
    squareX, squareY, sidePx, sidePx,  // área origen (en el canvas original)
    0, 0, sidePx, sidePx               // área destino (en el canvas temporal)
  );

  const imgData = tempCanvas.toDataURL("image/png");

  const pdf = new jsPDF({
    orientation: "portrait",
    unit: "cm",
    format: "a4"
  });

  // Tamaño del cuadrado en el PDF (exactamente como el lado deseado)
  const imgWidthCm = ladoCm;
  const imgHeightCm = ladoCm;

  // Centro de la página
  const posX = (21 - imgWidthCm) / 2;
  const posY = (29.7 - imgHeightCm) / 2;

  // Fondo blanco
  pdf.setFillColor(255, 255, 255);
  pdf.rect(0, 0, 21, 29.7, "F");

  // Insertar imagen recortada
  pdf.addImage(imgData, "PNG", posX, posY, imgWidthCm, imgHeightCm);

  // Escribir el tamaño del lado en el centro del cuadrado
  pdf.setFontSize(14);
  pdf.setTextColor(0, 0, 0);
  pdf.text(`${ladoCm.toFixed(2)} cm`, 10.5, posY + imgHeightCm / 2, { align: "center" });

  const filename = `scorpion_varileg_reference_points_${ladoCm.toFixed(2)}cm.pdf`;
  pdf.save(filename);
}


canvas.addEventListener('mousedown', function(e) {
  const rect = canvas.getBoundingClientRect();
  const mouseX = e.clientX - rect.left;
  const mouseY = e.clientY - rect.top;
  const sidePx = squareSizeCm * pixelsPerCm;

  if (mouseX > squareX && mouseX < squareX + sidePx && mouseY > squareY && mouseY < squareY + sidePx) {
    dragging = true;
    dragOffsetX = mouseX - squareX;
    dragOffsetY = mouseY - squareY;
    canvas.style.cursor = "grabbing";
  }
});

canvas.addEventListener('mousemove', function(e) {
  if (dragging) {
    const rect = canvas.getBoundingClientRect();
    squareX = (e.clientX - rect.left) - dragOffsetX;
    squareY = (e.clientY - rect.top) - dragOffsetY;
    draw();
  }
});

canvas.addEventListener('mouseup', function() {
  dragging = false;
  canvas.style.cursor = "grab";
});

canvas.addEventListener('mouseleave', function() {
  dragging = false;
  canvas.style.cursor = "grab";
});

draw();
</script>

</body>
</html>
