        function searchDrug() {
            let query = document.getElementById('search').value.toLowerCase();
            let resultsDiv = document.getElementById('results');
            resultsDiv.innerHTML = '';

            let filtered = data["DATOS GENERALES"].filter(item => 
                item["MEDICAMENTO"].toLowerCase().includes(query) ||
                item["PRINCIPIOS ACTIVOS"].toLowerCase().includes(query)
            );

            if (filtered.length === 0) {
                resultsDiv.innerHTML = '<p>No se encontraron resultados</p>';
                return;
            }

            filtered.forEach(item => {
                let card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `<strong>${item["MEDICAMENTO"]}</strong><br>
                                  <em>${item["PRINCIPIOS ACTIVOS"]}</em><br>
                                  <small>Número de Registro: ${item["NUMERO DE REGISTRO"]}</small>`;
                resultsDiv.appendChild(card);
            });
        }
