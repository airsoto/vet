    }

      max-width: 600px;
      margin: auto;
      background: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    .autocomplete {
      position: relative;
    }
    input[type="text"] {
      width: 100%;
      padding: 10px;
      margin-bottom: 10px;
      border: 1px solid #ccc;
      border-radius: 5px;
    }
    .suggestions {
      position: absolute;
      background: #fff;
      border: 1px solid #ccc;
      z-index: 99;
      max-height: 150px;
      overflow-y: auto;
      width: 100%;
    }
    .suggestion-item {
      padding: 8px;
      cursor: pointer;
    }
    .suggestion-item:hover {
      background-color: #eee;
    }
    .result {
      margin-top: 20px;
      padding: 15px;
      border-radius: 5px;
      font-weight: bold;
      text-align: center;
    }
    .green { background-color: #d4edda; color: #155724; }
    .red { background-color: #f8d7da; color: #721c24; }
    .grey { background-color: #e2e3e5; color: #383d41; }
    .yellow { background-color: #fff3cd; color: #856404; }
    .orange { background-color: #ffe5b4; color: #8a4b08; }
  </style>

    const data = {};
    const allDrugs = new Set();

    // Expand rawData to be bidirectional
    for (const drugA in rawData) {
      for (const drugB in rawData[drugA]) {
        const value = rawData[drugA][drugB];
        allDrugs.add(drugA);
        allDrugs.add(drugB);

        if (!data[drugA]) data[drugA] = {};
        if (!data[drugB]) data[drugB] = {};

        data[drugA][drugB] = value;
        data[drugB][drugA] = value;
      }
    }

    const drugList = [...allDrugs];

    const messages = {
      1: { text: "considerar como COMPATIBLE (no existen datos)", class: "green" },
      2: { text: "considerar como INCOMPATIBLE", class: "red" },
      3: { text: "considerar como INCOMPATIBLE (no existen datos)", class: "grey" },
      4: { text: "PRECAUCIÓN: dependiente del tiempo o concentración", class: "yellow" },
      5: { text: "Fármaco veterinario (sin datos): considerar INCOMPATIBLE", class: "orange" },
    };

    function showSuggestions(inputId) {
      const input = document.getElementById(inputId);
      const suggestionsBox = document.getElementById(`suggestions-${inputId}`);
      const val = input.value.toLowerCase();
      suggestionsBox.innerHTML = "";

      if (!val) return;

      const matches = drugList.filter(drug => drug.toLowerCase().includes(val));
      matches.forEach(drug => {
        const div = document.createElement("div");
        div.classList.add("suggestion-item");
        div.textContent = drug;
        div.onclick = () => {
          input.value = drug;
          suggestionsBox.innerHTML = "";
          checkCompatibility();
        };
        suggestionsBox.appendChild(div);
      });
    }

    function checkCompatibility() {
      const d1 = document.getElementById('drug1').value.trim();
      const d2 = document.getElementById('drug2').value.trim();
      const result = document.getElementById('result');

      if (d1 && d2 && d1 !== d2) {
        let code = data[d1]?.[d2];
        if (code && messages[code]) {
          result.className = `result ${messages[code].class}`;
          result.innerText = messages[code].text;
        } else {
          result.className = "result grey";
          result.innerText = "No hay datos disponibles para esta combinación";
        }
      } else {
        result.innerText = "";
        result.className = "result";
      }
    }
