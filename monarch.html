  const image = new Image();
  image.src = base64Image;

  image.onload = () => draw();

  function draw() {
    const squareSizeCm = parseFloat(document.getElementById("squareSize").value);
    const squareSizePx = squareSizeCm * pixelsPerCm;

    ctx.clearRect(0, 0, canvas.width, canvas.height);

    const cols = Math.floor(canvas.width / squareSizePx);
    const rows = Math.floor(canvas.height / squareSizePx);

    for (let y = 0; y < rows; y++) {
      for (let x = 0; x < cols; x++) {
        const dx = x * squareSizePx;
        const dy = y * squareSizePx;
        ctx.drawImage(image, dx, dy, squareSizePx, squareSizePx);
      }
    }
  }

  async function downloadPDF() {
    const { jsPDF } = window.jspdf;

    const imgData = canvas.toDataURL("image/png");
    const squareSizeCm = parseFloat(document.getElementById("squareSize").value);

    const pdf = new jsPDF({
      orientation: "portrait",
      unit: "cm",
      format: "a4"
    });

    pdf.addImage(imgData, "PNG", 0, 0, 21, 29.7);
    pdf.save(`monarch_skin_grid_${squareSizeCm.toFixed(2)}cm.pdf`);
  }
