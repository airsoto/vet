<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Reloj Digital Neón</title>
  <style>
    body {
      margin: 0;
      background: #000;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: monospace;
    }

    .clock {
      display: flex;
      gap: 20px;
      transform: scale(1.2);
    }

    .digit {
      position: relative;
      width: 50px;
      height: 100px;
    }

    .segment {
      position: absolute;
      background: #1a1a1a;
      border-radius: 5px;
      transition: 0.2s ease;
      box-shadow: inset 0 0 8px #000;
    }

    .on {
      background: #00ff99;
      box-shadow:
        0 0 12px #00ff99,
        0 0 20px #00ff99,
        inset 0 0 8px #00cc77;
    }

    /* Segment positions */
    .a { top: 0; left: 10px; width: 30px; height: 8px; }
    .b { top: 10px; right: 0; width: 8px; height: 35px; }
    .c { bottom: 10px; right: 0; width: 8px; height: 35px; }
    .d { bottom: 0; left: 10px; width: 30px; height: 8px; }
    .e { bottom: 10px; left: 0; width: 8px; height: 35px; }
    .f { top: 10px; left: 0; width: 8px; height: 35px; }
    .g { top: 46px; left: 10px; width: 30px; height: 8px; }

    .colon {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      height: 100px;
      padding: 25px 0;
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #00ff99;
      box-shadow: 0 0 10px #00ff99, 0 0 15px #00ff99;
    }
  </style>
</head>
<body>

<div class="clock" id="clock">
  <div class="digit" id="d0"></div>
  <div class="digit" id="d1"></div>
  <div class="colon"><div class="dot"></div><div class="dot"></div></div>
  <div class="digit" id="d2"></div>
  <div class="digit" id="d3"></div>
  <div class="colon"><div class="dot"></div><div class="dot"></div></div>
  <div class="digit" id="d4"></div>
  <div class="digit" id="d5"></div>
</div>

<script>
  const segments = {
    0: ['a', 'b', 'c', 'd', 'e', 'f'],
    1: ['b', 'c'],
    2: ['a', 'b', 'g', 'e', 'd'],
    3: ['a', 'b', 'g', 'c', 'd'],
    4: ['f', 'g', 'b', 'c'],
    5: ['a', 'f', 'g', 'c', 'd'],
    6: ['a', 'f', 'g', 'e', 'c', 'd'],
    7: ['a', 'b', 'c'],
    8: ['a', 'b', 'c', 'd', 'e', 'f', 'g'],
    9: ['a', 'b', 'c', 'd', 'f', 'g']
  };

  // Inicializa los dígitos
  for (let i = 0; i < 6; i++) {
    const digit = document.getElementById('d' + i);
    ['a', 'b', 'c', 'd', 'e', 'f', 'g'].forEach(seg => {
      const el = document.createElement('div');
      el.classList.add('segment', seg);
      digit.appendChild(el);
    });
  }

  // Actualiza cada dígito con segmentos activos
  function showDigit(id, number) {
    const digit = document.getElementById(id);
    const all = digit.querySelectorAll('.segment');
    all.forEach(seg => seg.classList.remove('on'));
    segments[number].forEach(s => {
      digit.querySelector('.' + s).classList.add('on');
    });
  }

  // Actualiza la hora
  function updateClock() {
    const now = new Date();
    const h = now.getHours().toString().padStart(2, '0');
    const m = now.getMinutes().toString().padStart(2, '0');
    const s = now.getSeconds().toString().padStart(2, '0');
    const full = h + m + s;
    for (let i = 0; i < 6; i++) {
      showDigit('d' + i, parseInt(full[i]));
    }
  }

  updateClock();
  setInterval(updateClock, 1000);
</script>

</body>
</html>
