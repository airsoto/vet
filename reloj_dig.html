<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Reloj Digital Estilo Casio</title>
    <style>
        body {
            margin: 0;
            background: black;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }

        .clock {
            display: flex;
            gap: 20px;
        }

        .digit {
            position: relative;
            width: 40px;
            height: 70px;
        }

        .segment {
            position: absolute;
            background: #222;
            transition: background 0.2s;
        }

        .on {
            background: #0f0;
        }

        /* Segment positions */
        .a { top: 0; left: 5px; width: 30px; height: 6px; }
        .b { top: 5px; right: 0; width: 6px; height: 30px; }
        .c { bottom: 5px; right: 0; width: 6px; height: 30px; }
        .d { bottom: 0; left: 5px; width: 30px; height: 6px; }
        .e { bottom: 5px; left: 0; width: 6px; height: 30px; }
        .f { top: 5px; left: 0; width: 6px; height: 30px; }
        .g { top: 32px; left: 5px; width: 30px; height: 6px; }

        .colon {
            display: flex;
            flex-direction: column;
            justify-content: space-around;
            height: 70px;
        }

        .dot {
            width: 6px;
            height: 6px;
            background: #0f0;
            border-radius: 50%;
        }
    </style>
</head>
<body>

<div class="clock" id="clock">
    <!-- Horas -->
    <div class="digit" id="d0"></div>
    <div class="digit" id="d1"></div>
    <div class="colon"><div class="dot"></div><div class="dot"></div></div>
    <!-- Minutos -->
    <div class="digit" id="d2"></div>
    <div class="digit" id="d3"></div>
    <div class="colon"><div class="dot"></div><div class="dot"></div></div>
    <!-- Segundos -->
    <div class="digit" id="d4"></div>
    <div class="digit" id="d5"></div>
</div>

<script>
    // Segmentos encendidos por dígito (a-g)
    const segments = {
        0: ['a', 'b', 'c', 'd', 'e', 'f'],
        1: ['b', 'c'],
        2: ['a', 'b', 'g', 'e', 'd'],
        3: ['a', 'b', 'g', 'c', 'd'],
        4: ['f', 'g', 'b', 'c'],
        5: ['a', 'f', 'g', 'c', 'd'],
        6: ['a', 'f', 'g', 'e', 'c', 'd'],
        7: ['a', 'b', 'c'],
        8: ['a', 'b', 'c', 'd', 'e', 'f', 'g'],
        9: ['a', 'b', 'c', 'd', 'f', 'g']
    };

    // Crear segmentos en cada dígito
    function createSegments(id) {
        const digit = document.getElementById(id);
        ['a', 'b', 'c', 'd', 'e', 'f', 'g'].forEach(seg => {
            const div = document.createElement('div');
            div.classList.add('segment', seg);
            digit.appendChild(div);
        });
    }

    for (let i = 0; i < 6; i++) createSegments("d" + i);

    // Mostrar número en un dígito
    function showDigit(digitId, number) {
        const active = segments[number];
        const digit = document.getElementById(digitId);
        const all = digit.querySelectorAll('.segment');
        all.forEach(seg => seg.classList.remove('on'));
        active.forEach(segName => {
            digit.querySelector('.' + segName).classList.add('on');
        });
    }

    // Actualizar reloj
    function updateClock() {
        const now = new Date();
        const time = now.toTimeString().slice(0, 8).replace(/:/g, "");
        for (let i = 0; i < 6; i++) {
            showDigit("d" + i, parseInt(time[i]));
        }
    }

    setInterval(updateClock, 1000);
    updateClock();
</script>

</body>
</html>
