<!DOCTYPE html>
<html lang="zh">
<script defer src="goat.js"></script>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reloj con Números japoneses</title>
  <style>
    body {
      overflow: hidden;
      background-color: #fffbe6;
    }

    .wrapper {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100vw;
      height: 100vh;
      font-size: clamp(20px, 5vw, 40px);
      font-family: "serif", "Noto Serif SC", "KaiTi", "SimSun";
    }

    #time-wrapper {
      transform-origin: center center;
    }

    #sumertime {
      text-align: center;
      width: clamp(200px, -40px + 40vw, 440px);
    }
  </style>
</head>
<body>

<div class="wrapper">
  <div id="time-wrapper">
    <div id="sumertime"></div>
  </div>
</div>

<script>
  const digits = ['零', '一', '二', '三', '四', '五', '六', '七', '八', '九'];

  function toChinese(num) {
    if (num === 0) return digits[0];

    if (num <= 10) {
      return num === 10 ? '十' : digits[num];
    }

    if (num < 20) {
      return '十' + digits[num % 10];
    }

    let tens = Math.floor(num / 10);
    let units = num % 10;
    return digits[tens] + '十' + (units > 0 ? digits[units] : '');
  }

  function setTime() {
    const d = new Date();
    const hour = d.getHours();
    const minute = d.getMinutes();
    const second = d.getSeconds();

    document.getElementById("sumertime").innerHTML =
      toChinese(hour) + " : " + toChinese(minute) + " : " + toChinese(second);
  }

  setTime();
  setInterval(setTime, 1000);
</script>

</body>
</html>
