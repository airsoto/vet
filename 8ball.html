<!DOCTYPE html>
<html lang="es">
<script defer src="goat.js"></script>

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bola 8 Mágica</title>
  <style>
    body {
      background-color: #000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      font-family: Arial, sans-serif;
    }

    #container {
      position: relative;
      width: 588.2px;
      height: 588.2px;
    }

    #ball {
      width: 588.2px;
      height: 588.2px;
      transition: transform 0.3s ease;
    }

    #message-box {
      position: absolute;
      top: 45%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 160px;
      padding: 10px;
      background-color: rgba(9, 9, 9, 0.8);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    #message {
      color: white;
      font-size: 14px;
      font-weight: bold;
    }

    button {
      margin-top: 20px;
      padding: 10px 20px;
      font-size: 16px;
      background-color: #444;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }

    #footer {
      margin-top: 20px;
      font-size: 12px;
      color: #ccc;
    }
  </style>
</head>
<body>
  <div id="container">
    <img id="ball" src="ball.png" alt="Bola 8" />
    <div id="message-box">
      <div id="message"></div>
    </div>
  </div>
  <button onclick="moverBola()">Mover</button>

  <div id="footer">Desarrollado por: Angel Soto</div>

  <script>
    const mensajes =  [
      "Es cierto.",
      "Es decididamente así.",
      "Sin lugar a dudas.",
      "SÍ, definitivamente.",
      "Puedes apostar por ello.",
      "Como yo lo veo, SÍ.",
      "Es lo más probable.",
      "CAsi seguro que SÍ.",
      "SÍ.",
      "Las señales apuntan a que sí.",
      "Es dudoso, vuelve a intentarlo.",
      "Vuelve a preguntar más tarde.",
      "No se puede predecir ahora.",
      "Concéntrate y vuelve a preguntar.",
      "No cuentes con ello.",
      "Mi respuesta es NO.",
      "Mis fuentes dicen que NO.",
      "Las perspectivas no son muy buenas.",
      "Muy improbable."
    ];

    function moverBola() {
      const ball = document.getElementById("ball");
      const message = document.getElementById("message");

      const desplazamientoX = Math.random() * 10 - 5;
      const desplazamientoY = Math.random() * 10 - 5;
      ball.style.transform = `translate(${desplazamientoX}px, ${desplazamientoY}px)`;

      let rot = 0;
      const rotFinal = Math.random() * 90 - 45;
      const steps = 30;
      const delay = 15;
      let step = 0;

      message.textContent = "";
      const mensajeAleatorio = mensajes[Math.floor(Math.random() * mensajes.length)];

      const interval = setInterval(() => {
        const progress = step / steps;
        const ease = 1 - Math.pow(1 - progress, 3);
        rot = ease * rotFinal;
        step++;
        if (step > steps) {
          clearInterval(interval);
          message.textContent = mensajeAleatorio;
        }
      }, delay);
    }
  </script>
</body>
</html>

<!-- Contenedor del footer -->
<div id="footer"></div>

<script>
  // Cargar footer.html y colocarlo en #footer
  fetch("footer.html")
    .then(response => {
      if (!response.ok) throw new Error("No se pudo cargar footer.html");
      return response.text();
    })
    .then(data => {
      document.getElementById("footer").innerHTML = data;
    })
    .catch(error => console.error("Error cargando el footer:", error));
</script>
