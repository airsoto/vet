<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#030407" />
  <title>Bola 8 Mágica</title>

  <script defer src="goat.js"></script>

  <style>
    :root{
      --bg:#030407;
      --panel:rgba(15,18,28,.72);
      --panel-border:rgba(255,255,255,.10);
      --text:#f7f8fb;
      --muted:#9ba3b5;
      --accent:#7c5cff;
      --accent2:#2dd4bf;
      --yes:#42d392;
      --maybe:#f5c451;
      --no:#ff6b7a;
      --shadow:0 24px 70px rgba(0,0,0,.55);
      --radius:22px;
    }

    *{
      box-sizing:border-box;
      -webkit-tap-highlight-color:transparent;
    }

    html,body{
      margin:0;
      min-height:100%;
      background:var(--bg);
      color:var(--text);
      font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text",Inter,system-ui,Segoe UI,Roboto,Arial,sans-serif;
    }

    body{
      min-height:100svh;
      overflow-x:hidden;
      padding:
        max(16px, env(safe-area-inset-top))
        max(16px, env(safe-area-inset-right))
        max(20px, env(safe-area-inset-bottom))
        max(16px, env(safe-area-inset-left));
      background:
        radial-gradient(circle at 50% 25%, rgba(124,92,255,.12), transparent 34%),
        radial-gradient(circle at 20% 80%, rgba(45,212,191,.07), transparent 32%),
        #030407;
    }

    #fxCanvas{
      position:fixed;
      inset:0;
      width:100%;
      height:100%;
      pointer-events:none;
      z-index:0;
    }

    .app{
      position:relative;
      z-index:1;
      width:min(100%, 920px);
      margin:0 auto;
      display:grid;
      gap:18px;
    }

    header{
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap:16px;
      padding:4px 2px 0;
    }

    .title-wrap{min-width:0}

    h1{
      margin:0;
      font-size:clamp(1.65rem, 5vw, 2.5rem);
      line-height:1;
      letter-spacing:-.04em;
    }

    .subtitle{
      margin:8px 0 0;
      color:var(--muted);
      font-size:.93rem;
    }

    .icon-btn{
      flex:0 0 auto;
      width:44px;
      height:44px;
      display:grid;
      place-items:center;
      border-radius:14px;
      border:1px solid var(--panel-border);
      background:rgba(255,255,255,.055);
      color:#fff;
      cursor:pointer;
      font-size:1.05rem;
      transition:.18s ease;
      backdrop-filter:blur(12px);
    }

    .icon-btn:hover{background:rgba(255,255,255,.09); transform:translateY(-1px)}
    .icon-btn:active{transform:scale(.96)}
    .icon-btn[aria-pressed="false"]{opacity:.55}

    .stage{
      min-height:520px;
      position:relative;
      display:grid;
      place-items:center;
      overflow:hidden;
      border-radius:30px;
      border:1px solid rgba(255,255,255,.075);
      background:
        radial-gradient(circle at 50% 42%, rgba(124,92,255,.13), transparent 40%),
        linear-gradient(180deg, rgba(255,255,255,.035), rgba(255,255,255,.015));
      box-shadow:var(--shadow);
      isolation:isolate;
    }

    .stage::before{
      content:"";
      position:absolute;
      width:min(82vw,590px);
      height:min(82vw,590px);
      border-radius:50%;
      background:radial-gradient(circle, rgba(124,92,255,.18), transparent 66%);
      filter:blur(34px);
      animation:pulseGlow 4.4s ease-in-out infinite;
      z-index:-1;
    }

    @keyframes pulseGlow{
      0%,100%{transform:scale(.92);opacity:.65}
      50%{transform:scale(1.04);opacity:1}
    }

    .ball-wrap{
      position:relative;
      width:min(76vw, 520px);
      aspect-ratio:1;
      display:grid;
      place-items:center;
      cursor:pointer;
      user-select:none;
      touch-action:manipulation;
      filter:drop-shadow(0 28px 40px rgba(0,0,0,.65));
      transform-origin:center;
    }

    #ball{
      width:100%;
      height:100%;
      object-fit:contain;
      display:block;
      will-change:transform,filter;
      transition:filter .3s ease;
    }

    .ball-wrap:hover #ball{
      filter:brightness(1.04);
    }

    .ball-wrap.shaking{
      animation:shakeBall 780ms cubic-bezier(.36,.07,.19,.97) both;
    }

    @keyframes shakeBall{
      10%,90% {transform:translate3d(-5px, 2px, 0) rotate(-2deg)}
      20%,80% {transform:translate3d(8px, -4px, 0) rotate(3deg)}
      30%,50%,70% {transform:translate3d(-12px, 5px, 0) rotate(-4deg)}
      40%,60% {transform:translate3d(12px, -5px, 0) rotate(4deg)}
    }

    .answer-window{
      position:absolute;
      left:50%;
      top:45%;
      transform:translate(-50%,-50%);
      width:clamp(132px, 27%, 178px);
      aspect-ratio:1.18/1;
      display:grid;
      place-items:center;
      padding:14px;
      text-align:center;
      clip-path:polygon(50% 0%, 100% 100%, 0% 100%);
      background:
        radial-gradient(circle at 50% 55%, rgba(49,96,255,.82), rgba(20,41,122,.90) 46%, rgba(4,8,25,.96) 79%);
      opacity:.12;
      filter:blur(2px) brightness(.65);
      transition:opacity .5s ease, filter .5s ease, transform .5s ease;
    }

    .answer-window.visible{
      opacity:1;
      filter:blur(0) brightness(1.05);
      transform:translate(-50%,-50%) scale(1.02);
      box-shadow:0 0 34px rgba(73,115,255,.42);
    }

    #message{
      width:82%;
      margin-top:34%;
      color:#fff;
      font-weight:800;
      font-size:clamp(.68rem, 2.4vw, .94rem);
      line-height:1.12;
      text-wrap:balance;
      text-shadow:0 2px 12px rgba(0,0,0,.85);
    }

    .thinking{
      display:inline-flex;
      gap:4px;
      align-items:center;
      justify-content:center;
    }

    .thinking i{
      width:5px;
      height:5px;
      border-radius:50%;
      background:#fff;
      animation:dot 1s infinite ease-in-out;
    }
    .thinking i:nth-child(2){animation-delay:.14s}
    .thinking i:nth-child(3){animation-delay:.28s}

    @keyframes dot{
      0%,80%,100%{transform:scale(.55);opacity:.35}
      40%{transform:scale(1);opacity:1}
    }

    .question-card{
      display:grid;
      gap:12px;
      padding:16px;
      border:1px solid var(--panel-border);
      border-radius:var(--radius);
      background:var(--panel);
      backdrop-filter:blur(18px);
      box-shadow:0 16px 40px rgba(0,0,0,.25);
    }

    label{
      color:var(--muted);
      font-size:.84rem;
      font-weight:650;
    }

    .question-row{
      display:grid;
      grid-template-columns:1fr auto;
      gap:10px;
    }

    input{
      width:100%;
      min-height:50px;
      border:1px solid rgba(255,255,255,.12);
      background:rgba(255,255,255,.045);
      border-radius:15px;
      color:#fff;
      padding:0 15px;
      font:inherit;
      font-size:16px;
      outline:none;
      transition:.18s ease;
    }

    input::placeholder{color:#737c91}

    input:focus{
      border-color:rgba(124,92,255,.85);
      box-shadow:0 0 0 4px rgba(124,92,255,.12);
    }

    .ask-btn{
      min-width:126px;
      border:0;
      border-radius:15px;
      color:#fff;
      background:linear-gradient(135deg, #7c5cff, #5540d8);
      font:inherit;
      font-weight:800;
      padding:0 18px;
      cursor:pointer;
      box-shadow:0 8px 24px rgba(124,92,255,.28);
      transition:.18s ease;
    }

    .ask-btn:hover{transform:translateY(-1px);filter:brightness(1.08)}
    .ask-btn:active{transform:translateY(0) scale(.98)}
    .ask-btn:disabled{opacity:.5;cursor:default;transform:none}

    .helper-row{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      color:var(--muted);
      font-size:.78rem;
    }

    .helper-actions{
      display:flex;
      gap:8px;
      flex-wrap:wrap;
    }

    .small-btn{
      border:1px solid rgba(255,255,255,.10);
      background:rgba(255,255,255,.045);
      color:#c7ccda;
      padding:8px 10px;
      border-radius:11px;
      cursor:pointer;
      font:inherit;
      font-size:.78rem;
    }

    .small-btn:hover{background:rgba(255,255,255,.075)}

    .history{
      display:none;
      border:1px solid var(--panel-border);
      border-radius:var(--radius);
      background:rgba(13,16,25,.72);
      backdrop-filter:blur(16px);
      overflow:hidden;
    }

    .history.open{display:block}

    .history-head{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      padding:14px 16px;
      border-bottom:1px solid rgba(255,255,255,.07);
    }

    .history h2{
      margin:0;
      font-size:1rem;
    }

    #historyList{
      list-style:none;
      margin:0;
      padding:0;
      max-height:260px;
      overflow:auto;
    }

    #historyList li{
      padding:12px 16px;
      border-bottom:1px solid rgba(255,255,255,.055);
      display:grid;
      gap:5px;
    }

    #historyList li:last-child{border-bottom:0}

    .hist-q{font-size:.86rem;color:#cbd1de}
    .hist-a{font-size:.82rem;font-weight:750}
    .hist-a.yes{color:var(--yes)}
    .hist-a.maybe{color:var(--maybe)}
    .hist-a.no{color:var(--no)}

    .empty{
      padding:18px 16px;
      color:var(--muted);
      font-size:.83rem;
    }

    .device-tip{
      display:none;
      margin-top:-3px;
      color:var(--muted);
      font-size:.76rem;
      text-align:center;
    }

    footer{
      text-align:center;
      color:#757d91;
      font-size:.76rem;
      padding:2px 0 6px;
    }

    #externalFooter:empty{display:none}

    .flash{
      position:fixed;
      inset:0;
      pointer-events:none;
      background:radial-gradient(circle at center, rgba(124,92,255,.17), transparent 48%);
      opacity:0;
      z-index:5;
    }
    .flash.on{animation:flash .7s ease}
    @keyframes flash{0%{opacity:0} 35%{opacity:1} 100%{opacity:0}}

    @media(max-width:640px){
      body{padding-left:12px;padding-right:12px}
      .app{gap:12px}
      .stage{
        min-height:440px;
        border-radius:24px;
      }
      .ball-wrap{
        width:min(92vw, 470px);
      }
      .question-row{
        grid-template-columns:1fr;
      }
      .ask-btn{
        min-height:50px;
        width:100%;
      }
      .helper-row{
        align-items:flex-start;
        flex-direction:column;
      }
      .answer-window{
        width:clamp(112px, 29%, 155px);
      }
    }

    @media(max-width:380px){
      .stage{min-height:390px}
      .subtitle{font-size:.82rem}
      .question-card{padding:13px}
      #message{font-size:.66rem}
    }

    @media(prefers-reduced-motion:reduce){
      *,*::before,*::after{
        animation-duration:.001ms !important;
        animation-iteration-count:1 !important;
        transition-duration:.001ms !important;
        scroll-behavior:auto !important;
      }
    }
  </style>
</head>

<body>
  <canvas id="fxCanvas" aria-hidden="true"></canvas>
  <div class="flash" id="flash" aria-hidden="true"></div>

  <main class="app">
    <header>
      <div class="title-wrap">
        <h1>Bola 8 Mágica</h1>
        <p class="subtitle">Formula una pregunta y toca la bola para conocer la respuesta.</p>
      </div>

      <button class="icon-btn" id="soundBtn" type="button" aria-label="Activar o desactivar sonido" aria-pressed="true" title="Sonido">♪</button>
    </header>

    <section class="stage" aria-label="Bola 8 mágica">
      <div class="ball-wrap" id="ballWrap" role="button" tabindex="0" aria-label="Agitar Bola 8">
        <img id="ball" src="ball.png" alt="Bola 8 mágica" draggable="false" />
        <div class="answer-window" id="answerWindow" aria-live="polite">
          <div id="message">Tócame</div>
        </div>
      </div>
    </section>

    <section class="question-card">
      <label for="questionInput">Tu pregunta</label>

      <div class="question-row">
        <input
          id="questionInput"
          type="text"
          maxlength="160"
          autocomplete="off"
          placeholder="Ej. ¿Tendré suerte hoy?"
          aria-describedby="questionHelp"
        />
        <button class="ask-btn" id="askBtn" type="button">Preguntar</button>
      </div>

      <div class="helper-row" id="questionHelp">
        <span>Pulsa Enter, toca la bola o usa “Preguntar”.</span>
        <div class="helper-actions">
          <button class="small-btn" id="motionBtn" type="button">📱 Activar agitado</button>
          <button class="small-btn" id="historyBtn" type="button">Historial</button>
        </div>
      </div>

      <div class="device-tip" id="deviceTip">Agita suavemente el dispositivo para preguntar.</div>
    </section>

    <section class="history" id="historyPanel" aria-label="Historial">
      <div class="history-head">
        <h2>Últimas preguntas</h2>
        <button class="small-btn" id="clearHistoryBtn" type="button">Borrar</button>
      </div>
      <ul id="historyList"></ul>
    </section>

    <footer>
      <div>Desarrollado por: Angel Soto</div>
      <div id="externalFooter"></div>
    </footer>
  </main>

  <script>
    (() => {
      "use strict";

      const RESPONSES = [
        { text: "Es cierto.", type: "yes" },
        { text: "Es decididamente así.", type: "yes" },
        { text: "Sin lugar a dudas.", type: "yes" },
        { text: "Sí, definitivamente.", type: "yes" },
        { text: "Puedes apostar por ello.", type: "yes" },
        { text: "Como yo lo veo, sí.", type: "yes" },
        { text: "Es lo más probable.", type: "yes" },
        { text: "Casi seguro que sí.", type: "yes" },
        { text: "Sí.", type: "yes" },
        { text: "Las señales apuntan a que sí.", type: "yes" },

        { text: "Es dudoso, vuelve a intentarlo.", type: "maybe" },
        { text: "Vuelve a preguntar más tarde.", type: "maybe" },
        { text: "No se puede predecir ahora.", type: "maybe" },
        { text: "Concéntrate y vuelve a preguntar.", type: "maybe" },

        { text: "No cuentes con ello.", type: "no" },
        { text: "Mi respuesta es no.", type: "no" },
        { text: "Mis fuentes dicen que no.", type: "no" },
        { text: "Las perspectivas no son muy buenas.", type: "no" },
        { text: "Muy improbable.", type: "no" }
      ];

      const els = {
        canvas: document.getElementById("fxCanvas"),
        ballWrap: document.getElementById("ballWrap"),
        answerWindow: document.getElementById("answerWindow"),
        message: document.getElementById("message"),
        input: document.getElementById("questionInput"),
        askBtn: document.getElementById("askBtn"),
        soundBtn: document.getElementById("soundBtn"),
        flash: document.getElementById("flash"),
        historyBtn: document.getElementById("historyBtn"),
        historyPanel: document.getElementById("historyPanel"),
        historyList: document.getElementById("historyList"),
        clearHistoryBtn: document.getElementById("clearHistoryBtn"),
        motionBtn: document.getElementById("motionBtn"),
        deviceTip: document.getElementById("deviceTip")
      };

      let busy = false;
      let soundEnabled = true;
      let lastResponseIndex = -1;
      let lastShakeAt = 0;
      let audioCtx = null;

      // ---------- Historial ----------
      function loadHistory() {
        try {
          return JSON.parse(localStorage.getItem("magic8_history") || "[]");
        } catch {
          return [];
        }
      }

      function saveHistory(items) {
        try {
          localStorage.setItem("magic8_history", JSON.stringify(items.slice(0, 12)));
        } catch {}
      }

      function addHistory(question, response) {
        const items = loadHistory();
        items.unshift({
          q: question || "Pregunta sin texto",
          a: response.text,
          type: response.type,
          at: Date.now()
        });
        saveHistory(items);
        renderHistory();
      }

      function renderHistory() {
        const items = loadHistory();
        els.historyList.innerHTML = "";

        if (!items.length) {
          const li = document.createElement("li");
          li.className = "empty";
          li.textContent = "Todavía no hay preguntas.";
          els.historyList.appendChild(li);
          return;
        }

        items.forEach(item => {
          const li = document.createElement("li");

          const q = document.createElement("div");
          q.className = "hist-q";
          q.textContent = item.q;

          const a = document.createElement("div");
          a.className = `hist-a ${item.type || "maybe"}`;
          a.textContent = `→ ${item.a}`;

          li.append(q, a);
          els.historyList.appendChild(li);
        });
      }

      // ---------- Respuesta aleatoria sin repetición inmediata ----------
      function getRandomResponse() {
        let idx;
        do {
          idx = Math.floor(Math.random() * RESPONSES.length);
        } while (RESPONSES.length > 1 && idx === lastResponseIndex);

        lastResponseIndex = idx;
        return RESPONSES[idx];
      }

      // ---------- Sonido con WebAudio ----------
      function ensureAudio() {
        if (!soundEnabled) return null;
        if (!audioCtx) {
          const AC = window.AudioContext || window.webkitAudioContext;
          if (!AC) return null;
          audioCtx = new AC();
        }
        if (audioCtx.state === "suspended") audioCtx.resume().catch(() => {});
        return audioCtx;
      }

      function playShakeSound() {
        const ctx = ensureAudio();
        if (!ctx) return;

        const duration = 0.55;
        const buffer = ctx.createBuffer(1, Math.floor(ctx.sampleRate * duration), ctx.sampleRate);
        const data = buffer.getChannelData(0);

        for (let i = 0; i < data.length; i++) {
          const t = i / data.length;
          data[i] = (Math.random() * 2 - 1) * (1 - t) * 0.16;
        }

        const src = ctx.createBufferSource();
        const filter = ctx.createBiquadFilter();
        const gain = ctx.createGain();

        filter.type = "lowpass";
        filter.frequency.value = 850;
        gain.gain.value = .25;

        src.buffer = buffer;
        src.connect(filter).connect(gain).connect(ctx.destination);
        src.start();
      }

      function playRevealSound(type) {
        const ctx = ensureAudio();
        if (!ctx) return;

        const osc = ctx.createOscillator();
        const gain = ctx.createGain();

        const freq = type === "yes" ? 520 : type === "no" ? 250 : 390;
        osc.frequency.setValueAtTime(freq, ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(freq * 1.28, ctx.currentTime + .22);

        gain.gain.setValueAtTime(.0001, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(.12, ctx.currentTime + .025);
        gain.gain.exponentialRampToValueAtTime(.0001, ctx.currentTime + .35);

        osc.connect(gain).connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + .36);
      }

      // ---------- Canvas de partículas ----------
      const ctx = els.canvas.getContext("2d", { alpha:true });
      let dpr = Math.min(window.devicePixelRatio || 1, 2);
      let particles = [];
      let stars = [];

      function resizeCanvas() {
        dpr = Math.min(window.devicePixelRatio || 1, 2);
        els.canvas.width = Math.floor(innerWidth * dpr);
        els.canvas.height = Math.floor(innerHeight * dpr);
        els.canvas.style.width = innerWidth + "px";
        els.canvas.style.height = innerHeight + "px";
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

        stars = Array.from({ length: Math.min(90, Math.floor(innerWidth / 10)) }, () => ({
          x: Math.random() * innerWidth,
          y: Math.random() * innerHeight,
          r: Math.random() * 1.35 + .2,
          a: Math.random() * .42 + .08,
          tw: Math.random() * .018 + .004
        }));
      }

      function burstParticles(type) {
        const rect = els.ballWrap.getBoundingClientRect();
        const cx = rect.left + rect.width / 2;
        const cy = rect.top + rect.height * .44;

        const hue = type === "yes" ? 154 : type === "no" ? 350 : 44;

        for (let i = 0; i < 34; i++) {
          const angle = Math.random() * Math.PI * 2;
          const speed = Math.random() * 2.4 + .6;

          particles.push({
            x: cx,
            y: cy,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            life: 1,
            size: Math.random() * 2.8 + .8,
            hue
          });
        }
      }

      function drawCanvas() {
        ctx.clearRect(0, 0, innerWidth, innerHeight);

        for (const s of stars) {
          s.a += s.tw;
          if (s.a > .58 || s.a < .08) s.tw *= -1;

          ctx.beginPath();
          ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(210,220,255,${s.a})`;
          ctx.fill();
        }

        particles = particles.filter(p => p.life > .02);

        for (const p of particles) {
          p.x += p.vx;
          p.y += p.vy;
          p.vx *= .986;
          p.vy *= .986;
          p.life *= .964;

          ctx.beginPath();
          ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
          ctx.fillStyle = `hsla(${p.hue},90%,70%,${p.life * .75})`;
          ctx.fill();
        }

        requestAnimationFrame(drawCanvas);
      }

      // ---------- Efecto principal ----------
      async function askMagicBall(source = "button") {
        if (busy) return;

        const question = els.input.value.trim();

        busy = true;
        els.askBtn.disabled = true;
        els.answerWindow.classList.remove("visible");
        els.message.innerHTML = '<span class="thinking"><i></i><i></i><i></i></span>';

        els.ballWrap.classList.remove("shaking");
        void els.ballWrap.offsetWidth;
        els.ballWrap.classList.add("shaking");

        if ("vibrate" in navigator) {
          navigator.vibrate?.([35, 30, 45, 35, 65]);
        }

        playShakeSound();

        els.flash.classList.remove("on");
        void els.flash.offsetWidth;
        els.flash.classList.add("on");

        await new Promise(r => setTimeout(r, 790));

        const response = getRandomResponse();
        els.message.textContent = response.text;
        els.answerWindow.classList.add("visible");
        els.ballWrap.classList.remove("shaking");

        burstParticles(response.type);
        playRevealSound(response.type);
        addHistory(question, response);

        busy = false;
        els.askBtn.disabled = false;

        if (source === "motion") {
          els.deviceTip.textContent = "Respuesta obtenida al agitar el dispositivo.";
        }
      }

      // ---------- Agitado físico ----------
      function onDeviceMotion(event) {
        const a = event.accelerationIncludingGravity || event.acceleration;
        if (!a) return;

        const magnitude = Math.sqrt(
          Math.pow(a.x || 0, 2) +
          Math.pow(a.y || 0, 2) +
          Math.pow(a.z || 0, 2)
        );

        const now = Date.now();
        if (magnitude > 24 && now - lastShakeAt > 1800 && !busy) {
          lastShakeAt = now;
          askMagicBall("motion");
        }
      }

      async function enableMotion() {
        try {
          if (typeof DeviceMotionEvent !== "undefined" &&
              typeof DeviceMotionEvent.requestPermission === "function") {
            const permission = await DeviceMotionEvent.requestPermission();
            if (permission !== "granted") {
              els.deviceTip.style.display = "block";
              els.deviceTip.textContent = "Permiso de movimiento no concedido.";
              return;
            }
          }

          window.addEventListener("devicemotion", onDeviceMotion, { passive:true });
          els.motionBtn.textContent = "✓ Agitado activo";
          els.deviceTip.style.display = "block";
          els.deviceTip.textContent = "Agita suavemente el dispositivo para preguntar.";
        } catch (err) {
          els.deviceTip.style.display = "block";
          els.deviceTip.textContent = "El sensor de movimiento no está disponible en este dispositivo.";
        }
      }

      // ---------- Eventos ----------
      els.askBtn.addEventListener("click", () => askMagicBall("button"));

      els.ballWrap.addEventListener("click", () => askMagicBall("ball"));

      els.ballWrap.addEventListener("keydown", e => {
        if (e.key === "Enter" || e.key === " ") {
          e.preventDefault();
          askMagicBall("keyboard");
        }
      });

      els.input.addEventListener("keydown", e => {
        if (e.key === "Enter") askMagicBall("keyboard");
      });

      els.soundBtn.addEventListener("click", () => {
        soundEnabled = !soundEnabled;
        els.soundBtn.setAttribute("aria-pressed", String(soundEnabled));
        els.soundBtn.textContent = soundEnabled ? "♪" : "×";
        if (soundEnabled) ensureAudio();
      });

      els.historyBtn.addEventListener("click", () => {
        const open = els.historyPanel.classList.toggle("open");
        els.historyBtn.textContent = open ? "Ocultar historial" : "Historial";
      });

      els.clearHistoryBtn.addEventListener("click", () => {
        try { localStorage.removeItem("magic8_history"); } catch {}
        renderHistory();
      });

      els.motionBtn.addEventListener("click", enableMotion);

      window.addEventListener("resize", resizeCanvas, { passive:true });

      // ---------- Footer externo opcional ----------
      fetch("footer.html")
        .then(r => {
          if (!r.ok) throw new Error("footer.html no disponible");
          return r.text();
        })
        .then(html => {
          document.getElementById("externalFooter").innerHTML = html;
        })
        .catch(() => {
          // El footer local ya está visible; no hace falta mostrar error.
        });

      resizeCanvas();
      drawCanvas();
      renderHistory();

      // Estado inicial de la ventana.
      setTimeout(() => els.answerWindow.classList.add("visible"), 260);
    })();
  </script>
</body>
</html>
