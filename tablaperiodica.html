<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#08111f">
<title>Tabla Periódica · Juego</title>
<script defer src="goat.js"></script>
<style>
:root{--bg:#07101d;--panel:#0d1929;--panel2:#111f32;--text:#f4f8ff;--muted:#9eb0c8;--accent:#52b7ff;--accent2:#7c6cff;--ok:#25c277;--bad:#ff5b69;--warn:#ffd166;--cell:clamp(36px,4.5vw,54px);--gap:3px;--radius:18px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg);color-scheme:dark}
body{margin:0;min-height:100dvh;font-family:Inter,ui-rounded,"SF Pro Rounded","SF Pro Display",system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--text);background:radial-gradient(circle at 50% -10%,#18335b 0,transparent 36%),linear-gradient(180deg,#07101d,#091525 65%,#07101d);padding:max(12px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) max(18px,env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left));overflow-x:hidden}
button,select{font:inherit}.app{width:min(1500px,100%);margin:auto}.topbar{display:grid;grid-template-columns:48px 1fr 48px;align-items:center;gap:10px;margin-bottom:14px}.home,.icon-btn{width:44px;height:44px;border-radius:14px;border:1px solid #ffffff18;background:#ffffff0b;color:#fff;display:grid;place-items:center;text-decoration:none;font-size:21px;cursor:pointer}.home:active,.icon-btn:active,.btn:active,.chip:active{transform:scale(.97)}.title{text-align:center}.title h1{font-size:clamp(1.45rem,4vw,2.2rem);margin:0;letter-spacing:-.035em}.title p{margin:4px 0 0;color:var(--muted);font-size:.86rem}.title strong{color:var(--warn);font-weight:700}
.toolbar{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:9px;padding:12px;border:1px solid #ffffff12;background:#0d1929cc;backdrop-filter:blur(16px);border-radius:var(--radius);box-shadow:0 14px 40px #0005;position:sticky;top:max(8px,env(safe-area-inset-top));z-index:20}.field{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:.9rem}.field select{appearance:none;border:1px solid #ffffff1b;background:#14243a;color:#fff;border-radius:12px;padding:10px 34px 10px 12px;background-image:linear-gradient(45deg,transparent 50%,#9eb0c8 50%),linear-gradient(135deg,#9eb0c8 50%,transparent 50%);background-position:calc(100% - 16px) 16px,calc(100% - 11px) 16px;background-size:5px 5px;background-repeat:no-repeat;min-height:44px}.btn{border:0;border-radius:12px;min-height:44px;padding:0 14px;font-weight:750;cursor:pointer;color:white;background:#1b2b42}.btn.primary{background:linear-gradient(135deg,#188be0,#6457e8);box-shadow:0 7px 18px #168de034}.btn.ghost{border:1px solid #ffffff18;background:#ffffff08}.stats{display:flex;gap:6px;align-items:center}.stat{background:#ffffff09;border:1px solid #ffffff10;border-radius:10px;padding:7px 10px;font-size:.83rem;color:var(--muted);white-space:nowrap}.stat b{color:#fff;font-size:.95rem}
.help{margin:10px auto 12px;text-align:center;color:var(--muted);font-size:.9rem;min-height:1.3em}.help b{color:#dcecff}.game{display:grid;grid-template-columns:minmax(150px,1fr) minmax(720px,4.4fr) minmax(150px,1fr);gap:12px;align-items:start}.bank{position:sticky;top:92px;display:grid;grid-template-columns:repeat(3,minmax(42px,1fr));gap:6px;padding:10px;border-radius:16px;background:#0d1929b8;border:1px solid #ffffff10;max-height:calc(100dvh - 118px);overflow:auto;overscroll-behavior:contain}.element{min-width:0;height:46px;border:1px solid #70c8ff55;background:linear-gradient(145deg,#1688d4,#1766b4);color:#fff;border-radius:10px;display:grid;place-items:center;font-size:clamp(.82rem,1.3vw,1rem);font-weight:850;box-shadow:inset 0 1px #ffffff25,0 4px 12px #0003;cursor:grab;user-select:none;touch-action:manipulation;transition:transform .12s,box-shadow .12s,opacity .12s}.element:hover{transform:translateY(-1px);box-shadow:inset 0 1px #ffffff30,0 7px 15px #0005}.element.selected{outline:3px solid var(--warn);outline-offset:2px;transform:scale(1.05);z-index:2}.element.placed{cursor:pointer}.board-card{min-width:0;border:1px solid #ffffff10;background:#091524aa;border-radius:18px;padding:10px;box-shadow:0 18px 50px #0004}.scroll{overflow:auto;padding:2px 2px 8px;overscroll-behavior-x:contain;-webkit-overflow-scrolling:touch}.periodic{display:grid;grid-template-columns:repeat(18,var(--cell));grid-template-rows:repeat(7,var(--cell));gap:var(--gap);width:max-content;margin:auto}.dropzone{width:var(--cell);height:var(--cell);border:1px dashed #60738d88;background:#ffffff05;border-radius:8px;display:grid;place-items:center;position:relative;transition:.14s;cursor:pointer}.dropzone:hover,.dropzone.target{background:#52b7ff16;border-color:#52b7ff}.dropzone.correct{border-style:solid;border-color:#45e397;background:#25c27722}.dropzone.incorrect{border-style:solid;border-color:#ff7380;background:#ff5b6922;animation:shake .24s}.dropzone .element{width:100%;height:100%;border-radius:7px}.series-wrap{margin-top:12px}.series-title{display:flex;align-items:center;gap:8px;margin:8px 0 5px;color:#c9d7e9;font-size:.83rem;font-weight:750}.series-title::before{content:"";width:16px;height:2px;background:#71839b}.series{display:grid;grid-template-columns:repeat(14,var(--cell));gap:var(--gap);width:max-content;margin:auto}.empty-note{padding:55px 15px;text-align:center;color:var(--muted)}
.result{position:fixed;left:50%;bottom:max(16px,env(safe-area-inset-bottom));transform:translate(-50%,120px);opacity:0;z-index:50;background:#101e31f2;border:1px solid #ffffff1c;border-radius:18px;padding:13px 18px;box-shadow:0 18px 55px #0008;backdrop-filter:blur(18px);font-weight:750;text-align:center;transition:.28s;max-width:calc(100vw - 24px)}.result.show{transform:translate(-50%,0);opacity:1}.result small{display:block;color:var(--muted);font-weight:500;margin-top:3px}.pulse{animation:pulse .3s}@keyframes pulse{50%{transform:scale(1.08)}}@keyframes shake{25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
@media(max-width:980px){:root{--cell:43px}.game{display:block}.bank{position:static;max-height:none;grid-template-columns:repeat(8,1fr);margin-bottom:10px}.bank.right{display:none}.board-card{padding:8px}.toolbar{position:relative;top:auto}.help{font-size:.84rem}.element{height:44px}.periodic,.series{margin-left:0}.scroll{mask-image:linear-gradient(90deg,transparent 0,#000 8px,#000 calc(100% - 8px),transparent 100%)}}
@media(max-width:600px){body{padding-left:8px;padding-right:8px}:root{--cell:40px;--gap:2px}.topbar{grid-template-columns:42px 1fr 42px}.home,.icon-btn{width:40px;height:40px;border-radius:12px}.title h1{font-size:1.3rem}.title p{font-size:.74rem}.toolbar{padding:9px 7px;gap:7px}.field{width:100%;justify-content:center}.field select{flex:1;max-width:310px}.btn{flex:1;padding:0 9px;font-size:.86rem}.stats{width:100%;justify-content:center}.stat{padding:6px 8px}.bank{grid-template-columns:repeat(7,1fr);gap:5px;padding:8px}.element{height:42px;border-radius:9px}.board-card{border-radius:14px}.help{margin:8px 5px 10px}.series-wrap{margin-top:9px}}
@media(max-width:390px){.bank{grid-template-columns:repeat(6,1fr)}.title p span{display:none}.stat{font-size:.76rem}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main class="app">
<header class="topbar">
<a class="home" href="https://airsoto.github.io/vet/" aria-label="Volver al inicio" title="Inicio">⌂</a>
<div class="title"><h1>Tabla Periódica · Juego</h1><p><span>Aprende colocando cada símbolo en su posición · </span><strong>Ángel Soto</strong></p></div>
<button class="icon-btn" id="shuffleBtn" type="button" aria-label="Mezclar elementos" title="Mezclar">↻</button>
</header>
<section class="toolbar" aria-label="Controles del juego">
<label class="field" for="modo"><span>Dificultad</span><select id="modo"><option value="">Elige un nivel…</option><option value="nieto">🌱 Nieto de Mendeleiev</option><option value="hijo">⚗️ Hijo de Mendeleiev</option><option value="dmitri">🧠 Dmitri Mendeleiev</option></select></label>
<div class="stats"><div class="stat">Colocados <b id="placed">0</b>/<b id="total">0</b></div><div class="stat">Progreso <b id="progress">0%</b></div></div>
<button class="btn primary" id="checkBtn" type="button">✓ Comprobar</button><button class="btn ghost" id="resetBtn" type="button">Reiniciar</button>
</section>
<div class="help" id="help">Selecciona una dificultad para empezar.</div>
<section class="game">
<div class="bank" id="bankLeft" aria-label="Elementos disponibles"></div>
<div class="board-card"><div class="scroll" id="boardScroll"><div id="mainBoard" class="periodic" aria-label="Tabla periódica"></div><div class="series-wrap" id="lanWrap"><div class="series-title">Lantánidos</div><div id="lanBoard" class="series"></div></div><div class="series-wrap" id="actWrap"><div class="series-title">Actínidos</div><div id="actBoard" class="series"></div></div><div class="empty-note" id="empty">Elige un nivel para generar el tablero.</div></div></div>
<div class="bank right" id="bankRight" aria-label="Elementos disponibles"></div>
</section>
</main>
<div class="result" id="result" role="status" aria-live="polite"></div>
<script>
const levels={
 nieto:["H","He","Li","Be","B","C","N","O","F","Ne","Na","Mg","Al","Si","P","S","Cl","Ar","K","Ca","Ga","Ge","As","Se","Br","Kr","Rb","Sr","In","Sn","Sb","Te","I","Xe","Cs","Ba","Tl","Pb","Bi","Po","At","Rn","Fr","Ra"],
 hijo:["H","He","Li","Be","B","C","N","O","F","Ne","Na","Mg","Al","Si","P","S","Cl","Ar","K","Ca","Sc","Ti","V","Cr","Mn","Fe","Co","Ni","Cu","Zn","Ga","Ge","As","Se","Br","Kr","Rb","Sr","Pd","Ag","Cd","In","Sn","Sb","Te","I","Xe","Cs","Ba","Pt","Au","Hg","Tl","Pb","Bi","Po","At","Rn","Fr","Ra"],
 dmitri:["H","He","Li","Be","B","C","N","O","F","Ne","Na","Mg","Al","Si","P","S","Cl","Ar","K","Ca","Sc","Ti","V","Cr","Mn","Fe","Co","Ni","Cu","Zn","Ga","Ge","As","Se","Br","Kr","Rb","Sr","Y","Zr","Nb","Mo","Tc","Ru","Rh","Pd","Ag","Cd","In","Sn","Sb","Te","I","Xe","Cs","Ba","Lu","Hf","Ta","W","Re","Os","Ir","Pt","Au","Hg","Tl","Pb","Bi","Po","At","Rn","Fr","Ra","Lr","Rf","Db","Sg","Bh","Hs","Mt","Ds","Rg","Cn","Nh","Fl","Mc","Lv","Ts","Og","La","Ce","Pr","Nd","Pm","Sm","Eu","Gd","Tb","Dy","Ho","Er","Tm","Yb","Ac","Th","Pa","U","Np","Pu","Am","Cm","Bk","Cf","Es","Fm","Md","No"]
};
const rows=[
["H",1,1],["He",1,18],["Li",2,1],["Be",2,2],["B",2,13],["C",2,14],["N",2,15],["O",2,16],["F",2,17],["Ne",2,18],["Na",3,1],["Mg",3,2],["Al",3,13],["Si",3,14],["P",3,15],["S",3,16],["Cl",3,17],["Ar",3,18],["K",4,1],["Ca",4,2],["Sc",4,3],["Ti",4,4],["V",4,5],["Cr",4,6],["Mn",4,7],["Fe",4,8],["Co",4,9],["Ni",4,10],["Cu",4,11],["Zn",4,12],["Ga",4,13],["Ge",4,14],["As",4,15],["Se",4,16],["Br",4,17],["Kr",4,18],["Rb",5,1],["Sr",5,2],["Y",5,3],["Zr",5,4],["Nb",5,5],["Mo",5,6],["Tc",5,7],["Ru",5,8],["Rh",5,9],["Pd",5,10],["Ag",5,11],["Cd",5,12],["In",5,13],["Sn",5,14],["Sb",5,15],["Te",5,16],["I",5,17],["Xe",5,18],["Cs",6,1],["Ba",6,2],["Lu",6,3],["Hf",6,4],["Ta",6,5],["W",6,6],["Re",6,7],["Os",6,8],["Ir",6,9],["Pt",6,10],["Au",6,11],["Hg",6,12],["Tl",6,13],["Pb",6,14],["Bi",6,15],["Po",6,16],["At",6,17],["Rn",6,18],["Fr",7,1],["Ra",7,2],["Lr",7,3],["Rf",7,4],["Db",7,5],["Sg",7,6],["Bh",7,7],["Hs",7,8],["Mt",7,9],["Ds",7,10],["Rg",7,11],["Cn",7,12],["Nh",7,13],["Fl",7,14],["Mc",7,15],["Lv",7,16],["Ts",7,17],["Og",7,18]
];
const lan=["La","Ce","Pr","Nd","Pm","Sm","Eu","Gd","Tb","Dy","Ho","Er","Tm","Yb"], act=["Ac","Th","Pa","U","Np","Pu","Am","Cm","Bk","Cf","Es","Fm","Md","No"];
const $=s=>document.querySelector(s), mode=$('#modo'), main=$('#mainBoard'), lanBoard=$('#lanBoard'), actBoard=$('#actBoard'), left=$('#bankLeft'), right=$('#bankRight'), help=$('#help'), result=$('#result');
let active=[],selected=null,toastTimer=null;
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
function makeTile(sym){const el=document.createElement('div');el.className='element';el.textContent=sym;el.dataset.symbol=sym;el.id='el-'+sym;el.draggable=true;el.setAttribute('role','button');el.setAttribute('tabindex','0');el.setAttribute('aria-label',`Elemento ${sym}`);el.addEventListener('click',()=>selectTile(el));el.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();selectTile(el)}});el.addEventListener('dragstart',e=>{selected=el;e.dataTransfer.setData('text/plain',sym);e.dataTransfer.effectAllowed='move'});return el}
function makeDrop(sym){const d=document.createElement('div');d.className='dropzone';d.dataset.symbol=sym;d.setAttribute('aria-label',`Posición de ${sym}`);d.addEventListener('click',()=>placeSelected(d));d.addEventListener('dragover',e=>{e.preventDefault();d.classList.add('target')});d.addEventListener('dragleave',()=>d.classList.remove('target'));d.addEventListener('drop',e=>{e.preventDefault();d.classList.remove('target');const el=document.getElementById('el-'+e.dataTransfer.getData('text/plain'));if(el)place(el,d)});return d}
function selectTile(el){document.querySelectorAll('.element.selected').forEach(x=>x.classList.remove('selected'));selected=el;el.classList.add('selected');help.innerHTML=`Seleccionado <b>${el.dataset.symbol}</b>. Toca su casilla en la tabla.`;if(navigator.vibrate)navigator.vibrate(12)}
function placeSelected(drop){if(!selected){const inside=drop.querySelector('.element');if(inside)selectTile(inside);return}place(selected,drop)}
function place(el,drop){const old=drop.querySelector('.element');if(old&&old!==el)returnToBank(old);drop.innerHTML='';drop.appendChild(el);el.classList.remove('selected');el.classList.add('placed');drop.classList.remove('correct','incorrect');selected=null;help.textContent='Bien. Selecciona otro símbolo o arrástralo a su casilla.';updateStats()}
function returnToBank(el){el.classList.remove('placed','selected');const target=innerWidth<=980?left:(left.children.length<=right.children.length?left:right);target.appendChild(el)}
function render(){active=levels[mode.value]||[];selected=null;[main,lanBoard,actBoard,left,right].forEach(x=>x.innerHTML='');result.classList.remove('show');$('#empty').hidden=!!active.length;$('#lanWrap').hidden=!active.some(x=>lan.includes(x));$('#actWrap').hidden=!active.some(x=>act.includes(x));if(!active.length){help.textContent='Selecciona una dificultad para empezar.';updateStats();return}
 rows.filter(([s])=>active.includes(s)).forEach(([s,p,g])=>{const d=makeDrop(s);d.style.gridColumn=g;d.style.gridRow=p;main.appendChild(d)});
 lan.filter(s=>active.includes(s)).forEach(s=>lanBoard.appendChild(makeDrop(s)));act.filter(s=>active.includes(s)).forEach(s=>actBoard.appendChild(makeDrop(s)));
 shuffle(active).forEach((s,i)=>{const el=makeTile(s);(innerWidth<=980||i%2===0?left:right).appendChild(el)});help.innerHTML='<b>iPhone/iPad:</b> toca un símbolo y después su casilla. En ordenador también puedes arrastrar.';updateStats()}
function updateStats(){const placed=document.querySelectorAll('.dropzone .element').length,total=active.length;$('#placed').textContent=placed;$('#total').textContent=total;$('#progress').textContent=total?Math.round(placed/total*100)+'%':'0%'}
function check(){if(!active.length){show('Primero elige una dificultad.','');return}let ok=0,bad=0,empty=0;document.querySelectorAll('.dropzone').forEach(d=>{d.classList.remove('correct','incorrect');const el=d.querySelector('.element');if(!el){empty++;return}if(el.dataset.symbol===d.dataset.symbol){ok++;d.classList.add('correct')}else{bad++;d.classList.add('incorrect')}});const total=active.length,score=(10*ok/total).toFixed(1);show(`✅ ${ok} correctos · ❌ ${bad} incorrectos · ⬜ ${empty} pendientes`,`Nota actual: ${score}/10`);help.textContent=ok===total?'¡Tabla completada! Resultado perfecto.':'Las casillas verdes son correctas. Puedes mover las demás y volver a comprobar.'}
function show(text,sub){result.innerHTML=`${text}${sub?`<small>${sub}</small>`:''}`;result.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>result.classList.remove('show'),4500)}
function reset(){if(!mode.value)return;render();show('Juego reiniciado','Los elementos se han mezclado de nuevo.')}
function remix(){if(!active.length)return;const loose=[...document.querySelectorAll('.bank .element')];shuffle(loose).forEach((el,i)=>(innerWidth<=980||i%2===0?left:right).appendChild(el));show('Elementos mezclados','Las posiciones ya colocadas se conservan.')}
mode.addEventListener('change',render);$('#checkBtn').addEventListener('click',check);$('#resetBtn').addEventListener('click',reset);$('#shuffleBtn').addEventListener('click',remix);window.addEventListener('resize',()=>{if(innerWidth<=980)[...right.children].forEach(x=>left.appendChild(x))});render();
</script>
</body>
</html>
