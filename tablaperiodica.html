<!DOCTYPE html>
<html lang="es">
<script defer src="goat.js"></script>
<head>
  <meta charset="UTF-8">
  <title>Tabla Periódica Interactiva</title>
  <style>
body {
  background-color: #121212;
  color: white;
  font-family: Arial, sans-serif;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 10px;
  /* ❌ Quitar esta línea */
  /* overflow: hidden; */
}
.header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  width: 95vw;
  margin-top: 2cm;
  position: relative;
}

.title-block {
  text-align: center;
  flex-grow: 1;
}

h1 {
  font-size: 1.8em;
  margin: 0;
}

.autor {
  margin: 5px 0 0 0;
  color: yellow;
  font-size: 1.1em;
}
    .grid {
      display: grid;
      grid-template-columns: repeat(18, 45px);
      gap: 1px;
      background-color: #222;
      padding: 5px;
      margin-bottom: 8px;
    }

    .element {
      background-color: #1e88e5;
      border: 1px solid #333;
      text-align: center;
      font-size: 14px;
      font-weight: bold;
      width: 45px;
      height: 45px;
      line-height: 45px;
      border-radius: 4px;
      cursor: pointer;
    }

    .dropzone {
      width: 45px;
      height: 45px;
      border: 1px dashed #666;
      border-radius: 4px;
      font-size: 14px;
      text-align: center;
      line-height: 45px;
    }

    .correct {
      background-color: #2e7d32 !important;
      color: white;
    }
    .incorrect {
      background-color: #c62828 !important;
      color: white;
    }

    select, button {
      margin: 5px;
      padding: 5px;
      font-size: 14px;
    }

    #layout {
      display: flex;
      justify-content: space-between;
      width: 100vw;
      height: 90vh;
    }

.side-panel {
  width: 20%;
  display: grid;
  grid-template-columns: repeat(4, 1fr); /* Cambiado de 3 a 4 columnas */
  grid-auto-rows: 45px;
  gap: 4px;
  padding: 5px;
}


    .center-panel {
      width: 60%;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    #resultado {
      margin-top: 10px;
      font-size: 16px;
      color: #fff;
    }
#home-link {
  font-size: 28px;
  text-decoration: none;
  color: white;
  padding-right: 10px;
  padding-top: 5px;
}
#home-link:hover {
  color: #0ff;
}

  </style>
</head>
<div class="header">
  <div class="title-block">
    <h1>Tabla Periódica - Juego</h1>
    <h2 class="autor">Desarrollado por: Ángel Soto</h2>
  </div>
  <a href="https://airsoto.github.io/vet/" id="home-link" title="Ir al inicio">🏠</a>
</div>

    let seleccionados = [];

    selectModo.addEventListener("change", () => {
      const modo = selectModo.value;
      izq.innerHTML = "";
      der.innerHTML = "";
      tabla.innerHTML = "";
      resultado.textContent = "";
      const activos = modo === "nieto" ? nieto : modo === "hijo" ? hijo : modo === "dmitri" ? dmitri : [];
      seleccionados = todos.filter(e => activos.includes(e.simbolo));

      seleccionados.forEach(e => {
        const drop = document.createElement("div");
        drop.className = "dropzone";
        drop.dataset.simbolo = e.simbolo;
        drop.style.gridColumn = e.grupo;
        drop.style.gridRow = e.periodo;
        drop.ondragover = ev => ev.preventDefault();
        drop.ondrop = function(ev) {
          ev.preventDefault();
          const data = ev.dataTransfer.getData("text");
          const dragged = document.getElementById(data);
          this.innerHTML = "";
          this.appendChild(dragged);
        };
        tabla.appendChild(drop);
      });

      seleccionados.forEach((e, i) => {
        const div = document.createElement("div");
        div.className = "element";
        div.textContent = e.simbolo;
        div.id = "drag-" + e.simbolo;
        div.draggable = true;
        div.ondragstart = ev => ev.dataTransfer.setData("text", ev.target.id);
(i % 6 < 3 ? izq : der).appendChild(div);
      });
    });

    function verResultados() {
      let aciertos = 0;
      let errores = 0;
      document.querySelectorAll(".dropzone").forEach(drop => {
        const contenido = drop.textContent.trim();
        const solucion = drop.dataset.simbolo;
        if (contenido === solucion) {
          drop.classList.add("correct");
          drop.classList.remove("incorrect");
          aciertos++;
        } else {
          drop.classList.add("incorrect");
          drop.classList.remove("correct");
          drop.innerHTML = `<div class='element incorrect'>${solucion}</div>`;
          errores++;
        }
      });
      const total = aciertos + errores;
      const nota = total > 0 ? (10 * aciertos / total).toFixed(1) : "0.0";
      resultado.textContent = `✅ Aciertos: ${aciertos} | ❌ Errores: ${errores} | Nota: ${nota}/10`;
    }

    function resetearJuego() {
      izq.innerHTML = "";
      der.innerHTML = "";
      tabla.innerHTML = "";
      resultado.textContent = "";
      selectModo.value = "";
    }
  </script>
